const hash2=(a,b,s)=>{let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0;};

const WATER_Y=-0.1,RK=0.0048;
// i fiumi sono il livello-zero di un campo di rumore: curve che serpeggiano all'infinito
const rf=(x,z)=>0.82*noise(x*RK+31.7,z*RK-12.3)+0.18*noise(x*RK*2.7-8.1,z*RK*2.7+4.4);
function riverD(x,z){const f=rf(x,z),e=2,fx=(rf(x+e,z)-f)/e,fz=(rf(x,z+e)-f)/e;return Math.abs(f)/clamp(Math.hypot(fx,fz),0.003,0.02);}
function riverFlow(x,z){const f=rf(x,z),e=2,fx=(rf(x+e,z)-f)/e,fz=(rf(x,z+e)-f)/e,l=Math.hypot(fx,fz)||1;return[-fz/l,fx/l];}
function terrainH(x,z){
  const n1=fbm(x*0.011+10,z*0.011+3,4),n2=fbm(x*0.035,z*0.035,3);
  let h=3.4+4.2*n1+1.6*n2;
  h=1.0+Math.log(1+Math.exp(1.3*(h-1.0)))/1.3;
  h+=0.4*noise(x*0.13,z*0.13);
  const d=riverD(x,z);
  const far=smooth(70,190,Math.hypot(x,z));
  const m=fbm(x*0.0032+100,z*0.0032-50,3);
  h+=26*Math.pow(smooth(0.1,0.55,m),1.4)*far*smooth(20,110,d);
  h+=9*smooth(9,70,d);
  return lerp(-1.15,h,smooth(2.2,16,d));
}
const slopeAt=(x,z)=>Math.hypot(terrainH(x+1,z)-terrainH(x-1,z),terrainH(x,z+1)-terrainH(x,z-1))*0.5;

/* ---------- oggetti deterministici per cella (alberi, cespugli, rocce) ---------- */
const TT=[{h:8,r:3.2},{h:8.4,r:3.4},{h:8,r:1.9},{h:9.6,r:2.1}];
const CELL={t:9,b:11,g:18,s:7,p:3};                                  // t=alberi b=cespugli g=massi s=sassi nel fiume p=ciottoli
const cache={t:new Map(),b:new Map(),g:new Map(),s:new Map(),p:new Map()};
const rock=(x,z,s,y,qv,qr)=>({k:'r',x,y,z,s,v:Math.min(2,(qv*3)|0),ry:qr*6.283});
function cellItems(k,ix,iz){
  const mp=cache[k],key=(ix+32768)*65536+(iz+32768);
  let a=mp.get(key);if(a)return a;a=[];
  const C0=CELL[k],r=mulberry32(hash2(ix,iz,k.charCodeAt(0)));
  const x=(ix+0.5+(r()-0.5)*0.7)*C0,z=(iz+0.5+(r()-0.5)*0.7)*C0,roll=r(),q1=r(),q2=r(),q3=r();
  const d=(k==='t'||k==='b'||k==='g')?riverD(x,z):0;
  if(k==='t'){
    const dens=smooth(-0.1,0.4,fbm(x*0.022+40,z*0.022-20,3));
    if(roll<0.012+0.40*dens&&d>10.5){const y=terrainH(x,z);
      if(y<26&&slopeAt(x,z)<0.75)a.push({k:'t',x,y,z,s:0.8+0.55*q2,ry:q3*6.283,type:y>9?(q1<0.75?3:1):(q1<0.46?0:q1<0.64?1:q1<0.82?3:2)});}
  }else if(k==='b'){
    if(roll<(d<22?0.34:0.10)&&d>8.5){const y=terrainH(x,z);if(slopeAt(x,z)<0.8)a.push({k:'b',x,y,z,s:0.8+0.8*q2,ry:q3*6.283});}
  }else if(k==='g'){
    if(roll<0.22&&d>9){const y=terrainH(x,z);if(slopeAt(x,z)<1.1){
      const s=1+1.8*q2;a.push(rock(x,z,s,y-s*0.22,q1,q3));
      for(let i=0,m=2+((q1*3)|0);i<m;i++){const an=r()*6.283,rd=s*(1+r()),s2=0.3+0.6*r(),xx=x+Math.cos(an)*rd,zz=z+Math.sin(an)*rd;a.push(rock(xx,zz,s2,terrainH(xx,zz)-s2*0.22,r(),r()));}}}
  }else if(k==='s'){
    if(roll<0.35&&terrainH(x,z)<WATER_Y-0.35){const s=0.6+q2,o=rock(x,z,s,WATER_Y+0.25*s-0.1,q1,q3);o.st=1;a.push(o);}
  }else{
    if(roll<0.4){const y=terrainH(x,z);if(y>-0.5&&y<1.4)a.push(rock(x,z,0.15+0.27*q2,y-0.04,q1,q3));}
  }
  mp.set(key,a);return a;
}
function itemsIn(x0,z0,x1,z1,kinds){
  const out=[];
  for(let q=0;q<kinds.length;q++){const k=kinds[q],C0=CELL[k],ia=Math.floor(x0/C0),ib=Math.floor(x1/C0),ja=Math.floor(z0/C0),jb=Math.floor(z1/C0);
    for(let iz=ja;iz<=jb;iz++)for(let ix=ia;ix<=ib;ix++){const a=cellItems(k,ix,iz);for(let i=0;i<a.length;i++)out.push(a[i]);}}
  return out;
}
function trimCache(){for(const k in cache)if(cache[k].size>60000)cache[k].clear();}

/* ---------- raster locale per ombre "cotte" e maschera senza-erba ---------- */
class Raster{
  constructor(ox,oz,size,cell){this.ox=ox;this.oz=oz;this.c=cell;this.n=Math.ceil(size/cell);this.d=new Float32Array(this.n*this.n);}
  max(x,z,v){const i=Math.floor((x-this.ox)/this.c),j=Math.floor((z-this.oz)/this.c);if(i<0||j<0||i>=this.n||j>=this.n)return;const k=j*this.n+i;if(v>this.d[k])this.d[k]=v;}
  get(x,z){const fx=(x-this.ox)/this.c-0.5,fz=(z-this.oz)/this.c-0.5,i=Math.floor(fx),j=Math.floor(fz);if(i<0||j<0||i>=this.n-1||j>=this.n-1)return 0;const tx=fx-i,tz=fz-j,n=this.n,d=this.d;return lerp(lerp(d[j*n+i],d[j*n+i+1],tx),lerp(d[(j+1)*n+i],d[(j+1)*n+i+1],tx),tz);}
}
function addShadow(R,x,z,h,r,str){
  const len=h*1.1,cx=x+SD.x*len*0.5,cz=z+SD.z*len*0.5,a=len*0.5+r,b=r*0.95,E=Math.max(a,b)+1.5,end=R.n*R.c;
  const xa=Math.max(cx-E,R.ox),xb=Math.min(cx+E,R.ox+end),za=Math.max(cz-E,R.oz),zb=Math.min(cz+E,R.oz+end);
  for(let zz=za;zz<=zb;zz+=0.5)for(let xx=xa;xx<=xb;xx+=0.5){
    const du=(xx-cx)*SD.x+(zz-cz)*SD.z,dw=-(xx-cx)*SD.z+(zz-cz)*SD.x;
    const s=str*(1-smooth(0.45,1,Math.hypot(du/a,dw/b))),s2=0.45*(1-smooth(0.2,1,Math.hypot(xx-x,zz-z)/(r*1.1)));
    const m=Math.max(s,s2);if(m>0)R.max(xx,zz,m);
  }
}
function addNoGrass(R,x,z,r){
  const E=r+1,end=R.n*R.c,xa=Math.max(x-E,R.ox),xb=Math.min(x+E,R.ox+end),za=Math.max(z-E,R.oz),zb=Math.min(z+E,R.oz+end);
  for(let zz=za;zz<=zb;zz+=0.5)for(let xx=xa;xx<=xb;xx+=0.5)R.max(xx,zz,1-smooth(0.7,1,Math.hypot(xx-x,zz-z)/r));
}
function makeRasters(c){
  const M=22,its=itemsIn(c.x0-M,c.z0-M,c.x0+CS+M,c.z0+CS+M,'tbgs');
  const sh=new Raster(c.x0-2,c.z0-2,CS+4,0.5),ng=new Raster(c.x0-2,c.z0-2,CS+4,0.5);
  for(const it of its){
    if(it.k==='t'){const T=TT[it.type];addShadow(sh,it.x,it.z,T.h*it.s,T.r*it.s,0.78);addNoGrass(ng,it.x,it.z,0.9*it.s);}
    else if(it.k==='b'){addShadow(sh,it.x,it.z,1.2*it.s,it.s,0.5);addNoGrass(ng,it.x,it.z,1.1*it.s);}
    else{if(!it.st)addShadow(sh,it.x,it.z,it.s*1.1,it.s*0.9,0.55);addNoGrass(ng,it.x,it.z,it.s*1.1);}
  }
  return{sh,ng};
}

/* ---------- colori del terreno ---------- */
const cMeadow=[L(0x5fae35),L(0x86c441),L(0xb2d24e),L(0x3f9a43)],cHill=L(0x4f9a52),cSand=L(0xd9cc9c),cBed=L(0xa7a27a),cRock=L(0x9b9484);
function meadow(x,z,c){
  const a=fbm(x*0.045+7,z*0.045-3,3)*0.5+0.5,b=fbm(x*0.16-5,z*0.16+9,2)*0.5+0.5;
  return c.copy(cMeadow[0]).lerp(cMeadow[1],smooth(0.35,0.7,a)).lerp(cMeadow[2],smooth(0.6,0.85,b)*0.6).lerp(cMeadow[3],smooth(0.7,0.9,1-a)*0.5);
}
function terrainColor(x,z,h,slope,c,sh){
  meadow(x,z,c);
  c.lerp(cHill,smooth(10,28,h)*0.55);
  c.lerp(cRock,smooth(26,42,h)*0.5);
  c.lerp(cSand,(1-smooth(0.15,1.05,h))*0.9);
  if(h<WATER_Y+0.2){const k=smooth(WATER_Y,-1.1,h);c.lerp(cBed,0.55+0.45*k).multiplyScalar(1-0.3*k);}
  c.lerp(cRock,smooth(0.5,0.9,slope)*0.8);
  const s=sh.get(x,z);c.multiplyScalar(1-0.5*s);c.r*=1-0.1*s;
  return c;
}

/* =====================================================================
   3. SHADER CHUNKS
   ===================================================================== */
const NOISE=`
float hI(ivec2 i){uvec2 v=uvec2(i+ivec2(65536));v=v*1664525u+1013904223u;v.x+=v.y*1664525u;v.y+=v.x*1664525u;v^=v>>16u;v.x+=v.y*1664525u;v.y+=v.x*1664525u;v^=v>>16u;return float(v.x>>8u)*(1.0/16777216.0);}
float vn(vec2 p){ivec2 i=ivec2(floor(p));vec2 f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hI(i),hI(i+ivec2(1,0)),f.x),mix(hI(i+ivec2(0,1)),hI(i+ivec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=0.5,s=0.0;for(int i=0;i<4;i++){s+=a*vn(p);p=p*2.03+vec2(17.1,9.2);a*=0.5;}return s;}
`;
const WIND=`
const vec2 WD=vec2(0.9285,0.3714);
float windAt(vec2 p,float t){
  float g1=sin(dot(p,WD)*0.11-t*1.0)*0.5+0.5;
  float g2=sin(dot(p,WD)*0.29-t*1.8+sin(p.y*0.21)*1.7)*0.5+0.5;
  return 0.12+0.62*g1*g1+0.26*g2*g1;
}`;
const FOGF=`
  float fgf=1.0-exp(-uFogDensity*uFogDensity*vFog*vFog);
  gl_FragColor.rgb=mix(gl_FragColor.rgb,uFogColor,fgf);`;
// ombra del cavallo proiettata su prato/erba (ellisse allungata lungo la direzione dell'ombra)
const HSH=`
uniform vec4 uHS;uniform vec2 uSDir;uniform vec4 uFlock[6];
float horseShadow(vec2 p){
  vec2 c=uHS.xy+uSDir*uHS.z*0.55,d=p-c;
  float u=dot(d,uSDir),w=dot(d,vec2(-uSDir.y,uSDir.x));
  return 0.5*(1.0-smoothstep(0.35,1.0,length(vec2(u/uHS.z,w/uHS.w))));
}`;

const U={
  uTime:{value:0},uSunDir:{value:LIGHT.clone()},uSunCol:{value:C.sun},uSunI:{value:SUN_I},
  uSkyCol:{value:C.hemiSky},uGndCol:{value:C.hemiGnd},uHemiI:{value:HEMI_I},
  uFogColor:{value:FOG_SRGB},uFogDensity:{value:FOG_D},uPointScale:{value:70},
  uFadeA:{value:Q.fA},uFadeB:{value:Q.fB},
  uHS:{value:new THREE.Vector4(0,0,1,1)},uSDir:{value:new THREE.Vector2(SD.x,SD.z)},uNight:{value:0},
  uFlock:{value:Array.from({length:6},()=>new THREE.Vector4(0,0,0,0))}
};
const mk=(vs,fs,extra,opt)=>new THREE.ShaderMaterial(Object.assign({vertexShader:vs,fragmentShader:fs,uniforms:Object.assign({},U,extra||{})},opt||{}));

const terrainMat=mk(`
attribute vec3 aCol;varying vec3 vN,vCol,vW;varying float vFog;
void main(){vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;vN=normal;vCol=aCol;vec4 mv=viewMatrix*wp;vFog=-mv.z;gl_Position=projectionMatrix*mv;}`,
`uniform vec3 uSunDir,uSunCol,uSkyCol,uGndCol,uFogColor;uniform float uSunI,uHemiI,uFogDensity;
varying vec3 vN,vCol,vW;varying float vFog;
${NOISE}
${HSH}
void main(){
  vec3 N=normalize(vN);vec2 q=vW.xz;
  float n=vn(q*0.9)*0.55+vn(q*2.7)*0.3+vn(q*7.0)*0.15;
  vec3 alb=vCol*(0.84+0.32*n)*(1.0-horseShadow(vW.xz));
  float d=max(dot(N,uSunDir),0.0);
  vec3 amb=mix(uGndCol,uSkyCol,N.y*0.5+0.5)*uHemiI;
  gl_FragColor=vec4(alb*(uSunCol*uSunI*d+amb),1.0);
  #include <encodings_fragment>
  ${FOGF}
}`);

const grassMat=mk(`
attribute vec3 aOffset;attribute vec4 aData;attribute vec3 aColor;
uniform float uTime,uFadeA,uFadeB;uniform vec3 uSunDir,uSunCol;varying vec3 vCol;varying float vFog;
${WIND}
${HSH}
void main(){
  float fade=1.0-smoothstep(uFadeA,uFadeB,length(aOffset.xz-cameraPosition.xz));
  if(fade<0.02){gl_Position=vec4(2.0,2.0,2.0,1.0);vCol=vec3(0.0);vFog=0.0;return;}
  vec2 hd=aOffset.xz-uHS.xy;float tr=1.0-smoothstep(0.0,uHS.z*1.15,length(hd));          // erba calpestata dal cavallo
  float gz=0.0;for(int i=0;i<6;i++){vec4 fl=uFlock[i];if(fl.z>0.0)gz=max(gz,1.0-smoothstep(fl.z*0.5,fl.z,length(aOffset.xz-fl.xy)));}   // le pecore tengono l'erba bassa
  float hf=position.y,H=aData.y*fade*(1.0-0.45*tr)*(1.0-0.62*gz);
  vec3 p=vec3(position.x*aData.z*(0.5+0.5*fade),hf*H,hf*hf*H*0.22*(aData.w-0.35));
  float c=cos(aData.x),s=sin(aData.x);
  p=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);
  vec3 wp=aOffset+p;
  float w=windAt(aOffset.xz,uTime);
  float flutter=sin(uTime*3.1+aData.w*40.0+aOffset.x*0.9)*0.06;
  float bend=(w+flutter)*hf*hf*H*0.62;
  wp.xz+=WD*bend;wp.y-=bend*bend*0.45;
  wp.xz+=normalize(hd+vec2(1e-3))*tr*0.65*hf;
  vec3 baseC=aColor*0.5,tipC=aColor*1.35+vec3(0.03,0.06,0.0);
  vCol=mix(baseC,tipC,pow(hf,0.75))*(0.80+0.40*w);
  float back=pow(clamp(dot(normalize(wp-cameraPosition),uSunDir),0.0,1.0),4.0);
  vCol+=aColor*uSunCol*back*hf*0.8;
  vCol*=1.0-horseShadow(aOffset.xz);
  vec4 mv=viewMatrix*vec4(wp,1.0);vFog=-mv.z;gl_Position=projectionMatrix*mv;
}`,`
uniform vec3 uFogColor;uniform float uFogDensity;varying vec3 vCol;varying float vFog;
void main(){gl_FragColor=vec4(vCol,1.0);
  #include <encodings_fragment>
  ${FOGF}
}`,{}, {side:THREE.DoubleSide});

const flowerMat=mk(`
attribute vec3 aOffset;attribute vec4 aData;attribute vec3 aColor;attribute float aK;
uniform float uTime,uFadeA,uFadeB;varying vec3 vCol;varying float vK,vH,vFog;
${WIND}
${HSH}
void main(){
  float fade=1.0-smoothstep(uFadeA,uFadeB,length(aOffset.xz-cameraPosition.xz));
  if(fade<0.02){gl_Position=vec4(2.0,2.0,2.0,1.0);vCol=vec3(0.0);vK=0.0;vH=0.0;vFog=0.0;return;}
  vec2 hd=aOffset.xz-uHS.xy;float tr=1.0-smoothstep(0.0,uHS.z*1.15,length(hd));
  float gz=0.0;for(int i=0;i<6;i++){vec4 fl=uFlock[i];if(fl.z>0.0)gz=max(gz,1.0-smoothstep(fl.z*0.5,fl.z,length(aOffset.xz-fl.xy)));}
  float hf=min(position.y,1.0),H=aData.y*fade*(1.0-0.5*tr)*(1.0-0.62*gz);
  vec3 p=vec3(position.x,position.y*H,position.z);
  if(aK>=0.0){p.x*=aData.z*fade;p.z*=aData.z*fade;p.y=H+(position.y-1.0)*aData.z*fade;}
  float c=cos(aData.x),s=sin(aData.x);
  p=vec3(c*p.x+s*p.z,p.y,-s*p.x+c*p.z);
  vec3 wp=aOffset+p;
  float w=windAt(aOffset.xz,uTime);
  float bend=(w+sin(uTime*2.7+aData.w*40.0)*0.07)*hf*hf*H*0.55;
  wp.xz+=WD*bend;wp.y-=bend*bend*0.4;
  wp.xz+=normalize(hd+vec2(1e-3))*tr*0.65*hf;
  vCol=aColor*(0.9+0.25*w);vK=aK;vH=hf;
  vec4 mv=viewMatrix*vec4(wp,1.0);vFog=-mv.z;gl_Position=projectionMatrix*mv;
}`,`
uniform vec3 uFogColor;uniform float uFogDensity;varying vec3 vCol;varying float vK,vH,vFog;
void main(){
  vec3 col=vK<0.0?vec3(0.06,0.28,0.04)*(0.5+0.7*vH):mix(vec3(0.95,0.55,0.02),vCol,smoothstep(0.2,0.55,vK));
  gl_FragColor=vec4(col,1.0);
  #include <encodings_fragment>
  ${FOGF}
}`,{}, {side:THREE.DoubleSide});

const waterMat=mk(`
attribute float aDepth;attribute vec2 aDir;attribute float aFoam;
varying vec3 vW;varying float vDepth,vFog,vFoam;varying vec2 vDir;
void main(){vDepth=aDepth;vDir=aDir;vFoam=aFoam;vec4 wp=modelMatrix*vec4(position,1.0);vW=wp.xyz;vec4 mv=viewMatrix*wp;vFog=-mv.z;gl_Position=projectionMatrix*mv;}`,
`uniform float uTime;uniform vec3 uSunDir,uSunCol,uHorizon,uSkyMid,uShallow,uDeep,uFogColor;uniform float uFogDensity;
varying vec3 vW;varying float vDepth,vFog,vFoam;varying vec2 vDir;
${NOISE}
float ripple(vec2 p){return vn(p*0.9)*0.6+vn(p*2.1+vec2(7.3,2.1))*0.4;}
float flowH(vec2 p,vec2 dir,float t){
  float ph0=fract(t*0.17),ph1=fract(t*0.17+0.5);
  float w0=1.0-abs(2.0*ph0-1.0),w1=1.0-abs(2.0*ph1-1.0);
  vec2 off=dir*3.2;
  return ripple(p-off*ph0)*w0+ripple(p-off*ph1+vec2(3.7,1.3))*w1;
}
void main(){
  vec2 dir=normalize(vDir+vec2(1e-4)),p=vW.xz;
  float h0=flowH(p,dir,uTime),hx=flowH(p+vec2(0.12,0.0),dir,uTime),hz=flowH(p+vec2(0.0,0.12),dir,uTime);
  vec3 N=normalize(vec3((h0-hx)*3.0,1.0,(h0-hz)*3.0));
  vec3 V=normalize(cameraPosition-vW);
  float depthT=smoothstep(0.0,1.2,vDepth);
  vec3 col=mix(uShallow,uDeep,depthT);
  col+=vec3(0.10,0.14,0.14)*smoothstep(0.55,0.85,h0)*0.6;
  float fres=pow(1.0-max(dot(N,V),0.0),3.0);
  vec3 R=reflect(-V,N);
  vec3 sky=mix(uHorizon,uSkyMid,smoothstep(0.0,0.7,R.y));
  col=mix(col,sky,clamp(0.12+fres*0.8,0.0,0.92));
  vec3 Hh=normalize(uSunDir+V);float nh=max(dot(N,Hh),0.0);
  col+=uSunCol*(pow(nh,180.0)*3.0+pow(nh,24.0)*0.15);
  float fn=flowH(p*1.7,dir,uTime*1.3);
  float edge=1.0-smoothstep(0.02,0.45,vDepth);
  float foam=edge*smoothstep(0.30,0.70,fn+edge*0.35);
  foam=max(foam,vFoam*smoothstep(0.25,0.65,fn+vFoam*0.4));
  col=mix(col,vec3(1.0,1.0,0.97),clamp(foam,0.0,1.0)*0.95);
  float alpha=max(mix(0.62,0.95,depthT),foam)*smoothstep(0.0,0.22,vDepth);
  if(alpha<0.01)discard;
  gl_FragColor=vec4(col,alpha);
  #include <encodings_fragment>
  ${FOGF}
}`,{uHorizon:{value:C.horizon},uSkyMid:{value:C.mid},uShallow:{value:L(0x86e0cf)},uDeep:{value:L(0x1f86b8)}},

const _v=new THREE.Vector3(),_n=new THREE.Vector3(),_c=new THREE.Color(),I4=new THREE.Matrix4();
function pushGeo(T,geo,mat,fn){
  const g=geo.index?geo.toNonIndexed():geo,P=g.attributes.position,N=g.attributes.normal,nm=new THREE.Matrix3().getNormalMatrix(mat);
  for(let i=0;i<P.count;i++){
    _v.fromBufferAttribute(P,i).applyMatrix4(mat);
    _n.fromBufferAttribute(N,i).applyMatrix3(nm).normalize();
    fn(_v,_n,_c,i);
    T.p.push(_v.x,_v.y,_v.z);T.n.push(_n.x,_n.y,_n.z);T.c.push(_c.r,_c.g,_c.b);
  }
}
function toGeo(T){const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(T.p,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(T.n,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(T.c,3));return g;}
function blobGeo(seed,disp){
  const g=new THREE.IcosahedronGeometry(1,2),P=g.attributes.position,N=g.attributes.normal,v=new THREE.Vector3();
  for(let i=0;i<P.count;i++){
    v.fromBufferAttribute(P,i);
    N.setXYZ(i,v.x,v.y+0.25,v.z);
    const k=1+disp*(Math.sin(v.x*3.1+seed)*Math.sin(v.y*2.7+seed*1.7)*Math.sin(v.z*3.3+seed*0.6)*1.4+0.5*Math.sin(v.x*7.3+v.z*6.1+seed*2.0));
    P.setXYZ(i,v.x*k,v.y*k*0.85,v.z*k);
  }
  return g;
}
function buildTree(o){
  const T={p:[],n:[],c:[]};let top=0;
  if(o.trunk){
    const t=o.trunk,len=t.h+o.blobs[0][1],g=new THREE.CylinderGeometry(t.rt,t.rb,len,8,4,true);g.translate(0,len/2-0.4,0);
    pushGeo(T,g,I4,(v,n,c)=>{c.copy(t.dark).lerp(t.light,clamp((v.y+0.4)/t.h,0,1));
      if(t.bands&&Math.sin(v.y*10+Math.atan2(v.z,v.x)*3)>0.82)c.multiplyScalar(0.3);});
    top=t.h-0.4;
  }
  let y0=1e9,y1=-1e9;
  o.blobs.forEach(b=>{y0=Math.min(y0,top+b[1]-b[3]*0.8);y1=Math.max(y1,top+b[1]+b[3]*0.8);});
  o.blobs.forEach((b,i)=>{
    const g=blobGeo(o.seed+i*5.17,o.disp);
    const m=new THREE.Matrix4().compose(new THREE.Vector3(b[0],top+b[1],b[2]),new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),i*1.7),new THREE.Vector3(b[3],b[3]*0.88,b[3]));
    pushGeo(T,g,m,(v,n,c)=>{
      const t=clamp((v.y-y0)/(y1-y0),0,1);
      c.copy(o.dark).lerp(o.light,Math.pow(t,0.85));
      if(n.y>0.5)c.lerp(o.top,(n.y-0.5)*1.1*t);
      c.multiplyScalar(0.9+0.2*Math.abs(Math.sin(v.x*4.1+v.z*3.3+v.y*2.9+o.seed)));

}
function oakBlobs(sd){const r=mulberry32(sd),b=[[0,2.5,0,2.5]],n=5+((r()*2)|0);

function buildPine(seed){
  const T={p:[],n:[],c:[]},dark=L(0x1f6a46),light=L(0x4fa35a),top=L(0x8fd070);
  const tg=new THREE.CylinderGeometry(0.07,0.3,4,8,2,true);tg.translate(0,1.6,0);
  pushGeo(T,tg,I4,(v,n,c)=>{c.copy(L(0x4a3426)).lerp(L(0x7a5a3c),clamp(v.y/4,0,1));});
  for(let i=0;i<5;i++){

const cRockD=L(0x76726d),cRockL=L(0xb6ae9f),cMoss=L(0x6fa03a);
function buildRock(seed){
  const g=new THREE.IcosahedronGeometry(1,1),P=g.attributes.position;
  for(let i=0;i<P.count;i++){const x=P.getX(i),y=P.getY(i),z=P.getZ(i),k=1+0.30*(Math.sin(x*2.3+seed)*Math.cos(y*2.9+seed*1.3)+0.6*Math.sin(z*3.7+seed*0.7));

  g.computeVertexNormals();
  const N=g.attributes.normal,col=new Float32Array(P.count*3),c=new THREE.Color();
  for(let f=0;f<P.count;f+=3){
    const ny=(N.getY(f)+N.getY(f+1)+N.getY(f+2))/3,yy=(P.getY(f)+P.getY(f+1)+P.getY(f+2))/3;
    const fr=0.86+0.28*(Math.abs(Math.sin(f*12.9898+seed*78.233)*43758.5453)%1);

    for(let k=0;k<3;k++){col[(f+k)*3]=c.r;col[(f+k)*3+1]=c.g;col[(f+k)*3+2]=c.b;}

function flowerGeo(){
  const P=[-0.012,0,0, 0.012,0,0, -0.008,1,0, 0.008,1,0],K=[-1,-1,-1,-1],I=[0,1,2,1,3,2],R=0.085;

function pickCoat(){
  let tot=0;COATS.forEach(c=>tot+=c.w);let r=Math.random()*tot;
  for(const c of COATS){r-=c.w;if(r<=0)return c;}return COATS[0];
}
function b64ToBuf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function parseGLB(buf){
  const dv=new DataView(buf);
  if(dv.getUint32(0,true)!==0x46546C67)throw new Error('GLB non valido');
  let off=12,json=null,bin=null;
  while(off<buf.byteLength){
    const len=dv.getUint32(off,true),type=dv.getUint32(off+4,true);off+=8;
    if(type===0x4E4F534A)json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,off,len)));
    else if(type===0x004E4942)bin=buf.slice(off,off+len);
    off+=len;
  }
  const acc=i=>{
    const a=json.accessors[i],bv=json.bufferViews[a.bufferView],n={SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[a.type];
    const C={5126:Float32Array,5123:Uint16Array,5125:Uint32Array,5121:Uint8Array}[a.componentType];
    return new C(bin,(bv.byteOffset||0)+(a.byteOffset||0),a.count*n);
  };
  const p=json.meshes[0].primitives[0],sm=json.animations[0].samplers[0];
  return{pos:acc(p.attributes.POSITION),col:acc(p.attributes.COLOR_0),idx:acc(p.indices),

}
function createHorse(scene){

  const stand=new Float32Array(b64ToBuf(HORSE_STAND_B64));
  const coat=pickCoat();
  const rg=mulberry32((Math.random()*1e9)|0);
  const rr2=(a,b)=>a+(b-a)*rg();

  /* ---- classificazione dei vertici dal colore originale ---- */
  const near=(a,b)=>Math.abs(a-b)<0.006;
  const isC=(i,r,g,b)=>near(G.col[i*3],r)&&near(G.col[i*3+1],g)&&near(G.col[i*3+2],b);
  const cls=new Uint8Array(V);          // 0 corpo 1 zampe 2 muso 3 orecchie 4 striscia criniera 5 coda/groppa 6 ciuffo 7 fronte
  for(let i=0;i<V;i++){
    const y=stand[i*3+1],z=stand[i*3+2];
    if(isC(i,0.24,0.12,0.09))cls[i]=z>-60?4:5;
    else if(isC(i,0.22,0.11,0.09))cls[i]=6;

  for(let i=0;i<V;i++)if(cls[i]===5&&stand[i*3+2]<-100)hidden[i]=1;     // la coda "a lama" originale viene sostituita da ciocche
  const idx=[];for(let t=0;t<G.idx.length;t+=3){const a=G.idx[t],b=G.idx[t+1],c=G.idx[t+2];if(!(hidden[a]||hidden[b]||hidden[c]))idx.push(a,b,c);}

    if(c===1){tc.copy(cPts);let k=0,bd=1e9;for(let l=0;l<4;l++){const d=Math.abs(z-legZ[l]);if(d<bd){bd=d;k=l;}}

    aInfo[i*4]=c;aInfo[i*4+1]=mark;aInfo[i*4+2]=hoof;aInfo[i*4+3]=rg();
  }
  
    // Cambia il mantello mantenendo la geometria e l'animazione.
  let coatIndex = COATS.indexOf(coat);

  function nextCoat(){
    coatIndex = (coatIndex + 1) % COATS.length;
    const next = COATS[coatIndex];

    if(!st.goal)st.goal=(st.ran?pickGoal(22,45):pickGoal(12,22))||{x:st.x+Math.sin(st.h)*12,z:st.z+Math.cos(st.h)*12};

    if(!ah(want)){let found=false;for(const o of[0.45,-0.45,0.9,-0.9,1.35,-1.35,1.8,-1.8,2.4,-2.4,Math.PI]){if(ah(want+o)){want=want+o;found=true;break;}}if(!found)st.goal=null;}

    if(g<0.999)walkPose(st.phaseW,wp);

   PECORE — modello procedurale (lana riccia, testa e zampe dettagliate),
   animazione nel vertex shader (passo diagonale + testa che bruca),

function curlyBlob(detail,seed,amp){
  const g=new THREE.IcosahedronGeometry(1,detail),P=g.attributes.position,N=g.attributes.normal,ao=new Float32Array(P.count);
  for(let i=0;i<P.count;i++){
    const x=P.getX(i),y=P.getY(i),z=P.getZ(i);
    const n1=Math.sin(x*6.1+seed)*Math.sin(y*5.3+seed*1.7)*Math.sin(z*6.7+seed*0.6);
    const n2=Math.sin(x*15.3+z*13.1+seed*2.1)*Math.sin(y*14.7+x*9.2+seed);
    const b=0.5+0.5*(0.6*n1+0.4*n2),k=1+amp*(b-0.5)*2;               // riccioli: rilievo 3D + occlusione baked
    N.setXYZ(i,x,y+0.15,z);P.setXYZ(i,x*k,y*k,z*k);ao[i]=b;
  }
  g.userData.ao=ao;return g;
}

//fix gemini

  // lana: masse ricciolute compatte + ciuffo largo e basso verso le orecchie
  [[0,0.57,0.22, 0.29,0.30,0.31, detail,0.10,1.1,BODY,1],
   [0,0.58,-0.25,0.30,0.31,0.33, detail,0.10,2.3,BODY,1],

   [0,0.44,0.00, 0.25,0.17,0.46, detail-1,0.10,4.9,BODY,0.82],

  const ico=n=>new THREE.IcosahedronGeometry(1,n);

function createSheep(scene){

  const anim=new Float32Array(N*4),aA=new THREE.InstancedBufferAttribute(anim,4);aA.setUsage(THREE.DynamicDrawUsage);geo.setAttribute('aAnim',aA);

      if(aPart.y>0.9){transformed=vec3(0.0,0.58,0.46)+(transformed-vec3(0.0,0.58,0.46))*(1.0+0.28*aKind);}   // agnelli: testa più grande in proporzione
      if(aPart.y>0.0){                                                    // collo/testa: si abbassano per brucare e masticano
        float g=aAnim.y;
        float an=(g*1.22+sin(uTime*5.0+aAnim.w*20.0)*0.045*g+sin(aAnim.w*9.0+uTime*0.7)*0.05*(1.0-g))*aPart.y;
        float cs=cos(an),sn=sin(an),dz=transformed.z-0.42,dy2=transformed.y-0.58;
        transformed.z=0.42+dz*cs+dy2*sn;transformed.y=0.58-dz*sn+dy2*cs;

  const mesh=new THREE.InstancedMesh(geo,mat,N);mesh.frustumCulled=false;mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  // ombra morbida a terra
  const shGeo=new THREE.PlaneGeometry(1,1);shGeo.rotateX(-Math.PI/2);
  const shMat=mk(`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*viewMatrix*modelMatrix*instanceMatrix*vec4(position,1.0);}`,
    `uniform float uSunI;varying vec2 vUv;void main(){float a=0.42*(1.0-smoothstep(0.0,0.5,length(vUv-0.5)))*clamp(uSunI*1.3,0.0,1.0);gl_FragColor=vec4(0.02,0.03,0.0,a);}`,
    {},{transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});

  C.sun.copy(a.ls).lerp(b.ls,f);C.hemiSky.copy(a.lk).lerp(b.lk,f);C.hemiGnd.copy(a.lg).lerp(b.lg,f);
  const sunI=m(a.sunI,b.sunI),hI2=m(a.hI,b.hI);
  U.uSunI.value=sunI;U.uHemiI.value=hI2;U.uNight.value=m(a.night,b.night);
  hemi.color.copy(C.hemiSky);hemi.groundColor.copy(C.hemiGnd);hemi.intensity=hI2;dl.color.copy(C.sun);dl.intensity=sunI;
  dirAE(-0.5,m(a.lightE,b.lightE),U.uSunDir.value);dl.position.copy(U.uSunDir.value).multiplyScalar(100);
  const sunE=m(a.sunE,b.sunE),moonE=m(a.moonE,b.moonE),su=skyMat.uniforms;
  dirAE(-0.5,sunE,su.uDisc.value);dirAE(-0.95,moonE,su.uMoon.value);su.uGlow.value.copy(a.lw).lerp(b.lw,f);
  const cu=cloudMat.uniforms;cu.uSunDir.value.copy(sunE>-0.08?su.uDisc.value:su.uMoon.value);
  cu.uCLit.value.set(m(a.cL[0],b.cL[0]),m(a.cL[1],b.cL[1]),m(a.cL[2],b.cL[2]));
  cu.uCShade.value.set(m(a.cS[0],b.cS[0]),m(a.cS[1],b.cS[1]),m(a.cS[2],b.cS[2]));
  const fd=m(a.fogD,b.fogD);U.uFogDensity.value=fd;scene.fog.density=fd;
  const fc=U.uFogColor.value;fc.setRGB(Math.pow(C.horizon.r,1/2.2),Math.pow(C.horizon.g,1/2.2),Math.pow(C.horizon.b,1/2.2));
  scene.fog.color.copy(fc);renderer.setClearColor(fc,1);
}
function updateTOD(dt){
  if(tod.auto){if(tod.delay>0)tod.delay-=dt;else tod.s=(tod.s+dt/36)%5;}
  else{const d=((tod.target-tod.s+7.5)%5)-2.5;tod.s=(tod.s+d*Math.min(1,dt*1.3)+5)%5;}
  applyTOD(tod.s);
}
(function todUI(){
  const btns=[...document.querySelectorAll('#tod button')];
  const mark=()=>btns.forEach(b=>b.classList&&b.classList.toggle('on',tod.auto?b.dataset.k==='auto':+b.dataset.k===tod.target));
  const set=k=>{if(k==='auto'){tod.auto=true;tod.delay=0;}else{tod.auto=false;tod.target=+k;}mark();};
  btns.forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();set(b.dataset.k);}));
  window.addEventListener('keydown',e=>{const m={Digit1:4,Digit2:0,Digit3:2,Digit4:3,KeyT:'auto'}[e.code];if(m!==undefined)set(m);});
})();

/* =====================================================================
   8. INIT, RESIZE, LOOP
   ===================================================================== */
function init(){
  treeMat=new THREE.MeshLambertMaterial({vertexColors:true});
  treeMat.onBeforeCompile=sh=>{sh.uniforms.uTime=U.uTime;
    sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
      float hh=max(position.y,0.0);
      vec2 ip=instanceMatrix[3].xz;
      float ph=ip.x*0.045+ip.y*0.031;
      float sw=sin(uTime*0.9+ph)*0.6+sin(uTime*1.7+ph*2.3)*0.4;
      float am=0.0034*hh*hh;
      transformed.x+=sw*am+sin(uTime*2.4+position.x*1.9+position.y*1.3+ph*3.0)*0.010*hh;
      transformed.z+=cos(uTime*0.8+ph*1.3)*am*0.6+cos(uTime*2.1+position.z*1.7+position.y*1.1)*0.010*hh;`);};
  treeMat.customProgramCacheKey=()=>'treeSway';
  rockMat=new THREE.MeshLambertMaterial({vertexColors:true});
  const oakCols=[{dark:L(0x2c7a3a),light:L(0x86c94a),top:L(0xc3e063)},{dark:L(0x347f3d),light:L(0xa0d150),top:L(0xd6e868)}];
  const trunkOak={h:3.4,rt:0.16,rb:0.34,dark:L(0x4b3324),light:L(0x80603f),bands:false};
  geoms=[
    buildTree(Object.assign({trunk:trunkOak,blobs:oakBlobs(11),disp:0.16,seed:1.3},oakCols[0])),
    buildTree(Object.assign({trunk:trunkOak,blobs:oakBlobs(29),disp:0.18,seed:4.1},oakCols[1])),
    buildTree({trunk:{h:5,rt:0.09,rb:0.19,dark:L(0xcfcabb),light:L(0xf0ece0),bands:true},blobs:[[0,2.3,0,1.7],[0.8,1.3,0.5,1.25],[-0.7,1.6,-0.5,1.3],[0.2,3.1,-0.2,1.1]],disp:0.15,seed:7.7,dark:L(0x58a53c),light:L(0xc4e268),top:L(0xe8f58a)}),
    buildPine(3.1)
  ];
  bushGeo=buildTree({trunk:null,blobs:[[0,0.5,0,0.9],[0.7,0.35,0.2,0.65],[-0.6,0.4,-0.3,0.7]],disp:0.2,seed:9.9,dark:L(0x2f7f3a),light:L(0x7cc646),top:L(0xb5dd5a)});
  rg=[buildRock(1.7),buildRock(5.3),buildRock(8.9)];

  sky=new THREE.Mesh(new THREE.SphereGeometry(1,32,16),skyMat);sky.frustumCulled=false;sky.renderOrder=-1000;scene.add(sky);
  {
    const pf=[];
    for(let k=0;k<Q.clouds;k++){
      const front=k<7,az=front?-Math.PI/2+rr(-0.7,0.7):rr(0,6.283),el=front?rr(0.2,0.65):0.14+Math.pow(rnd(),1.5)*0.9;
      const R=450,ce=Math.cos(el),dx=Math.cos(az)*ce,dy=Math.sin(el),dz=Math.sin(az)*ce,tx=-Math.sin(az),tz=Math.cos(az);
      const Wd=rr(110,210)*(1.2-el*0.45),np=8+((rnd()*5)|0);
      for(let p=0;p<np;p++){
        const o=rr(-1,1),on=Math.abs(o),ox=o*Wd*0.5,oy=rr(-0.04,0.13)*Wd*(1-0.65*on)+(1-on)*Wd*0.04,sz=Wd*rr(0.26,0.46)*(1-0.4*on);
        pf.push(dx*R+tx*ox,dy*R+oy,dz*R+tz*ox,sz,rnd());
      }
    }
    const np=pf.length/5,aPos=new Float32Array(np*3),aSS=new Float32Array(np*2);
    for(let i=0;i<np;i++){aPos[i*3]=pf[i*5];aPos[i*3+1]=pf[i*5+1];aPos[i*3+2]=pf[i*5+2];aSS[i*2]=pf[i*5+3];aSS[i*2+1]=pf[i*5+4];}
    const m=new THREE.Mesh(instGeo(new THREE.PlaneGeometry(1,1),np,{aPos:[aPos,3],aSS:[aSS,2]}),cloudMat);m.frustumCulled=false;m.renderOrder=2;scene.add(m);
  }
  {
    const n=Q.pollen,p=new Float32Array(n*3),s=new Float32Array(n);
    for(let i=0;i<n;i++){p[i*3]=rnd();p[i*3+1]=rnd();p[i*3+2]=rnd();s[i]=rnd();}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aS',new THREE.BufferAttribute(s,1));
    const m=new THREE.Points(g,pollenMat);m.frustumCulled=false;m.renderOrder=3;scene.add(m);
  }

  const st=findStart();
  Object.assign(DEF,{th:st.th,x:st.x,z:st.z});Object.assign(tgt,DEF);
  cur.x=DEF.x;cur.z=DEF.z;cur.th=DEF.th+0.55;cur.y=Math.max(terrainH(cur.x,cur.z),0.5)+2.6;
  updateCamera(0.016);
  try{                                            // il cavallo non deve mai impedire di vedere la valle
    horse=createHorse(scene);
    const fx=-Math.sin(DEF.th),fz=-Math.cos(DEF.th);horse.place(DEF.x-fx*34,DEF.z-fz*34,fx,fz);   // ~25 m davanti alla camera iniziale
    document.getElementById('coat').textContent='Cavallo arabo · manto '+horse.coat.n;
	document.getElementById('coat').addEventListener('click',()=>{
		horse.nextCoat();
	});
    console.log('[cavallo] manto:',horse.coat.n);
  }catch(err){console.error('Cavallo non caricato:',err);}
  
  // Genera e posiziona i greggi nella direzione della visuale iniziale.
  try {
    sheep=createSheep(scene);
    const fx=-Math.sin(cur.th), 
	fz=-Math.cos(cur.th);
    sheep.place(cur.x,cur.z,fx,fz);
    sheep.update(0.016,{x:cur.x,z:cur.z},horse?horse.state:null);
    console.log('[pecore] greggi generati:', sheep.flocks.length);
  } catch(err) { console.error('Pecore non caricate:',err); }
  
  applyTOD(0);plan();pump(Infinity,150);
}
function resize(){
  const w=window.innerWidth,h=window.innerHeight,a=w/h;
  renderer.setSize(w,h);camera.aspect=a;
  camera.fov=a<1.2?clamp(2*Math.atan(0.577/a)*180/Math.PI,50,72):50;
  camera.updateProjectionMatrix();
  U.uPointScale.value=70*dpr*(h/900);
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
const clock=new THREE.Clock();let accT=0,accF=0,planT=0;
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),0.05);t+=dt;introT+=dt;U.uTime.value=t;
  updateCamera(dt);sky.position.copy(camera.position);updateTOD(dt);
  if(horse)horse.update(dt,t,{x:cur.x,z:cur.z});
  if(sheep) sheep.update(dt,{x:cur.x,z:cur.z},horse?horse.state:null);
  planT-=dt;if(planT<=0){plan();planT=0.25;}
  pump(introT<8?9:4,Infinity);
  renderer.render(scene,camera);
  if(t>10){accT+=dt;accF++;if(accT>1.5){const fps=accF/accT;accT=0;accF=0;
    if(fps<38&&dpr>1){dpr=Math.max(1,dpr-0.25);renderer.setPixelRatio(dpr);resize();}}}
}

resize();
setTimeout(()=>{
  try{init();}catch(err){loader.textContent='Errore: '+err.message;console.error(err);return;}
  frame();
  loader.style.opacity=0;setTimeout(()=>loader.remove(),1000);
},60);
})();
</script>
