  var mmCanvas = document.getElementById('minimap-canvas');
  var mmCtx = mmCanvas.getContext('2d');

  function drawMinimap() {
    var w = mmCanvas.width;
    var h = mmCanvas.height;
    mmCtx.fillStyle = '#030b14';
    mmCtx.fillRect(0, 0, w, h);

    var scale = 9; // pixel per cella
    var pGx = player.x / CELL_SIZE;
    var pGz = player.z / CELL_SIZE;

    var radiusCells = Math.ceil((w / 2) / scale) + 1;
    var startX = Math.floor(pGx - radiusCells);
    var endX = Math.ceil(pGx + radiusCells);
    var startZ = Math.floor(pGz - radiusCells);
    var endZ = Math.ceil(pGz + radiusCells);

    for (var gx = startX; gx <= endX; gx++) {
      for (var gz = startZ; gz <= endZ; gz++) {
        var c = getCell(gx, gz);
        if (c === CELL_VOID) continue;

        var sx = (w * 0.5) + (gx - pGx - 0.5) * scale;
        var sy = (h * 0.5) + (gz - pGz - 0.5) * scale;

        if (c === CELL_FLOOR) {
          mmCtx.fillStyle = '#12263a';
        } else if (c === CELL_WALL_STONE) {
          mmCtx.fillStyle = '#3868c8';
        } else if (c === CELL_WALL_BRICK) {
          mmCtx.fillStyle = '#b83830';
        } else if (c === CELL_WALL_WOOD) {
          mmCtx.fillStyle = '#9c6228';
        } else if (c === CELL_WALL_ROCK) {
          mmCtx.fillStyle = '#6e665e';
        } else if (c === CELL_WALL_MOSS) {
          mmCtx.fillStyle = '#387a42';
        } else if (c === CELL_WALL_GRAY) {
          mmCtx.fillStyle = '#909399';
        } else if (c === CELL_WALL_BLUE) {
          mmCtx.fillStyle = '#203db0';
                } else if (c === CELL_WALL_METAL) {
          mmCtx.fillStyle = '#77858c';
        } else if (c === CELL_WALL_WHITE_ROCK || c === CELL_WALL_WHITE_CAGE) {
          mmCtx.fillStyle = '#c4c6c7';
        } else if (c === CELL_WALL_GRAY_CAGE) {
          mmCtx.fillStyle = '#909399';
        } else if (c === CELL_WALL_BLUE_CAGE) {
          mmCtx.fillStyle = '#203db0';
        } else if (c === CELL_WALL_METAL_CAGE) {
          mmCtx.fillStyle = '#77858c';
        } else if (c === CELL_WALL_WOOD_DECOR) {
          mmCtx.fillStyle = '#bd7f32';
        } else if (c === CELL_WALL_GRAY_DECOR) {
          mmCtx.fillStyle = '#909399';
        } else if (c === CELL_WALL_BLUE_DECOR) {
          mmCtx.fillStyle = '#203db0';
        } else if (c === CELL_WALL_METAL_DECOR) {
          mmCtx.fillStyle = '#77858c';
		} else if (c === CELL_PILLAR) {
          mmCtx.fillStyle = '#6888b8';
        } else if (c === CELL_DOOR_CLOSED) {
          mmCtx.fillStyle = '#00e5ff';
        } else if (c === CELL_DOOR_OPEN) {
          mmCtx.fillStyle = '#005a66';
        }
        mmCtx.fillRect(sx, sy, scale + 0.5, scale + 0.5);
      }
    }

    // Guardie e cani sulla minimappa
    for (var i = 0; i < guards.length; i++) {
      var g = guards[i];
      if (!g.alive) continue;
      var gxPos = (w * 0.5) + (g.x / CELL_SIZE - pGx) * scale;
      var gzPos = (h * 0.5) + (g.z / CELL_SIZE - pGz) * scale;
      if (gxPos >= 0 && gxPos <= w && gzPos >= 0 && gzPos <= h) {
        mmCtx.fillStyle = g.alerted ? '#ff2a2a' : '#ffaa00';
        mmCtx.beginPath();
        mmCtx.arc(gxPos, gzPos, 3, 0, Math.PI * 2);
        mmCtx.fill();
      }
    }

    for (var dIdx = 0; dIdx < dogs.length; dIdx++) {
      var dg = dogs[dIdx];
      if (!dg.alive) continue;
      var dxPos = (w * 0.5) + (dg.x / CELL_SIZE - pGx) * scale;
      var dzPos = (h * 0.5) + (dg.z / CELL_SIZE - pGz) * scale;
      if (dxPos >= 0 && dxPos <= w && dzPos >= 0 && dzPos <= h) {
        mmCtx.fillStyle = dg.alerted ? '#ff6600' : '#d4882a';
        mmCtx.beginPath();
        mmCtx.arc(dxPos, dzPos, 2.5, 0, Math.PI * 2);
        mmCtx.fill();
      }
    }

    // Cono visivo giocatore
    var cx = w * 0.5;
    var cy = h * 0.5;
    var lookAng = -player.yaw - Math.PI * 0.5;

    mmCtx.fillStyle = 'rgba(85, 255, 255, 0.18)';
    mmCtx.beginPath();
    mmCtx.moveTo(cx, cy);
    mmCtx.arc(cx, cy, 24, lookAng - 0.55, lookAng + 0.55);
    mmCtx.closePath();
    mmCtx.fill();

    // Puntino giocatore
    mmCtx.fillStyle = '#55ff55';
    mmCtx.beginPath();
    mmCtx.arc(cx, cy, 3.5, 0, Math.PI * 2);
    mmCtx.fill();
  }

  /* ============================================================================

  function initInitialLevel() {
    // Pulisci eventuale stato precedente
    while (worldMeshes.children.length > 0) {
      worldMeshes.remove(worldMeshes.children[0]);
    }
    for (var i = 0; i < guards.length; i++) {
      scene.remove(guards[i].root);
    }
    for (var j = 0; j < dogs.length; j++) {
      scene.remove(dogs[j].root);
    }
    for (var k = 0; k < droppedPickups.length; k++) {
      scene.remove(droppedPickups[k].group);
    }
        for (var m = 0; m < gorePieces.length; m++) {
      scene.remove(gorePieces[m].mesh);
      disposeGoreMaterials(gorePieces[m].mesh);
    }
    for (var bs = 0; bs < bloodStains.length; bs++) {
      scene.remove(bloodStains[bs]);
    }
    bloodStains = [];
    for (var n = 0; n < wallDecals.length; n++) {
      scene.remove(wallDecals[n]);
      wallDecals[n].material.dispose();
    }
    worldGrid = {};
    builtCells = {};
    doors = [];
    doorMap = {};
    chandeliers = [];
    guards = [];
    dogs = [];
    droppedPickups = [];
    for (var rpk = 0; rpk < roomPickups.length; rpk++) scene.remove(roomPickups[rpk].group);
    roomPickups = [];
    for (var rpr = 0; rpr < roomProps.length; rpr++) scene.remove(roomProps[rpr]);
    roomProps = [];
    gorePieces = [];
    wallDecals = [];
    propObstacles = [];
    clearMolotovEffects();
    state.molotovs = 5;
    state.throwAnim = 0;
    state.roomsGenerated = 0;
	pillarThemeMap = {};

    // Stanza 1 (Stanza iniziale del giocatore): [-2..2] x [-2..2]
	//xxxxxxxxxxxxxxxxxxx
    carveRoom(-2, 2, -2, 2, CELL_WALL_STONE, 999, 999, 0);

    // Porta Nord della stanza 1 (0, -2) -> Stanza 2 già presente all'avvio [-2..2] x [-6..-2]
    var doorN = doorMap[gridKey(0, -2)];
    if (!doorN) {
      setCell(0, -2, CELL_DOOR_CLOSED);
      delete builtCells[gridKey(0, -2)];
      buildCellGeometry(0, -2);
      doorN = doorMap[gridKey(0, -2)];
    }
    doorN.expanded = true;
    carveRoom(-2, 2, -6, -2, CELL_WALL_BRICK, 0, -2, 1, rollDogCount());

    // Porta Est della stanza 1 (2, 0) -> Stanza 3 già presente all'avvio [2..6] x [-2..2]
    var doorE = doorMap[gridKey(2, 0)];
    if (!doorE) {
      setCell(2, 0, CELL_DOOR_CLOSED);
      delete builtCells[gridKey(2, 0)];
      buildCellGeometry(2, 0);
      doorE = doorMap[gridKey(2, 0)];
    }
    doorE.expanded = true;
    carveRoom(2, 6, -2, 2, CELL_WALL_WOOD, 2, 0, 2, rollDogCount());

    // Posiziona il giocatore al centro della Stanza 1 rivolto verso Nord
    player.x = 0;
    player.z = 0;
    player.yaw = 0;
    player.pitch = 0;

    state.dead = false;
    state.health = 100;
    state.score = 0;
    state.ammo = 99;
    switchWeapon(1);
    updateHUD();
  }

  // Joystick analogico sinistro su mobile
  var joyTouchId = null;
  var joyCenterX = 0;
  var joyCenterY = 0;
  var joyMaxRadius = 38;

  function updateJoystickFromTouch(clientX, clientY) {
    var dx = clientX - joyCenterX;
    var dy = clientY - joyCenterY;
    var dist = Math.hypot(dx, dy);
    if (dist > joyMaxRadius) {
      dx = (dx / dist) * joyMaxRadius;
      dy = (dy / dist) * joyMaxRadius;
    }
    joystickKnob.style.transform = 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px)';
    touchMoveX = dx / joyMaxRadius;
    touchMoveY = -dy / joyMaxRadius;
  }

    e.preventDefault();
    e.stopPropagation();
    var t = e.changedTouches[0];
    var rect = joystickZone.getBoundingClientRect();
    joyTouchId = t.identifier;
    joyCenterX = rect.left + rect.width * 0.5;
    joyCenterY = rect.top + rect.height * 0.5;
    updateJoystickFromTouch(t.clientX, t.clientY);
  }, { passive: false });

  joystickZone.addEventListener('touchmove', function(e) {
    if (joyTouchId === null) return;
    e.preventDefault();
    e.stopPropagation();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.identifier === joyTouchId) {
        updateJoystickFromTouch(t.clientX, t.clientY);
        break;
      }
    }
  }, { passive: false });

  function endJoystickTouch(e) {
    if (joyTouchId === null) return;
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joyTouchId) {
        joyTouchId = null;
        resetJoystick();
        break;

  function damagePlayer(amount) {

    state.facePainTimer = 0.45;
    triggerScreenFlash('rgba(220, 0, 0, 0.42)');

      aimTouchId = null;

      }

      playOverlay.style.display = 'flex';

  function updateSimulation(dt) {
    state.time += dt;

for (var c = 0; c < chandeliers.length; c++) {
      var ch = chandeliers[c];

      if (ch.broken) {
        ch.flickerTimer -= dt;
        if (ch.flickerTimer <= 0) {
          var roll = Math.random();
          if (roll < 0.28) {
            // Falso contatto / buio quasi totale o spento
            ch.flickerFactor = Math.random() < 0.65 ? 0.0 : 0.12;
            ch.flickerTimer = 0.03 + Math.random() * 0.14;
          } else if (roll < 0.62) {
            // Luce fioca o instabile
            ch.flickerFactor = 0.25 + Math.random() * 0.45;
            ch.flickerTimer = 0.04 + Math.random() * 0.18;
          } else {
            // Breve picco normale prima del prossimo difetto
            ch.flickerFactor = 0.85 + Math.random() * 0.25;
            ch.flickerTimer = 0.05 + Math.random() * 0.25;
          }
        }

        var buzz = Math.sin(state.time * 47 + ch.phase) * 0.05;
        ch.intensity = Math.max(0, ch.baseIntensity * ch.flickerFactor + buzz);
      } else {
        var flicker = Math.sin(state.time * 9.5 + ch.phase) * 0.12 +
                      Math.sin(state.time * 23.0 + ch.phase * 2.1) * 0.06;
        ch.intensity = ch.baseIntensity + flicker;
      }

      // Sincronizza cono luminoso e candele con l'intensità attuale
      var ratio = Math.max(0, Math.min(1.25, ch.intensity / ch.baseIntensity));
      if (ch.coneMat) {
        ch.coneMat.opacity = ch.coneBaseOpacity * ratio;
        ch.cone.visible = ratio > 0.02;
      }
      if (ch.cone && ch.broken) {
        var jitter = (ratio < 0.2) ? 0.04 : 0.01;
        ch.cone.rotation.z = Math.sin(state.time * 38 + ch.phase) * jitter;
        ch.cone.rotation.x = Math.cos(state.time * 31 + ch.phase) * jitter;
      }
      if (ch.bulbMat && ch.baseColor) {
        var dim = 0.15 + 0.85 * Math.min(1, ratio);
        ch.bulbMat.color.setRGB(
          ch.baseColor.r * dim,
          ch.baseColor.g * dim,
          ch.baseColor.b * dim
        );
      }
    }

    updateChandelierLights();
    updateMolotovs(dt);
    updateFires(dt);

    // Decadimento lampo di sparo
    flameMaterial.uniforms.uTime.value += dt;
    if (state.muzzleLightTimer > 0) {
      state.muzzleLightTimer -= dt;
      var flamePulse = 0.88 + Math.sin(flameMaterial.uniforms.uTime.value * 43) * 0.12;
      muzzleMesh.scale.setScalar(flamePulse);
      for (var fi = 0; fi < flameTongues.length; fi++) {
        flameTongues[fi].rotation.z += dt * (fi - 1) * 2.8;
        flameTongues[fi].scale.y = 0.82 + Math.random() * 0.38;
      }
      if (state.muzzleLightTimer <= 0) {
        muzzleLight.intensity = 0;
        muzzleMesh.visible = false;
      }
    }

    // Animazione volto B.J. Blazkowicz
    state.faceTimer -= dt;
    if (state.faceTimer <= 0) {
      state.faceTimer = 0.8 + Math.random() * 1.4;
      var dirs = [-1, 0, 1, 0];
      state.faceLookDir = dirs[Math.floor(Math.random() * dirs.length)];
      drawBJFace();
    }
    if (state.faceGrinTimer > 0) {
      state.faceGrinTimer -= dt;
      if (state.faceGrinTimer <= 0) drawBJFace();
    }
    if (state.facePainTimer > 0) {
      state.facePainTimer -= dt;
      if (state.facePainTimer <= 0) drawBJFace();
    }


//ALB
// Cooldown e fuoco automatico mitragliatore
    if (state.fireCooldown > 0) {
      state.fireCooldown -= dt;
    }
    if (state.playing && !state.dead && mouseDown && state.currentWeapon === 3 && state.fireCooldown <= 0) {
      fireWeapon();
    }

    // Animazione porte scorrevoli
    for (var d = 0; d < doors.length; d++) {
      var door = doors[d];
      if (door.opening && door.openAmount < 1) {
        door.openAmount = Math.min(1, door.openAmount + dt * 2.1);
        // L'anta scorre lateralmente dentro lo stipite
        door.slab.position.x = door.openAmount * (CELL_SIZE - 0.62);
        if (door.openAmount >= 0.72) {
          setCell(door.gx, door.gz, CELL_DOOR_OPEN);
        }
      }
    }

    // Aggiornamento particelle e bossoli
    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p];
      pt.life -= dt;
      if (pt.life <= 0) {
        scene.remove(pt.mesh);
        particles.splice(p, 1);
        continue;
      }
      pt.vy -= pt.gravity * dt;
      if (pt.grow) pt.mesh.scale.multiplyScalar(1 + pt.grow * dt);
      pt.mesh.position.x += pt.vx * dt;
      pt.mesh.position.y += pt.vy * dt;
      pt.mesh.position.z += pt.vz * dt;
      if (pt.mesh.position.y < 0.03) {
        pt.mesh.position.y = 0.03;
        pt.vy *= -0.35;
        pt.vx *= 0.7;
        pt.vz *= 0.7;
      }
      if (pt.spin) {
        pt.mesh.rotation.x += 12 * dt;
        pt.mesh.rotation.z += 9 * dt;
											 

												  
											 
									   
									  
						   
						   
				
					   
						   
						   
		 
      }

											  
											  
											  
    }
//ALB ^^^

    // Raccolta automatica di medikit e munizioni collocati davanti alle wall decor.
    for (var rp = 0; rp < roomPickups.length; rp++) {
      var roomPk = roomPickups[rp];
      if (roomPk.collected) continue;
      if (Math.hypot(roomPk.x - player.x, roomPk.z - player.z) < 1.25) collectRoomPickup(roomPk);
    }

    // Raccolta armi e munizioni cadute passando sopra o premendo E
    for (var pkIdx = 0; pkIdx < droppedPickups.length; pkIdx++) {
      var pk = droppedPickups[pkIdx];
      if (pk.collected) continue;
      pk.group.rotation.y += dt * 1.4;
      if (Math.hypot(pk.x - player.x, pk.z - player.z) < 1.35) {
        collectPickup(pk);
      }
    }

    // Aggiornamento frammenti smembrati con gravità e rimbalzo sul pavimento
    // Aggiornamento frammenti smembrati con gravità e rimbalzo sul pavimento
    for (var gp = gorePieces.length - 1; gp >= 0; gp--) {
      var piece = gorePieces[gp];
      var speedSq = piece.vx * piece.vx + piece.vz * piece.vz + piece.vy * piece.vy;

      piece.vy -= 15.5 * dt;
      piece.mesh.position.x += piece.vx * dt;
      piece.mesh.position.y += piece.vy * dt;
      piece.mesh.position.z += piece.vz * dt;

      if (piece.mesh.position.y <= piece.floorY) {
        piece.mesh.position.y = piece.floorY;
        if (Math.abs(piece.vy) > 0.8) {
          piece.vy = -piece.vy * 0.36;
          piece.vx *= 0.65;
          piece.vz *= 0.65;
        } else {
          piece.vy = 0;
          piece.vx *= 0.72;
          piece.vz *= 0.72;
        }
      }

      // Lascia sangue solo mentre il pezzo è ancora in movimento e distanziato dall'ultima macchia
      var horizSpeedSq = piece.vx * piece.vx + piece.vz * piece.vz;
      if (horizSpeedSq > 0.15) {
        var lastX = (piece.lastBloodX !== undefined) ? piece.lastBloodX : piece.mesh.position.x + 999;
        var lastZ = (piece.lastBloodZ !== undefined) ? piece.lastBloodZ : piece.mesh.position.z + 999;
        if (Math.hypot(piece.mesh.position.x - lastX, piece.mesh.position.z - lastZ) > 0.28) {
          addBloodStain(piece.mesh.position.x, piece.mesh.position.z);
          piece.lastBloodX = piece.mesh.position.x;
          piece.lastBloodZ = piece.mesh.position.z;
        }
      }

      var spinDamping = Math.exp(-5 * dt);
      piece.rvx *= spinDamping;
      piece.rvy *= spinDamping;
      piece.rvz *= spinDamping;
      if (piece.mesh.position.y <= piece.floorY && Math.abs(piece.vy) < 0.8) {
        if (Math.abs(piece.vx) < 0.04) piece.vx = 0;
        if (Math.abs(piece.vz) < 0.04) piece.vz = 0;
        if (Math.abs(piece.rvx) < 0.08) piece.rvx = 0;
        if (Math.abs(piece.rvy) < 0.08) piece.rvy = 0;
        if (Math.abs(piece.rvz) < 0.08) piece.rvz = 0;
      }

      piece.mesh.rotation.x += piece.rvx * dt;
      piece.mesh.rotation.y += piece.rvy * dt;
      piece.mesh.rotation.z += piece.rvz * dt;
    }

    // Aggiornamento Guardie (AI, movimento, sparo, crollo realistico a terra)
    for (var gIdx = 0; gIdx < guards.length; gIdx++) {
      var g = guards[gIdx];

      if (!g.alive) {
        if (g.burnMat && (g.burning || g.burnTime < g.burnRunDuration)) updateBurningGuard(g, dt);
        var stillRunning = g.burnMat && g.burnTime < g.burnRunDuration;
	  // Movimento e attrito del torso a terra quando viene colpito
        if (Math.abs(g.vx) > 0.05 || Math.abs(g.vz) > 0.05) {
          var nextGx = g.x + g.vx * dt;
          var nextGz = g.z + g.vz * dt;
          if (isWalkable(nextGx, g.z, 0.45) && !isBlockedByProps(nextGx, g.z, 0.2)) g.x = nextGx;
          else g.vx *= -0.3;

          if (isWalkable(g.x, nextGz, 0.45) && !isBlockedByProps(g.x, nextGz, 0.2)) g.z = nextGz;
          else g.vz *= -0.3;

          g.root.position.set(g.x, 0, g.z);
          addBloodStain(g.x, g.z);

          var friction = Math.exp(-5.5 * dt);
          g.vx *= friction;
          g.vz *= friction;
        } else {
          g.vx = 0;
          g.vz = 0;
        }
        // Crollo in avanti/di lato a terra con l'arma che scende lungo il corpo (mai dritta verticale)
        if (g.deathProgress < 1 && !stillRunning) {
          g.deathProgress = Math.min(1, g.deathProgress + dt * 3.2);
          var ease = 1 - Math.pow(1 - g.deathProgress, 2);
          g.bodyPivot.rotation.x = ease * (Math.PI * 0.48);
          g.bodyPivot.rotation.z = ease * 0.24;
          g.bodyPivot.position.y = ease * 0.24;
          g.rifleGroup.rotation.x = 0.14 + ease * 0.95;
          g.rifleGroup.position.y = -0.06 - ease * 0.14;
        }
        continue;
      }

      if (g.painTimer > 0) {
        g.painTimer -= dt;
        g.torso.material = matGuardUniformBlood; // Flash visivo hit
      } else {
        g.torso.material = matGuardUniform;
      }

      if (g.flashTimer > 0) {
        g.flashTimer -= dt;
        if (g.flashTimer <= 0) g.enemyFlash.visible = false;
      }

      var dx = player.x - g.x;
      var dz = player.z - g.z;
      var dist = Math.hypot(dx, dz);

      // Linea di vista verso il giocatore
      var hasLOS = false;
      if (dist < CELL_SIZE * 5.2) {
        hasLOS = true;
        var steps = Math.floor(dist / 0.35);
        for (var s = 1; s < steps; s++) {
          var t = s / steps;
          var c = getCell(worldToGridX(g.x + dx * t), worldToGridZ(g.z + dz * t));
          if (c !== CELL_FLOOR && c !== CELL_DOOR_OPEN) {
            hasLOS = false;
            break;
          }
        }
      }

      if (hasLOS && state.playing) {
        g.alerted = true;
      }

      if (g.alerted && state.playing && !state.dead && g.painTimer <= 0) {
        var targetYaw = Math.atan2(dx, dz);
        g.yaw = targetYaw;
        g.root.rotation.y = g.yaw;

        // Avanza se lontano, fermati a distanza di tiro
        if (dist > 3.2) {
          var moveSpd = 2.35 * dt;
          var nx = g.x + Math.sin(g.yaw) * moveSpd;
          var nz = g.z + Math.cos(g.yaw) * moveSpd;
          if (isWalkable(nx, g.z, 0.42) && !isMoveBlockedByActors(g.x, g.z, nx, g.z, ACTOR_HALF_SIZE, g, true)) g.x = nx;
          if (isWalkable(g.x, nz, 0.42) && !isMoveBlockedByActors(g.x, g.z, g.x, nz, ACTOR_HALF_SIZE, g, true)) g.z = nz;
          g.root.position.set(g.x, 0, g.z);

          g.walkPhase += dt * 9;
          g.legL.rotation.x = Math.sin(g.walkPhase) * 0.45;
          g.legR.rotation.x = -Math.sin(g.walkPhase) * 0.45;
        } else {
          g.legL.rotation.x = 0;
          g.legR.rotation.x = 0;
        }

        // Spara al giocatore se ha linea di vista
        if (hasLOS) {
          g.shootCooldown -= dt;
          if (g.shootCooldown <= 0) {
            g.shootCooldown = 1.35 + Math.random() * 0.9;
            g.enemyFlash.visible = true;
            g.flashTimer = 0.08;
            if (Math.random() < 0.65) {
              damagePlayer(10 + Math.floor(Math.random() * 8));
            }
          }
        }
      }
    }

    // Aggiornamento Cani Pastori Tedeschi (AI corsa veloce, morso, caduta)
    for (var dIdx = 0; dIdx < dogs.length; dIdx++) {
      var dg = dogs[dIdx];
      if (!dg.alive) {
        if (dg.burnMat && (dg.burning || dg.burnTime < dg.burnRunDuration)) updateBurningDog(dg, dt);
        if (dg.deathProgress < 1 && !(dg.burnMat && dg.burnTime < dg.burnRunDuration)) {
          dg.deathProgress = Math.min(1, dg.deathProgress + dt * 3.8);
          dg.body.rotation.z = dg.deathProgress * (Math.PI * 0.48);
          dg.body.position.y = -dg.deathProgress * 0.24;
        }
        continue;
      }

      if (dg.painTimer > 0) {
        dg.painTimer -= dt;
      }

      var ddx = player.x - dg.x;
      var ddz = player.z - dg.z;
      var dDist = Math.hypot(ddx, ddz);

      var dHasLOS = false;
      if (dDist < CELL_SIZE * 5.5) {
        dHasLOS = true;
        var dSteps = Math.floor(dDist / 0.35);
        for (var ds = 1; ds < dSteps; ds++) {
          var dtRatio = ds / dSteps;
          var dc = getCell(worldToGridX(dg.x + ddx * dtRatio), worldToGridZ(dg.z + ddz * dtRatio));
          if (dc !== CELL_FLOOR && dc !== CELL_DOOR_OPEN) {
            dHasLOS = false;
            break;
          }
        }
      }

      if (dHasLOS && state.playing) {
        dg.alerted = true;
      }

      if (dg.alerted && state.playing && !state.dead && dg.painTimer <= 0) {
        dg.yaw = Math.atan2(ddx, ddz);
        dg.root.rotation.y = dg.yaw;

        if (dDist > 1.55) {
          var dogSpd = 4.35 * dt;
          var dnx = dg.x + Math.sin(dg.yaw) * dogSpd;
          var dnz = dg.z + Math.cos(dg.yaw) * dogSpd;
          if (isWalkable(dnx, dg.z, 0.38) && !isMoveBlockedByActors(dg.x, dg.z, dnx, dg.z, 0.3, null, false)) dg.x = dnx;
          if (isWalkable(dg.x, dnz, 0.38) && !isMoveBlockedByActors(dg.x, dg.z, dg.x, dnz, 0.3, null, false)) dg.z = dnz;
          dg.root.position.set(dg.x, 0, dg.z);

          dg.runPhase += dt * 16;
          var swing = Math.sin(dg.runPhase) * 0.65;
          dg.flLeg.rotation.x = swing;
          dg.brLeg.rotation.x = swing;
          dg.frLeg.rotation.x = -swing;
          dg.blLeg.rotation.x = -swing;
          dg.tail.rotation.y = Math.sin(dg.runPhase * 1.4) * 0.45;
        } else {
          dg.flLeg.rotation.x = 0;
          dg.frLeg.rotation.x = 0;
          dg.blLeg.rotation.x = 0;
          dg.brLeg.rotation.x = 0;
          dg.biteCooldown -= dt;
          if (dg.biteCooldown <= 0) {
            dg.biteCooldown = 1.05;
            dg.body.position.z = 0.22;
            damagePlayer(9 + Math.floor(Math.random() * 6));
          } else {
            dg.body.position.z = Math.max(0, dg.body.position.z - dt * 1.2);
          }
        }
      }
    }
	
	
	//alb
	// Movimento Giocatore
    if (state.playing && !state.dead) {
      if (keys['ArrowLeft']) player.yaw += 2.1 * dt;
      if (keys['ArrowRight']) player.yaw -= 2.1 * dt;
								   
																	  
																   
														
		 
				 
	   

      var forward = touchMoveY;
      var strafe = touchMoveX;
      if (keys['KeyW'] || keys['ArrowUp']) forward += 1;
      if (keys['KeyS'] || keys['ArrowDown']) forward -= 1;
      if (keys['KeyD']) strafe += 1;
      if (keys['KeyA']) strafe -= 1;

      var moveSpeed = 6.2;
      var sinY = Math.sin(player.yaw);
      var cosY = Math.cos(player.yaw);

      var vx = (-sinY * forward + cosY * strafe);
      var vz = (-cosY * forward - sinY * strafe);
      var len = Math.hypot(vx, vz);
      if (len > 0) {
        var speedScale = Math.min(1, len);
        vx = (vx / len) * speedScale * moveSpeed * dt;
        vz = (vz / len) * speedScale * moveSpeed * dt;
																								   
														   
							
				  
		   
		 
	   

        // Controlla porte sul percorso
        checkDoorBump(player.x + vx * 2.2, player.z + vz * 2.2);
	   

        // Collisione separata su X e Z per scivolamento fluido lungo i muri
        if (isWalkable(player.x + vx, player.z, PLAYER_RADIUS) &&
            !isMoveBlockedByActors(player.x, player.z, player.x + vx, player.z, PLAYER_RADIUS, null, false)) {
          player.x += vx;
        }
        if (isWalkable(player.x, player.z + vz, PLAYER_RADIUS) &&
            !isMoveBlockedByActors(player.x, player.z, player.x, player.z + vz, PLAYER_RADIUS, null, false)) {
          player.z += vz;
        }

        player.bobPhase += dt * 11.5 * speedScale;
        player.bobAmount = Math.min(1, player.bobAmount + dt * 6 * speedScale);
													 
													 
													  
													  
											  

								 
												   
									  
									  
									   
									   
																  
				
								  
								  
								  
								  
								
									 
								   
									  
															
      } else {
        player.bobAmount = Math.max(0, player.bobAmount - dt * 6);
		   
		 
      }
    }
	//ALB ^^^^
	
	
	
	
	
	
	
	
	
	

    // Aggiornamento Camera & Oscillazione Armi
    var headBob = Math.sin(player.bobPhase) * 0.055 * player.bobAmount;
    camera.position.set(player.x, PLAYER_HEIGHT + headBob, player.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    // Rinculo e movimento arma in mano
    state.weaponRecoil = Math.max(0, state.weaponRecoil - dt * 6.5);
    var swayX = Math.cos(player.bobPhase * 0.5) * 0.014 * player.bobAmount;
    var swayY = Math.abs(Math.sin(player.bobPhase * 0.5)) * 0.014 * player.bobAmount;

    weaponHolder.position.set(
      swayX,
      -swayY + state.weaponRecoil * 0.025,
      state.weaponRecoil * 0.075
    );
    // Animazione ricarica lenta e azione a pompa dello Shotgun a 2 mani

									 
    if (state.pumpProgress > 0) {
      state.pumpProgress = Math.max(0, state.pumpProgress - dt * 0.85);
      var pumpCycle = Math.sin(state.pumpProgress * Math.PI);
      sgPumpAssembly.position.z = pumpCycle * 0.14;
      sgPumpAssembly.position.y = -pumpCycle * 0.025;
      shotgunGroup.rotation.x = pumpCycle * 0.14;
      shotgunGroup.rotation.z = -pumpCycle * 0.22;
    } else {
      sgPumpAssembly.position.set(0, 0, 0);
      shotgunGroup.rotation.set(0, 0, 0);
    }
  }

  /* ============================================================================
     AVVIO DEL MOTORE & MAIN LOOP
     ============================================================================ */
  var lastTime = performance.now();

  function animate(now) {
    requestAnimationFrame(animate);
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    updateSimulation(dt);
    drawMinimap();
    renderer.render(scene, camera);
  }

  window.onload = function() {
    initInitialLevel();
    drawWeaponSilhouette();
    drawBJFace();
    requestAnimationFrame(animate);
  };
})();


</script>
