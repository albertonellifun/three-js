<!DOCTYPE html>
<html lang="it">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Regata – Mini Pianeta</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cd;
        font-family: system-ui, sans-serif;
        color: #fff
      }

      canvas {
        display: block;
        touch-action: none
      }

      #ui {
        display: none
      }

      /* ---------- schermata iniziale ---------- */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 0%, #2a86c9 0%, #0e4f86 45%, #071b33 100%)
      }

      #m_card {
        xxxwidth: min(460px, 100%);
        width: min(640px, 100%);
        margin: auto;
        box-sizing: border-box;
        padding: 24px 20px;
        border-radius: 22px;
        text-align: center;
        background: rgba(8, 30, 55, .55);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, .3);
        box-shadow: 0 10px 40px rgba(0, 0, 0, .35)
      }

      #m_card h1 {
        margin: 0 0 18px;
        font-size: clamp(26px, 6.5vw, 38px);
        line-height: 1.1;
        text-shadow: 0 2px 8px rgba(0, 0, 0, .4)
      }

      .m_s {
        margin: 16px 0 8px;
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        opacity: .8
      }

      #m_liv {
        display: grid;
        xxxgrid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
        gap: 8px
      }

      .lv {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 6px;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, .25);
        background: rgba(255, 255, 255, .08);
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        touch-action: manipulation
      }

      .lv i {
        display: block;
        width: 100%;
        height: 28px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, .6)
      }

      .lv.on {
        border-color: #ffd60a;
        background: rgba(255, 214, 10, .16)
      }

      #m_r,
      #m_h {
        width: 100%;
        accent-color: #ffd60a
      }

      #m_rv,
      #m_hv {
        font-size: 14px;
        margin-top: 2px
      }

      #m_play {
        margin-top: 22px;
        width: 100%;
        height: 54px;
        border-radius: 14px;
        border: 0;
        background: #ffd60a;
        color: #0b1d33;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation
      }

      #m_play:disabled {
        opacity: .7;
        cursor: default
      }

      #m_err {
        margin-top: 10px;
        font-size: 12px;
        color: #ffb4ab;
        display: none
      }

      /* ---------- HUD (niente backdrop-filter: costoso sopra un canvas WebGL animato) ---------- */
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14px;
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: flex-end;
        pointer-events: none
      }

      .p {
        background: rgba(8, 30, 55, .72);
        border: 1px solid rgba(255, 255, 255, .3);
        border-radius: 16px;
        padding: 8px 12px;
        text-align: center;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .p b {
        font-size: 28px;
        display: block
      }

      .p canvas {
        width: 130px;
        height: 130px
      }

      #help {
        position: fixed;
        top: 0px;
        font-size: 12px;
        text-shadow: 0 1px 3px #000;
        left: 50%;
        transform: translateX(-50%);
      }

      #kn {
        font-size: 18px;
        font-weight: 600;
      }

      #gt {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 2px
      }

      #gt button {
        pointer-events: auto;
        touch-action: manipulation;
        min-width: 30px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, .5);
        background: rgba(255, 255, 255, .15);
        color: #fff;
        font-size: 16px;
        cursor: pointer
      }

      #tc {
        display: none
      }

      .g {
        position: fixed;
        bottom: 4px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-evenly;
        gap: 8px
      }

      .g button {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, .5);
        background: rgba(8, 30, 55, .55);
        color: #fff;
        font-size: 26px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none
      }

      /* regole base: PRIMA della media query, così gli override mobile funzionano */
      #mw {
        position: fixed;
        top: 10px;
        left: 12px;
        padding: 5px;
        border-radius: 14px;
        background: rgba(8, 30, 55, .72);
        border: 1px solid rgba(255, 255, 255, .3);
        text-align: center;
        font-size: 11px;
        pointer-events: auto;
        cursor: zoom-in;
        z-index: 5;
        touch-action: manipulation
      }

      #mw.z {
        cursor: zoom-out
      }

      #mw.z #mp {
        width: min(400px, calc(100vw - 40px));
        height: auto
      }

      #mp {
        width: 200px;
        height: 100px;
        border-radius: 9px
      }

      #tools {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
        xxxpointer-events: none
      }

      #tools button,
      #fps {
        pointer-events: auto;
        font: 600 12px/1 ui-monospace, Menlo, monospace;
        padding: 6px 9px;
        border-radius: 10px;
        background: rgba(8, 30, 55, .72);
        border: 1px solid rgba(255, 255, 255, .3);
      }

      #fps {
        white-space: pre;
        text-align: right;
        line-height: 1.25
      }

      @media(pointer:coarse), (max-width:700px) {
        #tc {
          display: block
        }

        #help {
          display: none
        }

        #hud {
          top: 6px;
          bottom: auto;
          gap: 6px;
          align-items: flex-start;
        }

        .p {
          padding: 4px 6px;
          font-size: 10px;
          border-radius: 12px
        }

        .p canvas {
          width: 84px;
          height: 84px
        }

        .p b {
          font-size: 20px
        }

        #mw.z #mp {
          width: min(260px, calc(100vw - 30px));
          height: auto
        }

        #mp {
          width: 130px;
          height: 65px
        }

        #tools {
          top: 136px;
          right: 8px;
          xxxflex-direction: column-reverse;
        }
      }

      @media (pointer:coarse),
      (min-width: 470px) {
        #tools {
          top: 10px;
          right: 8px;
          flex-direction: column-reverse;
        }
      }

      @media (orientation:portrait) and (pointer:coarse),
      (orientation:portrait) and (max-width:700px) {
        #mw {
          top: auto;
          bottom: 78px;
          left: 8px
        }

        #tools {
          top: auto;
          bottom: 78px;
          right: 8px;
          flex-direction: column;
        }
      }

      body.nui #hud,
      body.nui #mw,
      body.nui #fps,
      body.nui #mu,
      body.nui #cpBtn,
      body.nui #tpBtn,
      body.nui #sailNumBtn,
      body.nui #help,
      body.nui .g {
        filter: url(#nightFx);
      }
    </style>

      //colore livrea + altezza montagne
      function startGame(R, liveryIdx, mountK) {
        const T = THREE,
          V3 = (x, y, z) => new T.Vector3(x, y, z),
          clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const sstep = (a, b, x) => {
          x = clamp((x - a) / (b - a), 0, 1);
          return x * x * (3 - 2 * x)
        };
        const lin = h => new T.Color(h).convertSRGBToLinear();
        const FOG = +new URLSearchParams(location.search).get('f') || .0016;
        const MHK = mountK || 1; // moltiplicatore altezza montagne
        const UWD = .025; //fattore di copertura fondale
        const UWC = lin(0x0e5466);
        const CAM_FLOOR = 1.5;
        const seed = Math.random() * 100;
        let pitch = 0;
        /* distanza angolare minima tra vulcani/isola: scala con R (a R=600 coincide con il vecchio .93) */
        const SEPC = Math.cos(Math.max(.3747, 200 / R));
        /* ---------- noise ---------- */
        function hs(x, y, z) {
          let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967295
        }

        function vn(x, y, z) {
          const ix = Math.floor(x),
            iy = Math.floor(y),
            iz = Math.floor(z);
          let fx = x - ix,
            fy = y - iy,
            fz = z - iz;
          fx *= fx * (3 - 2 * fx);
          fy *= fy * (3 - 2 * fy);
          fz *= fz * (3 - 2 * fz);
          const L = (a, b, t) => a + (b - a) * t,
            h = (a, b, c) => hs(ix + a, iy + b, iz + c);
          return L(L(L(h(0, 0, 0), h(1, 0, 0), fx), L(h(0, 1, 0), h(1, 1, 0), fx), fy), L(L(h(0, 0, 1), h(1, 0, 1), fx), L(h(0, 1, 1), h(1, 1, 1), fx), fy), fz)
        }

        function fbm(x, y, z, o = 5) {
          let s = 0,
            a = .5,
            f = 1;
          for (let i = 0; i < o; i++) {
            s += a * vn(x * f + seed, y * f + seed * .7, z * f + seed * 1.3);
            a *= .5;
            f *= 2.03
          }
          return s
        }
        /* ---------- terreno procedurale ---------- */
        const VR = 34,
          VF = 16;
        const vols = [];
        let lastVol = 1e9;
        //isola del faro
        let lastIsl = 1e9,
          isl = null; // isl = direzione unitaria dell'isola del faro
        const islT = (x, y, z, d) => -6 + 12 * (1 - sstep(14, 52, d)) // piattaforma piana r<14, costa a ~33 m
          +
          (fbm(x * 45, y * 45, z * 45, 2) - .45) * 6 * sstep(14, 30, d); // costa irregolare, piattaforma intatta
        function baseH(x, y, z) {
          let h = (fbm(x * 3, y * 3, z * 3) - .6) * 180;
          if (h > 0) h = (h * 1.5 + sstep(5, 20, h) * (1 - Math.abs(fbm(x * 14, y * 14, z * 14, 3) * 2 - 1)) * 9) * MHK;
          return Math.max(h, -55)
        }

        function hAt(x, y, z) {
          let h = baseH(x, y, z);
          lastVol = 1e9;
          lastIsl = 1e9;
          for (const v of vols) {
            const d = Math.acos(clamp(x * v.x + y * v.y + z * v.z, -1, 1)) * R;
            if (d < 90) {
              lastVol = Math.min(lastVol, d);
              h += (Math.max(h, -8) - h) * sstep(90, 55, d);
              h += 14 * sstep(90, 12, d) + 52 * Math.pow(clamp(1 - Math.max(d, VR) / 55, 0, 1), 1.2) - 16 * sstep(VR, VF, d)
            }
          }
          if (isl) {
            const d = Math.acos(clamp(x * isl.x + y * isl.y + z * isl.z, -1, 1)) * R;
            if (d < 90) {
              lastIsl = d;
              h += (islT(x, y, z, d) - h) * sstep(90, 52, d);
            }
          }
          return h
        }
        const rnd = () => Math.random(),
          rdir = () => {
            for (;;) {
              const x = rnd() * 2 - 1,
                y = rnd() * 2 - 1,
                z = rnd() * 2 - 1,
                l = Math.hypot(x, y, z);
              if (l < 1 && l > .1) return V3(x / l, y / l, z / l)
            }
          };
        for (let i = 0; i < 40000 && vols.length < 3; i++) {
          const d = rdir(),
            h = baseH(d.x, d.y, d.z);
          if (h > -20 && h < 6 && vols.every(v => v.dot(d) < SEPC)) vols.push(d)
        }
        for (let i = 0; i < 60000 && !isl; i++) {
          const d = rdir(),
            b = baseH(d.x, d.y, d.z);
          if (b > -14 || b < -48 || !vols.every(v => v.dot(d) < SEPC)) continue;
          let ok = true;
          for (let k = 0; k < 28 && ok; k++) {
            const r = 30 + rnd() * 130,
              p = d.clone().addScaledVector(rdir(), r / R).normalize();
            ok = baseH(p.x, p.y, p.z) < -5;
          }
          if (ok) isl = d;
        }
        /* ---------- sito piattaforma petrolifera ---------- */
        let plat = null;
        const PCOS = Math.cos(15 / R); // raggio di collisione barca (m)
        {
          const SEPP = Math.cos(Math.min(.9, Math.max(.25, 160 / R)));

{

        const ray = (A, B, D, x, y, z) => {

              const [z, rx, yt, yb, c] = bodyRings[r]; // yb = ventre (basso), yt = dorso (alto)//FIX
              const ym = (yt + yb) * 0.5;
              const cTop = (r === 5 || r === 6) ? cGrey : c;
              const cBot = (r >= 2 && r <= 7) ? cWhite : c;
              ringStart.push(pos.length / 3);
              pushV(0, yt, z, cTop); // 0: dorso (+Y)
              pushV(rx, ym, z, cBot); // 1: fianco dx
              pushV(0, yb, z, cBot); // 2: ventre (-Y)
              pushV(-rx, ym, z, cBot); // 3: fianco sx
            }
            for (let r = 0; r < bodyRings.length - 1; r++) {
              const a = ringStart[r],
                b = ringStart[r + 1];
              for (let s = 0; s < 4; s++) {
                const sn = (s + 1) % 4;
                quad(a + s, b + s, b + sn, a + sn);
              }
            }
            const first = ringStart[0],
              last = ringStart[ringStart.length - 1];
            tri(first, first + 1, first + 2);
            tri(first, first + 2, first + 3);
            tri(last, last + 2, last + 1);
            tri(last, last + 3, last + 2);
            // 2. ALI ARTICOLATE (corrette con il dorso in alto)
            const NW = 10;
            for (const side of [-1, 1]) {
              const wStart = [];
              for (let i = 0; i <= NW; i++) {
                const u = i / NW;
                const x = side * (0.08 + u * 1.48);
                // Profilo ad arco verso l'alto
                const arch = u < 0.42 ?
                  Math.sin((u / 0.42) * Math.PI * 0.5) * 0.14 :
                  0.14 - Math.pow((u - 0.42) / 0.58, 1.3) * 0.16;
                const zLead = u < 0.42 ?
                  -0.18 - Math.sin((u / 0.42) * Math.PI * 0.5) * 0.08 :
                  -0.26 + Math.pow((u - 0.42) / 0.58, 1.4) * 0.58;
                const chord = 0.44 * Math.pow(1 - u * 0.86, 0.75);
                const zTrail = zLead + chord;
                let cTop = cGrey;
                if (u > 0.72) cTop = (u > 0.85 && u < 0.93) ? cWhite : cBlack;
                const cUnder = u > 0.75 ? cBlack : cWhite;
                wStart.push(pos.length / 3);
                pushV(x, arch - 0.045, zLead, cTop); // dorso
                pushV(x, arch - 0.058, zLead + chord * 0.35, cTop); // centro ala
                pushV(x, arch - 0.030, zTrail, cUnder); // ventre/bordo d'uscita
              }
              for (let i = 0; i < NW; i++) {
                const a = wStart[i],
                  b = wStart[i + 1];
                if (side > 0) {
                  quad(a + 0, b + 0, b + 1, a + 1);
                  quad(a + 1, b + 1, b + 2, a + 2);
                } else {
                  quad(a + 0, a + 1, b + 1, b + 0);
                  quad(a + 1, a + 2, b + 2, b + 1);
                }
              }
            }
            const geo = new T.BufferGeometry();
            geo.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
            geo.setAttribute('color', new T.Float32BufferAttribute(col, 3));
            geo.setIndex(idx);
            geo.computeVertexNormals();
            return geo;
          }
          const baseGeo = buildSeagullGeo();
          const mat = new T.ShaderMaterial({
            side: T.DoubleSide,
            uniforms: {
              t: U.t,
              day: U.day,
              sun: U.sun
            },
            vertexShader: `
            attribute vec3 color;
            attribute float aPhase;
            uniform float t;
            varying vec3 vCol;
            varying vec3 vNorm;
            void main() {
              vec3 p = position;
              float span = max(0.0, (abs(p.x) - 0.08) / 1.48);

              float mode = sin(t * 0.55 + aPhase);
              float flapEnv = smoothstep(-0.15, 0.35, mode);

              // Battito d'ali orientato correttamente lungo l'asse Y
              float stroke = sin(t * 7.2 + aPhase * 3.0 - span * 1.4);
              float dy = stroke * flapEnv * pow(span, 1.35) * 0.58;

              p.y += dy;
              p.x += sign(p.x) * abs(dy) * 0.14 * span;

              vCol = color;
              vNorm = normalize(mat3(modelMatrix) * normal);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
            }
          `,
            fragmentShader: `
            uniform float day;
            uniform vec3 sun;
            varying vec3 vCol;
            varying vec3 vNorm;
            void main() {
              float ndl = dot(normalize(vNorm), normalize(sun)) * 0.5 + 0.5;
              vec3 light = mix(vec3(0.22, 0.28, 0.42), vec3(0.65 + 0.45 * ndl), day);
              gl_FragColor = vec4(vCol * light, 1.0);
              #include <encodings_fragment>
            }
          `
          });
          //ombra
          // materiale per la shadow map: stesso battito dello shader del gabbiano
          const depthMat = new T.MeshDepthMaterial({
            depthPacking: T.RGBADepthPacking
          });
          depthMat.onBeforeCompile = s => {
            s.uniforms.t = U.t;
            s.vertexShader = 'uniform float t;\nattribute float aPhase;\n' +
              s.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
          float span = max(0.0, (abs(position.x) - 0.08) / 1.48);
          float flapEnv = smoothstep(-0.15, 0.35, sin(t * 0.55 + aPhase));
          float dy = sin(t * 7.2 + aPhase * 3.0 - span * 1.4) * flapEnv * pow(span, 1.35) * 0.58;
          transformed.y += dy;
          transformed.x += sign(position.x) * abs(dy) * 0.14 * span;`);
          };
          // 6 varianti di geometria con fase di battito diversa, condivise da tutti i gabbiani
          const NV = 6,
            variants = [];
          for (let i = 0; i < NV; i++) {
            const g = baseGeo.clone();
            g.setAttribute('aPhase', new T.BufferAttribute(new Float32Array(g.attributes.position.count).fill(i * 2.1 + rnd()), 1));
            g.boundingSphere = new T.Sphere(V3(0, 0, 0), 2.5); // frustum culling per gabbiano (il battito è nello shader)
            variants.push(g);
          }
          const flocks = [],
            centers = [];
          for (let f = 0; f < NFLOCK; f++) {
            let d = null,
              h = 0;
            for (let i = 0; i < 400; i++) {
              const c = rdir(),
                ch = hAt(c.x, c.y, c.z);
              if (lastVol < 130) continue; // lontano dai vulcani (fumo/lava)
              if (ch > 30) continue; // non sopra le montagne
              if (i < 250 && centers.some(o => o.dot(c) > Math.cos(100 / R))) continue; // distanza minima tra stormi
              d = c;
              h = ch;
              break;
            }
            if (!d) {
              d = rdir();
              h = Math.max(0, hAt(d.x, d.y, d.z));
            }
            centers.push(d);
            const grp = new T.Group();
            grp.position.copy(d).multiplyScalar(R + Math.max(h, 0) + 16 + rnd() * 14);
            grp.quaternion.setFromUnitVectors(Y, d); // Y locale = su del pianeta
            scene.add(grp);
            const n = MINB + (rnd() * (MAXB - MINB + 1) | 0),
              dirK = rnd() < .5 ? 1 : -1, // tutto lo stormo gira nello stesso verso
              baseR = 9 + rnd() * 10,
              birds = [];
            for (let i = 0; i < n; i++) {
              const mesh = new T.Mesh(variants[(rnd() * NV) | 0], mat);
              mesh.scale.setScalar(.95 + rnd() * .35);
              //ombre
              mesh.castShadow = SHADOWS;
              mesh.customDepthMaterial = depthMat;
              grp.add(mesh);
              birds.push({
                mesh,
                rx: baseR * (.8 + rnd() * .4),
                rz: baseR * (.8 + rnd() * .4),
                y0: (rnd() - .5) * 8,
                spd: dirK * (.26 + rnd() * .1),
                ph: rnd() * 6.283
              });
            }
            flocks.push({
              grp,
              birds
            });
          }
          const _bp = V3();
          let nextCry = 4 + rnd() * 6;
          updateBirds = (t) => {
            const cp = cam.position;
            for (const f of flocks) {
              const vis = f.grp.position.distanceToSquared(cp) < HIDE * HIDE;
              f.grp.visible = vis;
              if (!vis) continue;
              for (const b of f.birds) {
                const a = t * b.spd + b.ph;
                const vx = -Math.sin(a) * b.rx * b.spd;
                const vz = Math.cos(a) * b.rz * b.spd;
                b.mesh.position.set(Math.cos(a) * b.rx, b.y0 + Math.sin(t * .85 + b.ph) * 1.6, Math.sin(a) * b.rz);
                b.mesh.rotation.set(0, Math.atan2(-vx, -vz), b.spd > 0 ? -.38 : .38);
              }
            }
            // verso: solo da stormi vicini alla camera, di giorno e fuori dall'acqua
            if (t >= nextCry) {
              const near = flocks.filter(f => f.grp.position.distanceTo(cp) < HEAR);
              if (!near.length) {
                nextCry = t + 3;
                return;
              }
              nextCry = t + 5 + rnd() * 10;
              if (U.day.value > .3 && U.uw.value < .5) {
                const f = near[(rnd() * near.length) | 0],
                  b = f.birds[(rnd() * f.birds.length) | 0];
                b.mesh.getWorldPosition(_bp).applyMatrix4(cam.matrixWorldInverse);
                const d = _bp.length();
                Snd.gull(clamp(_bp.x / Math.max(d, 1), -1, 1) * .85, Math.pow(1 - d / HEAR, 2));
              }
            }
          };
        })();
        /* ---------- faro ---------- */
        const FB = V3(),
          FRAD = 5,
          FTOP = 34; // asse/base per l'evitamento camera
        let faroOn = false;
        let faroUpdate = () => {};
        if (isl)(function() {
          const hb = meshH(isl.x, isl.y, isl.z); // quota della mesh *renderizzata*
          const faro = new T.Group();
          FB.copy(isl).multiplyScalar(R + hb);
          faro.position.copy(FB);
          faro.quaternion.setFromUnitVectors(Y, isl);
          scene.add(faro);
          faro.updateMatrixWorld(true);
          const mk = (c, o = {}) => new T.MeshStandardMaterial(Object.assign({
            color: lin(c),
            roughness: .55,
            metalness: .05
          }, o));
          const wht = mk(0xf4f2ec),
            red = mk(0xc8202c),
            stone = mk(0x8d877e, {
              roughness: .95
            }),
            dark = mk(0x2a2d33, {
              metalness: .3,
              roughness: .4
            });
          const winM = mk(0x1a2230, {
            emissive: lin(0xffc860),
            emissiveIntensity: 0
          });
          const glassM = new T.MeshStandardMaterial({
            color: lin(0xbfe6ff),
            transparent: true,
            opacity: .28,
            roughness: .1,
            metalness: 0,
            side: T.DoubleSide,
            depthWrite: false,
            emissive: lin(0xffd98a),
            emissiveIntensity: 0
          });
          const add = (g, m, x, y, z, cast = true) => {
            const o = new T.Mesh(g, m);
            o.position.set(x, y, z);
            o.castShadow = cast;
            o.receiveShadow = true;
            faro.add(o);
            return o
          };
          // fondazione: affonda di 4.5 m, copre i difetti della mesh a bassa risoluzione
          add(new T.CylinderGeometry(5.4, 7.2, 5.5, 28), stone, 0, -1.75, 0);
          // torre rastremata a 6 fasce bianco/rosso
          const TB = 1,
            TH = 26,
            NB = 6,
            r0 = 3.4,
            r1 = 2.3,
            rAt = y => r0 + (r1 - r0) * (y - TB) / TH;
          for (let i = 0; i < NB; i++) {
            const ya = TB + TH * i / NB,
              yb = TB + TH * (i + 1) / NB;
            add(new T.CylinderGeometry(rAt(yb), rAt(ya), yb - ya, 28), i % 2 ? red : wht, 0, (ya + yb) / 2, 0)
          }
          add(new T.BoxGeometry(1.3, 2.4, .5), mk(0x4a2c1a), 0, 2.2, rAt(2.2)); // porta
          [
            [8, .5],
            [12.5, -.9],
            [17, 1.3],
            [21, -.4]
          ].forEach(([y, a]) => { // finestre
            const w = add(new T.BoxGeometry(.7, 1.1, .5), winM, Math.sin(a) * rAt(y), y, Math.cos(a) * rAt(y), false);
            w.rotation.y = a
          });
          // galleria con ringhiera
          const GY = TB + TH;
          add(new T.CylinderGeometry(3.9, 2.4, .6, 28), dark, 0, GY - .3, 0);
          add(new T.CylinderGeometry(3.9, 3.9, .4, 28), dark, 0, GY + .2, 0);
          add(new T.TorusGeometry(3.7, .06, 6, 40).rotateX(Math.PI / 2), dark, 0, GY + 1.4, 0, false);
          for (let k = 0; k < 16; k++) {
            const a = k / 16 * Math.PI * 2;
            add(new T.CylinderGeometry(.04, .04, 1, 5), dark, Math.sin(a) * 3.7, GY + .9, Math.cos(a) * 3.7, false)
          }
          // lanterna: vetri, montanti, tetto
          const lampY = GY + 1.9;
          const gl = add(new T.CylinderGeometry(1.75, 1.75, 2.5, 24, 1, true), glassM, 0, GY + 1.65, 0, false);
          gl.renderOrder = 2;
          for (let k = 0; k < 8; k++) {
            const a = k / 8 * Math.PI * 2;
            add(new T.CylinderGeometry(.05, .05, 2.5, 5), dark, Math.sin(a) * 1.75, GY + 1.65, Math.cos(a) * 1.75, false)
          }
          add(new T.CylinderGeometry(.45, .6, 1.1, 12), dark, 0, GY + .95, 0, false); // piedistallo ottica
          add(new T.CylinderGeometry(2.3, 2.3, .25, 28), dark, 0, GY + 3.025, 0);
          add(new T.ConeGeometry(2.2, 1.6, 28), red, 0, GY + 3.95, 0);
          add(new T.SphereGeometry(.22, 10, 8), dark, 0, GY + 4.85, 0, false);
          add(new T.CylinderGeometry(.03, .03, 1.2, 5), dark, 0, GY + 5.4, 0, false);
          // ottica rotante: due raggi opposti (coni aperti, additivi, sfumati al bordo/in lunghezza/vicino camera)
          const beamMat = new T.ShaderMaterial({
            transparent: true,
            depthWrite: false,
            side: T.DoubleSide,
            blending: T.AdditiveBlending,
            uniforms: {
              day: U.day,
              col: {
                value: new T.Color(1, .92, .7)
              }
            },
            vertexShader: `varying vec3 vN,vV;varying float vT,vD;
void main(){vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);vD=length(mv.xyz);vT=uv.y;gl_Position=projectionMatrix*mv;}`,
            fragmentShader: `uniform float day;uniform vec3 col;varying vec3 vN,vV;varying float vT,vD;
void main(){float f=pow(abs(dot(normalize(vN),normalize(vV))),1.5);
float a=f*smoothstep(0.,.05,vT)*pow(1.-vT,1.2)*smoothstep(8.,40.,vD)*(.1+.9*(1.-day))*.55;
gl_FragColor=vec4(col,a);
#include <encodings_fragment>
}`
          });
          const lamp = new T.Group();
          lamp.position.set(0, lampY, 0);
          faro.add(lamp);
          const BL = 150,
            bg = new T.CylinderGeometry(11, .9, BL, 20, 1, true)
            .rotateX(Math.PI / 2).translate(0, 0, BL / 2).rotateX(.1); // +z, leggermente verso il basso (curvatura)
          for (let s = 0; s < 2; s++) {
            const b = new T.Mesh(bg, beamMat);
            b.rotation.y = s * Math.PI;
            b.renderOrder = 3;
            b.frustumCulled = false;
            lamp.add(b)
          }
          const core = new T.Mesh(new T.SphereGeometry(.32, 12, 8), new T.MeshBasicMaterial({
            color: 0xfff1c4
          }));
          core.position.copy(lamp.position);
          faro.add(core);
          const gc = document.createElement('canvas');
          gc.width = gc.height = 64;
          const gx = gc.getContext('2d'),
            gg = gx.createRadialGradient(32, 32, 0, 32, 32, 32);
          gg.addColorStop(0, 'rgba(255,255,255,1)');
          gg.addColorStop(.2, 'rgba(255,255,255,.7)');
          gg.addColorStop(.5, 'rgba(255,255,255,.15)');
          gg.addColorStop(1, 'rgba(255,255,255,0)');
          gx.fillStyle = gg;
          gx.fillRect(0, 0, 64, 64);
          const glow = new T.Sprite(new T.SpriteMaterial({
            map: new T.CanvasTexture(gc),
            color: 0xfff0c0,
            blending: T.AdditiveBlending,
            transparent: true,
            depthWrite: false,
            fog: false
          }));
          glow.position.copy(lamp.position);
          glow.renderOrder = 4;
          faro.add(glow);
          const _a = V3();
          faroUpdate = (t, dayK) => {
            const ang = t * .7,
              night = 1 - dayK;
            lamp.rotation.y = ang;
            _a.copy(cam.position);
            faro.worldToLocal(_a);
            _a.sub(lamp.position);
            _a.y = 0;
            const dl = _a.length(),
              fl = dl > 1e-3 ? Math.pow(Math.abs((_a.x * Math.sin(ang) + _a.z * Math.cos(ang)) / dl), 14) : 1; // lampo quando il raggio punta la camera
            glow.material.opacity = (.12 + .88 * fl) * (.15 + .85 * night);
            const s = 4 + 22 * fl * (.3 + .7 * night);
            glow.scale.set(s, s, 1);
            glassM.emissiveIntensity = .15 + 1.1 * night;
            winM.emissiveIntensity = 1.4 * night
          };
          faroOn = true;
        })();
        // camera: la torre è un cilindro-ostacolo (il terreno è già coperto da floorCam)
        const _fd = V3();
        const avoidFaro = v => {
          if (!faroOn) return;
          _fd.copy(v).sub(FB);
          const al = _fd.dot(isl);
          if (al < -4 || al > FTOP) return;
          _fd.addScaledVector(isl, -al);
          const l = _fd.length();
          if (l >= FRAD) return;
          if (l < 1e-3) _fd.copy(tang(isl)[0]);
          else _fd.divideScalar(l);
          v.copy(FB).addScaledVector(isl, al).addScaledVector(_fd, FRAD)
        };
        /* ---------- piattaforma petrolifera ---------- */
        const PB = V3(),
          PRAD = 13; // PB = base a livello del mare; PRAD = ingombro camera
        let platOn = false,
          platUpdate = () => {};
        if (plat)(function() {
          const grp = new T.Group();
          PB.copy(plat).multiplyScalar(R);
          grp.position.copy(PB);
          grp.quaternion.setFromUnitVectors(Y, plat);
          grp.rotateY(rnd() * 6.283);
          scene.add(grp);
          grp.updateMatrixWorld(true);
          const e1 = V3(1, 0, 0).applyQuaternion(grp.quaternion),
            e2 = V3(0, 0, 1).applyQuaternion(grp.quaternion);
          const seabed = (x, z) => {
            const w = PB.clone().addScaledVector(e1, x).addScaledVector(e2, z).normalize();
            return meshH(w.x, w.y, w.z)
          };
          /* --- helper: geometrie non indicizzate con colore per vertice, poi merge() --- */
          const K = {
              steel: lin(0x5d646c),
              dark: lin(0x2b2f35),
              deck: lin(0x777c82),
              orange: lin(0xe8601c),
              yellow: lin(0xf0b800),
              white: lin(0xe9e9e6),
              blue: lin(0x2b4d7a),
              red: lin(0xc8202c),
              grey: lin(0xc9ced3),
              win: lin(0x141a24),
              helid: lin(0x3b4048),
              green: lin(0x2d7a3e)
            },
            AX = V3(0, 1, 0);
          const emit = (L, g, c, p, q, s) => {
            g = g.index ? g.toNonIndexed() : g;
            g.applyMatrix4(new T.Matrix4().compose(p || V3(0, 0, 0), q || new T.Quaternion(), s || V3(1, 1, 1)));
            const n = g.attributes.position.count,
              a = new Float32Array(n * 3);
            for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3);
            g.setAttribute('color', new T.BufferAttribute(a, 3));
            L.push(g);
          };
          const pbx = (L, x, y, z, sx, sy, sz, c, ry = 0) =>
            emit(L, new T.BoxGeometry(sx, sy, sz), c, V3(x, y, z), new T.Quaternion().setFromAxisAngle(AX, ry));
          const pcy = (L, a, b, r0, r1, c, seg = 5) => { // cilindro/puntone da a a b
            const d = b.clone().sub(a),
              len = d.length();
            if (len < 1e-4) return;
            emit(L, new T.CylinderGeometry(r1, r0, len, seg, 1), c, a.clone().add(b).multiplyScalar(.5),
              new T.Quaternion().setFromUnitVectors(AX, d.divideScalar(len)));
          };
          const truss = (L, a, b, rA, rB, n, sides, c, rc, rg, off, x) => { // traliccio generico
            const ax = b.clone().sub(a).normalize(),
              u = V3(Math.abs(ax.y) < .9 ? 0 : 1, Math.abs(ax.y) < .9 ? 1 : 0, 0).cross(ax).normalize(),
              v = ax.clone().cross(u);
            const pt = (i, k) => {
              const f = i / n,
                r = rA + (rB - rA) * f,
                th = off + k / sides * 6.2832;
              return a.clone().lerp(b, f).addScaledVector(u, Math.cos(th) * r).addScaledVector(v, Math.sin(th) * r)
            };
            for (let i = 0; i <= n; i++)
              for (let k = 0; k < sides; k++) {
                const k2 = (k + 1) % sides,
                  p = pt(i, k);
                pcy(L, p, pt(i, k2), rg, rg, c, 3);
                if (i < n) {
                  pcy(L, p, pt(i + 1, k), rc, rc, c, 4);
                  pcy(L, p, pt(i + 1, k2), rg, rg, c, 3);
                  if (x) pcy(L, pt(i, k2), pt(i + 1, k), rg, rg, c, 3);
                }
              }
          };
          const LS = [],
            LW = [],
            LC = [],
            LR = [],
            LH = [];
          /* --- jacket: gambe inclinate fino al fondale + controventi a X --- */
          const DB = 14,
            DT = 15.2,
            S1 = 5.2,
            BAT = .1,
            sp = y => S1 + BAT * (DB - y),
            LG = [
              [-1, -1],
              [1, -1],
              [1, 1],
              [-1, 1]
            ];
          const yb = Math.min(-14, Math.max(-56, Math.min(...LG.map(([sx, sz]) => seabed(sx * 10, sz * 10))) - 1.5));
          const ys = [DB, -4, yb * .4, yb * .7, yb],

        function Sail(nu, nv, mat) {
          const g = new T.BufferGeometry(),
            n = (nu + 1) * (nv + 1),
            uv = new Float32Array(n * 2),
            id = [];
          g.setAttribute('position', new T.BufferAttribute(new Float32Array(n * 3), 3));
          for (let j = 0; j <= nv; j++)
            for (let i = 0; i <= nu; i++) {
              const k = j * (nu + 1) + i;
              uv[k * 2] = i / nu;
              uv[k * 2 + 1] = j / nv;
              if (j < nv && i < nu) id.push(k, k + 1, k + nu + 1, k + 1, k + nu + 2, k + nu + 1)
            }
          g.setAttribute('uv', new T.BufferAttribute(uv, 2));

              n = a.clone().cross(b).normalize();
            if (n.dot(pref) < 0) n.negate();
            for (let j = 0; j <= nv; j++) {

        rg.addEventListener('input', showR);
        showR();
        // Play: l'AudioContext nasce dentro il gesto utente, poi si genera il mondo
        play.addEventListener('click', () => {
          play.disabled = true;
          play.textContent = 'Generazione del mondo…';
          err.style.display = 'none';
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC && !window.__actx) {
            try {
              window.__actx = new AC();
              window.__actx.resume();
            } catch (e) {}
          }
          const R = +rg.value,
            mk = +hg.value,
            li = sel;
          requestAnimationFrame(() => setTimeout(() => {
            try {
              startGame(R, li, mk);
              ui.style.display = 'block';
              menu.remove();
            } catch (e) {
              console.error(e);
              err.textContent = 'Errore nella generazione: ' + e.message;
              err.style.display = 'block';
              play.disabled = false;
              play.textContent = '▶ Play';
            }
          }, 30));
        });
      })();
    </script>
  </body>

</html>
