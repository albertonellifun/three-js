<!DOCTYPE html>
<html lang="it">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cd;
        font-family: system-ui, sans-serif;
        color: #fff
      }

      canvas {
        display: block;
        touch-action: none
      }

      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14px;
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: flex-end;
        pointer-events: none
      }

      .p {
        background: rgba(8, 30, 55, .55);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, .3);
        border-radius: 16px;
        padding: 8px 12px;

        font-size: 13px;
        display: flex;

        font-size: 28px;

      }

      #help {
        position: fixed;
        top: 0px;
        left: 12px;
        font-size: 12px;
        text-shadow: 0 1px 3px #000;
        left: 50%;
        transform: translateX(-50%);
      }

      #gt {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 2px
      }

      #gt button {
        pointer-events: auto;
        touch-action: manipulation;
        min-width: 30px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, .5);
        background: rgba(255, 255, 255, .15);
        color: #fff;
        font-size: 16px;

      }

      #tc {
        display: none
      }

      .g {
        position: fixed;
        bottom: 4px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-evenly;
        gap: 8px
      }

      .g button {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, .5);
        background: rgba(8, 30, 55, .55);
        color: #fff;
        font-size: 26px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none
      }

      /* regole base: PRIMA della media query, così gli override mobile funzionano */
      #fps {
        position: fixed;
        top: 10px;
        right: 12px;
        font: 600 12px/1 ui-monospace, Menlo, monospace;
        padding: 6px 9px;
        border-radius: 10px;
        background: rgba(8, 30, 55, .55);
        border: 1px solid rgba(255, 255, 255, .3);
        backdrop-filter: blur(6px);
        pointer-events: none
      }

      #mw {
        position: fixed;
        top: 10px;
        left: 12px;
        padding: 5px;
        border-radius: 14px;
        background: rgba(8, 30, 55, .55);
        border: 1px solid rgba(255, 255, 255, .3);
        backdrop-filter: blur(6px);
        text-align: center;
        font-size: 11px;

        z-index: 5;
        touch-action: manipulation
      }

      #mw.z {

      }

      #mw.z #mp {
        width: min(400px, calc(100vw - 40px));
        height: auto
      }

      #mp {
        width: 200px;

        border-radius: 9px
      }

      #mu {
        position: fixed;
        top: 42px;

        width: 34px;
        height: 30px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, .3);
        background: rgba(8, 30, 55, .55);

        font-size: 15px;
        cursor: pointer;
        touch-action: manipulation

      @media(pointer:coarse), (max-width:700px) {
        #tc {
          display: block
        }

        #help {
          display: none
        }

        #hud {
          top: 6px;
          bottom: auto;
          gap: 6px;
          align-items: flex-start;
        }

        .p {
          padding: 4px 6px;
          font-size: 10px;
          border-radius: 12px
        }

        .p canvas {
          width: 84px;
          height: 84px
        }

        .p b {
          font-size: 20px
        }

        #mw.z #mp {
          width: min(260px, calc(100vw - 30px));
          height: auto
        }

        #mp {
          width: 130px;
          height: 65px
        }

        #fps {
          top: 136px;
          right: 8px
        }

        #mu {
          top: 168px;
          right: 8px
        }
      }
	  
	  @media (orientation:portrait) and (pointer:coarse),
		   (orientation:portrait) and (max-width:700px) {
	  #mw { top: auto; bottom: 78px; left: 8px }
	}
    </style>

  <body>
    <div id="help">A/D o ◀▶ timone · W/S o ▲▼ cazza/lasca · SPAZIO spinnaker · mouse: orbita, rotella: zoom · T: +3 ore · M: audio</div>
    <div id="fps">-- FPS</div>
    <button id="mu" title="Audio (M)">🔊</button>
    <div id="mw"><canvas id="mp" width="256" height="128"></canvas>
      <div id="mc"></div>

    <div id="hud">
      <div class="p"><canvas id="cw" width="280" height="280"></canvas>
        <div id="tw"></div>
      </div>
      <div class="p">
        <div id="gt">
          <button data-d="-1">−</button>
          <span id="tt">--:--</span>
          <button data-d="1">+</button>
          <button id="tr" title="Orologio di sistema">⟲</button>

          <span id="kn">0.0</span> nodi

      </div>
      <div class="p"><canvas id="cc" width="280" height="280"></canvas>

    </div>
    <div id="tc">
      <div class="g">
        <button data-k="KeyA">◀</button><button data-k="KeyD">▶</button>
        <button data-k="KeyW">▲</button><button data-k="KeyS">▼</button><button id="bs">⛵</button>
      </div>
    </div>
    <script src="./three.min.js"></script>
    <script>
      const T = THREE,
        V3 = (x, y, z) => new T.Vector3(x, y, z),
        clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const sstep = (a, b, x) => {
        x = clamp((x - a) / (b - a), 0, 1);
        return x * x * (3 - 2 * x)
      };
      const lin = h => new T.Color(h).convertSRGBToLinear();
	  const R = +new URLSearchParams(location.search).get('r') || 600;
	  const FOG = +new URLSearchParams(location.search).get('f') || .0016;
	  
      const seed = Math.random() * 100;
      /* ---------- noise ---------- */
      function hs(x, y, z) {
        let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967295
      }

      function vn(x, y, z) {
        const ix = Math.floor(x),
          iy = Math.floor(y),
          iz = Math.floor(z);
        let fx = x - ix,
          fy = y - iy,
          fz = z - iz;
        fx *= fx * (3 - 2 * fx);
        fy *= fy * (3 - 2 * fy);
        fz *= fz * (3 - 2 * fz);
        const L = (a, b, t) => a + (b - a) * t,
          h = (a, b, c) => hs(ix + a, iy + b, iz + c);
        return L(L(L(h(0, 0, 0), h(1, 0, 0), fx), L(h(0, 1, 0), h(1, 1, 0), fx), fy), L(L(h(0, 0, 1), h(1, 0, 1), fx), L(h(0, 1, 1), h(1, 1, 1), fx), fy), fz)
      }

      function fbm(x, y, z, o = 5) {
        let s = 0,
          a = .5,
          f = 1;
        for (let i = 0; i < o; i++) {
          s += a * vn(x * f + seed, y * f + seed * .7, z * f + seed * 1.3);
          a *= .5;
          f *= 2.03
        }
        return s
      }
      /* ---------- terreno procedurale ---------- */
      const VR = 34,
        VF = 16; // raggio del bordo / della piana del cratere
      const vols = [];
      let lastVol = 1e9;

      function baseH(x, y, z) {
        let h = (fbm(x * 3, y * 3, z * 3) - .6) * 180;
        if (h > 0) h = h * 1.5 + sstep(5, 20, h) * (1 - Math.abs(fbm(x * 14, y * 14, z * 14, 3) * 2 - 1)) * 9;
        return Math.max(h, -55)
      }

      function hAt(x, y, z) {
        let h = baseH(x, y, z);
        lastVol = 1e9;
        for (const v of vols) {
          const d = Math.acos(clamp(x * v.x + y * v.y + z * v.z, -1, 1)) * R;
          if (d < 90) {
            lastVol = Math.min(lastVol, d);
            h += (Math.max(h, -8) - h) * sstep(90, 55, d); // raccordo, niente gradino a d=90
            h += 14 * sstep(90, 12, d) + 52 * Math.pow(clamp(1 - Math.max(d, VR) / 55, 0, 1), 1.2) - 16 * sstep(VR, VF, d)
          }
        }
        return h
      }
      const rnd = () => Math.random(),
        rdir = () => {
          for (;;) {
            const x = rnd() * 2 - 1,
              y = rnd() * 2 - 1,
              z = rnd() * 2 - 1,
              l = Math.hypot(x, y, z);
            if (l < 1 && l > .1) return V3(x / l, y / l, z / l)
          }
        };
      for (let i = 0; i < 40000 && vols.length < 3; i++) {
        const d = rdir(),
          h = baseH(d.x, d.y, d.z);
        if (h > -20 && h < 6 && vols.every(v => v.dot(d) < .93)) vols.push(d)
      }
      /* cube-sphere indicizzata */
      const MOB = matchMedia("(pointer:coarse)").matches || innerWidth < 700;
      const N = +new URLSearchParams(location.search).get('n') || (MOB ? 64 : 128);
	  const WATERDETAIL = +new URLSearchParams(location.search).get('d') || (MOB ? 1.5 : 3);
	  const SHADOWS = new URLSearchParams(location.search).get('s') !== '0';
	  const SH = MOB ? 64 : 128; // mezza ampiezza dell'area ombreggiata attorno alla barca
	  
      console.log(	'RAGGIO TERRA (R) = '+R, 
					'NEBBIA (F) = '+FOG,
					'DETTAGLIO (N:64..256 / D:1..3) = ' +N+' '+WATERDETAIL,'OMBRE (S:0..1) = '+SHADOWS);
	  
      const idx = new Map(),
        dir = [],
        ind = [];

      function vid(x, y, z) {
        const k = ((x + N) * (2 * N + 1) + (y + N)) * (2 * N + 1) + (z + N);
        let v = idx.get(k);
        if (v === undefined) {
          v = dir.length / 3;
          idx.set(k, v);
          const l = Math.hypot(x, y, z);
          dir.push(x / l, y / l, z / l)
        }
        return v
      }
      for (let f = 0; f < 6; f++) {
        const a = f >> 1,
          s = f & 1 ? 1 : -1,
          u = (a + 1) % 3,
          w = (a + 2) % 3;
        const P = (i, j) => {
          const c = [0, 0, 0];
          c[a] = s * N;
          c[u] = 2 * i - N;
          c[w] = 2 * j - N;
          return vid(c[0], c[1], c[2])
        };
        for (let i = 0; i < N; i++)
          for (let j = 0; j < N; j++) {
            const p = P(i, j),
              q = P(i + 1, j),
              r = P(i + 1, j + 1),
              t = P(i, j + 1);
            s > 0 ? ind.push(p, q, r, p, r, t) : ind.push(p, r, q, p, t, r)
          }
      }
      const nV = dir.length / 3,
        H = new Float32Array(nV),
        tp = new Float32Array(nV * 3),
        tc = new Float32Array(nV * 3),
        op = new Float32Array(nV * 3);
		
	  //colori territorio
      const C = {
          sand: lin(0xe8d08e),
          shal: lin(0xcdbb88),
          floor: lin(0x1d4c5c),
          grass: lin(0x2f7524),   // era 0x4a9a30
		  forest: lin(0x153f19),  // era 0x1f5a22
          rock: lin(0x7a726c),
          dark: lin(0x2e2b2a),
          snow: lin(0xffffff),
          lava: lin(0x6a1a08)
        },
        tmp = new T.Color();
      for (let i = 0; i < nV; i++) {
        const x = dir[i * 3],
          y = dir[i * 3 + 1],
          z = dir[i * 3 + 2],
          h = hAt(x, y, z),
          n = fbm(x * 40, y * 40, z * 40, 2),
          vd = lastVol;
        H[i] = h;
        tp[i * 3] = x * (R + h);
        tp[i * 3 + 1] = y * (R + h);
        tp[i * 3 + 2] = z * (R + h);
        op[i * 3] = x * R;
        op[i * 3 + 1] = y * R;
        op[i * 3 + 2] = z * R;
        if (h < 0) tmp.copy(C.shal).lerp(C.floor, clamp(-h / 30, 0, 1));
        else if (vd < 48) tmp.copy(C.dark).lerp(C.rock, n).lerp(C.lava, sstep(VF + 6, VF - 2, vd) * .8);
        else if (h < 2.4) tmp.copy(C.sand);
        else if (h < 5) tmp.copy(C.sand).lerp(C.grass, sstep(2.4, 5, h));
        else if (h < 20 + n * 6) tmp.copy(C.grass).lerp(C.forest, clamp(n * 1.6, 0, 1) * sstep(5, 10, h));
        else if (h < 33) tmp.copy(C.rock).lerp(C.dark, n * .6);
        else tmp.copy(C.snow);
        tc[i * 3] = tmp.r;
        tc[i * 3 + 1] = tmp.g;
        tc[i * 3 + 2] = tmp.b
      }
      const scene = new T.Scene();
	  //colori cielo
	  const HOR = lin(0xcfe8ff);   // era 0xcfe8ff, influenza anche la nebbia
	  const ZEN = lin(0x2a78d6);   // era 0x2a78d6
        
      scene.fog = new T.FogExp2(HOR, FOG);
      const tg = new T.BufferGeometry();
      tg.setAttribute('position', new T.BufferAttribute(tp, 3));
      tg.setAttribute('color', new T.BufferAttribute(tc, 3));
      tg.setIndex(ind);
      tg.computeVertexNormals();
	  const terrain = new T.Mesh(tg, new T.MeshStandardMaterial({
		vertexColors: true,
		roughness: .95
	  }));
	  terrain.receiveShadow = true; // non proietta: costerebbe 200k triangoli e darebbe acne
	  scene.add(terrain);
	  
      const ray = (A, B, D, x, y, z) => { // Möller–Trumbore, origine = centro del pianeta
        const e1x = tp[B] - tp[A],
          e1y = tp[B + 1] - tp[A + 1],
          e1z = tp[B + 2] - tp[A + 2],
          e2x = tp[D] - tp[A],
          e2y = tp[D + 1] - tp[A + 1],
          e2z = tp[D + 2] - tp[A + 2],
          px = y * e2z - z * e2y,
          py = z * e2x - x * e2z,
          pz = x * e2y - y * e2x,
          det = e1x * px + e1y * py + e1z * pz;
        if (Math.abs(det) < 1e-9) return -1;
        const tx = -tp[A],
          ty = -tp[A + 1],
          tz = -tp[A + 2],
          u = (tx * px + ty * py + tz * pz) / det;
        if (u < -1e-3 || u > 1.001) return -1;
        const qx = ty * e1z - tz * e1y,
          qy = tz * e1x - tx * e1z,
          qz = tx * e1y - ty * e1x,
          v = (x * qx + y * qy + z * qz) / det;
        return v < -1e-3 || u + v > 1.001 ? -1 : (e2x * qx + e2y * qy + e2z * qz) / det
      };

      function meshH(x, y, z) { // quota (da R) del terreno *renderizzato*; (x,y,z) unitario
        const c = [x, y, z],
          ab = c.map(Math.abs),
          a = ab[0] >= ab[1] && ab[0] >= ab[2] ? 0 : ab[1] >= ab[2] ? 1 : 2,
          s = c[a] > 0 ? 1 : -1,
          u = (a + 1) % 3,
          w = (a + 2) % 3,
          k = N / ab[a],
          i = Math.floor(clamp((c[u] * k + N) / 2, 0, N - 1e-6)),
          j = Math.floor(clamp((c[w] * k + N) / 2, 0, N - 1e-6)),
          V = (ii, jj) => {
            const cc = [0, 0, 0];
            cc[a] = s * N;
            cc[u] = 2 * ii - N;
            cc[w] = 2 * jj - N;
            return idx.get(((cc[0] + N) * (2 * N + 1) + (cc[1] + N)) * (2 * N + 1) + (cc[2] + N)) * 3
          },
          p = V(i, j),
          q1 = V(i + 1, j),
          r = V(i + 1, j + 1),
          t = V(i, j + 1);
        let d = ray(p, q1, r, x, y, z);
        if (d <= 0) d = ray(p, r, t, x, y, z);
        return d > 0 ? d - R : hAt(x, y, z)
      }
      const tang = v => {
        let e = V3(1, 0, 0).cross(v);
        if (e.lengthSq() < .1) e = V3(0, 0, 1).cross(v);
        e.normalize();
        return [e, v.clone().cross(e)]
      };
      /* ---------- alberi (InstancedMesh) ---------- */
      const tf = (p, r, s) => new T.Matrix4().compose(p, new T.Quaternion().setFromEuler(new T.Euler(r[0], r[1], r[2])), V3(s[0], s[1], s[2]));

      function part(list, g, m, c1, c2) {
        g = g.index ? g.toNonIndexed() : g;
        g.applyMatrix4(m);
        g.computeBoundingBox();
        const p = g.attributes.position,
          b = g.boundingBox,
          a = lin(c1),
          z = lin(c2),
          col = new Float32Array(p.count * 3);
        for (let i = 0; i < p.count; i++) {
          const k = clamp((p.getY(i) - b.min.y) / (b.max.y - b.min.y + 1e-4), 0, 1),
            j = .88 + rnd() * .24;
          col[i * 3] = (a.r + (z.r - a.r) * k) * j;
          col[i * 3 + 1] = (a.g + (z.g - a.g) * k) * j;
          col[i * 3 + 2] = (a.b + (z.b - a.b) * k) * j
        }
        g.setAttribute('color', new T.BufferAttribute(col, 3));
        list.push(g)
      }

      function blob() {
        const g = new T.IcosahedronGeometry(1, 1),
          p = g.attributes.position,
          n = new Float32Array(p.count * 3),
          v = V3(0, 0, 0);
        for (let i = 0; i < p.count; i++) {
          v.fromBufferAttribute(p, i).normalize();
          n[i * 3] = v.x;
          n[i * 3 + 1] = v.y;
          n[i * 3 + 2] = v.z;
          const j = .75 + .5 * vn(v.x * 3, v.y * 3, v.z * 3);
          p.setXYZ(i, v.x * j, v.y * j, v.z * j)
        }
        g.setAttribute('normal', new T.BufferAttribute(n, 3));
        return g
      }

      function merge(list) {
        let n = 0;
        list.forEach(g => n += g.attributes.position.count);
        const o = {
          position: new Float32Array(n * 3),
          normal: new Float32Array(n * 3),
          color: new Float32Array(n * 3)
        };
        let k = 0;
        for (const g of list) {
          for (const a in o) o[a].set(g.attributes[a].array, k * 3);
          k += g.attributes.position.count
        }
        const r = new T.BufferGeometry();
        for (const a in o) r.setAttribute(a, new T.BufferAttribute(o[a], 3));
        return r
      }
      const cyl = (r1, r2, h, y) => new T.CylinderGeometry(r1, r2, h, 6).translate(0, y, 0);

      function broadleaf() {
        const l = [];
        part(l, cyl(.15, .28, 2.6, 1.3), new T.Matrix4(), 0x4a3524, 0x5a4430);
        for (let i = 0; i < 3; i++) part(l, cyl(.05, .1, 1.6, .8), tf(V3(0, 1.8, 0), [.7, i * 2.1, 0], [1, 1, 1]), 0x4a3524, 0x5a4430);
        [
          [0, 4.2, 0, 1.9],
          [1.2, 3.6, .4, 1.4],
          [-1.1, 3.5, -.6, 1.5],
          [.3, 3.4, -1.3, 1.3],
          [-.4, 5.3, .5, 1.3]
        ]
        .forEach(c => part(l, blob(), tf(V3(c[0], c[1], c[2]), [rnd() * 3, rnd() * 3, 0], [c[3], c[3] * .8, c[3]]), 0x1d5a1c, 0x6fb53a));
        return merge(l)
      }

      function pine() {
        const l = [];
        part(l, cyl(.12, .25, 2.5, 1.2), new T.Matrix4(), 0x4a3524, 0x5a4430);
        [
          [1.9, 2.2, .7],
          [1.5, 3.2, .7],
          [1.1, 4.2, .65],
          [.7, 5.1, .6]
        ]
        .forEach(c => part(l, blob(), tf(V3(0, c[1], 0), [0, rnd() * 6, 0], [c[0], c[2], c[0]]), 0x0f3f1c, 0x2e7a35));
        return merge(l)
      }

      function palm() {
        const l = [];
        let x = 0,
          y = 0;
        for (let i = 0; i < 6; i++) {
          part(l, cyl(.13 - i * .008, .17 - i * .008, .95, 0), tf(V3(x, y + .45, 0), [0, 0, -i * .09], [1, 1, 1]), 0x8a7456, 0xa08a68);
          x += Math.sin(i * .09) * .95;
          y += Math.cos(i * .09) * .95
        }
        for (let i = 0; i < 8; i++) {
          const g = new T.PlaneGeometry(.7, 3.4, 1, 5);
          g.rotateZ(-Math.PI / 2).translate(1.7, 0, 0);
          const p = g.attributes.position;

      /* ---------- minimappa ---------- */
      const MW = 256,
        MH = 128,
        mapC = document.createElement('canvas');

      mapC.height = MH;
      (function() { // mappa equirettangolare campionata da hAt(), una volta sola
        const x = mapC.getContext('2d'),
          im = x.createImageData(MW, MH),
          mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
		  //colori minimappa
        const K = {
            shal: [96, 190, 196],
            deep: [8, 44, 84],
            sand: [232, 208, 142],
            gr: [74, 154, 48],
            fo: [31, 90, 34],
            rock: [122, 114, 108],
            snow: [255, 255, 255],
            dark: [52, 46, 44],
            lava: [255, 90, 16]
          };
        for (let j = 0; j < MH; j++) {
          const la = (.5 - (j + .5) / MH) * Math.PI,
            cl = Math.cos(la),
            sl = Math.sin(la);
          for (let i = 0; i < MW; i++) {
            const lo = ((i + .5) / MW * 2 - 1) * Math.PI,
              h = hAt(cl * Math.cos(lo), sl, -cl * Math.sin(lo)),
              vd = lastVol;
            const c = h < 0 ? mix(K.shal, K.deep, clamp(-h / 30, 0, 1)) : vd < 48 ? (vd < 10 ? K.lava : K.dark) : h < 2.4 ? K.sand : h < 20 ? mix(K.gr, K.fo, clamp((h - 5) / 12, 0, 1)) : h < 33 ? K.rock : K.snow;
            im.data.set([c[0], c[1], c[2], 255], (j * MW + i) * 4)
          }

        mp.stroke();
        const la = Math.asin(clamp(P.y, -1, 1)),

      }
      /* ---------- audio procedurale (Web Audio, nessun asset) ---------- */
      const Snd = (() => {
        let ctx, out, B = {},
          on = false,
          muted = false,
          acc = 0,
          scanT = 0,
          shore = 0,
          sp0 = 0,
          vp0 = 0,
          ph = Math.random(),
          lastHit = -9;
        let wind, whistle, swell, rush, flap, surf, lfo, la, scrape, grit, rumble, hiss, sPan, vPan;
        const tv = V3(0, 0, 0);
        const set = (p, v, tc = .12) => p.setTargetAtTime(v, ctx.currentTime, tc);
        const panner = () => {
          if (!ctx.createStereoPanner) return null;
          const p = ctx.createStereoPanner();
          p.connect(out);
          return p
        };

        function noise(type) { // buffer loopabile da 4s con crossfade sulla giunzione
          const n = ctx.sampleRate * 4 | 0,
            X = ctx.sampleRate * .1 | 0,
            x = new Float32Array(n + X);
          let l = 0,
            b0 = 0,
            b1 = 0,
            b2 = 0;
          for (let i = 0; i < x.length; i++) {
            const w = Math.random() * 2 - 1;
            if (type === 'brown') {
              l = (l + .02 * w) / 1.02;
              x[i] = l * 3.5
            } else if (type === 'pink') {
              b0 = .99765 * b0 + w * .099046;
              b1 = .963 * b1 + w * .2965164;
              b2 = .57 * b2 + w * 1.0526913;
              x[i] = (b0 + b1 + b2 + w * .1848) * .25
            } else x[i] = w * .6
          }
          const b = ctx.createBuffer(1, n, ctx.sampleRate),
            d = b.getChannelData(0);
          for (let i = 0; i < n; i++) d[i] = i < X ? x[i] * (i / X) + x[n + i] * (1 - i / X) : x[i];
          return b
        }

        function layer(buf, type, f, q, dest) {
          const s = ctx.createBufferSource(),
            fl = ctx.createBiquadFilter(),
            g = ctx.createGain();
          s.buffer = buf;
          s.loop = true;
          fl.type = type;
          fl.frequency.value = f;
          fl.Q.value = q;
          g.gain.value = 0;
          s.connect(fl);
          fl.connect(g);
          g.connect(dest || out);
          s.start(0, Math.random() * 3);
          return {
            f: fl.frequency,
            g: g.gain
          }
        }

        function burst(buf, type, f, vol, dur, dest) { // colpo di rumore filtrato con decadimento
          const t = ctx.currentTime,
            s = ctx.createBufferSource(),
            fl = ctx.createBiquadFilter(),
            g = ctx.createGain();
          s.buffer = buf;
          fl.type = type;
          fl.frequency.value = f;
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(.001, t + dur);
          s.connect(fl);
          fl.connect(g);
          g.connect(dest || out);
          s.start(t, Math.random() * 3, dur + .05)
        }

        function creak(v) { // cigolio di scafo/attrezzatura
          const t = ctx.currentTime,
            d = .25 + Math.random() * .4,
            f0 = 90 + Math.random() * 120,
            o = ctx.createOscillator(),
            f = ctx.createBiquadFilter(),
            g = ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.setValueAtTime(f0, t);
          o.frequency.linearRampToValueAtTime(f0 * (.8 + Math.random() * .5), t + d);
          f.type = 'bandpass';
          f.frequency.value = f0 * 3 + Math.random() * 300;
          f.Q.value = 8;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(.03 + .05 * v, t + d * .2);
          g.gain.linearRampToValueAtTime(0, t + d);
          o.connect(f);
          f.connect(g);
          g.connect(out);
          o.start(t);
          o.stop(t + d + .05)
        }

        function slap(v) {
          burst(B.brown, 'lowpass', 350 + v * 700, .1 + .3 * v, .22)
        } // onda sullo scafo
        function thud(v) { // urto sul fondo: botta sorda + sabbia/roccia
          const t = ctx.currentTime,
            o = ctx.createOscillator(),
            g = ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(110, t);
          o.frequency.exponentialRampToValueAtTime(32, t + .5);
          g.gain.setValueAtTime(.001, t);
          g.gain.linearRampToValueAtTime(.5 + .4 * v, t + .015);
          g.gain.exponentialRampToValueAtTime(.001, t + .6);
          o.connect(g);
          g.connect(out);
          o.start(t);
          o.stop(t + .65);
          burst(B.brown, 'lowpass', 500, .3 + .5 * v, .5);
          burst(B.white, 'bandpass', 1800, .15 + .2 * v, .25)
        }

        function boom(v) { // esplosione sorda del vulcano
          const t = ctx.currentTime,
            o = ctx.createOscillator(),
            g = ctx.createGain(),
            dest = vPan || out;
          o.type = 'sine';
          o.frequency.setValueAtTime(70, t);
          o.frequency.exponentialRampToValueAtTime(26, t + 1.4);
          g.gain.setValueAtTime(.001, t);
          g.gain.linearRampToValueAtTime(.45 * v, t + .06);
          g.gain.exponentialRampToValueAtTime(.001, t + 1.5);
          o.connect(g);
          g.connect(dest);
          o.start(t);
          o.stop(t + 1.6);
          burst(B.brown, 'lowpass', 220, .55 * v, 1.4, dest);
          burst(B.pink, 'bandpass', 1300, .12 * v, .8, dest)
        }

        function scan(s) { // distanza dalla costa: 3 anelli x 8 direzioni (~100 hAt/s)
          const Pp = s.P,
            F = s.Tn,
            Rr = s.Rt;
          let best = 0,
            sw = 0,
            sp = 0;
          for (const r of [25, 60, 110]) {
            const c = Math.cos(r / R),
              sn = Math.sin(r / R),
              w = 1 - r / 140;
            for (let k = 0; k < 8; k++) {
              const a = k * .7854,
                ux = Math.cos(a),
                uz = Math.sin(a);
              if (hAt(Pp.x * c + (F.x * ux + Rr.x * uz) * sn, Pp.y * c + (F.y * ux + Rr.y * uz) * sn, Pp.z * c + (F.z * ux + Rr.z * uz) * sn) > .5) {
                best = Math.max(best, w);
                sw += w;
                sp += w * uz
              }
            }
          }
          shore = best;
          sp0 = clamp(sp / Math.max(sw, 1e-3), -1, 1) * .8
        }
        return {
          start() {
            if (on) {
              if (ctx.state !== 'running') ctx.resume();
              return
            }
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            ctx = new AC();
            const mg = ctx.createGain(),
              cp = ctx.createDynamicsCompressor();
            mg.gain.value = muted ? 0 : .9;
            mg.connect(cp);
            cp.connect(ctx.destination);
            out = mg;
            B = {
              white: noise('white'),
              pink: noise('pink'),
              brown: noise('brown')
            };
            sPan = panner();
            vPan = panner();
            wind = layer(B.pink, 'bandpass', 500, .5);
            whistle = layer(B.white, 'bandpass', 1100, 18);
            swell = layer(B.brown, 'lowpass', 260, .7);
            rush = layer(B.pink, 'bandpass', 900, .4);
            flap = layer(B.white, 'bandpass', 1600, .7);
            lfo = ctx.createOscillator();
            la = ctx.createGain();
            lfo.frequency.value = 7;
            la.gain.value = 0;
            lfo.connect(la);
            la.connect(flap.g);
            lfo.start(); // l'LFO modula il gain del fileggio
            surf = layer(B.pink, 'lowpass', 1500, .5, sPan);
            scrape = layer(B.brown, 'lowpass', 300, .8);
            grit = layer(B.white, 'bandpass', 2200, .9);
            rumble = layer(B.brown, 'lowpass', 100, .9, vPan);
            hiss = layer(B.pink, 'bandpass', 2800, .7, vPan);
            on = true
          },
          toggle() {
            if (!on) {
              muted = false;
              this.start();
              return false
            }
            muted = !muted;
            set(out.gain, muted ? 0 : .9, .05);
            return muted
          },
          suspend(h) {
            if (on)(h ? ctx.suspend() : ctx.resume()).catch(() => {})
          },
          hit(v) { // chiamata direttamente dalla collisione
            if (!on || ctx.currentTime - lastHit < .4) return;
            lastHit = ctx.currentTime;
            thud(clamp(v / 8, .15, 1));

          },
          update(dt, s) {
            if (!on) return;
            acc += dt;
            if (acc < .05) return;
            const d = acc;
            acc = 0;
            const app = s.windKn * .7 + s.speed * .6,
              gust = 1 + .22 * Math.sin(s.time * .7) + .12 * Math.sin(s.time * 1.9 + 1),
              sp = clamp(s.speed / 10, 0, 1);
            /* vento + fischio nelle sartie */
            set(wind.g, (.03 + Math.pow(app / 20, 1.5) * .5) * gust);
            set(wind.f, 280 + app * 28 * gust);
            set(whistle.g, Math.max(0, app - 11) * .006 * (1 - s.flap));
            set(whistle.f, 900 + app * 40);
            /* mare: onda lunga + acqua lungo lo scafo */
            set(swell.g, .16 + .1 * Math.sin(s.time * .8) + s.windKn * .004);
            set(swell.f, 180 + s.windKn * 10);
            set(rush.g, Math.pow(sp, 1.3) * .3 * (1 + Math.abs(s.roll)));
            set(rush.f, 500 + sp * 900);
            /* vela che sbatte */
            const fa = s.flap * .22;
            set(flap.g, fa * .5);
            set(la.gain, fa * .5);
            set(lfo.frequency, 6.5 + 2.5 * Math.sin(s.time * 1.3));
            /* risacca: ciclo ~8.5s, pan verso la costa */
            if ((scanT += d) > .25) {
              scanT = 0;
              scan(s)
            }
            ph = (ph + d / 8.5) % 1;
            const env = ph < .28 ? Math.pow(ph / .28, 2) : Math.exp(-(ph - .28) * 4.5);
            set(surf.g, shore * (.04 + .5 * env) * .8, .08);
            set(surf.f, 700 + 2600 * env);
            if (sPan) set(sPan.pan, sp0, .3);
            /* vulcano: rombo continuo, sfrigolio di lava, boati occasionali, pan verso il cratere più vicino */
            let vd = 1e9,
              vnr = null;
            for (const v of vols) {
              const dd = Math.acos(clamp(s.P.dot(v), -1, 1)) * R;
              if (dd < vd) {
                vd = dd;
                vnr = v
              }
            }
            const vk = sstep(220, 30, vd);
            if (vnr) {
              tv.copy(vnr).addScaledVector(s.P, -s.P.dot(vnr));
              if (tv.lengthSq() > 1e-6) vp0 = clamp(tv.normalize().dot(s.Rt), -1, 1) * .85
            }
            set(rumble.g, vk * .9 * (1 + .3 * Math.sin(s.time * 1.7) + .15 * Math.sin(s.time * 4.3)), .15);
            set(rumble.f, 90 + vk * 90);
            set(hiss.g, vk * vk * .07);
            if (vPan) set(vPan.pan, vp0, .3);
            if (Math.random() < d * vk * vk * 8) burst(B.white, 'bandpass', 1500 + Math.random() * 2500, .04 + .1 * vk, .04 + Math.random() * .08, vPan);
            if (Math.random() < d * vk * .15) boom(vk);
            /* fondo: raschio continuo finché la barca struscia */
            set(scrape.g, s.touch * .55, .05);
            set(scrape.f, 220 + s.touch * 200);
            set(grit.g, s.touch * (.03 + .1 * Math.random()), .04);
            /* eventi: cigolii (più sbandamento) e schiaffi d'onda (più velocità) */
            if (Math.random() < d * (.12 + Math.abs(s.roll) * .8)) creak(Math.abs(s.roll));
            if (Math.random() < d * sp * 1.4) slap(sp)
          }
        }
      })();
      const muBtn = document.getElementById('mu'),
        tglSnd = () => {
          muBtn.textContent = Snd.toggle() ? '🔇' : '🔊'
        };
      muBtn.addEventListener('click', tglSnd);
      ['pointerdown', 'keydown', 'touchend'].forEach(k => addEventListener(k, e => {
        if ((e.target && e.target.id === 'mu') || e.code === 'KeyM') return; // gestiti da toggle()
        Snd.start()
      }, {
        passive: true
      }));
      addEventListener('keydown', e => {
        if (e.code === 'KeyM' && !e.repeat) tglSnd()
      });
      document.addEventListener('visibilitychange', () => Snd.suspend(document.hidden));
      /* ---------- loop ---------- */
      const hDay = HOR.clone(),
        zDay = ZEN.clone(),
        hNight = lin(0x050a16),
        zNight = lin(0x010207),
        hTw = lin(0xff9055),
        zTw = lin(0x3a3f86),
        cSun = lin(0xfff0d8),
        cDusk = lin(0xff9a55),
        cMoon = lin(0x8fa8ff),
        cHD = lin(0xbfdcff),
        cHN = lin(0x1a2a55),
        cGD = lin(0x3a5a70),
        cGN = lin(0x05080f);
      let timeOff = 0,
        hhG = 12;
      const clock = new T.Clock(),
        Rt = V3(),
        Bk = V3(),
        mx = new T.Matrix4(),
        SUN = V3();
      const SS = {
        P,
        Tn,
        Rt,
        time: 0,
        windKn: 0,
        speed: 0,
        roll: 0,
        flap: 0,
        touch: 0
      };
      const fpsEl = document.getElementById('fps');
      let fN = 0,
        fT = performance.now();

      function frame() {
        requestAnimationFrame(frame);
        fN++;
        const pn = performance.now();
        if (pn - fT > 500) {
          fpsEl.textContent = Math.round(fN * 1000 / (pn - fT)) + ' FPS';
          fN = 0;
          fT = pn
        }
        const dt = Math.min(clock.getDelta(), .05);
        time += dt;
        U.t.value = time;
        const N = V3(0, 1, 0).sub(P.clone().multiplyScalar(P.y));
        if (N.lengthSq() < 1e-4) N.set(1, 0, 0);
        N.normalize();
        const E = new T.Vector3().crossVectors(N, P);
        hd = Math.atan2(Tn.dot(E), Tn.dot(N));
        windKn = 12 + 4 * Math.sin(time * .05) + 1.5 * Math.sin(time * .13);
        const wf = windFrom + .5 * Math.sin(time * .021) + .25 * Math.sin(time * .057);
        twa = wrap(wf - hd);
        const a = Math.abs(twa);
        const inp = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
        rudder += (inp - rudder) * Math.min(1, dt * 4);
        Tn.applyAxisAngle(P, -rudder * dt * (.12 + .5 * clamp(speed / 10, 0, 1)));
        trim = clamp(trim + ((keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0)) * .5 * dt, 0, 1);
        spinE = clamp(spinE + (spinOn ? 1 : -1) * dt * .45, 0, 1);
        const e = sstep(0, 1, spinE);
        fillS += ((a > 1.3 ? sstep(1.3, 1.9, a) : 0) - fillS) * Math.min(1, dt * 1.5);
        const sopt = clamp((a - .55) / 2.4, 0, 1);
        let eff = clamp(1 - Math.abs(trim - sopt) * 1.4, .3, 1);
        eff = Math.max(eff, .85 * e * fillS);
        const target = windKn * 1.15 * polar(a) * eff * (1 + .3 * fillS * e) * (1 - .25 * (1 - fillS) * e);
        speed += (target - speed) * Math.min(1, dt * .45);
        const ax = P.clone().cross(Tn).normalize(),
          ds = speed * dt / R,
          np = P.clone().applyAxisAngle(ax, ds);
        touch = Math.max(0, touch - dt * 2.5);
        if (hAt(np.x, np.y, np.z) > -3) { // fondo: urto + raschio
          Snd.hit(speed);
          touch = 1;
          speed *= .6;
          P.applyAxisAngle(ax, -2 * dt / R);
          Tn.applyAxisAngle(ax, -2 * dt / R)
        } else {
          P.copy(np);
          Tn.applyAxisAngle(ax, ds)
        }
        P.normalize();
        Tn.sub(P.clone().multiplyScalar(P.dot(Tn))).normalize();
        /* barca */
        Rt.crossVectors(Tn, P);
        Bk.copy(Tn).negate();
        mx.makeBasis(Rt, P, Bk);
        boat.quaternion.setFromRotationMatrix(mx);
        const wp = P.clone().multiplyScalar(R),
          fr = wp.clone().add(Tn.clone().multiplyScalar(5)).setLength(R),
          bk = wp.clone().sub(Tn.clone().multiplyScalar(5)).setLength(R);
        //////const bob = waveH(wp, time) * .8,
        const bob = waveH(wp, time) * 0.9; //altrimenti galleggia troppo?
        pitch = Math.atan2(waveH(fr, time) - waveH(bk, time), 10) - speed * .004;
        boat.position.copy(P).multiplyScalar(R + bob);
        const heelT = -leeT * clamp(.62 * clamp(windKn / 15, .3, 1.3) * Math.sin(Math.min(a, 2.2)) * eff * (1 + .25 * fillS * e), 0, .68);
        roll += (heelT - roll) * Math.min(1, dt * 1.5);
        tilt.rotation.set(pitch, 0, roll + Math.sin(time * 1.1) * .015);
        rdr.rotation.y = rudder * .5;
        if (a > .12 && a < 3) leeT = twa > 0 ? -1 : 1;
        leeS += clamp(leeT - leeS, -dt * 2.6, dt * 2.6);
        const sg = leeS >= 0 ? 1 : -1,
          ab = Math.abs(leeS);
        const ang = .08 + trim * 1.35,
          lf = sstep(.75, .4, a),
          pw = a > .55 ? clamp(1.1 - Math.abs(trim - sopt) * 1.5, .3, 1) : .25;
        boom.rotation.y = leeS * ang;
        main.upd(V3(0, 2.4, -1), V3(leeS * Math.sin(ang) * 6.6, 2.4, -1 + Math.cos(ang) * 6.6), V3(0, 19.4, -1), (.6 + 1.1 * pw) * ab, V3(sg, 0, 0), Math.max(lf, 1 - ab));
        const ja = ang * .8,
          tkJ = V3(0, 1.5, -7.3),
          jh = Math.max(0, 1 - 1.8 * e);
        jib.visible = jh > .1;
        if (jib.visible) jib.upd(tkJ, tkJ.clone().lerp(V3(leeS * (Math.sin(ja) * 3.8 + .6), 2.3, -1.9), jh), tkJ.clone().lerp(V3(0, 15.8, -2.2), jh), (.5 + .9 * pw) * jh * ab, V3(sg, 0, 0), Math.max(lf, 1 - ab));
        /*
		spin.visible = e > .01;
		if (spin.visible) {
          const tk = V3(0, 1.7, -8.8);
          spin.upd(tk,
            tk.clone().lerp(V3(leeS * (2.2 + 4.6 * fillS), 6 + 2.5 * fillS, -3.6 + .8 * fillS), e),
            tk.clone().lerp(V3(0, 21.4, -1.8), e),
            (.6 + 6 * fillS) * e * ab, V3(sg * .35, .25, -1), Math.max(1 - fillS, 1 - ab))
        }*/
        //SPINNAKER SIMMETRICO
        spin.visible = pole.visible = e > .01;
        if (spin.visible) {
          const sw = -leeS, // lato sopravvento (continuo nella strambata)
            pa = .3 + .6 * sstep(1.5, 2.9, a), // tangone: avanti di lasco, quasi squadrato in poppa
            root = V3(0, 2.4, -1.2), // attacco all'albero
            end = V3(sw * Math.sin(pa) * 6.2, 2.9, -1.2 - Math.cos(pa) * 6.2),
            tk = V3(0, 1.5, -6.6).lerp(end, e), // dal sacco a prua alla punta del tangone
            clT = V3(leeS * (2.6 + 2.4 * fillS), 3.2, 2.2 - 3.4 * fillS), // sottovento: indietro di lasco, fuori e avanti in poppa
            hdT = V3(0, 21.4, -1.8);
          spin.upd(tk, tk.clone().lerp(clT, e), tk.clone().lerp(hdT, e),
            (.6 + 6 * fillS) * e * ab, V3(sg * .35, .25, -1), Math.max(1 - fillS, 1 - ab));
          const dv = tk.clone().sub(root);
          pole.position.copy(root);
          pole.scale.z = dv.length();
          pole.quaternion.setFromUnitVectors(V3(0, 0, 1), dv.normalize());
        }
        /* sole, luci, oceano */
        const dd = new Date(),
          hh = ((dd.getHours() + dd.getMinutes() / 60 + dd.getSeconds() / 3600 + timeOff) % 24 + 24) % 24;
        hhG = hh;
        const el = Math.sin((hh - 6) / 12 * Math.PI) * 1.2,
          az = (90 + (hh - 6) * 15) * Math.PI / 180;
        SUN.copy(P).multiplyScalar(Math.sin(el)).addScaledVector(N, Math.cos(az) * Math.cos(el)).addScaledVector(E, Math.sin(az) * Math.cos(el)).normalize();
        const sE = SUN.dot(P),
          dayK = sstep(-.12, .25, sE),
          tw = Math.exp(-Math.pow((sE - .02) / .16, 2)),
          moon = sE < -.06;
        HOR.copy(hNight).lerp(hDay, dayK).lerp(hTw, tw * .65);
        ZEN.copy(zNight).lerp(zDay, dayK).lerp(zTw, tw * .4);
        scene.fog.color.copy(HOR);
        U.sun.value.copy(SUN);
        if (moon) U.sun.value.negate();
        U.sI.value = moon ? .2 : sstep(-.1, .05, sE);
        U.day.value = dayK;
        U.nt.value = 1 - dayK;
		//ombra!!!
        //sunL.position.copy(U.sun.value).multiplyScalar(1000);
		//sunL.target.position.copy(boat.position);
sunL.target.position.copy(boat.position);
sunL.position.copy(boat.position).addScaledVector(U.sun.value, 350); // la shadow camera segue la barca

        sunL.target.updateMatrixWorld();
        sunL.color.copy(moon ? cMoon : cSun).lerp(cDusk, moon ? 0 : tw * .8);
//sunL.intensity = moon ? .45 * (1 - dayK) * sstep(-.06, -.2, sE) : 2.4 * sstep(-.06, .3, sE);
sunL.intensity = moon ? .45 * (1 - dayK) * sstep(-.06, -.2, sE) : 1.6 * sstep(-.06, .3, sE);

		
//shMat.opacity = .4 * clamp(sunL.intensity / 2.4, 0, 1); // niente ombre nette quando la luce è spenta
shMat.opacity = .22 * clamp(sunL.intensity / 1.6, 0, 1);
shCap.quaternion.setFromUnitVectors(Y, P);
const shP = shGeo.attributes.position, sa = shP.array;
for (let i = 0; i < sa.length; i += 3) {
  shV.set(shDir[i], shDir[i + 1], shDir[i + 2]).applyQuaternion(shCap.quaternion).multiplyScalar(R);
  const rr = R + waveH(shV, time) + .3; // stessa onda del vertex shader dell'oceano
  sa[i] = shDir[i] * rr; sa[i + 1] = shDir[i + 1] * rr; sa[i + 2] = shDir[i + 2] * rr;
}
shP.needsUpdate = true;

		
        hemi.position.copy(P);
//hemi.intensity = .12 + .78 * dayK;
hemi.intensity = .12 + 1.25 * dayK;

        hemi.color.copy(cHN).lerp(cHD, dayK);
        hemi.groundColor.copy(cGN).lerp(cGD, dayK);
        sailMat.emissiveIntensity = .2 + .8 * dayK;
        spMat.emissiveIntensity = .1 + .3 * dayK;
        discMat.color.setRGB(1, .3 + .12 * Math.sin(time * 2.2), .05);
        const navO = .12 + .88 * (1 - dayK); // alone delle luci di via: forte di notte, appena visibile di giorno
        for (const s of navL) s.material.opacity = navO;
        U.boat.value.copy(boat.position).setLength(R);
        U.fwd.value.copy(Tn);
        U.spd.value = speed;
        clouds.rotation.y = time * .004;
        /* camera */
        const th = camYaw,
          ph = camPit,
          off = Rt.clone().multiplyScalar(Math.sin(th) * Math.cos(ph)).addScaledVector(P, Math.sin(ph)).addScaledVector(Bk, Math.cos(th) * Math.cos(ph)).multiplyScalar(camD);
        const want = boat.position.clone().addScaledVector(P, 6).add(off);
        if (want.length() < R + 4) want.setLength(R + 4);
        cam.position.lerp(want, 1 - Math.exp(-6 * dt));
        cam.up.copy(cam.position).normalize();
        cam.lookAt(boat.position.clone().addScaledVector(P, 7));
        U.cam.value.copy(cam.position);
        U.up.value.copy(cam.position).normalize();
        sky.position.copy(cam.position);
        renderer.render(scene, cam);
        drawHud();
        drawMap();
        SS.time = time;
        SS.windKn = windKn;
        SS.speed = speed;
        SS.roll = roll;
        SS.touch = touch;
        SS.flap = Math.max(lf * ab, e * (1 - fillS) * .6);
        Snd.update(dt, SS)
      }
      frame();
    </script>
  </body>

</html>
