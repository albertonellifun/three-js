<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor oggetti Three.js</title>
<style>
  :root { --bg:#1b1e24; --panel:#252932; --line:#383e4b; --txt:#e6e8ee; --dim:#9aa1b0; --acc:#ffb300; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 13px/1.4 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--txt); }
  #app { display: grid; grid-template-columns: 340px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
  #panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 14px 24px; }
  #viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  #viewport canvas { display: block; }
  #hint { position: absolute; z-index: 1; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; pointer-events: none; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 18px 0 6px; }
  label { display: block; margin: 8px 0 3px; color: var(--dim); }
  label.chk { display: flex; align-items: center; gap: 8px; color: var(--txt); margin: 8px 0; cursor: pointer; }
  select, input[type=text], input[type=number], textarea {
    width: 100%; background: #15181d; color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; font: inherit;
  }
  input:disabled { opacity: .45; }
  input[type=color] { width: 100%; height: 32px; padding: 2px; margin-top: 6px; background: #15181d; border: 1px solid var(--line); border-radius: 6px; }
  button { background: #3a4050; color: var(--txt); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: #48506a; }
  button:disabled { opacity: .4; cursor: default; }
  button.on { background: var(--acc); border-color: var(--acc); color: #111; }
  button.primary { background: #2e7d32; border-color: #2e7d32; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  .row > button { flex: 1; }
  #tgrid { display: grid; grid-template-columns: 78px repeat(3, 1fr); gap: 4px; align-items: center; margin-top: 8px; }
  #tgrid input { padding: 5px 4px; }
  #list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 190px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  #list:empty::after { content: "Nessun oggetto: premi «Aggiungi»"; display: block; padding: 10px; color: var(--dim); }
  #list li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #list li:last-child { border-bottom: 0; }
  #list li.sel { background: #3b3320; box-shadow: inset 3px 0 var(--acc); }
  .sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #0007; flex: none; }
  textarea { height: 160px; margin-top: 8px; font: 11px/1.4 ui-monospace, Consolas, monospace; white-space: pre; resize: vertical; }
  @media (max-width: 800px) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); }
    #viewport { order: -1; }
    #panel { border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Editor oggetti Three.js</h1>

    <h2>Forma e materiale</h2>
    <label for="shape">Forma</label>
    <select id="shape"></select>

    <label for="color">Colore materiale</label>
    <select id="color"></select>
    <input type="color" id="custom" value="#ff8800" hidden>

    <label class="chk"><input type="checkbox" id="cast" checked> Proietta ombra (castShadow)</label>
    <label class="chk"><input type="checkbox" id="receive"> Riceve ombra (receiveShadow)</label>

    <div class="row">
      <button id="add" class="primary">＋ Aggiungi</button>
      <button id="dup" disabled>Duplica</button>
      <button id="del" disabled>Elimina</button>
    </div>

    <h2>Oggetti</h2>
    <input type="text" id="name" placeholder="Nome oggetto" disabled>
    <ul id="list"></ul>

    <h2>Trasformazione</h2>
    <div class="row">
      <button data-mode="translate" class="on">Sposta (W)</button>
      <button data-mode="rotate">Ruota (E)</button>
      <button data-mode="scale">Scala (R)</button>
    </div>
    <label class="chk"><input type="checkbox" id="snap"> Snap (0.25 · 15°)</label>
    <div id="tgrid"></div>

    <h2>Scena</h2>
    <label class="chk"><input type="checkbox" id="grid" checked> Mostra griglia e assi</label>

    <h2>Esporta / Importa</h2>
    <div class="row">
      <button id="exp-js">Codice JS</button>
      <button id="exp-json">JSON</button>
      <button id="copy">Copia</button>
    </div>
    <div class="row">
      <button id="imp">Importa JSON</button>
      <button id="clr">Svuota scena</button>
    </div>
    <textarea id="out" spellcheck="false" placeholder="Qui compaiono il codice generato o il JSON da importare"></textarea>
  </aside>

  <main id="viewport">
    <div id="hint">Click: seleziona · Trascina: orbita · Rotellina: zoom · Tasto destro: pan · Canc: elimina · Ctrl+D: duplica</div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);

/* ============ Forme e colori (modificali/aggiungine a piacere) ============ */
const SHAPES = {
  box:      { label: 'Box',                code: 'new THREE.BoxGeometry(1, 1, 1)' },
  sphere:   { label: 'Sfera',              code: 'new THREE.SphereGeometry(0.5, 32, 16)' },
  cylinder: { label: 'Cilindro',           code: 'new THREE.CylinderGeometry(0.5, 0.5, 1, 32)' },
  cone:     { label: 'Cono',               code: 'new THREE.ConeGeometry(0.5, 1, 32)' },
  pyramid:  { label: 'Piramide',           code: 'new THREE.ConeGeometry(0.7071, 1, 4).rotateY(Math.PI / 4)', flat: true },
  prism:    { label: 'Prisma triangolare', code: 'new THREE.CylinderGeometry(0.5774, 0.5774, 1, 3)', flat: true },
  torus:    { label: 'Toro',               code: 'new THREE.TorusGeometry(0.5, 0.18, 16, 48)' },
  plane:    { label: 'Piano',              code: 'new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2)', double: true },
  tetra:    { label: 'Tetraedro',          code: 'new THREE.TetrahedronGeometry(0.6)' },
  octa:     { label: 'Ottaedro',           code: 'new THREE.OctahedronGeometry(0.6)' },
  dodeca:   { label: 'Dodecaedro',         code: 'new THREE.DodecahedronGeometry(0.6)' },
  icosa:    { label: 'Icosaedro',          code: 'new THREE.IcosahedronGeometry(0.6)' }
};
const PALETTE = [
  ['Arancione', '#fb8c00'], ['Rosso', '#e53935'], ['Giallo', '#fdd835'], ['Verde', '#43a047'],
  ['Verde chiaro', '#9ccc65'], ['Azzurro', '#29b6f6'], ['Blu', '#1e57d6'], ['Viola', '#8e24aa'],
  ['Rosa', '#f48fb1'], ['Marrone', '#795548'], ['Beige', '#f5deb3'], ['Bianco', '#ffffff'],
  ['Grigio chiaro', '#bdbdbd'], ['Grigio scuro', '#616161'], ['Nero', '#212121']
];  // esadecimali in minuscolo

/* ============ Renderer, scena, luci ============ */
const viewport = $('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewport.appendChild(renderer.domElement);
const dom = renderer.domElement;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20242b);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);
camera.position.set(3.5, 3, 4.5);
const orbit = new THREE.OrbitControls(camera, dom);
orbit.target.set(0, 0.5, 0);
orbit.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0x556070, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 0.5, far: 40 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0005;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.002;
ground.receiveShadow = true;
scene.add(ground);

const helpers = new THREE.Group();
helpers.add(new THREE.GridHelper(20, 20, 0x6b7385, 0x3a4050), new THREE.AxesHelper(0.8));
scene.add(helpers);

const tc = new THREE.TransformControls(camera, dom);
tc.size = 0.85;
tc.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; });
tc.addEventListener('objectChange', () => { syncTransform(); changed(); });
scene.add(tc);

function resize() {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(viewport);
resize();
(function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();

/* ============ Stato e oggetti ============ */
const objs = [];
let sel = null, counter = 0, saveT = 0;
const rad = THREE.MathUtils.degToRad, deg = THREE.MathUtils.radToDeg;

const shapeSel = $('shape'), colorSel = $('color'), custom = $('custom'),
      castCb = $('cast'), recvCb = $('receive'), nameIn = $('name'),
      list = $('list'), out = $('out');
const getHex = () => colorSel.value === 'custom' ? custom.value : colorSel.value;

function makeGeometry(shape) {
  return new Function('THREE', 'return ' + SHAPES[shape].code)(THREE);
}
function makeMaterial(shape, hex) {
  const s = SHAPES[shape];
  return new THREE.MeshStandardMaterial({
    color: hex, roughness: 0.7, metalness: 0,
    flatShading: !!s.flat, side: s.double ? THREE.DoubleSide : THREE.FrontSide
  });
}
function createMesh(shape, hex, cast, receive) {
  const m = new THREE.Mesh(makeGeometry(shape), makeMaterial(shape, hex));
  m.userData.shape = shape;
  m.castShadow = !!cast;
  m.receiveShadow = !!receive;
  return m;
}
function register(m) {
  if (!m.name) m.name = SHAPES[m.userData.shape].label + ' ' + (++counter);
  scene.add(m);
  objs.push(m);
}
function dropOnFloor(m) {
  m.geometry.computeBoundingBox();
  m.position.y = -m.geometry.boundingBox.min.y * m.scale.y;
}
function disposeMesh(m) { scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
function clearAll() { select(null); objs.splice(0).forEach(disposeMesh); counter = 0; renderList(); }

/* ============ Selezione e UI ============ */
function select(m) {
  sel = m;
  if (m) { tc.attach(m); setUI(m); syncTransform(); }
  else { tc.detach(); nameIn.value = ''; }
  renderList();
  $('dup').disabled = $('del').disabled = nameIn.disabled = !m;
  tin.forEach(i => { i.disabled = !m; if (!m) i.value = ''; });
}
function setUI(m) {
  shapeSel.value = m.userData.shape;
  const hex = '#' + m.material.color.getHexString();
  const known = [...colorSel.options].some(o => o.value === hex);
  colorSel.value = known ? hex : 'custom';
  custom.value = hex;
  custom.hidden = known;
  castCb.checked = m.castShadow;
  recvCb.checked = m.receiveShadow;
  nameIn.value = m.name;
}
function renderList() {
  list.innerHTML = '';
  objs.forEach(m => {
    const li = document.createElement('li');
    if (m === sel) li.className = 'sel';
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = '#' + m.material.color.getHexString();
    const t = document.createElement('span');
    t.textContent = m.name || '(senza nome)';
    li.append(sw, t);
    li.onclick = () => select(m);
    list.appendChild(li);
  });
}

/* Controlli forma / colore / ombre: agiscono sull'oggetto selezionato,
   altrimenti sono i valori usati dal prossimo "Aggiungi" */
shapeSel.onchange = () => {
  if (sel) {
    const s = shapeSel.value, d = SHAPES[s], oldLabel = SHAPES[sel.userData.shape].label;
    sel.geometry.dispose();
    sel.geometry = makeGeometry(s);
    sel.userData.shape = s;
    sel.material.flatShading = !!d.flat;
    sel.material.side = d.double ? THREE.DoubleSide : THREE.FrontSide;
    sel.material.needsUpdate = true;
    if (sel.name.startsWith(oldLabel + ' ')) { sel.name = d.label + sel.name.slice(oldLabel.length); nameIn.value = sel.name; }
    renderList(); changed();
  }
  shapeSel.blur();
};
function applyColor() {
  if (!sel) return;
  sel.material.color.set(getHex());
  renderList(); changed();
}
colorSel.onchange = () => {
  const isCustom = colorSel.value === 'custom';
  custom.hidden = !isCustom;
  if (isCustom && sel) custom.value = '#' + sel.material.color.getHexString();
  else applyColor();
  colorSel.blur();
};
custom.oninput = applyColor;
castCb.onchange = () => { if (sel) { sel.castShadow = castCb.checked; changed(); } };
recvCb.onchange = () => { if (sel) { sel.receiveShadow = recvCb.checked; changed(); } };
nameIn.oninput = () => { if (sel) { sel.name = nameIn.value; renderList(); changed(); } };

$('add').onclick = () => {
  const m = createMesh(shapeSel.value, getHex(), castCb.checked, recvCb.checked);
  dropOnFloor(m);
  register(m);
  select(m);
  changed();
};
$('dup').onclick = () => {
  if (!sel) return;
  const m = createMesh(sel.userData.shape, '#' + sel.material.color.getHexString(), sel.castShadow, sel.receiveShadow);
  m.position.copy(sel.position).x += 0.5;
  m.rotation.copy(sel.rotation);
  m.scale.copy(sel.scale);
  m.name = sel.name + ' copia';
  register(m);
  select(m);
  changed();
};
function removeSel() {
  if (!sel) return;
  const m = sel;
  select(null);
  objs.splice(objs.indexOf(m), 1);
  disposeMesh(m);
  renderList(); changed();
}
$('del').onclick = removeSel;

/* ============ Trasformazioni (gizmo + campi numerici) ============ */
const tin = [];   // 0-2 posizione, 3-5 rotazione (gradi), 6-8 scala
const tgrid = $('tgrid');
[['Posizione', 0.1], ['Rotazione °', 5], ['Scala', 0.1]].forEach(([lab, step]) => {
  const s = document.createElement('span');
  s.textContent = lab;
  tgrid.appendChild(s);
  for (let i = 0; i < 3; i++) {
    const inp = document.createElement('input');
    inp.type = 'number'; inp.step = step; inp.disabled = true;
    inp.oninput = applyTransform;
    tgrid.appendChild(inp);
    tin.push(inp);
  }
});
function syncTransform() {
  if (!sel) return;
  const r = n => +n.toFixed(3);
  const v = [sel.position.x, sel.position.y, sel.position.z,
             deg(sel.rotation.x), deg(sel.rotation.y), deg(sel.rotation.z),
             sel.scale.x, sel.scale.y, sel.scale.z];
  v.forEach((n, i) => { tin[i].value = r(n); });
}
function applyTransform() {
  if (!sel) return;
  const v = tin.map(i => parseFloat(i.value));
  if (v.some(isNaN)) return;
  const nz = x => x === 0 ? 0.001 : x;
  sel.position.set(v[0], v[1], v[2]);
  sel.rotation.set(rad(v[3]), rad(v[4]), rad(v[5]));
  sel.scale.set(nz(v[6]), nz(v[7]), nz(v[8]));
  changed();
}
function setMode(m) {
  tc.setMode(m);
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
}
document.querySelectorAll('[data-mode]').forEach(b => { b.onclick = () => setMode(b.dataset.mode); });
$('snap').onchange = e => {
  const on = e.target.checked;
  tc.setTranslationSnap(on ? 0.25 : null);
  tc.setRotationSnap(on ? rad(15) : null);
  tc.setScaleSnap(on ? 0.25 : null);
};
$('grid').onchange = e => { helpers.visible = e.target.checked; };

/* ============ Selezione con click sul viewport ============ */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let down = null;
dom.addEventListener('pointerdown', e => {
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  down = e.button === 0 ? { x: e.clientX, y: e.clientY, gizmo: !!sel && tc.axis !== null } : null;
});
dom.addEventListener('pointerup', e => {
  const d = down; down = null;
  if (!d || d.gizmo || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 4) return;
  const r = dom.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(objs, false)[0];
  select(hit ? hit.object : null);
});
addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'w') setMode('translate');
  else if (k === 'e') setMode('rotate');
  else if (k === 'r') setMode('scale');
  else if (k === 'delete' || k === 'backspace') removeSel();
  else if (k === 'escape') select(null);
  else if (k === 'd' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('dup').click(); }
});

/* ============ Salvataggio, JSON, codice ============ */
const KEY = 'threejs-object-editor-v1';
const r4 = n => Math.round(n * 10000) / 10000;
function serialize() {
  return {
    v: 1,
    objects: objs.map(m => ({
      name: m.name,
      shape: m.userData.shape,
      color: '#' + m.material.color.getHexString(),
      cast: m.castShadow,
      receive: m.receiveShadow,
      pos: m.position.toArray().map(r4),
      rot: [m.rotation.x, m.rotation.y, m.rotation.z].map(r4),
      scl: m.scale.toArray().map(r4)
    }))
  };
}
function loadData(d) {
  clearAll();
  (d.objects || []).forEach(o => {
    if (!SHAPES[o.shape]) return;
    const m = createMesh(o.shape, o.color || '#ffffff', o.cast !== false, !!o.receive);
    m.name = o.name || '';
    m.position.fromArray(o.pos || [0, 0, 0]);
    m.rotation.set(...(o.rot || [0, 0, 0]));
    m.scale.fromArray(o.scl || [1, 1, 1]);
    register(m);
  });
  counter = objs.length;
  renderList();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(serialize())); } catch (e) {} }
function changed() { clearTimeout(saveT); saveT = setTimeout(save, 300); }

function genCode() {
  let s = '// Generato con Editor oggetti Three.js (compatibile r128+)\n' +
          '// Richiede renderer.shadowMap.enabled = true e una luce con castShadow = true.\n' +
          '// Le singole parti si recuperano con group.getObjectByName("nome").\n' +
          'function createObject() {\n  const group = new THREE.Group();\n';
  serialize().objects.forEach(o => {
    const d = SHAPES[o.shape];
    const opts = ['color: 0x' + o.color.slice(1), 'roughness: 0.7', 'metalness: 0'];
    if (d.flat) opts.push('flatShading: true');
    if (d.double) opts.push('side: THREE.DoubleSide');
    const L = [
      '  {',
      '    const mesh = new THREE.Mesh(',
      '      ' + d.code + ',',
      '      new THREE.MeshStandardMaterial({ ' + opts.join(', ') + ' })',
      '    );',
      '    mesh.name = ' + JSON.stringify(o.name) + ';',
      '    mesh.position.set(' + o.pos.join(', ') + ');'
    ];
    if (o.rot.some(v => v)) L.push('    mesh.rotation.set(' + o.rot.join(', ') + ');');
    if (o.scl.some(v => v !== 1)) L.push('    mesh.scale.set(' + o.scl.join(', ') + ');');
    if (o.cast) L.push('    mesh.castShadow = true;');
    if (o.receive) L.push('    mesh.receiveShadow = true;');
    L.push('    group.add(mesh);', '  }');
    s += '\n' + L.join('\n') + '\n';
  });
  return s + '\n  return group;\n}\n';
}
$('exp-js').onclick = () => { out.value = genCode(); };
$('exp-json').onclick = () => {
  out.value = '{"v":1,"objects":[\n' + serialize().objects.map(o => '  ' + JSON.stringify(o)).join(',\n') + '\n]}';
};
$('copy').onclick = async e => {
  const b = e.currentTarget;
  out.select();
  try { await navigator.clipboard.writeText(out.value); } catch (_) { document.execCommand('copy'); }
  const t = b.textContent;
  b.textContent = 'Copiato ✓';
  setTimeout(() => { b.textContent = t; }, 1200);
};
$('imp').onclick = () => {
  try { loadData(JSON.parse(out.value)); changed(); }
  catch (e) { alert('JSON non valido'); }
};
$('clr').onclick = () => { if (confirm('Eliminare tutti gli oggetti?')) { clearAll(); changed(); } };

/* ============ Avvio ============ */
Object.entries(SHAPES).forEach(([k, s]) => shapeSel.add(new Option(s.label, k)));
const lum = h => { const n = parseInt(h.slice(1), 16); return (((n >> 16) & 255) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000; };
PALETTE.forEach(([name, hex]) => {
  const o = new Option(name, hex);
  o.style.background = hex;
  o.style.color = lum(hex) > 140 ? '#000' : '#fff';
  colorSel.add(o);
});
colorSel.add(new Option('Personalizzato…', 'custom'));
colorSel.value = '#fb8c00';

setMode('translate');
try { const s = localStorage.getItem(KEY); if (s) loadData(JSON.parse(s)); } catch (e) {}
select(null);
})();
</script>
</body>
</html>
