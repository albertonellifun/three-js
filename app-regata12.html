<!DOCTYPE html>
<html lang="it">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Regata – Mini Pianeta</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cd;
        font-family: system-ui, sans-serif;
        color: #fff
      }

      canvas {
        display: block;
        touch-action: none
      }

      #ui {
        display: none
      }

      /* ---------- schermata iniziale ---------- */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 100;
        overflow: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: radial-gradient(ellipse at 50% 0%, #2a86c9 0%, #0e4f86 45%, #071b33 100%)
      }

      #m_card {
        width: min(460px, 100%);
        margin: auto;
        box-sizing: border-box;
        padding: 24px 20px;
        border-radius: 22px;
        text-align: center;
        background: rgba(8, 30, 55, .77);
        backdrop-filter: blur(2px);
        border: 1px solid rgba(255, 255, 255, .3);
        box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
      }

      #m_card h1 {
        margin: 0 0 18px;
        font-size: clamp(26px, 6.5vw, 38px);
        line-height: 1.1;
        text-shadow: 0 2px 8px rgba(0, 0, 0, .4)
      }

      .m_s {
        margin: 16px 0 8px;
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        opacity: .8
      }

      #m_liv {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 8px
      }

      .lv {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 6px;
        border-radius: 12px;
        border: 2px solid rgba(255, 255, 255, .25);
        background: rgba(255, 255, 255, .08);
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        touch-action: manipulation
      }

      .lv i {
        display: block;
        width: 100%;
        height: 28px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, .6)
      }

      .lv.on {
        border-color: #ffd60a;
        background: rgba(255, 214, 10, .16)
      }

      #m_r,
      #m_h {
        width: 100%;
        accent-color: #ffd60a
      }

      #m_rv,
      #m_hv {
        font-size: 14px;
        margin-top: 2px
      }

      #m_play {
        margin-top: 22px;
        width: 100%;
        height: 54px;
        border-radius: 14px;
        border: 0;
        background: #ffd60a;
        color: #0b1d33;
        font-size: 20px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation
      }

      #m_play:disabled {
        opacity: .7;
        cursor: default
      }

      #m_err {
        margin-top: 10px;
        font-size: 12px;
        color: #ffb4ab;
        display: none
      }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 14px;
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: flex-end;
        pointer-events: none
      }

      .p {
        background: rgba(8, 30, 55, .77);
        backdrop-filter: blur(2px);
        border: 1px solid rgba(255, 255, 255, .3);
        border-radius: 16px;
        padding: 8px 12px;
        text-align: center;
        font-size: 13px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .p b {
        font-size: 28px;
        display: block
      }

      .p canvas {
        width: 130px;
        height: 130px
      }

      #help {
        position: fixed;
        top: 0px;
        left: 12px;
        font-size: 12px;
        text-shadow: 0 1px 3px #000;
        left: 50%;
        transform: translateX(-50%);
      }

      #gt {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 2px
      }

      #gt button {
        pointer-events: auto;
        touch-action: manipulation;
        min-width: 30px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, .5);
        background: rgba(255, 255, 255, .15);
        color: #fff;
        font-size: 16px;
        cursor: pointer
      }

      #tc {
        display: none
      }

      .g {
        position: fixed;
        bottom: 4px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-evenly;
        gap: 8px
      }

      .g button {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, .5);
        background: rgba(8, 30, 55, .77);
        color: #fff;
        font-size: 26px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none
      }

      /* regole base: PRIMA della media query, così gli override mobile funzionano */
      #mw {
        position: fixed;
        top: 10px;
        left: 12px;
        padding: 5px;
        border-radius: 14px;
        background: rgba(8, 30, 55, .77);
        border: 1px solid rgba(255, 255, 255, .3);
        backdrop-filter: blur(2px);
        text-align: center;
        font-size: 11px;
        pointer-events: auto;
        cursor: zoom-in;
        z-index: 5;
        touch-action: manipulation;
      }

      #mw.z {
        cursor: zoom-out
      }

      #mw.z #mp {
        width: min(400px, calc(100vw - 40px));
        height: auto
      }

      #mp {
        width: 200px;
        height: 100px;
        border-radius: 9px
      }

      #tools {
        position: fixed;
        top: 10px;
        right: 12px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }

      #tools button,
      #fps {
        pointer-events: auto;
		font: 600 12px/1 ui-monospace, Menlo, monospace;
        padding: 6px 9px;
        border-radius: 10px;
        background: rgba(8, 30, 55, .77);
        border: 1px solid rgba(255, 255, 255, .3);
        backdrop-filter: blur(2px);
		white-space: pre; 
		text-align: right;
      }

      #mu {
        right: 12px;
      }

        right: 50px;
      }

      #tpBtn {
        right: 88px;
      }

        #tc {
          display: block
        }

        #help {
          display: none
        }

        #hud {
          top: 6px;

        }

        .p {

          border-radius: 12px
        }

        .p canvas {

          height: 84px
        }

        .p b {

        }

        #mw.z #mp {
          width: min(260px, calc(100vw - 30px));
          height: auto
        }

          height: 65px
        }

          right: 8px
        }

          bottom: 78px;
          left: 8px
        }

          top: auto;
          bottom: 78px;
          right: 8px
        }
      }

      body.nui #hud,
      body.nui #mw,
      body.nui #fps,
      body.nui #mu,
      body.nui #cpBtn,
      body.nui #tpBtn,
      body.nui #help,

        filter: url(#nightFx);
      }

      //colore livrea + altezza montagne
      function startGame(R, liveryIdx, mountK) {
        const T = THREE,
          V3 = (x, y, z) => new T.Vector3(x, y, z),
          clamp = (x, a, b) => Math.min(b, Math.max(a, x));
        const sstep = (a, b, x) => {
          x = clamp((x - a) / (b - a), 0, 1);
          return x * x * (3 - 2 * x)
        };
        const lin = h => new T.Color(h).convertSRGBToLinear();
        const FOG = +new URLSearchParams(location.search).get('f') || .0016;
        const MHK = mountK || 1; // moltiplicatore altezza montagne
        const UWD = .035,
          UWC = lin(0x0e5466),
          CAM_FLOOR = 1.5;
        const seed = Math.random() * 100;
        let pitch = 0;
        /* distanza angolare minima tra vulcani/isola: scala con R (a R=600 coincide con il vecchio .93) */
        const SEPC = Math.cos(Math.max(.3747, 200 / R));
        /* ---------- noise ---------- */
        function hs(x, y, z) {
          let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
          h = Math.imul(h ^ (h >>> 13), 1274126177);
          return ((h ^ (h >>> 16)) >>> 0) / 4294967295
        }

        function vn(x, y, z) {
          const ix = Math.floor(x),
            iy = Math.floor(y),
            iz = Math.floor(z);
          let fx = x - ix,
            fy = y - iy,
            fz = z - iz;
          fx *= fx * (3 - 2 * fx);
          fy *= fy * (3 - 2 * fy);
          fz *= fz * (3 - 2 * fz);
          const L = (a, b, t) => a + (b - a) * t,
            h = (a, b, c) => hs(ix + a, iy + b, iz + c);
          return L(L(L(h(0, 0, 0), h(1, 0, 0), fx), L(h(0, 1, 0), h(1, 1, 0), fx), fy), L(L(h(0, 0, 1), h(1, 0, 1), fx), L(h(0, 1, 1), h(1, 1, 1), fx), fy), fz)
        }

        function fbm(x, y, z, o = 5) {
          let s = 0,
            a = .5,
            f = 1;
          for (let i = 0; i < o; i++) {
            s += a * vn(x * f + seed, y * f + seed * .7, z * f + seed * 1.3);
            a *= .5;
            f *= 2.03
          }
          return s
        }
        /* ---------- terreno procedurale ---------- */
        const VR = 34,
          VF = 16;
        const vols = [];
        let lastVol = 1e9;
        //isola del faro
        let lastIsl = 1e9,
          isl = null; // isl = direzione unitaria dell'isola del faro
        const islT = (x, y, z, d) => -6 + 12 * (1 - sstep(14, 52, d)) // piattaforma piana r<14, costa a ~33 m
          +
          (fbm(x * 45, y * 45, z * 45, 2) - .45) * 6 * sstep(14, 30, d); // costa irregolare, piattaforma intatta
        function baseH(x, y, z) {
          let h = (fbm(x * 3, y * 3, z * 3) - .6) * 180;
          if (h > 0) h = (h * 1.5 + sstep(5, 20, h) * (1 - Math.abs(fbm(x * 14, y * 14, z * 14, 3) * 2 - 1)) * 9) * MHK;
          return Math.max(h, -55)
        }

        function hAt(x, y, z) {
          let h = baseH(x, y, z);
          lastVol = 1e9;
          lastIsl = 1e9;
          for (const v of vols) {
            const d = Math.acos(clamp(x * v.x + y * v.y + z * v.z, -1, 1)) * R;
            if (d < 90) {
              lastVol = Math.min(lastVol, d);
              h += (Math.max(h, -8) - h) * sstep(90, 55, d);
              h += 14 * sstep(90, 12, d) + 52 * Math.pow(clamp(1 - Math.max(d, VR) / 55, 0, 1), 1.2) - 16 * sstep(VR, VF, d)
            }
          }
          if (isl) {
            const d = Math.acos(clamp(x * isl.x + y * isl.y + z * isl.z, -1, 1)) * R;
            if (d < 90) {
              lastIsl = d;
              h += (islT(x, y, z, d) - h) * sstep(90, 52, d);
            }
          }
          return h
        }
        const rnd = () => Math.random(),
          rdir = () => {
            for (;;) {
              const x = rnd() * 2 - 1,
                y = rnd() * 2 - 1,
                z = rnd() * 2 - 1,
                l = Math.hypot(x, y, z);
              if (l < 1 && l > .1) return V3(x / l, y / l, z / l)
            }
          };
        for (let i = 0; i < 40000 && vols.length < 3; i++) {
          const d = rdir(),
            h = baseH(d.x, d.y, d.z);
          if (h > -20 && h < 6 && vols.every(v => v.dot(d) < SEPC)) vols.push(d)
        }
        for (let i = 0; i < 60000 && !isl; i++) {
          const d = rdir(),
            b = baseH(d.x, d.y, d.z);
          if (b > -14 || b < -48 || !vols.every(v => v.dot(d) < SEPC)) continue;
          let ok = true;
          for (let k = 0; k < 28 && ok; k++) {
            const r = 30 + rnd() * 130,
              p = d.clone().addScaledVector(rdir(), r / R).normalize();
            ok = baseH(p.x, p.y, p.z) < -5;
          }
          if (ok) isl = d;
        }
        if (!isl) {
			console.warn('Faro: nessun sito valido, isola non creata');
			document.getElementById('help').textContent += ` · Faro non creato`;
		}
        const MOB = matchMedia("(pointer:coarse)").matches || innerWidth < 700;
        const N = +new URLSearchParams(location.search).get('n') || (MOB ? 64 : 128);
        const WATERDETAIL = +new URLSearchParams(location.search).get('d') || (MOB ? 1.5 : 3);

            U.wr2.value = r * r;
          }
          U.fwd.value.copy(Tn);
          U.spd.value = speed;
          clouds.rotation.y = time * .004;
          const th = camYaw,
            ph = camPit,
            off = Rt.clone().multiplyScalar(Math.sin(th) * Math.cos(ph)).addScaledVector(P, Math.sin(ph)).addScaledVector(Bk, Math.cos(th) * Math.cos(ph)).multiplyScalar(camD);
          const want = boat.position.clone().addScaledVector(P, 6).add(off);
          //isola
          floorCam(want);
          avoidFaro(want);
          floorCam(want);
          cam.position.lerp(want, 1 - Math.exp(-6 * dt));
          avoidFaro(cam.position);
          floorCam(cam.position);
          cam.up.copy(cam.position).normalize();
          cam.lookAt(boat.position.clone().addScaledVector(P, 7));
          U.cam.value.copy(cam.position);
          U.up.value.copy(cam.position).normalize();
          sky.position.copy(cam.position);
          const cL = cam.position.length(),
            sea = R + waveH(cam.position, time),
            uw = sstep(sea + .25, sea - .25, cL),
            dep = Math.max(0, sea - cL);
		  oceanMat.side = cL > R + 3 ? T.FrontSide : T.DoubleSide;//ottimizzazione
          U.uw.value = uw;
          U.uwc.value.copy(UWC).multiplyScalar((.05 + .95 * dayK) * (.3 + .7 * Math.exp(-dep / 40)));
          scene.fog.color.copy(HOR).lerp(U.uwc.value, uw);
          scene.fog.density = FOG + (UWD - FOG) * uw;
          clouds.visible = uw < .99;
          faroUpdate(time, dayK); //isola
          renderer.render(scene, cam);
		  //ottimizzazione
		  if ((hudT += dt) >= .03) {
			hudT = 0; 
			drawHud(); 
			drawMap(); 
		  }
          
		  SS.time = time;
          SS.windKn = windKn;
          SS.speed = speed;
          SS.roll = roll;
          SS.touch = touch;
          SS.flap = Math.max(lf * ab, e * (1 - fillS) * .6);
          Snd.update(dt, SS)
        }
        frame();
        Snd.start(); // l'AudioContext è già stato creato/ripreso nel click su Play
      }
    </script>
    <script>
      /* ---------- schermata iniziale ---------- */
      (function() {
        const $ = id => document.getElementById(id);
        const hex = h => '#' + h.toString(16).padStart(6, '0');
        const menu = $('menu'),
          ui = $('ui'),
          liv = $('m_liv'),
          rg = $('m_r'),
          rv = $('m_rv'),
          hg = $('m_h'),
          hv = $('m_hv'),
          play = $('m_play'),
          err = $('m_err');
        let sel = 0;
        // selettore livrea / colore barca
        cupLiveries.forEach((l, i) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'lv' + (i === sel ? ' on' : '');
          const sw = document.createElement('i');
          sw.style.background = `linear-gradient(${hex(l.hullTop)} 0 34%,${hex(l.hullStripe)} 34% 52%,${hex(l.hullBottom)} 52%)`;
          const nm = document.createElement('span');
          nm.textContent = `Team: ${l.name} · ${l.country}`;
          b.append(sw, nm);
          b.addEventListener('click', () => {
            sel = i;
            [...liv.children].forEach((c, k) => c.classList.toggle('on', k === i));
          });
          liv.appendChild(b);
        });
        // selettore altezza montagne
        const h0 = +new URLSearchParams(location.search).get('mh');
		if (h0) hg.value = h0;
        const showH = () => {
          const k = +hg.value,
            n = k < .5 ? 'Dolci' : k < .9 ? 'Basse' : k < 1.3 ? 'Normali' : k < 1.8 ? 'Alte' : 'Altissime';
          hv.textContent = `${n} · ×${k.toFixed(2).replace('.', ',')} · cime fino a ≈ ${Math.round(60 * k)} m`;
        };
        hg.addEventListener('input', showH);
        showH();
        // selettore dimensione pianeta (R)
        const r0 = +new URLSearchParams(location.search).get('r');
		if (r0) rg.value = r0;
        const showR = () => {
          const R = +rg.value,
            n = R < 500 ? 'Piccolo' : R < 800 ? 'Medio' : R < 1000 ? 'Grande' : 'Enorme';
          rv.textContent = `${n} · R = ${R} m · Equatore ≈ ${(2 * Math.PI * R / 1000).toFixed(1).replace('.', ',')} km`;
        };
        rg.addEventListener('input', showR);
        showR();
        // Play: l'AudioContext nasce dentro il gesto utente, poi si genera il mondo
        play.addEventListener('click', () => {
          play.disabled = true;
          play.textContent = 'Generazione del mondo…';
          err.style.display = 'none';
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC && !window.__actx) {
            try {
              window.__actx = new AC();
              window.__actx.resume();
            } catch (e) {}
          }
          const R = +rg.value,
            mk = +hg.value,
            li = sel;
          requestAnimationFrame(() => setTimeout(() => {
            try {
              startGame(R, li, mk);
              ui.style.display = 'block';
              menu.remove();
            } catch (e) {
              console.error(e);
              err.textContent = 'Errore nella generazione: ' + e.message;
              err.style.display = 'block';
              play.disabled = false;
              play.textContent = '▶ Play';
            }
          }, 30));
        });
      })();
    </script>
