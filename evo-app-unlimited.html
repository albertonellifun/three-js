<script>
(()=>{
'use strict';
const DS=3;
const CH=12;
const HALF=5;
const AHEAD=8;   // 8*12*3 ≈ 290-320 m, sempre dentro i tile (TR=3), era 15
const RATE=0.004;
const H=1/120;
const PRE=20;// punti di strada prima della partenza (vedi punto 2)
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=x=>x-Math.floor(x);
const angDiff=(a,b)=>{
		let d=b-a;
		while(d>Math.PI)d-=2*Math.PI;
		while(d<-Math.PI)d+=2*Math.PI;
		return d;
};
const $=id=>document.getElementById(id);



const params = new URLSearchParams(location.search);
const USE_MOBILE = params.get('mobile') === '1';
const USE_DESKTOP = params.get('mobile') === '0';
const IS_MOBILE = !USE_DESKTOP && (USE_MOBILE || matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent));

console.log(USE_DESKTOP, USE_MOBILE, '--> ' + IS_MOBILE);




const PINE_TRUNK_GEO = 4;//tronco è un cilindro quadrato
const PINE_LEAVES_GEO = 8;//le foglie sono coni esagonali :)
let headlightsOn = false;//luci accese anche di giorno, e prudenza... sempre!
let shadowsOn=true;
let camInside = false;
let glassInside = null;   // ultimo stato applicato
let fpsSmooth=60;

//danneggiamento!
const dmg={toe:[0,0,0,0],camber:[0,0,0,0],lost:[false,false,false,false],pull:0,
			zone:[0,0,0,0]}; // zone: muso, coda, sx, dx
function repairCar(){ 
  spawnCar(); 
  Object.assign(dmg,{toe:[0,0,0,0],camber:[0,0,0,0],lost:[false,false,false,false],pull:0,
			zone:[0,0,0,0]}); 
}



const _v=new THREE.Vector3(), _p=new THREE.Vector3();


//danni 2.0
const _bb=new THREE.Box3(), _m=new THREE.Matrix4(), _mi=new THREE.Matrix4();

// suddivide i triangoli finché i lati sono < maxEdge (geometria non indicizzata)
function subdivideGeo(src,maxEdge){
  const g=src.index?src.toNonIndexed():src.clone();
  const P=g.attributes.position.array, U=g.attributes.uv?g.attributes.uv.array:null;
  const oP=[], oU=U?[]:null, e2=maxEdge*maxEdge;
  const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
  const mid=(a,b)=>a.map((v,i)=>(v+b[i])*.5);
  const emitT=(a,b,c,ua,ub,uc,dp)=>{
    if(dp<5&&Math.max(d2(a,b),d2(b,c),d2(c,a))>e2){
      const ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
      const uab=U&&mid(ua,ub),ubc=U&&mid(ub,uc),uca=U&&mid(uc,ua);
      emitT(a,ab,ca,ua,uab,uca,dp+1);
      emitT(ab,b,bc,uab,ub,ubc,dp+1);
      emitT(ca,bc,c,uca,ubc,uc,dp+1);
      emitT(ab,bc,ca,uab,ubc,uca,dp+1);
    }else{
      oP.push(...a,...b,...c);
      if(U)oU.push(...ua,...ub,...uc);
    }
  };
  for(let i=0;i<P.length;i+=9){
    const t=i/9*6;
    emitT([P[i],P[i+1],P[i+2]],[P[i+3],P[i+4],P[i+5]],[P[i+6],P[i+7],P[i+8]],
          U&&[U[t],U[t+1]],U&&[U[t+2],U[t+3]],U&&[U[t+4],U[t+5]],0);
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(oP,3));
  if(U)out.setAttribute('uv',new THREE.Float32BufferAttribute(oU,2));
  out.computeVertexNormals();
  return out;
}

function dent(lx,lz,R,depth){
  carG.updateMatrixWorld(true);
  const k=1/model.scale.x;                              // 127/pandina: g.scale=1.2
  _p.set(lx,.6,lz); model.worldToLocal(carG.localToWorld(_p));
  R*=k; depth*=k;

  // spinta lungo l'asse dominante dell'urto (niente taglio diagonale)
  const fF=lz/2.1, fS=lx/.95, lat=Math.abs(fS)>Math.abs(fF);
  const pushX=lat?-Math.sign(fS):0, pushZ=lat?0:-Math.sign(fF);

  const mInv=model.matrixWorld.clone().invert();
  model.traverse(o=>{
    if(!o.isMesh||o.userData.noDent) return;
    const wheel=o.parent&&(o.parent.name==='steer'||o.parent.name==='spin');
    _m.multiplyMatrices(mInv,o.matrixWorld);
    let g=o.geometry;
    if(!g.boundingBox) g.computeBoundingBox();
    if(_bb.copy(g.boundingBox).applyMatrix4(_m).distanceToPoint(_p)>R) return;  // mesh lontana: non si tocca

    if(!o.userData.own){                                 // una volta sola, solo per le mesh colpite
      g=o.geometry=wheel?g.clone():subdivideGeo(g,.3);
      o.userData.own=true;
    }
    _mi.copy(_m).invert();
    const pos=g.attributes.position, df=wheel?.25:1;
    for(let i=0;i<pos.count;i++){
      _v.fromBufferAttribute(pos,i).applyMatrix4(_m);    // direttamente nello spazio del modello
      const d=_v.distanceTo(_p);
      if(d>R) continue;
      // rumore continuo nello spazio: vertici coincidenti = stesso valore, niente cuciture aperte
      const n=.6+.4*vnoise(_v.x*9+_v.y*4.7,_v.z*9+_v.y*3.1);
      const f=(1-d/R)**2*depth*n*df;
      _v.x+=pushX*f*.6;
      _v.z+=pushZ*f*.6;
      _v.y-=f*.3;                                        // era f: cedimento verso il basso ridotto
      _v.applyMatrix4(_mi);
      pos.setXYZ(i,_v.x,_v.y,_v.z);
    }
    pos.needsUpdate=true;
    g.computeVertexNormals();
    g.computeBoundingBox(); g.computeBoundingSphere();
  });
}




//danneggiamento
function dentOLD(lx,lz,R,depth){
  _p.set(lx,.6,lz);
  // direzione di spinta verso l'interno, combinando componente longitudinale e laterale
  const fFront=clamp(lz/2.1,-1,1);   // -1 dietro .. 1 davanti
  const fSide =clamp(lx/.95,-1,1);   // -1 sinistra .. 1 destra
  const pushZ=-fFront;
  const pushX=-fSide;                // urto laterale: lo sportello si incassa verso il centro auto
  model.updateMatrixWorld(true);
  let moved=0;
  model.traverse(o=>{
	if(!o.isMesh||o.userData.noDent) return;
	let isWheel = false;
	if (o.parent && (o.parent.name === 'steer' || o.parent.name === 'spin')) isWheel=true;
	if(!o.userData.own){o.geometry=o.geometry.clone();o.userData.own=true;}
	const pos=o.geometry.attributes.position;
	const inv=o.matrixWorld.clone().invert();
	const damageFactor = isWheel ? 0.25 : 1.0;
	for(let i=0;i<pos.count;i++){
      _v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);
      model.worldToLocal(_v);
      const d=_v.distanceTo(_p);
      if(d>R)continue;
	  const f=(1-d/R)**2*depth*(.6+Math.random()*.4) * damageFactor;
      _v.x+=pushX*f*.6;
      _v.z+=pushZ*f*.6; 
	  _v.y-=f;
      model.localToWorld(_v); _v.applyMatrix4(inv);
      pos.setXYZ(i,_v.x,_v.y,_v.z);
      moved++;
    }
    pos.needsUpdate=true; o.geometry.computeVertexNormals();
  });
  console.log('dent: vertici spostati',moved);
}

// Chiavi orarie: [ora, colore sole, intensità sole, intensità luce ambientale] + [cielo zenit, cielo orizzonte]]
const LIGHT_KEYS=[
 [0,    0x26305c, 0.12, 0.30, [0x050a1f, 0x141c3a]],
 [5,    0x26305c, 0.12, 0.30, [0x050a1f, 0x141c3a]],
 [6.5,  0xff8a3c, 0.55, 0.45, [0x3a5a9a, 0xff9a5c]],   // alba
 [8,    0xffe6c0, 0.85, 0.70, [0x0f55c4, 0xc4dcf2]],   // mattino
 [16.5, 0xfff0d8, 0.85, 0.70, [0x0f55c4, 0xc4dcf2]],   // pomeriggio
 [18.5, 0xff7a2e, 0.50, 0.42, [0x3a4f9a, 0xff8a4a]],   // tramonto
 [20,   0x3a3a7a, 0.12, 0.28, [0x141a40, 0x4a3a6a]],   // crepuscolo
 [24,   0x26305c, 0.12, 0.30, [0x050a1f, 0x141c3a]]
];
function lightAt(h){
  for(let i=1;i<LIGHT_KEYS.length;i++){
    const a=LIGHT_KEYS[i-1], b=LIGHT_KEYS[i];
    if(h<=b[0]){
      const t=(h-a[0])/(b[0]-a[0]);
      return {color:hexMix(a[1],b[1],t), sun:lerp(a[2],b[2],t), amb:lerp(a[3],b[3],t),
              zen:hexMix(a[4][0],b[4][0],t), hor:hexMix(a[4][1],b[4][1],t)};
    }
  }
  const k=LIGHT_KEYS[0];
  return {color:k[1], sun:k[2], amb:k[3], zen:k[4][0], hor:k[4][1]};
}
const hexMix=(a,b,t)=>{
  const ar=a>>16,ag=(a>>8)&255,ab=a&255;
  const br=b>>16,bg=(b>>8)&255,bb=b&255;
  return (Math.round(ar+(br-ar)*t)<<16)|(Math.round(ag+(bg-ag)*t)<<8)|Math.round(ab+(bb-ab)*t);
};

const hlU={
  uHLPos:{value:new THREE.Vector3()},
  uHLDir:{value:new THREE.Vector2(0,1)},
  uHLK:{value:0}
};
function patchHeadlight(m){
  const prevCompile=m.onBeforeCompile, prevKey=m.customProgramCacheKey;
  m.onBeforeCompile=(sh,r)=>{
    if(prevCompile)prevCompile(sh,r);
    Object.assign(sh.uniforms,hlU);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vHW;')
      .replace('#include <begin_vertex>',`#include <begin_vertex>
#ifdef USE_INSTANCING
  vHW=(modelMatrix*instanceMatrix*vec4(transformed,1.)).xyz;
#else
  vHW=(modelMatrix*vec4(transformed,1.)).xyz;
#endif`);
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
uniform vec3 uHLPos; uniform vec2 uHLDir; uniform float uHLK; varying vec3 vHW;`)
      .replace('#include <fog_fragment>',`
if(uHLK>0.){
  vec3 d=vHW-uHLPos;
  float f=dot(d.xz,uHLDir);                         // distanza davanti all'auto
  float l=dot(d.xz,vec2(uHLDir.y,-uHLDir.x));       // distanza laterale
  float hw=1.6+f*.30;                               // il cono si allarga
  float beam=smoothstep(1.,5.,f)*(1.-smoothstep(25.,60.,f))
            *(1.-smoothstep(hw*.35,hw,abs(l)))
            *(1.-smoothstep(4.,10.,abs(d.y)));
  beam/=1.+f*.03;
  gl_FragColor.rgb+=vec3(1.,.92,.7)*beam*uHLK*(.22+diffuseColor.rgb*1.1);
}
#include <fog_fragment>`);
  };
  m.customProgramCacheKey=()=>(prevKey?prevKey.call(m):'')+'hl';
  m.needsUpdate=true;
}




/* ============ TEXTURE STRADA ============ */
function mkTex(draw,w=256,h=512){
	const c=document.createElement('canvas');
	c.width=w;
	c.height=h;
	draw(c.getContext('2d'),w,h);
    const t=new THREE.CanvasTexture(c);
	t.wrapS=t.wrapT=THREE.RepeatWrapping;
	t.anisotropy=4;
	return t;
}
function speckle(g,w,h,n,al,light){
	const v=light?255:0;
	for(let i=0;i<n;i++){
		g.fillStyle=`rgba(${v},${v},${v},${Math.random()*al})`;
		g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);
	}
}

const bumpAt=s=>{
 const c=Math.floor(s/140);
 let y=0;
 for(let k=Math.max(1,c-1);k<=c+1;k++){
  if(hash2(k,77)<.55)continue;                       // ~1 dosso ogni 300 m
  const cx=(k+.25+hash2(k,91)*.5)*140;
  const w=10+hash2(k,13)*5;
  const a=.6+hash2(k,5)*1.0;
  const d=(s-cx)/w;
  if(d>-1&&d<1)y+=a*.5*(1+Math.cos(Math.PI*d));      // altezza 0.6-1.6 m, lunghezza 20-30 m
 }
 return y;
};

// ritorna il segno di k se P[q] è l'inizio di un tornante, altrimenti 0
function hairpinSign(q){
 ensurePoints(q+70);
 const k=P[q].k, sg=Math.sign(k);
 const prevIn=Math.abs(P[q-1].k)>=HAIRPIN_K&&Math.sign(P[q-1].k)===sg;
 if(Math.abs(k)<HAIRPIN_K||prevIn)return 0;     // deve essere il primo punto "stretto"
 let h=0;
 for(let n=q;n<q+60;n++){
  const kk=P[n].k;
  if(Math.sign(kk)!==sg||Math.abs(kk)<1/90)break;
  h+=Math.abs(kk)*DS;
 }
 return h>=HAIRPIN_ANG?sg:0;
}

const wFac=z=>{ 
	if(z<=0)return 1; 
	const h=hash2(z,201); 
	return h < 0.75 ? 1 //larghezza standard 75%
		   : h < 0.85 ? 1.33 //allargata 10%

};

const widthAt=s=>{ 
	const z=Math.floor(s/W_ZONE);

};

const MIN_GAP=80;                 // distanza minima tra tratti lontani lungo la strada
const MIN_GAP2=MIN_GAP*MIN_GAP;
const NEAR_GAP=60;                // distanza minima tra tratti "vicini" (bracci di un tornante: 2R ≥ 68 m)
const NEAR_GAP2=NEAR_GAP*NEAR_GAP;
const NEAR_SKIP=80;               // sotto questa distanza lungo la strada è la curva stessa: non si controlla
const ARC_SKIP=250;               // oltre questa distanza vale MIN_GAP invece di NEAR_GAP
const GRID_R=Math.ceil(MIN_GAP/GRID);   // celle da scansionare per lato (prima fisso a 1 = bug)

function tooClose(px,pz,ps,x,z,s){
 const ds=s-ps;
 if(ds<NEAR_SKIP)return false;
 const dx=px-x,dz=pz-z;
 return dx*dx+dz*dz<(ds<ARC_SKIP?NEAR_GAP2:MIN_GAP2);
}

function nearRoad(x,z,s,sim){
 const cx=Math.floor(x/GRID);
 const cz=Math.floor(z/GRID);
 for(let a=-GRID_R;a<=GRID_R;a++){
 for(let b=-GRID_R;b<=GRID_R;b++){
  const arr=grid.get(gkey(cx+a,cz+b));
  if(!arr)continue;
  for(let n=0;n<arr.length;n++){
   const p=P[arr[n]];
   if(tooClose(p.x,p.z,p.s,x,z,s))return true;
  }
 }
 }
 // punti simulati ma non ancora in P: la strada appena accodata non deve sfiorare se stessa
 if(sim){
  for(let n=0;n<sim.length;n++){
   const p=sim[n];
   if(tooClose(p.x,p.z,p.s,x,z,s))return true;
  }
 }
 return false;
}




const LOOK=110;   // rettilineo di verifica in coda: evita i vicoli ciechi

// metri percorsi prima della prima collisione (Infinity = tutto libero)
function clearDist(segs){
 let h=gen.h,k=gen.k,x=gen.x,z=gen.z,n=0;
 const sim=[],rr=RATE*DS;
 for(const sg of segs.concat({k:0,len:LOOK})){
  let left=sg.len;
  while(left>0){
   const dk=sg.k-k;
   k+=Math.abs(dk)<rr?dk:Math.sign(dk)*rr;
   left-=DS;
   h+=k*DS;
   x+=Math.sin(h)*DS;
   z+=Math.cos(h)*DS;
   const s=gen.s+(++n)*DS;
   if(nearRoad(x,z,s,sim))return n*DS;
   sim.push({x,z,s});
  }
 }
 return Infinity;
}

function fillQueue(){
 let best=null,bestD=-1;
 const attempt=build=>{
  const start=queue.length,bak=planH;
  build();
  const segs=queue.slice(start),d=clearDist(segs);
  queue.length=start;
  if(d===Infinity){queue.push(...segs);return true;}   // planH resta quello aggiornato da build
  if(d>bestD){bestD=d;best={segs,planH};}
  planH=bak;
  return false;
 };
 for(let t=0;t<24;t++) if(attempt(fillQueueRaw)) return;

 // vie di fuga: tornante a destra o a sinistra
 for(const sg of [1,-1])
  if(attempt(()=>{queue.push({k:0,len:15});pushCorner(36,2.9,sg);planH+=sg*2.9;})) return;

 // nessuna via libera: il candidato che arriva più lontano
 queue.push(...best.segs);
 planH=best.planH;
}

function mergeGeos(list){

const GRASS_TUFT_NUMBER = 8;
const GRASS_TUFT_LEAN   = 0.2;   // inclinazione della punta verso l'esterno

//densita mobile minore di desktop!!!
const TREES_NUMBER = IS_MOBILE ? 50 : 100;
const ROCKS_NUMBER = IS_MOBILE ? 25 : 45;
const PUDDLES_NUMBER = IS_MOBILE ? 5 : 10;
 
const makeGrassGeo = (number, width, height, spread, lean) => {
  const p = [];
  const step = (Math.PI * 2) / number;
  for (let i = 0; i < number; i++) {
    const a = i * step, c = Math.cos(a), s = Math.sin(a);
    const ox = s * spread, oz = c * spread;
    p.push(
      ox - width * c, 0,       oz + width * s,
      ox + width * c, 0,       oz - width * s,
      ox + s * lean,   height, oz + c * lean
    );
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  return g;
};
const grassGeo = makeGrassGeo(GRASS_NUMBER, GRASS_WIDTH, GRASS_HEIGHT, GRASS_SPREAD, GRASS_LEAN);
const grassTuftGeo = makeGrassGeo(GRASS_TUFT_NUMBER, GRASS_WIDTH, GRASS_HEIGHT, GRASS_TUFT_BASE_WIDTH, GRASS_TUFT_LEAN);
const grassTuftMat = grassMat.clone();
grassTuftMat.fragmentShader = grassTuftMat.fragmentShader

  .replace('vec3 tip=mix(vec3(.35,.55,.18),vec3(.55,.60,.25),vT);', 'vec3 tip=mix(vec3(.42,.30,.13),vec3(.60,.42,.20),vT);');
grassTuftMat.needsUpdate = true;

function addGrass(tile,R){
  const {hs,ads,x0,z0}=tile;
  const M=N+2;
  const pts=[];
  const puddles=tile.obs.filter(o=>o.type==='puddle');//
  const smp=(arr,x,z)=>{
    const fx=clamp((x-x0)/CS,0,N-1.001);
	const fz=clamp((z-z0)/CS,0,N-1.001);
    const a=Math.floor(fx);
	const b=Math.floor(fz);
	const u=fx-a;
	const v=fz-b;
	const k=(a+1)*M+b+1;
    return lerp(lerp(arr[k],arr[k+1],v),lerp(arr[k+M],arr[k+M+1],v),u);
  };
  const DIRADAMENTO_MIN = 45;
  const DIRADAMENTO_MAX = 78;
  
  for(let k=0;k<GRASS_N;k++){
    const x=x0+R(0,TILE);
    const z=z0+R(0,TILE);
    if(overlapsPuddle(x,z,puddles))continue;//
    if(smp(ads,x,z)<5.5)continue;   // più vicino alla strada
    const y=smp(hs,x,z);
	//if(y>52)continue;		  		// no erba oltre 52m di altitudine
    const keep=1-sm(y,DIRADAMENTO_MIN,DIRADAMENTO_MAX);//diradamento 25-58
    if(R(0,1)>keep)continue;
	if(vnoise(x*.05,z*.05)<.12)continue; // chiazze rade invece di un terzo vuoto
	//pts.push([x,y,z,R(.6,1.3)]);
    pts.push([x,y,z,R(.6,1.3)*(1-.4*sm(y,DIRADAMENTO_MIN,DIRADAMENTO_MAX))]);//erba meno alta man mano che aumenta altitudine
  }

  if(!pts.length)return;
  const im=new THREE.InstancedMesh(grassGeo,IS_MOBILE?grassMatMobile:grassMat,pts.length);
  pts.forEach((t,i)=>{
    dummy.position.set(t[0],t[1]+0.02,t[2]);//-0.05
    dummy.rotation.set(0,R(0,6.28),0);
    dummy.scale.set(1,t[3],1);
    dummy.updateMatrix();
    im.setMatrixAt(i,dummy.matrix);
  });
  im.instanceMatrix.needsUpdate=true;
  im.frustumCulled=false;
  im.userData.grass=true;
  im.visible=grassOn;
  
  scene.add(im);
  tile.objs.push(im);   // disposeTile lo smaltisce già
}

const SIGN_EVERY = 500;// metri tra un cartello e l'altro
const signTex = {};
const signMats = {};

function signTexture(type) {
  if (signTex[type]) return signTex[type];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  
  //guado!
  if (type === 'fordPanel' || type === 'hairpinPanel') c.height = 100;
  
  const g = c.getContext('2d');
  g.lineJoin = 'round'; g.lineCap = 'round';

  const V = [[128, 20], [240, 214], [16, 214]], cx = 128, cy = 149.3;
  const tri = (sc, col, lw) => {
    g.fillStyle = g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
    V.forEach((v, i) => { const x = cx + (v[0] - cx) * sc, y = cy + (v[1] - cy) * sc; i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath(); g.fill(); g.stroke();
  };

  //allargamento
  if (type === 'widen') {                                // quadrato bianco con doppia freccia
    g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 256);
    g.strokeStyle = '#222'; g.lineWidth = 10; g.strokeRect(5, 5, 246, 246);
    g.fillStyle = g.strokeStyle = '#111'; g.lineWidth = 6;
    for (const cx of [82, 174]) {
      g.beginPath();
      g.moveTo(cx, 40); g.lineTo(cx + 36, 112); g.lineTo(cx + 10, 112); g.lineTo(cx + 10, 220);
      g.lineTo(cx - 10, 220); g.lineTo(cx - 10, 112); g.lineTo(cx - 36, 112);
      g.closePath(); g.fill(); g.stroke();
    }
  } 
 
  //guado
  else if (type === 'fordPanel') {                     // pannello con onde blu
    g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 100);
    g.strokeStyle = '#222'; g.lineWidth = 6; g.strokeRect(3, 3, 250, 94);
    g.strokeStyle = '#1f5fbf'; g.lineWidth = 6; g.lineCap = 'round';
    for (const y of [32, 50, 68]) {
      g.beginPath(); g.moveTo(26, y);
      for (let x = 26; x <= 230; x += 4) g.lineTo(x, y + Math.sin((x - 26) / 204 * Math.PI * 6) * 5);
      g.stroke();
    }
  } 
  
  //tornante
  else if (type === 'hairpinPanel') {
    g.fillStyle = '#fff'; g.fillRect(0, 0, 256, 100);
    g.strokeStyle = '#222'; g.lineWidth = 6; g.strokeRect(3, 3, 250, 94);
    g.fillStyle = '#111'; g.font = 'bold 34px Arial';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('TORNANTE', 128, 52);
  }
  
  //pericolo
  else if (type === 'danger') {                        // triangolo con punto esclamativo
    tri(1, '#d4141c', 14); tri(.72, '#ffffff', 6);
    g.fillStyle = '#111';
    g.beginPath(); g.moveTo(119, 88); g.lineTo(137, 88); g.lineTo(133, 148); g.lineTo(123, 148); g.closePath(); g.fill();
    g.beginPath(); g.arc(128, 170, 9, 0, 6.2832); g.fill();
  } 

  //limite 50
  else if (type === 'limit50') {
    g.fillStyle = '#d4141c'; g.beginPath(); g.arc(128, 128, 118, 0, 6.2832); g.fill();
    g.fillStyle = '#fff';    g.beginPath(); g.arc(128, 128, 86, 0, 6.2832); g.fill();
    g.fillStyle = '#111'; g.font = 'bold 100px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('50', 128, 134);
  }
  
  // CUNETTA O DOSSO
  else if (type === 'bump') {
    tri(1, '#d4141c', 14); tri(.72, '#ffffff', 6);
    g.fillStyle = '#111';
    g.beginPath();
    g.moveTo(77, 180);
    g.lineTo(77, 166);
    // Prima gobba (allargata a sinistra e punti di controllo adeguati)
    g.bezierCurveTo(77, 142, 105, 142, 118, 158);
    // Avvallamento centrale
    g.bezierCurveTo(123, 164, 129, 164, 134, 158);
    // Seconda gobba (allargata a destra)
    g.bezierCurveTo(147, 142, 175, 142, 175, 166);
    g.lineTo(175, 180);
    g.closePath();
    g.fill();
}
  
  //slippery
  else {
    tri(1, '#d4141c', 14); tri(.72, '#ffffff', 6);
    g.fillStyle = g.strokeStyle = '#111';
	
	if (type === 'slippery') {                          // auto che sbanda
      g.save();
      g.translate(128, 128); g.rotate(-0.1); g.translate(-128, -128);

      g.fillStyle = '#111';
      g.beginPath();                                    // cabina
      g.moveTo(104, 118); g.lineTo(112, 98); g.lineTo(144, 98); g.lineTo(152, 118);
      g.closePath(); g.fill();
      g.beginPath(); g.roundRect(94, 116, 68, 24, 5); g.fill();         // carrozzeria
      g.fillRect(98, 138, 13, 13); g.fillRect(145, 138, 13, 13);        // ruote

      g.fillStyle = '#fff';
      g.beginPath();                                    // parabrezza
      g.moveTo(111, 115); g.lineTo(117, 103); g.lineTo(139, 103); g.lineTo(145, 115);
      g.closePath(); g.fill();
      g.fillRect(99, 123, 12, 6); g.fillRect(145, 123, 12, 6);          // fari
      g.restore();

      g.strokeStyle = '#111'; g.lineWidth = 7; g.lineCap = 'round';     // scie
      for (const dx of [-22, 22]) {
        g.beginPath(); g.moveTo(128 + dx, 157);
        g.bezierCurveTo(128 + dx + 16, 165, 128 + dx - 16, 175, 128 + dx, 184);
        g.bezierCurveTo(128 + dx + 10, 189, 128 + dx - 6, 192, 128 + dx - 2, 194);
        g.stroke();
      }
	} 
	
	else if (type === 'narrow' || type === 'widen') {
	  //larghezza strada
      g.save();
      if (type === 'widen') { g.translate(0, 293); g.scale(1, -1); }
      g.fillStyle = '#111';
      for (const m of [1, -1]) {
        g.beginPath();
        [[108,105],[122,105],[122,135],[110,160],[110,188],[96,188],[96,160],[108,135]]
          .forEach((p, i) => { const x = m > 0 ? p[0] : 256 - p[0]; i ? g.lineTo(x, p[1]) : g.moveTo(x, p[1]); });
        g.closePath(); g.fill();
      }
      g.restore();
    } else {
      // curveR / curveL
      g.save();
      if (type === 'curveL') { g.translate(256, 0); g.scale(-1, 1); }
      g.lineWidth = 14; g.lineCap = 'butt';
      g.beginPath(); g.moveTo(108, 190); g.lineTo(108, 152); g.quadraticCurveTo(108, 114, 132, 112); g.stroke();
      g.beginPath(); g.moveTo(128, 100); g.lineTo(150, 112); g.lineTo(128, 124); g.fill();
      g.restore();
    }
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return signTex[type] = t;
}
const signMat = type => signMats[type] || (signMats[type] = new THREE.MeshBasicMaterial({ map: signTexture(type), alphaTest: .5 }));

const SIGN_H = 3.0;      // altezza del palo (un po piu alti, vengono interrati di 30cm)
const SIGN_SIZE = 1.5;   // lato del cartello
const signPoleGeo = new THREE.CylinderGeometry(.035, .035, SIGN_H, 6).translate(0, SIGN_H / 2, 0);
const signPlaneGeo = new THREE.PlaneGeometry(SIGN_SIZE, SIGN_SIZE);
const signCircleGeo = new THREE.CircleGeometry(SIGN_SIZE / 2, 32);
const signTriangleShape = new THREE.Shape();
signTriangleShape.moveTo(0, SIGN_SIZE / 2);
signTriangleShape.lineTo(SIGN_SIZE / 2, -SIGN_SIZE / 2);
signTriangleShape.lineTo(-SIGN_SIZE / 2, -SIGN_SIZE / 2);
signTriangleShape.closePath();
const signTriangleGeo = new THREE.ShapeGeometry(signTriangleShape);
const SIGN_FACE_Y = SIGN_H - SIGN_SIZE / 2 - .1;
const signPoleMat = new THREE.MeshLambertMaterial({ color: 0x8a9096 });
const signBackMat = new THREE.MeshBasicMaterial({ color: 0x555a60, alphaTest: .5 });

const fordPanelGeo = new THREE.PlaneGeometry(1.1, .43);

function makeSign(type) {
  const g = new THREE.Group();
  const pole = new THREE.Mesh(signPoleGeo, signPoleMat);
  pole.castShadow = true;
  g.add(pole);
  if (type === 'ford' || type === 'hairpinL' || type === 'hairpinR') {
    const faceT  = type === 'ford' ? 'danger' : type === 'hairpinL' ? 'curveL' : 'curveR';
    const panelT = type === 'ford' ? 'fordPanel' : 'hairpinPanel';
    const face = new THREE.Mesh(signPlaneGeo, signMat(faceT)); face.position.set(0, SIGN_FACE_Y, .04);
    const back = new THREE.Mesh(signTriangleGeo, signBackMat);    back.position.set(0, SIGN_FACE_Y, .03); back.rotation.y = Math.PI;
    const py = SIGN_FACE_Y - SIGN_SIZE * .336 - .1 - .215;
    const pf = new THREE.Mesh(fordPanelGeo, signMat(panelT)); pf.position.set(0, py, .04);
    const pb = new THREE.Mesh(fordPanelGeo, signBackMat);      pb.position.set(0, py, .03); pb.rotation.y = Math.PI;
    g.add(face, back, pf, pb);
    return g;
  }
  const face = new THREE.Mesh(signPlaneGeo, signMat(type)); face.position.set(0, SIGN_FACE_Y, .04);
  const backGeo = type === 'limit50' ? signCircleGeo : type === 'widen' ? signPlaneGeo : signTriangleGeo;
  const back = new THREE.Mesh(backGeo, signBackMat); back.position.set(0, SIGN_FACE_Y, .03); back.rotation.y = Math.PI;
  g.add(face, back);
  return g;
}




/* ===== TRANSIZIONE TRA SUPERFICI ===== */
const TRANS_PTS=4;                       // 4 punti x 3 m = 12 m (una ripetizione di texture)
const transMats={};
function transMat(surf){
 if(transMats[surf])return transMats[surf];
 const src=roadMats[surf].map.image;     // canvas della texture del tratto precedente
 const c=document.createElement('canvas');c.width=src.width;c.height=src.height;
 const g=c.getContext('2d');
 g.drawImage(src,0,0);
 g.globalCompositeOperation='destination-in';   // maschera alpha: opaco all'inizio, trasparente alla fine
 const gr=g.createLinearGradient(0,c.height,0,0);
 gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
 g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
 const t=new THREE.CanvasTexture(c);
 t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;

 // in transMat()
 const tm=new THREE.MeshLambertMaterial({ map:t,transparent:true,depthWrite:false, polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4});
 patchHeadlight(tm);
 return transMats[surf]=tm;
}


/* ============ CHUNK STRADA (nastro + paletti) ============ */
function buildChunk(c){
 ensurePoints((c+1)*CH+3);
 const i0=c*CH;
 const n=CH+1;
 const surf=surfOf(c);
 
 //guadi
 const ch={objs:[],geos:[],obs:[],fords:[]};
 
 const rp=new Float32Array(n*6);
 const ru=new Float32Array(n*4);
 const ri=[];
 for(let j=0;j<n;j++){
	const p=P[i0+j];
	const lx=Math.cos(p.h);
	const lz=-Math.sin(p.h);
	const y=p.y+.06;
	
	//larghezza strada
	//rp.set([p.x+lx*HALF,y,p.z+lz*HALF,p.x-lx*HALF,y,p.z-lz*HALF],j*6);
	rp.set([p.x+lx*p.w,y,p.z+lz*p.w,p.x-lx*p.w,y,p.z-lz*p.w],j*6);
	
	ru.set([0,p.s/12,1,p.s/12],j*4);
	if(j<n-1){
		const a=j*2;
		ri.push(a,a+1,a+2,a+1,a+3,a+2);
	}
 }
 const rg=new THREE.BufferGeometry();
 rg.setAttribute('position',new THREE.BufferAttribute(rp,3));
 rg.setAttribute('uv',new THREE.BufferAttribute(ru,2));
 rg.setIndex(ri);
 rg.computeVertexNormals();
 const road=new THREE.Mesh(rg,roadMats[surf]);
 road.receiveShadow=true;//prova ombra
 scene.add(road);
 ch.objs.push(road);
 ch.geos.push(rg);
 
 // transizione: la superficie precedente sfuma sopra l'inizio di questo chunk
 if(c>0){
	const ps=surfOf(c-1);
	if(ps!==surf){
		const tn=TRANS_PTS+1;
		const tp=new Float32Array(tn*6);
		const tu=new Float32Array(tn*4);
		const ti=[];
		for(let j=0;j<tn;j++){
			const p=P[i0+j];
			const lx=Math.cos(p.h);
			const lz=-Math.sin(p.h);
			const y=p.y+.062;
			
			//larghezza strada
			//tp.set([p.x+lx*HALF,y,p.z+lz*HALF,p.x-lx*HALF,y,p.z-lz*HALF],j*6);
			tp.set([p.x+lx*p.w,y,p.z+lz*p.w,p.x-lx*p.w,y,p.z-lz*p.w],j*6);
		
			tu.set([0,p.s/12,1,p.s/12],j*4);
			if(j<tn-1){
				const a=j*2;ti.push(a,a+1,a+2,a+1,a+3,a+2);
			}
		}
		const tg=new THREE.BufferGeometry();
		tg.setAttribute('position',new THREE.BufferAttribute(tp,3));
		tg.setAttribute('uv',new THREE.BufferAttribute(tu,2));
		tg.setIndex(ti);tg.computeVertexNormals();
		const tm=new THREE.Mesh(tg,transMat(ps));
		tm.receiveShadow=true;
		scene.add(tm);ch.objs.push(tm);ch.geos.push(tg);
	}
 }


 
 //paletti
 const posts=[];
 const POST_OFFSET = 0.25;
 
 //larghezza strada
 //const d = HALF + POST_OFFSET;
 
 for(let j=0;j<CH;j++){
	const p=P[i0+j];
	const lx=Math.cos(p.h);
	const lz=-Math.sin(p.h);
	
	//larghezza strada
	const d=p.w+POST_OFFSET;
	
	if(Math.abs(p.k)>1/60 && j%2 === 0){
		const sd=-Math.sign(p.k);//esterni
		posts.push([p.x+lx*sd*d, p.y + POST_H / 2 - .3, p.z+lz*sd*d, p.h, (i0+j)%4<2]);//invece di 6 schiantato, uso d
	}
 }
 if(posts.length){
  const im=new THREE.InstancedMesh(postGeo,postMat,posts.length);
  posts.forEach((t,i)=>{
    dummy.position.set(t[0],t[1],t[2]);
	dummy.rotation.set(0,t[3],0);
	dummy.scale.set(1,1,1);
	dummy.updateMatrix();
	im.setMatrixAt(i,dummy.matrix);
	im.setColorAt(i, tmpCol.setRGB(1, 1, 1));
    ch.obs.push({type:'post',x:t[0],y:t[1],z:t[2],r:.35,col:[1,1,1],im,i});
  });
  im.instanceMatrix.needsUpdate=true;
  im.instanceColor.needsUpdate=true;
  im.frustumCulled=false;
  im.castShadow=true;//prova ombra
  scene.add(im);
  ch.objs.push(im);
 }
 
 //cartelli ogni SIGN_EVERY metri
 const sA = P[i0].s;
 const sB = P[i0 + CH].s;
 for (let n = Math.max(1, Math.ceil(sA / SIGN_EVERY)); n * SIGN_EVERY < sB; n++) {
	const s = n * SIGN_EVERY;
	let j = i0; while (j < i0 + CH - 1 && P[j + 1].s <= s) j++;
	const p = P[j];
	ensurePoints(j + 70);
	let kmax = 0;
	let ks = 0;
	for (let q = j + 8; q < j + 60; q++) {
		if (Math.abs(P[q].k) > kmax) { 
			kmax = Math.abs(P[q].k); 
			ks = Math.sign(P[q].k); 
		}
	}
	
	const type = kmax > 1 / 70 ? (ks > 0 ? 'curveL' : 'curveR')
			: p.surf >= 4 ? 'slippery'
			: (n % 3 === 1 ? 'limit50' : n % 3 === 2 ? 'bump' : 'danger');
	
	const lx = Math.cos(p.h);
	const lz = -Math.sin(p.h);
	
	//larghezza strada
	const x = p.x - lx * (p.w + 1.3);//lato destro
	const z = p.z - lz * (p.w + 1.3);
	
	const sg = makeSign(type);
	sg.position.set(x, p.y - .3, z);
	sg.rotation.y = p.h + Math.PI;                                    // rivolto verso chi arriva
	scene.add(sg);
	ch.objs.push(sg);
	ch.obs.push({ type: 'sign', x, y: p.y + 1, z, r: .3, col: [.55, .57, .6], group: sg });
 }
 
 
 //larghezza strada - cartelli strettoia / allargamento
 for(let zn=Math.max(1,Math.ceil((sA+W_SIGN)/W_ZONE)); zn*W_ZONE-W_SIGN<sB; zn++){
	const f0=wFac(zn-1), f1=wFac(zn);
	if(f0===f1)continue;
	const s=zn*W_ZONE-W_SIGN;
	let j=i0; while(j<i0+CH-1&&P[j+1].s<=s)j++;
	const p=P[j];
	const lx=Math.cos(p.h);
	const lz=-Math.sin(p.h);
	const x=p.x-lx*(p.w+1.3);//a destra
	const zp=p.z-lz*(p.w+1.3);
	const sg=makeSign(f1>f0?'widen':'narrow');
	sg.position.set(x,p.y-.3,zp);
	sg.rotation.y=p.h+Math.PI;
	scene.add(sg);
	ch.objs.push(sg);
	ch.obs.push({type:'sign',x,y:p.y+1,z:zp,r:.3,col:[.55,.57,.6],group:sg});
 }
 
 // cartelli tornante: HAIRPIN_SIGN m prima dell'inizio della curva
 for(let j=i0;j<i0+CH;j++){
	const hs=hairpinSign(j+Math.round(HAIRPIN_SIGN/DS));
	if(!hs)continue;
	const p=P[j];
	const lx=Math.cos(p.h);
	const lz=-Math.sin(p.h);
	const dist = p.w + 1.3;
	const side = -1;//destra anche sulle curve a sx
	const x = p.x + lx * side * dist;
	const zp = p.z + lz * side * dist;
	const sgn = makeSign(hs > 0 ? 'hairpinL' : 'hairpinR');
	sgn.position.set(x, p.y - .3, zp); 
	sgn.rotation.y = p.h + Math.PI;
	scene.add(sgn); 
	ch.objs.push(sgn);
	ch.obs.push({type: 'sign', x, y: p.y + 1, z: zp, r: .3, col: [.55, .57, .6], group: sgn});
 }
 
 // guadi: cartello FORD_SIGN m prima + specchio d'acqua
 for(let k=Math.floor(sA/FORD_ZONE); k<=Math.floor((sB+FORD_SIGN)/FORD_ZONE); k++){
	const def=fordDef(k); if(!def)continue;
	const jf=Math.floor((def.s-P[0].s)/DS);                  // indice del guado
	const js=Math.floor((def.s-FORD_SIGN-P[0].s)/DS);        // indice del cartello
	const hereF=jf>=i0&&jf<i0+CH, hereS=js>=i0&&js<i0+CH;
	if(!hereF&&!hereS)continue;
	if(!fordIsStraight(jf,def.len))continue;                 // guado e cartello nascono insieme o per niente
	if(hereF)buildFord(def,jf,ch);
	if(hereS)placeFordSign(P[js],ch);
 }
 
 
 return ch;
}

const TQ={y:0,d:0,ad:0,i:0,t:0,surf:0};
const sm=(x,a,b)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash2(i,j){let h=(Math.imul(i,374761393)+Math.imul(j,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
 return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v);}
const fbm=(x,z)=>vnoise(x,z)*.55+vnoise(x*2.1+7.3,z*2.1-3.1)*.3+vnoise(x*4.3-11,z*4.3+5)*.15;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// quota del terreno + strada più vicina in (x,z). o.d = distanza laterale con segno (sinistra +), o.ad = distanza assoluta
function terrain(x,z,o){
 const cx=Math.floor(x/GRID),cz=Math.floor(z/GRID);
 let best=1e18;
 let bi=-1;
 let bt=0;
 let ws=0;
 let ys=0;
 
 //larghezza strada
 let hw=HALF;
 
 for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++){
  const arr=grid.get(gkey(cx+a,cz+b));if(!arr)continue;
  for(let n=0;n<arr.length;n++){
   const i=arr[n],p=P[i],q=P[i+1];if(!q)continue;
   const dx=q.x-p.x,dz=q.z-p.z;let t=((x-p.x)*dx+(z-p.z)*dz)/(dx*dx+dz*dz);t=t<0?0:t>1?1:t;
   const ex=p.x+dx*t-x,ez=p.z+dz*t-z,d2=ex*ex+ez*ez;
   if(d2<best){best=d2;bi=i;bt=t;}
   if(d2<32400){const f=1-Math.sqrt(d2)/180,w=f*f/((d2+4)*(d2+4));ws+=w;ys+=w*(p.y+(q.y-p.y)*t);}
  }}
 
 let dmin=1e4;
 let ynear=24;
 let idw=24;
 let d=1e9;
 let surf=0;
 let sl=0;
 if(bi>=0){
   const p=P[bi];
   const q=P[bi+1];
   const dx=q.x-p.x;
   const dz=q.z-p.z;
   const L=Math.hypot(dx,dz);
   dmin=Math.sqrt(best);
   ynear=p.y+(q.y-p.y)*bt;
   idw=ws>1e-30?ys/ws:24;
   d=(x-(p.x+dx*bt))*(dz/L)+(z-(p.z+dz*bt))*(-dx/L);
   surf=p.surf;
   sl=Math.abs(q.y-p.y)/DS;
   
   //larghezza strada
   hw=p.w+(q.w-p.w)*bt;
 }
 
 //larghezza strada
 const dA=Math.max(dmin-(hw-HALF),0);
 
 const dE=Math.min(dA,185);// oltre la finestra di ricerca il terreno non cambia più
 
 /////let yRef=lerp(ynear,idw,sm(dE,6,12));
 /////yRef=lerp(yRef,24,sm(dE,60,160));
 //GEMINI FIX
 let yRef = lerp(ynear, idw, sm(dE, 6, 12));//Ridotto per evitare incroci
 yRef = lerp(yRef, 24, sm(dE, 60, 160));//Ridotto per evitare incroci
 
 const t=Math.max(0,dE-5);let hn=Math.pow(t,1.7)*.0105*(.45+vnoise(x*.012,z*.012)*1.1);hn/=1+hn/20;
 const dune=(vnoise(x*.035+50,z*.035)-.5)*3*Math.min(1,t/20);
 const mt=95*Math.pow(fbm(x*.0016,z*.0016),1.6)*sm(dE,40,170);
 o.y=yRef+hn+dune+mt+.06*(1-sm(dE,5,7));
 
 //o.i=bi;o.t=bt;o.d=d;o.ad=dmin;o.surf=surf;o.sl=sl;return o;
 //larghezza strada
 o.i=bi;o.t=bt;o.d=d;o.ad=dA;o.hw=hw;o.surf=surf;o.sl=sl;return o;
}

function updFords(dt){

function disposeTile(t){

function manageTiles(){
 const ctx=Math.floor(car.x/TILE);
 const ctz=Math.floor(car.z/TILE);
 const nowMs=performance.now();

 // si eliminano solo le tile lontane; quelle dirty NON si distruggono più qui
 for(const[k,t]of tiles){
   if(Math.abs(t.tx-ctx)>TR+1||Math.abs(t.tz-ctz)>TR+1){
     disposeTile(t);
     tiles.delete(k);
   }
 }

 const ax=car.x+Math.sin(car.th)*TILE*1.5;
 const az=car.z+Math.cos(car.th)*TILE*1.5;
 const want=[];
 for(let a=-TR;a<=TR;a++){
   for(let b=-TR;b<=TR;b++){
     const tx=ctx+a;
     const tz=ctz+b;
     const t=tiles.get(tileKey(tx,tz));
     const d=((tx+.5)*TILE-ax)**2+((tz+.5)*TILE-az)**2;

     if(!t)want.push([d,tx,tz,0]);                                   // tile mancante: priorità massima
     else if(t.dirty&&nowMs-t.born>400)want.push([d+1e6,tx,tz,2]);   // rigenerazione "a caldo"
     else if(!t.detail&&Math.max(Math.abs(a),Math.abs(b))<=2)want.push([d+1e7,tx,tz,1]);
   }
 }
 want.sort((p,q)=>p[0]-q[0]);
 const t0=performance.now();
 for(const w of want){
   if(performance.now()-t0>6)break;
   const key=tileKey(w[1],w[2]);
   if(w[3]===0){
     tiles.set(key,buildTile(w[1],w[2]));
   }else if(w[3]===1){
     buildDetail(tiles.get(key));
   }else{
     // swap senza buchi: costruisco la nuova, poi tolgo la vecchia nello stesso frame
     const old=tiles.get(key);
     const nt=buildTile(w[1],w[2]);
     if(old.detail)buildDetail(nt);   // stesso seed: alberi nelle stesse posizioni
     disposeTile(old);
     tiles.set(key,nt);
   }
 }
 //OPT!
 for(const t of tiles.values()){
  const near=Math.abs(t.tx-ctx)<=1&&Math.abs(t.tz-ctz)<=1;
  for(const o of t.objs) if(o.userData.cs) o.castShadow=shadowsOn&&near;
 }
}

/* livery come shader */
function _genericCarLivery(g, paint, o, k, tri) {
  const pick = (...a) => a.find(v => v != null);
  const c = {
    tricoloreAzz: pick(o.tricoloreAzz, o.martiniAzz, o.repsolOra),
    tricoloreBlu: pick(o.tricoloreBlu, o.martiniBlu, o.repsolAzz),
    tricoloreRed: pick(o.tricoloreRed, o.martiniRed, o.repsolRed)
  };
  if (c.tricoloreAzz == null || c.tricoloreBlu == null || c.tricoloreRed == null) return null;
  const cols = _genericEvoLivery(paint, k, ['tricolore'], c,
    { inv: o.livInv || new THREE.Matrix4(), oy: o.livOffY != null ? o.livOffY : .06, tri });  // .06 = model.position.y in spawnCar
  g.userData.livery = cols;
  g.userData.setLivery = function (x) {
    if (!x) return;
    for (const n in x) if (cols[n]) for (const key in x[n]) if (x[n][key] != null && cols[n][key]) cols[n][key].set(x[n][key]);
  };
  return cols;
}

const _capitalize = s => s[0].toUpperCase() + s.slice(1);

function _genericEvoLivery(mats, k, order, opts, space) {
  mats = [].concat(mats);
  const cols = {}, unis = [], parts = [];
  order.forEach(function (name) {
    const L = GENERIC_EVO_LIVERIES[name], c = {};
    for (const key in L.col) {
      const ov = opts[name + _capitalize(key)];
      c[key] = new THREE.Color(ov != null ? ov : L.col[key]);
      unis.push({ n: 'u' + L.pre + _capitalize(key), c: c[key] });
    }
    cols[name] = c;
    const src = typeof L.glsl === 'function' ? L.glsl(space && space.tri) : L.glsl;
    parts.push(src.replace('__K__', k.toFixed(6)));
  });
  const glsl = parts.join('\n');
  const decl = unis.map(u => 'uniform vec3 ' + u.n + ';').join('\n');
  const oy = space ? (space.oy || 0).toFixed(4) : '0';
  // TUTTO ciò che cambia il GLSL deve stare nella chiave: la cache di three condivide il programma
  const key = 'evoLivery' + order.join('') + k.toFixed(3) + (space ? 'C' + oy + JSON.stringify(space.tri || {}) : '');

  mats.forEach(function (mat) {
    mat.onBeforeCompile = function (sh) {
      unis.forEach(u => { sh.uniforms[u.n] = { value: u.c }; });
      if (space) sh.uniforms.uLivInv = { value: space.inv };
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vLiv;' + (space ? '\nuniform mat4 uLivInv;' : ''))
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvLiv = ' +
          (space ? '(uLivInv * modelMatrix * vec4(transformed, 1.0)).xyz - vec3(0.0, ' + oy + ', 0.0);' : 'position;'));
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vLiv;\n' + decl)
        .replace('#include <color_fragment>', '#include <color_fragment>\n' + glsl);
    };
    mat.customProgramCacheKey = function () { return key; };
  });
  return cols;
}


const GENERIC_EVO_LIVERIES = {
  repsol: {
    pre: 'R',
    col: { azz: "#112255", ora: "#ff8800", red: "#dd1122" },
    glsl: "{\n vec3 lp = vLiv / __K__;\n float ee = 0.0120;\n float az = abs(lp.z);\n float yTop = 0.5200 + 0.1100;\n float yBot = 0.5200 - 0.1100;\n float z0 = clamp(1.5500 - 0.9000 * (lp.y - yTop), 1.1500, 1.5500);\n float z1 = clamp(1.4500 - 1.0000 * (yBot - lp.y), 1.2000, 1.4500);\n float mOra = smoothstep(yTop - ee, yTop + ee, lp.y) * smoothstep(z0 - ee, z0 + ee, az);\n float mRed = (1.0 - smoothstep(yBot - ee, yBot + ee, lp.y)) * smoothstep(z1 - ee, z1 + ee, az);\n float mBand = 1.0 - smoothstep(0.1100 - ee, 0.1100 + ee, abs(lp.y - 0.5200));\n vec3 lc = diffuseColor.rgb;\n lc = mix(lc, uROra, mOra);\n lc = mix(lc, uRRed, mRed);\n lc = mix(lc, uRAzz, mBand);\n diffuseColor.rgb = lc;\n}"
  },
  
  tricolore: {
	pre: 'T',
	col: { azz: "#112366", blu: "#00aa33", red: "#ee0011" },
	glsl: _triGlsl
  },
  
  martini: {
    pre: 'M',
    col: { azz: "#112366", blu: "#00aa33", red: "#ee0011" },
    glsl: " { "
    +" vec3 lp = vLiv / __K__;"
    +" float pos = lp.y; "
    +" float baseCenter = 0.85;"
    +" float slope = 0.04;"
    +" float center = baseCenter - (lp.z * slope); "
	+" float widthMultiplier = 0.5 - (lp.z * 0.3); "
    +" widthMultiplier = max(0.1, widthMultiplier);"
    +" float redWidth  = 0.030 * widthMultiplier;"
    +" float blue1Width = 0.030 * widthMultiplier;"
    +" float sky1Width  = 0.030 * widthMultiplier;"
    +" float blue2Width = 0.030 * widthMultiplier;"
    +" float sky2Width  = 0.030 * widthMultiplier;"
    +" float ee = 0.008 * widthMultiplier;"
    +" float dist = abs(pos - center);"
    +" vec3 lc = diffuseColor.rgb;"
    +" float limit2 = redWidth + blue1Width + sky1Width + blue2Width + sky2Width;"
    +" float maskSky2 = 1.0 - smoothstep(limit2 - ee, limit2 + ee, dist);"
    +" lc = mix(lc, uMBlu, maskSky2);"
    +" float limit1_b2 = redWidth + blue1Width + sky1Width + blue2Width;"
    +" float maskBlue2 = 1.0 - smoothstep(limit1_b2 - ee, limit1_b2 + ee, dist);"
    +" lc = mix(lc, uMAzz, maskBlue2);"
    +" float limit1_s1 = redWidth + blue1Width + sky1Width;"
    +" float maskSky1 = 1.0 - smoothstep(limit1_s1 - ee, limit1_s1 + ee, dist);"
    +" lc = mix(lc, uMBlu, maskSky1);"
    +" float limit1_b1 = redWidth + blue1Width;"
    +" float maskBlue1 = 1.0 - smoothstep(limit1_b1 - ee, limit1_b1 + ee, dist);"
    +" lc = mix(lc, uMAzz, maskBlue1);"
    +" float maskRed = 1.0 - smoothstep(redWidth - ee, redWidth + ee, dist);"
    +" lc = mix(lc, uMRed, maskRed);"
    +" diffuseColor.rgb = lc;"
    +" }"
  }
};

const _TRI_DEF = {
  sideMin:.30, sideY:.46, sideSp:.095, sideHw:.04,   // fasce laterali: |x| minimo, quota centro, passo, semispessore
  topMinY:.45, topMaxX:.17, topSp:.095, topHw:.04,   // strisce su cofano/tetto/coda
  topZMin:-99, topZMax:99                            // limiti longitudinali delle strisce superiori
};
function _triGlsl(P) {
  const p = Object.assign({}, _TRI_DEF, P), f = v => v.toFixed(4);
  const hs = f(p.sideHw), es = f(Math.min(.01, p.sideHw * .4));
  const ht = f(p.topHw),  et = f(Math.min(.01, p.topHw * .4));
  const bs = d => '(1.0 - smoothstep(' + hs + ' - ' + es + ', ' + hs + ' + ' + es + ', abs(' + d + ')))';
  const bt = d => '(1.0 - smoothstep(' + ht + ' - ' + et + ', ' + ht + ' + ' + et + ', abs(' + d + ')))';
  const ss = f(p.sideSp), ts = f(p.topSp), yc = f(p.sideY);
  return '{ vec3 lp = vLiv / __K__; float ax = abs(lp.x);'
   + ' float sideM = smoothstep(' + f(p.sideMin - .01) + ', ' + f(p.sideMin + .01) + ', ax);'
   + ' float sD = ' + bs('lp.y - (' + yc + ' + ' + ss + ')') + ' * sideM;'
   + ' float sL = ' + bs('lp.y - ' + yc) + ' * sideM;'
   + ' float sR = ' + bs('lp.y - (' + yc + ' - ' + ss + ')') + ' * sideM;'
   + ' float topM = (1.0 - smoothstep(' + f(p.topMaxX - .01) + ', ' + f(p.topMaxX + .01) + ', ax))'
   + ' * smoothstep(' + f(p.topMinY - .01) + ', ' + f(p.topMinY + .01) + ', lp.y)'
   + ' * step(' + f(p.topZMin) + ', lp.z) * step(lp.z, ' + f(p.topZMax) + ');'
   + ' float tD = ' + bt('lp.x + ' + ts) + ' * topM;'
   + ' float tL = ' + bt('lp.x') + ' * topM;'
   + ' float tR = ' + bt('lp.x - ' + ts) + ' * topM;'
   + ' vec3 lc = diffuseColor.rgb;'
   + ' lc = mix(lc, uTAzz, max(sD, tD));'
   + ' lc = mix(lc, uTBlu, max(sL, tL));'
   + ' lc = mix(lc, uTRed, max(sR, tR));'
   + ' diffuseColor.rgb = lc; }';
}





//fiat 127 sport!!!
function buildCarCentoventisette(o) {
    const g = new THREE.Group();

    // ---------- materiali ----------
    const M = c => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide, shadowSide: THREE.BackSide });
    const B = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
    const nc = m => (m.userData.noCast = true, m);
	const MS = c => new THREE.MeshStandardMaterial({ color:c, side:THREE.DoubleSide, shadowSide: THREE.BackSide, metalness:0, roughness:0.5 });

    const paint = MS(o.paint);
    const black = M(0x000000);
    const plastic = M(0x222222);
    const steel = M(0x888899);
    const dark = M(0x333333);
    const floorM = M(0x111122);
	
    const glass = new THREE.MeshLambertMaterial({
        color: 0x223333, transparent: true, opacity: o.glassOpacity, side: THREE.DoubleSide
    });
    glass.depthWrite = false;
    glass.userData.noCast = true;
    glass.userData.noRecv = true;
    const white = B(0xffffff);
	const panna = B(0xffffdd);
	const red = B(0xdd2222);
	const orange = B(0xee6600);
	const blue = B(0x2233cc);
	const brakeM = B(0x330000);   // stop: spento
	const revM   = B(0x666666);   // retromarcia: spenta

    // ---------- quote (metri, z+ = muso, x+ = sinistra) ----------
    const HW = 0.73;                    // semilarghezza carrozzeria
    const ZF = 1.66, ZR = -1.72;        // muso e coda (paraurti esclusi)
    const BELT = 0.90, ROOF = 1.32;     // cintura e tetto (127: bassa e vetrata)
    const SILL = 0.30;                  // bordo basso fiancata
	const WZ = 1.11, WX = 0.66, WY = 0.30, WR = 0.30;   // ruote: passo 2.22
    const AR = 0.35;                    // raggio passaruota
    // semilarghezza della fiancata sopra la cintura (forte rastremazione verso il tetto)
    const sx = y => 0.69 - Math.max(0, y - BELT) / (ROOF - BELT) * 0.26;

    // cofano: dalla base del parabrezza (HZ0) al muso (HF), leggermente inclinato
    const HZ0 = 0.72, HF = 0.78;
    const HOOD_RX = Math.atan((BELT - HF) / (ZF - HZ0));
    const hoodY = z => BELT - (z - HZ0) * (BELT - HF) / (ZF - HZ0);

    // coda: UN SOLO piano dal fondo del tetto (RZ0,RY0) allo spigolo di coda (ZR,TY)
	const RZ0 = -1.00, RY0 = ROOF - 0.01;      // fine tetto
	const TY = 0.70;                           // spigolo alto del pannello di coda
	const RM = (RY0 - TY) / (RZ0 - ZR);        // ≈0.85 (~40°)
	const rl = z => TY + (z - ZR) * RM;        // y del piano a quota z
	const rz = (y, off = 0) => ZR + (y - TY) / RM + off;   // z del piano a quota y
	const RY1 = 0.95, RZ1 = rz(RY1);           // fondo lunotto
	const RZ2 = rz(BELT);                      // incrocio con la cintura

    // ---------- helper ----------
    const box = (w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
        g.add(m); return m;
    };
    const cylZ = (r, len, mat, x, y, z, seg = 24) => {            // asse lungo Z (fari)
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2), mat);
        m.position.set(x, y, z); g.add(m); return m;
    };
    const cylX = (r, len, mat, x, y, z, seg = 12) => {            // asse lungo X (assali)
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2), mat);
        m.position.set(x, y, z); g.add(m); return m;
    };
    // estrusione lungo X di un profilo [z,y], centrata in cx
    const prism = (pts, width, mat, cx = 0) => {
        const sh = new THREE.Shape();
        pts.forEach((p, i) => i ? sh.lineTo(p[0], p[1]) : sh.moveTo(p[0], p[1]));
        sh.closePath();
        const geo = new THREE.ExtrudeGeometry(sh, { depth: width, bevelEnabled: false, steps: 1 });
        geo.rotateY(-Math.PI / 2);
        geo.translate(width / 2 + cx, 0, 0);
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // quadrilatero 3D
    const panel = (v, mat) => {
        const a = v.map(q => new THREE.Vector3(q[0], q[1], q[2])), p = [];
        [0, 1, 2, 0, 2, 3].forEach(i => p.push(...a[i].toArray()));
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // poligono [z,y] (con eventuali buchi) appoggiato sulla fiancata superiore inclinata (dx = sporgenza)
    const sidePoly = (s, pts, holes, mat, dx = 0) => {
        const sh = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
        (holes || []).forEach(h => sh.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))));
        const geo = new THREE.ShapeGeometry(sh);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) { const z = pos.getX(i), y = pos.getY(i); pos.setXYZ(i, s * (sx(y) + dx), y, z); }
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // punti dell'arco del passaruota (percorso in senso z decrescente)
    const archPts = zc => {
        const a0 = Math.asin((SILL - WY) / AR), p = [];
        for (let i = 0; i <= 12; i++) {
            const a = a0 + (Math.PI - 2 * a0) * i / 12;
            p.push([zc + AR * Math.cos(a), WY + AR * Math.sin(a)]);
        }
        return p;
    };

    // ---------- SCOCCA ----------
    const bodyMeshes = [];
    // fiancate sottili con passaruota (il centro dell'abitacolo resta vuoto per sedili e volante)
    const SIDE = [[ZF, SILL], ...archPts(WZ), ...archPts(-WZ), [ZR, SILL], [ZR, TY],
                  [RZ2, BELT], [HZ0, BELT], [ZF, HF]];
    for (const s of [-1, 1]) bodyMeshes.push(prism(SIDE, 0.08, paint, s * 0.69));
    // cofano (cuneo piano, leggermente inclinato)
    bodyMeshes.push(prism([[HZ0, 0.62], [ZF, 0.62], [ZF, HF], [HZ0, BELT]], 1.30, paint));
    // musetto (sotto il cofano, fino al paraurti) e pannello di coda verticale
    bodyMeshes.push(box(1.30, 0.32, 0.04, paint, 0, 0.46, ZF - 0.02));
    bodyMeshes.push(box(1.30, 0.30, 0.03, paint, 0, 0.57, ZR + 0.015));

    // pavimento scuro
    box(1.00, 0.03, 3.20, floorM, 0, 0.47, -0.08);

    // piccola presa d'aria a puntini alla base del parabrezza
    box(0.40, 0.05, 0.20, black, 0, hoodY(0.88) + 0.01, 0.88, HOOD_RX);

    // fascione nero sotto le porte
    for (const s of [-1, 1]) box(0.04, 0.04, 1.40, black, s * 0.73, 0.32, 0);

    // ---------- PARTE ALTA: tetto, montanti, vetri ----------
	box(0.86, 0.04, 0.33 - RZ0, paint, 0, ROOF - 0.02, (0.33 + RZ0) / 2);//tetto

    const OUT    = [[0.72, BELT], [0.33, ROOF - 0.01], [RZ0, RY0], [RZ1, RY1], [RZ2, BELT]];
    const DOOR   = [[0.56, 0.93], [0.215, 1.23], [-0.26, 1.23], [-0.26, 0.93]];
    // cornici nere dei finestrini (poligono esterno leggermente più grande)
    const DOORF  = [[0.60, 0.905], [0.235, 1.255], [-0.285, 1.255], [-0.285, 0.905]];
    
	const PT = 0.30;//spessore
	const QUART  = [[-0.345, 0.93], [-0.345, 1.23], [rz(1.23, PT), 1.23], [rz(0.93, PT), 0.93]];
	const QUARTF = [[-0.32, 0.905], [-0.32, 1.255], [rz(1.255, PT - 0.03), 1.255], [rz(0.905, PT - 0.03), 0.905]];
	
    for (const s of [-1, 1]) {
        sidePoly(s, OUT, [DOOR, QUART], paint);       // lamiera con i buchi dei finestrini
        sidePoly(s, DOOR, null, glass);
        sidePoly(s, QUART, null, glass);
        sidePoly(s, DOORF, [DOOR], black, 0.004);
        sidePoly(s, QUARTF, [QUART], black, 0.004);
        //montante A (fiancata -> parabrezza) e montante C largo (fiancata -> lunotto)
        panel([[s * 0.69, BELT, 0.72], [s * 0.436, ROOF - 0.01, 0.33], [s * 0.385, 1.30, 0.34], [s * 0.55, 0.905, 0.70]], paint);
		
		//montante C
		panel([[s * sx(RY0), RY0, RZ0], [s * sx(RY1), RY1, RZ1], [s * 0.44, RY1, RZ1], [s * 0.34, RY0, RZ0]], paint);
    }
    // parabrezza molto inclinato
    panel([[-0.55, 0.905, 0.70], [0.55, 0.905, 0.70], [0.385, 1.30, 0.34], [-0.385, 1.30, 0.34]], glass);
	
    // lunotto con guarnizione nera spessa
    const rw = (x, y) => [x, y, rz(y)];
	const RW_O = [rw(-0.34, RY0), rw(0.34, RY0), rw(0.44, RY1), rw(-0.44, RY1)];
	const RW_I = [rw(-0.31, RY0 - 0.03), rw(0.31, RY0 - 0.03), rw(0.41, RY1 + 0.03), rw(-0.41, RY1 + 0.03)];
	for (let k = 0; k < 4; k++) {
		panel([RW_O[k], RW_O[(k + 1) % 4], RW_I[(k + 1) % 4], RW_I[k]], black);
	}
    panel(RW_I, glass);
	
    // portellone: pannello ripido sotto il lunotto (si allarga verso il basso)
    panel([[-sx(RY1), RY1, RZ1], [sx(RY1), RY1, RZ1], [0.69, BELT, RZ2], [-0.69, BELT, RZ2]], paint);
    panel([[-0.69, BELT, RZ2], [0.69, BELT, RZ2], [0.69, TY, ZR], [-0.69, TY, ZR]], paint);

    // ---------- PORTE E DETTAGLI LATERALI ----------
    for (const s of [-1, 1]) {
        box(0.006, 0.57, 0.008, black, s * 0.731, 0.615, -0.32);    // taglio porta / montante B
        box(0.006, 0.58, 0.008, black, s * 0.731, 0.61, 0.695);     // taglio porta / parafango
        box(0.02, 0.05, 0.20, black, s * 0.745, 0.76, -0.20);       // maniglia NERA
		box(0.02, 0.03, 0.10, steel, s * 0.750, 0.75, -0.20);       // maniglia steel
        box(0.02, 0.04, 0.06, orange, s * 0.745, 0.75, 1.46);       // freccetta laterale
		
		if (s === 1) {
			box(0.08, 0.03, 0.03,   plastic, s * 0.695, 0.92, 0.57);    // braccetto zeppetto
			box(0.14, 0.10, 0.04,   plastic, s * 0.755, 0.95, 0.55, 0, s*0.5, 0);    // corpo specchio, ora a ridosso della fiancata
			box(0.12, 0.08, 0.01,   steel,   s * 0.755, 0.95, 0.53, 0, s*0.5, 0);    // vetro specchio (rivolto verso dietro)
		}
    }

    // ---------- FRONTALE ----------
    box(1.52, 0.12, 0.07, steel, 0, 0.40, ZF + 0.045);              // paraurti a lama
	for (const s of [-1, 1]) {
		box(0.04, 0.12, 0.20, steel, s * 0.74, 0.40, ZF - 0.02);   // risvolto paraurti
		box(0.51, 0.06, 0.20, black, s * 0.52, 0.40, ZF - 0.005);  // paraurti gomma
	}
	
	//targa anteriore
    const fp = new THREE.Mesh(
        new THREE.PlaneGeometry(0.50, 0.12),
        new THREE.MeshLambertMaterial({ map: makeTargaTexture('Roma X33318'), side: THREE.DoubleSide })
    );
    fp.position.set(0, 0.40, ZF + 0.082); g.add(fp);

    box(0.80, 0.15, 0.03, black, 0, 0.58, ZF + 0.005);          // griglia nera
    
	cylZ(0.05, 0.025, steel, 0, 0.72, ZF + 0.022, 12);          // bordo cromato (come prima)
	cylZ(0.04, 0.025, red, 0,   0.72, ZF + 0.028, 12);          // logo FIAT vintage era rosso!!!
	
    for (const s of [-1, 1]) {
		//aggiunto come su a112 per sagomare il cofano
		/////box(0.32, 0.03, ZF-HZ0, paint, s * 0.56, 0.80, HZ0 + (ZF-HF)*0.5 + 0.03);  // cornice faro rettangolare
		//a filo alla base del parabrezza, +3cm sul cofano al faro
		const FT = 0.15;                                   // spessore (il resto resta "dentro" il cofano)
		const fyA = BELT + 0.002, fyB = HF + 0.03;         // quota superiore: parabrezza -> faro
		const fa = Math.atan((fyA - fyB) / (ZF - HZ0));    // inclinazione (minore di HOOD_RX)
		const fl = Math.hypot(ZF - HZ0, fyA - fyB);        // lunghezza lungo la pendenza
		box(0.34, FT, fl, paint,
			s * 0.56,
			(fyA + fyB) / 2 - FT / 2 * Math.cos(fa),
			(HZ0 + ZF) / 2 - FT / 2 * Math.sin(fa) + 0.02,
			fa);
		
		
        box(0.28, 0.18, 0.03, steel,  s * 0.57, 0.695, ZF + 0.005);  // cornice faro rettangolare
        box(0.22, 0.13, 0.03, white,  s * 0.57, 0.695, ZF + 0.012);  // lente rettangolare
        box(0.19, 0.06, 0.03, orange, s * 0.58, 0.53, ZF + 0.005);  // freccetta sotto il faro
    }

    // ---------- POSTERIORE ----------
    box(1.52, 0.12, 0.07, steel, 0, 0.40, ZR - 0.045);  // paraurti a lama
	box(1.56, 0.06, 0.20, black, 0, 0.40, ZR - 0.005);  // paraurti gomma
    for (const s of [-1, 1]) {
        box(0.04, 0.12, 0.20, steel, s * 0.74, 0.40, ZR + 0.02);    // risvolto paraurti
		box(0.33, 0.14, 0.03, black, s * 0.58, 0.60, ZR - 0.005);   // incasso fanale a 60cm da terra
        for (const dx of [-0.105, 0, 0.105])                        // fanale orizzontale a 3 settori
			box(0.095, 0.10, 0.03, dx * s > 0 ? orange : s===1 && dx===-0.105 ? revM : brakeM, s * 0.58 + dx, 0.60, ZR - 0.012);//freccette
			
		cylZ(0.04, 0.45, steel, s * 0.50, 0.25, -1.555, 12);        // scarico doppio sotto il paraurti
    }
	
	//targa posteriore
    const rp = new THREE.Mesh(
        new THREE.PlaneGeometry(0.60, 0.145),
        new THREE.MeshLambertMaterial({ map: makeTargaTexture('Roma X33318'), side: THREE.DoubleSide })
    );
	rp.rotation.y = Math.PI; // Ruota di 180 gradi per correggere l'effetto specchio
    rp.position.set(0, 0.60, ZR-0.02); g.add(rp);

    
    // ---------- passaruota: fodera interna e bordo ----------
    for (const s of [-1, 1]) {
		for (const zc of [WZ, -WZ]) {
			prism(archPts(zc), 0.012, black, s * 0.656);                // fodera interna del passaruota
			const pts = [];
			for (let i = 0; i <= 14; i++) {
				const a = 0.02 + (Math.PI - 0.04) * i / 14;
				pts.push(new THREE.Vector3(s * 0.735, WY + (AR + 0.01) * Math.sin(a), zc + (AR + 0.01) * Math.cos(a)));
			}
			g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 16, 0.024, 6, false), plastic));
		}
	}

	
    // RUOTE
	const wheels = [];
    const wheelPositions = [
        [-WX,  WZ],
        [ WX,  WZ],
        [-WX, -WZ],
        [ WX, -WZ]
    ];
	//const WZ = 1.085, WX = 0.61, WY = 0.30, WR = 0.30;   // ruote: passo 2.17
	const rubber = M(0x222222);
    wheelPositions.forEach(([x,z]) => {
        const steer = new THREE.Group();
        steer.name = 'steer';
        steer.position.set(x, WY, z);
        const spin = new THREE.Group();
        spin.name = 'spin';

        // Pneumatico
        const tire = new THREE.Mesh(
            new THREE.CylinderGeometry(WR, WR, 0.15, 32),
            rubber
        );
		tire.rotation.z = Math.PI/2;
        spin.add(tire);

        // Cerchio
        const rim = new THREE.Mesh(
            new THREE.CylinderGeometry(WY*0.6, WY*0.6, 0.16, 32),
            steel
        );
        rim.rotation.z = Math.PI/2;
        spin.add(rim);

        // Borchia centrale
        const cap = new THREE.Mesh(
            new THREE.CylinderGeometry(0.10, 0.07, 0.03, 32),
            plastic
        );
		cap.position.x = x > 0 ? 0.13 : -0.13;
        cap.rotation.z = x > 0 ? Math.PI/2 : -Math.PI/2;
        spin.add(cap);

        steer.add(spin);
        g.add(steer);

        wheels.push({
            front: z>0 ? 1 : 0,
            steer,
            spin
        });
    });

	//doppio spoiler!!!
	if (o.spoilerEnabled) {
		// Supporti dello spoiler
		for(const s of [-1,1]) {
			box(
				0.055,0.10,0.07,
				steel,
				s*0.50,
				0.86,
				-1.56,
				-Math.PI/12//inclinato di 22'
			);
			
			box(
				0.055,0.10,0.07,
				steel,
				s*0.40,
				0.91,
				-1.46,
				-Math.PI/12//inclinato di 22'
			);
		}

		// Ala sottile inclinata a 45°
		box(
			1.35,0.025,0.12,
			black,
			0,
			0.905,
			-1.64,//bello cazzo!
			Math.PI/8//inclinato di 22'
		);
		
		box(
			1.35,0.025,0.12,
			black,
			0,
			0.955,
			-1.54,//bello cazzo!
			Math.PI/8//inclinato di 22'
		);
	}
	

    // ---------- LIVREA TRICOLORE (cofano, tetto, portellone, fascia laterale) ----------
	_genericCarLivery(g, paint, o, 1.2, { sideMin:.69, sideY:.74, sideSp:.0245, sideHw:.0103, topMinY:.72 });
    
	// ---------- DATI E CONTROLLI ----------
    g.userData.wheels = wheels;
    g.userData.dashW = 1.00;//127 e' stretta... e pure corta!
	g.userData.dashL = 1.00;
    g.userData.setGlassOpacity = v => { glass.opacity = v; };
    g.userData.setNumbersVisible = () => {};

	
    if (o.numbersVisible) {
        const plates = carAddNumbers(g, bodyMeshes, {
            raceNumber: o.raceNumber,
            numberStripe: o.numberStripe,
            numbersVisible: o.numbersVisible,
            numberSize: 0.28, numberY: 0.60, numberZ: 0.19
        });
        plates.forEach((p, i) => {
            p.userData.noCast = true;
            p.userData.decal = true;
            p.userData.side = i === 0 ? 1 : -1;
            p.position.x += p.userData.side * 0.012;
            p.renderOrder = 2;
            p.material.polygonOffset = true;
            p.material.polygonOffsetFactor = -4;
            p.material.polygonOffsetUnits = -4;
        });
        g.userData.setNumbersVisible = v => plates.forEach(p => p.visible = v);
    }

    const K = 1.20;   // scala complessiva (come prima)
    g.scale.setScalar(K);
	
	
	g.userData.brakeMat = brakeM;
	g.userData.revMat   = revM;

    return g;
}



//fiat tipozza 16vongole
function buildCarTipozza(o) {
    const g = new THREE.Group();

    // ---------- materiali ----------
    const M = c =>  new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide, shadowSide: THREE.BackSide });
    const B = c =>  new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
    const MS = c => new THREE.MeshStandardMaterial({ color: c, side: THREE.DoubleSide, shadowSide: THREE.BackSide, metalness: 0, roughness: 0.5 });

    const paint = MS(o.paint);
    const black = M(0x000000);
    const plastic = M(0x222222);
    const steel = M(0x666677);
    const chrome = M(0xaaaaaa);
    const dark = M(0x333333);
    const floorM = M(0x111122);
    const glass = new THREE.MeshLambertMaterial({
        color: 0x223333, transparent: true, opacity: o.glassOpacity, side: THREE.DoubleSide
    });
    glass.depthWrite = false;
    glass.userData.noCast = true;
    glass.userData.noRecv = true;
    const white = B(0xffffff), grey = B(0x666666), red = B(0xdd2222), orange = B(0xee6600), blue = B(0x2233cc);
    
	const trim = M(0xdd2222);
	const xtrim = new THREE.MeshBasicMaterial({          // filetti rossi paraurti / minigonne
        color: 0xdd2222, side: THREE.DoubleSide,
        polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2
    });
    
	const brakeM = B(0x330000);        // stop: spento
    const revM   = B(0x666666);        // retromarcia: spenta

    // ---------- quote (metri, z+ = muso, x+ = sinistra) ----------
    const WZ = 1.30, WX = 0.80, WY = 0.30, WR = 0.30;   // ruote: PASSO 2.60 (assi a z = +-1.30)
    const AR = 0.335;                   // raggio passaruota
    const SILL = 0.17;                  // bordo basso fiancata tra i passaruota
    const BELT = 0.90, ROOF = 1.44;     // cintura e tetto
    const ZN = 1.92, TAIL = -1.83;      // piano frontale (fari/cofano) e piano posteriore (portellone)
    const FLOOR_Y = 0.40;               // quota pavimento
    const sx = y => 0.83 - (y - BELT) / (ROOF - BELT) * 0.25;   // semilarghezza della fiancata alta (tumblehome)
	
	// ---------- helper ----------
    const box = (w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
        g.add(m); return m;
    };
    const cylZ = (r, len, mat, x, y, z, seg = 24) => {            // asse lungo Z
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2), mat);
        m.position.set(x, y, z); g.add(m); return m;
    };
    // estrusione lungo X di un profilo [z,y], centrata in cx
    const prism = (pts, width, mat, cx = 0) => {
        const sh = new THREE.Shape();
        pts.forEach((p, i) => i ? sh.lineTo(p[0], p[1]) : sh.moveTo(p[0], p[1]));
        sh.closePath();
        const geo = new THREE.ExtrudeGeometry(sh, { depth: width, bevelEnabled: false, steps: 1 });
        geo.rotateY(-Math.PI / 2);
        geo.translate(width / 2 + cx, 0, 0);
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // quadrilatero 3D
    const panel = (v, mat) => {
        const a = v.map(q => new THREE.Vector3(q[0], q[1], q[2])), p = [];
        [0, 1, 2, 0, 2, 3].forEach(i => p.push(...a[i].toArray()));
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
	// poligono [z,y] (con eventuali buchi) appoggiato sulla fiancata alta inclinata
    const sidePoly = (s, pts, holes, mat) => {
        const sh = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
        (holes || []).forEach(h => sh.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))));
        const geo = new THREE.ShapeGeometry(sh);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) { const z = pos.getX(i), y = pos.getY(i); pos.setXYZ(i, s * sx(y), y, z); }
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // punti dell'arco del passaruota (percorso in senso z decrescente)
    const archPts = zc => {
        const a0 = Math.asin((SILL - WY) / AR), p = [];
        for (let i = 0; i <= 12; i++) {
            const a = a0 + (Math.PI - 2 * a0) * i / 12;
            p.push([zc + AR * Math.cos(a), WY + AR * Math.sin(a)]);
        }
        return p;
    };

    // ---------- SCOCCA BASSA ----------
    const bodyMeshes = [];
    // fiancate sottili con passaruota
    const SIDE = [[ZN, 0.235], [1.70, 0.235], 
				  ...archPts(WZ), 
				  ...archPts(-WZ), 
				  [-1.70, 0.26], 
				  [TAIL, 0.26],
                  [TAIL, BELT+0.05], //angolo posteriore
				  [0.88, BELT+0.05], //punto specchietto
				  [0.88, BELT+0.05], //fiancata intruppata a conca
				  [ZN, 0.73]];
    for (const s of [-1, 1]) bodyMeshes.push(prism(SIDE, 0.07, paint, s * 0.815));
	
    // cofano (piano, inclinato in avanti) e portellone posteriore (coda verticale)
    bodyMeshes.push(prism([[0.88, 0.55], [ZN, 0.55], [ZN, 0.73], [0.88, 0.96]], 1.56, paint));
    //////bodyMeshes.push(prism([[-1.20, 0.52], [TAIL, 0.52], [TAIL, 1.00], [-1.20, 0.93]], 1.56, paint));
	      bodyMeshes.push(prism([[-1.76, 0.52], [TAIL, 0.52], [TAIL, 1.00], [-1.76, 1.00]], 1.56, paint));
	box(1.50, 0.02, 0.46, floorM, 0, 1.03, -1.58);   // cappelliera scura, sotto il vetro
	
	
	// cofano con rialzo centrale squadrato: piano + diagonale + piano rialzato
    const HOOD_CROWN = 0.01;   // altezza del rialzo
    const HOOD_W     = 0.95;   // larghezza del piano rialzato
    const HOOD_RAMP  = 0.01;   // larghezza orizzontale della diagonale
    {
        const hw = HOOD_W / 2;
        const PX = [-hw - HOOD_RAMP, -hw, hw, hw + HOOD_RAMP];   // profilo in sezione (x)
        const PH = [0, HOOD_CROWN, HOOD_CROWN, 0];               // quota sopra il cofano (y)
        const zs = [0.88, ZN], ys = [0.96, 0.73];                // righe: base parabrezza / muso
        const P = (i, r, base) => [PX[i], ys[r] + (base ? 0 : PH[i]), zs[r]];
        const pos = [];
        const tri = (a, b, c) => pos.push(...a, ...b, ...c);
        for (let i = 0; i < 3; i++) {
            // superficie superiore (diagonale, piano, diagonale)
            tri(P(i, 0), P(i, 1), P(i + 1, 0));
            tri(P(i + 1, 0), P(i, 1), P(i + 1, 1));
            // chiusura dei lati anteriore e posteriore, fino al cofano originale
            for (const r of [0, 1]) {
                tri(P(i, r), P(i + 1, r), P(i, r, 1));
                tri(P(i + 1, r), P(i + 1, r, 1), P(i, r, 1));
            }
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.computeVertexNormals();      // non indicizzata: spigoli netti
        g.add(new THREE.Mesh(geo, paint));
    }
	

    // pavimento (scuro): gli interni veri li crea la funzione dedicata
    box(1.56, 0.03, 1.90, floorM, 0, FLOOR_Y, 0);
    box(1.16, 0.03, 0.95, floorM, 0, FLOOR_Y, 1.40);
    box(1.16, 0.03, 0.90, floorM, 0, FLOOR_Y, -1.38);

    // ---------- PARTE ALTA: tetto, montanti, vetri ----------
    box(1.16, 0.04, 1.52, paint, 0, ROOF - 0.02, -0.46);                // tetto

    const OUT = [[0.96, BELT], [0.30, ROOF], [-1.20, ROOF], [-1.83, 1.0], [-1.83, BELT]];                    // sagoma alta (lamiera)
    const BZ  = [[0.85, 0.915],  [0.31, 1.38], [-1.15, 1.38], [-1.52, 1.019], [-1.52, 1.0085], [-1.20, 0.915]]; // cornice nera
    // vetri: 2 cm dal bordo della cornice, 4 cm tra un vetro e l'altro
	const G1  = [[0.797, 0.935], [0.303, 1.36], [-0.26, 1.36], [-0.26, 0.935]];                               // porta anteriore
	const G2  = [[-0.30, 0.935], [-0.30, 1.36], [-1.02, 1.36], [-1.22, 0.935]];                               // porta posteriore

		box(0.020, 0.04, 0.22, plastic, s * 0.862, 0.82, -0.08);    // maniglia anteriore

    // ---------- PARAURTI (neri, con filetto rosso fuori dalle facce del paraurti, spessore 1 cm)

		// minigonne nere con filetto rosso

    // ---------- FRONTALE ----------

    // targa anteriore

    cylZ(0.02, 0.03, steel, 0, 0.85, -1.83, 12);             // serratura portellone

    // doppio cannone a sinistra e destra
    cylZ(0.045, 0.14, chrome,  0.60, 0.27, -1.90, 16);
	cylZ(0.045, 0.14, chrome, -0.60, 0.27, -1.90, 16);

    // ---------- passaruota: fodera nera interna ----------
    for (const s of [-1, 1]) for (const zc of [WZ, -WZ]) prism(archPts(zc), 0.012, black, s * 0.60);

	
	//spoiler tipozza sul tetto appena accennato con micro-supporti
	if (o.spoilerEnabled) {

			paint,
			0,

			Math.PI/12//inclinato di 15'
		);
	}
	
	


    // ---------- RUOTE: gomma tassellata + cerchi in lega bianchi a 4 fori ----------
    const tc = document.createElement('canvas'); tc.width = 448; tc.height = 64;
    const tg = tc.getContext('2d');
    tg.fillStyle = '#171717'; tg.fillRect(0, 0, 448, 64);
    tg.fillStyle = '#353535';
    for (let i = 0; i < 28; i++) {
        const x = i * 16;
        tg.beginPath(); tg.moveTo(x + 2, 0);  tg.lineTo(x + 10, 0);  tg.lineTo(x + 14, 32); tg.lineTo(x + 6, 32); tg.closePath(); tg.fill();
        tg.beginPath(); tg.moveTo(x + 6, 32); tg.lineTo(x + 14, 32); tg.lineTo(x + 10, 64); tg.lineTo(x + 2, 64); tg.closePath(); tg.fill();
    }
    const treadTex = new THREE.CanvasTexture(tc);
    treadTex.wrapS = THREE.RepeatWrapping; treadTex.anisotropy = 4;
    const treadMat = new THREE.MeshLambertMaterial({ map: treadTex });
    const sideMat = M(0x1b1b1b);
    const rimMat = M(0xe9e9e9), hubDark = M(0x4a4a4a), holeM = M(0x1c1c1c);

    const wheels = [];
    [[-WX, WZ], [WX, WZ], [-WX, -WZ], [WX, -WZ]].forEach(([x, z]) => {
        const steer = new THREE.Group(); steer.name = 'steer';
        steer.position.set(x, WY, z);
        const spin = new THREE.Group(); spin.name = 'spin';

        // battistrada (cilindro aperto) + due fianchi ad anello
        spin.add(new THREE.Mesh(new THREE.CylinderGeometry(WR, WR, 0.20, 28, 1, true).rotateZ(Math.PI / 2), treadMat));
        for (const sg of [-1, 1]) {
            const wall = new THREE.Mesh(new THREE.RingGeometry(0.19, WR, 28).rotateY(Math.PI / 2), sideMat);
            wall.position.x = sg * 0.100; spin.add(wall);
        }
        // cerchio bianco
        spin.add(new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.205, 28).rotateZ(Math.PI / 2), rimMat));
        for (const sg of [-1, 1]) {
            const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.004, 6).rotateZ(Math.PI / 2), hubDark);
            hub.position.x = sg * 0.1055; spin.add(hub);
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.012, 6).rotateZ(Math.PI / 2), steel);
            cap.position.x = sg * 0.108; spin.add(cap);
            for (let k = 0; k < 5; k++) {
                const a = k * 2 * Math.PI / 5; //+ k * Math.PI / 2;
                const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.004, 6).rotateZ(Math.PI / 2), holeM);//Math.PI / 2), holeM);
                hole.position.set(sg * 0.1055, 0.14 * Math.cos(a), 0.14 * Math.sin(a)); spin.add(hole);
            }
        }

        steer.add(spin); g.add(steer);
        wheels.push({ front: z > 0 ? 1 : 0, steer, spin });
    });

    // ---------- LIVREA TRICOLORE (cofano, tetto, portellone, fascia laterale) ----------
	_genericCarLivery(g, paint, o, 1, { sideMin:.81, sideY:.65, sideSp:.0276, sideHw:.0116, topMinY:.72 });
    
	// ---------- DATI E CONTROLLI ----------

            p.renderOrder = 2;
            p.material.polygonOffset = true;
            p.material.polygonOffsetFactor = -4;
