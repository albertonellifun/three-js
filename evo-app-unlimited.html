//fiat panda 4x4 anni 80 modificata da claude
function buildCarPandina(o) {
    const g = new THREE.Group();

    // ---------- materiali ----------
    const M = c => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide, shadowSide: THREE.BackSide });
    const B = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
    const nc = m => (m.userData.noCast = true, m);
	const MS = c => new THREE.MeshStandardMaterial({ color:c, side:THREE.DoubleSide, shadowSide: THREE.BackSide, metalness:0, roughness:0.5 });

    const paint = MS(o.paint);
	const black = M(0x000000);
    const plastic = M(0x222222);
    const steel = M(0x666677);
    const dark = M(0x333333);
    const floorM = M(0x111122);
    const glass = new THREE.MeshLambertMaterial({
        color: 0x223333, transparent: true, opacity: o.glassOpacity, side: THREE.DoubleSide
    });
    glass.depthWrite = false;
    glass.userData.noCast = true;
    glass.userData.noRecv = true;
    const white = B(0xffffff), panna = B(0xffffdd), red = B(0xdd2222), orange = B(0xee6600), blue = B(0x2233cc);
	const brakeM = B(0x330000);   // stop: spento
	const revM   = B(0x666666);   // retromarcia: spenta

    // ---------- quote (metri, z+ = muso, x+ = sinistra) ----------
    const HW = 0.73;                    // semilarghezza carrozzeria
    const ZF = 1.58, ZR = -1.58;        // muso e coda (paraurti esclusi)
    const BELT = 1.06, ROOF = 1.47;     // cintura e tetto
    const SILL = 0.44;                  // bordo basso fiancata (assetto rialzato)
    const WZ = 1.085, WX = 0.61, WY = 0.30, WR = 0.30;   // ruote: passo 2.17
    const AR = 0.40;                    // raggio passaruota
	const REAR_Y = 1.06;				// portellone quota
    const sx = y => 0.70 - (y - BELT) / (ROOF - BELT) * 0.16;   // semilarghezza della fiancata inclinata a quota y

    // ---------- helper ----------
    const box = (w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
        g.add(m); return m;
    };
    const cylZ = (r, len, mat, x, y, z, seg = 24) => {            // asse lungo Z (fari)
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2), mat);
        m.position.set(x, y, z); g.add(m); return m;
    };
    const cylX = (r, len, mat, x, y, z, seg = 12) => {            // asse lungo X (assali)
        const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2), mat);
        m.position.set(x, y, z); g.add(m); return m;
    };
    // estrusione lungo X di un profilo [z,y], centrata in cx
    const prism = (pts, width, mat, cx = 0) => {
        const sh = new THREE.Shape();
        pts.forEach((p, i) => i ? sh.lineTo(p[0], p[1]) : sh.moveTo(p[0], p[1]));
        sh.closePath();
        const geo = new THREE.ExtrudeGeometry(sh, { depth: width, bevelEnabled: false, steps: 1 });
        geo.rotateY(-Math.PI / 2);
        geo.translate(width / 2 + cx, 0, 0);
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // quadrilatero 3D
    const panel = (v, mat) => {
        const a = v.map(q => new THREE.Vector3(q[0], q[1], q[2])), p = [];
        [0, 1, 2, 0, 2, 3].forEach(i => p.push(...a[i].toArray()));
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // poligono [z,y] (con eventuali buchi) appoggiato sulla fiancata superiore inclinata
    const sidePoly = (s, pts, holes, mat) => {
        const sh = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
        (holes || []).forEach(h => sh.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))));
        const geo = new THREE.ShapeGeometry(sh);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) { const z = pos.getX(i), y = pos.getY(i); pos.setXYZ(i, s * sx(y), y, z); }
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mat);
        g.add(m); return m;
    };
    // punti dell'arco del passaruota (percorso in senso z decrescente)
    const archPts = zc => {
        const a0 = Math.asin((SILL - WY) / AR), p = [];
        for (let i = 0; i <= 12; i++) {
            const a = a0 + (Math.PI - 2 * a0) * i / 12;
            p.push([zc + AR * Math.cos(a), WY + AR * Math.sin(a)]);
        }
        return p;
    };

    // ---------- SCOCCA ----------
    const bodyMeshes = [];
    // fiancate sottili con passaruota (il centro dell'abitacolo resta vuoto per sedili e volante)
    const SIDE = [[ZF, SILL], ...archPts(WZ), ...archPts(-WZ), [ZR, SILL], [ZR, BELT],
                  [0.72, BELT], [0.72, 1.04], [ZF, 0.88]];
    for (const s of [-1, 1]) bodyMeshes.push(prism(SIDE, 0.08, paint, s * 0.69));
    // cofano (piano, leggermente inclinato) e portellone posteriore
    bodyMeshes.push(prism([[0.72, 0.62], [ZF, 0.62], [ZF, 0.88], [0.72, 1.04]], 1.30, paint));
    bodyMeshes.push(prism([[-1.30, 0.62], [ZR, 0.62], [ZR, REAR_Y], [-1.52, REAR_Y], [-1.30, BELT]], 1.30, paint));
	
	// cofano con rialzo centrale squadrato: piano originale + diagonale + piano rialzato
	const HOOD_CROWN = 0.02;   // altezza del rialzo
	const HOOD_W     = 0.85;   // larghezza del piano rialzato
	const HOOD_RAMP  = 0.02;   // larghezza orizzontale della diagonale
	{
		const hw = HOOD_W / 2;
		const PX = [-hw - HOOD_RAMP, -hw, hw, hw + HOOD_RAMP];   // profilo in sezione (x)
		const PH = [0, HOOD_CROWN, HOOD_CROWN, 0];               // quota sopra il cofano (y)
		const zs = [0.72, ZF], ys = [1.04, 0.88];                // righe: base parabrezza / muso
		const P = (i, r, base) => [PX[i], ys[r] + (base ? 0 : PH[i]), zs[r]];
		const pos = [];
		const tri = (a, b, c) => pos.push(...a, ...b, ...c);
		for (let i = 0; i < 3; i++) {
			// superficie superiore (diagonale, piano, diagonale)
			tri(P(i, 0), P(i, 1), P(i + 1, 0));
			tri(P(i + 1, 0), P(i, 1), P(i + 1, 1));
			// chiusura dei lati anteriore e posteriore, fino al cofano originale
			for (const r of [0, 1]) {
				tri(P(i, r), P(i + 1, r), P(i, r, 1));
				tri(P(i + 1, r), P(i + 1, r, 1), P(i, r, 1));
			}
		}
		const geo = new THREE.BufferGeometry();
		geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
		geo.computeVertexNormals();      // non indicizzata: normali per faccia, spigoli netti
		g.add(new THREE.Mesh(geo, paint));
	}
	
	
    // pavimento e presa d'aria scuri alla base del parabrezza
    box(1.00, 0.03, 2.90, floorM, 0, 0.47, -0.05);
    box(1.30, 0.04, 0.08, black, 0, 1.04, 0.70);

    // fascione nero sotto le porte
    for (const s of [-1, 1]) box(0.04, 0.12, 1.46, plastic, s * 0.73, 0.50, 0);//era alto nelle panda

    // ---------- PARTE ALTA: tetto, montanti, vetri dritti ----------
    box(0.54 * 2, 0.04, 1.42, paint, 0, ROOF - 0.02, -0.46);                // tetto

    const OUT   = [[0.72, BELT], [0.25, ROOF], [-1.17, ROOF], [-1.56, REAR_Y-0.025], [-1.56, BELT]];
    const DOOR  = [[0.55, BELT + 0.03], [0.27, 1.42], [-0.38, 1.42], [-0.38, BELT + 0.03]];
    const QUART = [[-0.47, BELT + 0.03], [-0.47, 1.42], [-1.07, 1.42], [-1.20, BELT + 0.03]];
    for (const s of [-1, 1]) {
        sidePoly(s, OUT, [DOOR, QUART], paint);      // lamiera con i buchi dei finestrini
        sidePoly(s, DOOR, null, glass);
        sidePoly(s, QUART, null, glass);
        // montante A e montante C (raccordo tra fiancata inclinata e parabrezza / lunotto)
        panel([[s * 0.70, BELT, 0.72], [s * 0.54, ROOF, 0.25], [s * 0.50, 1.46, 0.26], [s * 0.62, BELT, 0.70]], paint);
        panel([[s * 0.70, REAR_Y, -1.53], [s * 0.54, ROOF, -1.17], [s * 0.50, 1.46, -1.19], [s * 0.58, REAR_Y, -1.55]], paint);//il primo e' spigolo esterno lamiera

//cinquino gpt modificata in a112 abarth imbruttita
function buildCarBianchina(o) {
    const K = 1.26;
    const g = new THREE.Group();

	const M = c => new THREE.MeshLambertMaterial({ color: c, side: THREE.DoubleSide, shadowSide: THREE.BackSide });
	const B = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide, shadowSide: THREE.BackSide });
	const nc = m => (m.userData.noCast = true, m);   // mesh che non proietta ombra
	const MS = c => new THREE.MeshStandardMaterial({ color:c, side:THREE.DoubleSide, shadowSide: THREE.BackSide, metalness:0, roughness:0.5 });
	
    const paint = MS(o.paint);
	// vernice dei montanti: leggermente "avanti" rispetto ai vetri, non riceve ombra
	const paintMontanti = paint.clone();
	paintMontanti.polygonOffset = true;
	paintMontanti.polygonOffsetFactor = -1; 
	paintMontanti.polygonOffsetUnits = -1;
	paintMontanti.userData.noRecv = true;
	
    const black = M(0x000000);
    const rubber = M(0x222222);
    const steel = M(0x444455);

    const glass = new THREE.MeshLambertMaterial({
        color: 0x223333,
        transparent: true,
        opacity: o.glassOpacity,
        side: THREE.DoubleSide
    });
	
	//fix sfarfallio
	glass.depthWrite = false;      //il vetro non scrive depth
	glass.polygonOffset = true;    //vetro spinto indietro
	glass.polygonOffsetFactor = 1;
	glass.polygonOffsetUnits = 1;
	glass.userData.noCast=true;
	glass.userData.noRecv=true;

    const white = B(0xffffff);
	const panna = B(0xffffdd);
    const red = B(0xdd2222);
    const orange = B(0xee5500);
	const brakeM = B(0x330000);   // stop: spento
	const revM   = B(0x666666);   // retromarcia: spenta

	// --------------------------------------------------
    // FUNZIONI GEOMETRICHE
    // --------------------------------------------------

    function add(geo, mat, x, y, z) {
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x*K, y*K, z*K);
        g.add(mesh);
        return mesh;
    }

    function box(w,h,d,mat,x,y,z,rx=0,ry=0,rz=0) {
        const mesh = add(
            new THREE.BoxGeometry(w*K,h*K,d*K),
            mat,x,y,z
        );

        mesh.rotation.set(rx,ry,rz);
        return mesh;
    }

    function sphere(rx,ry,rz,mat,x,y,z) {
        const mesh = add(
            new THREE.SphereGeometry(1,24,16),
            mat,x,y,z
        );

        mesh.scale.set(rx*K,ry*K,rz*K);
        return mesh;
    }

    function cylinder(r1,r2,len,mat, x,y,z, segments=16, rotationX=Math.PI/2, rotationY=0, rotationZ=0) {
        const geo = new THREE.CylinderGeometry(
            r1*K,r2*K,len*K,segments
        );

        geo.rotateX(rotationX);
		geo.rotateY(rotationY);
		geo.rotateZ(rotationZ);
        return add(geo,mat,x,y,z);
    }

    function profile(pts, depth, mat, bevel=0.02, cx=0) {
        const shape = new THREE.Shape();

        pts.forEach((p,i) => {
            if(i===0) shape.moveTo(p[0],p[1]);
            else shape.lineTo(p[0],p[1]);
        });

        shape.closePath();

        const geo = new THREE.ExtrudeGeometry(shape,{
            depth: depth,
            bevelEnabled: bevel > 0,
            bevelThickness: bevel,
            bevelSize: bevel,
            bevelSegments: 4,
            curveSegments: 20,
			steps: 16,//divide ogni linea in 16 lungo l'asse z
        });

        geo.rotateY(-Math.PI*0.5);
        geo.translate(depth*0.5 + cx, 0, 0);   // <-- + cx
        geo.scale(K,K,K);

        const mesh = new THREE.Mesh(geo,mat);
        g.add(mesh);
        return mesh;
    }

    // Quadrilatero tridimensionale
    function panel(vertices,mat) {
        const positions = [];

        const v = vertices.map(p => new THREE.Vector3(
            p[0]*K,p[1]*K,p[2]*K
        ));

        positions.push(
            ...v[0].toArray(),
            ...v[1].toArray(),
            ...v[2].toArray(),

            ...v[0].toArray(),
            ...v[2].toArray(),
            ...v[3].toArray()
        );

        const geo = new THREE.BufferGeometry();

        geo.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(positions,3)
        );

        geo.computeVertexNormals();
		return add(geo, mat === paint ? paintMontanti : mat, 0, 0, 0);
    }

let dirt=0, dirtyMats=[];
const dirtCol=new THREE.Color(.5,.43,.3), _dc=new THREE.Color();
//               0 1 2 3  grav1        fango         roccia        offroad
const DIRT_COLS=[0,0,0,0,[.62,.50,.32],[.25,.17,.10],[.45,.45,.45],[.30,.22,.13]];
const MAX_DIRT_COLOR=0.2;
const MAX_DIRT_OPACITY=1.6;
const dirtU={uDirt:{value:0}, uDirtCol:{value:dirtCol}, uInv:{value:new THREE.Matrix4()}};



function patchDirtMat(m){
  const prevCompile = m.onBeforeCompile;//la salvo altrimenti sovrascrive le livery
  const prevKey = m.customProgramCacheKey;
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,dirtU);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nuniform mat4 uInv;\nvarying vec3 vDP;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvDP=(uInv*modelMatrix*vec4(position,1.)).xyz;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
uniform float uDirt; uniform vec3 uDirtCol; varying vec3 vDP;
float dh(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
float dn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(dh(i),dh(i+vec3(1,0,0)),f.x),mix(dh(i+vec3(0,1,0)),dh(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(dh(i+vec3(0,0,1)),dh(i+vec3(1,0,1)),f.x),mix(dh(i+vec3(0,1,1)),dh(i+vec3(1,1,1)),f.x),f.y),f.z);}`)
      .replace('#include <color_fragment>',`#include <color_fragment>
{
  float n=dn(vDP*7.)*.6+dn(vDP*19.)*.4;
  float low=1.-smoothstep(.15,1.0,vDP.y+(n-.5)*.5);
  float rear=smoothstep(-.3,-2.1,vDP.z);
  float base=low*(.55+.75*rear);
  float mask=smoothstep(.25,.6,base*uDirt*1.6+(n-.5)*.35*uDirt)*clamp(uDirt*1.5,0.,1.);
  diffuseColor.rgb=mix(diffuseColor.rgb,uDirtCol*.8,mask);
}`);
    if (prevCompile) prevCompile(sh);   // livrea: si inserisce subito dopo color_fragment, prima dello sporco
  };
  m.customProgramCacheKey=()=>(prevKey?prevKey.call(m):'')+'dirt';
  m.needsUpdate=true;
}




function collectDirtMats(){
  dirtyMats=[];
  const seen=new Set();
  model.traverse(o=>{
    if(!o.isMesh)return;
    [].concat(o.material).forEach(m=>{
      if(seen.has(m)||!m.color||m.transparent||m.opacity<1||m.isMeshBasicMaterial)return;
      seen.add(m);
      patchDirtMat(m);
      dirtyMats.push({m,c0:m.color.clone(),
        met:m.metalness, rou:m.roughness, cc:m.clearcoat,
        env:m.envMapIntensity, shi:m.shininess,
        spec:m.specular?m.specular.clone():null});
    });
  });
}

function applyDirt(){
  dirtU.uDirt.value=dirt;
  const k=Math.min(dirt,1)*MAX_DIRT_COLOR;     // intensità del colore
  const mk=Math.min(dirt*MAX_DIRT_OPACITY,1);         // l'opacità arriva prima del colore
  for(const d of dirtyMats){
    const m=d.m;
    m.color.copy(d.c0).lerp(dirtCol,k);
    if(d.met!==undefined) m.metalness=lerp(d.met,0,mk);
    if(d.rou!==undefined) m.roughness=lerp(d.rou,1,mk);
    if(d.cc!==undefined)  m.clearcoat=lerp(d.cc,0,mk);
    if(d.env!==undefined) m.envMapIntensity=lerp(d.env,0,mk);
    if(d.shi!==undefined) m.shininess=lerp(d.shi,2,mk);          // Phong/Lambert-like
    if(d.spec) m.specular.copy(d.spec).multiplyScalar(1-mk);
  }  
}

//numeri sulle fiancate, funzione usata dal cinquino/a112
function makeNumberTexture(num, stripe) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const m = 12;
  const size = 256 - m * 2;
  const r = 24;

  g.fillStyle = '#ffffff';
  g.beginPath();
  g.roundRect(m, m, size, size, [0, 0, r, r]);
  g.fill();
  g.strokeStyle = '#111111'; g.lineWidth = 8; g.stroke();

  g.strokeStyle = stripe || '#0088ee'; g.lineWidth = 40;       // fascia superiore
  g.beginPath(); g.moveTo(m, m + 20); g.lineTo(m + size, m + 20); g.stroke();

  g.fillStyle = '#111111';
  g.font = '900 180px monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(num), 128, 165);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

//funzione usata dal cinquino/a112
function carAddNumbers(car, bodyMeshes, opts) {
  const num = opts.raceNumber | 0;
  if (num <= 0) return [];                                      // 0 = nessuna targa

  const size = opts.numberSize != null ? opts.numberSize : 0.45;
  const y    = opts.numberY    != null ? opts.numberY    : 0.60;
  const z    = opts.numberZ    != null ? opts.numberZ    : 0.20;

  const mat = new THREE.MeshLambertMaterial({
    map: makeNumberTexture(num, opts.numberStripe),
    alphaTest: 0.5, // al posto di transparent: true altrimenti non si infanga!
    polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
  });
  
  //const geo = new THREE.PlaneGeometry(size, size);
  const geo = new THREE.PlaneGeometry(size, size, 4, 4);   // 25 vertici per accartocciamento
  const visible = opts.numbersVisible !== false;

  car.updateMatrixWorld(true);
  const rc = new THREE.Raycaster();
  const plates = [];

  [1, -1].forEach(function (side) {                             // +X sinistra, -X destra
    rc.set(new THREE.Vector3(side * 3, y, z), new THREE.Vector3(-side, 0, 0));
    const hit = rc.intersectObjects(bodyMeshes, false)[0];

    const n = new THREE.Vector3(side, 0, 0);
    const p = new THREE.Vector3(side * 0.90, y, z);             // fallback se il raggio non colpisce
    if (hit) {
      p.copy(hit.point);
      if (hit.face) {
        const f = hit.face.normal.clone();
        if (f.x * side > 0.5) {
          f.z = 0;                                              // niente inclinazione avanti/indietro
          f.y = Math.max(-0.2, Math.min(0.2, f.y));             // solo la leggera inclinazione della fiancata
          n.copy(f).normalize();
        }
      }
    }
    p.addScaledVector(n, 0.006);

    // base ortonormale: z = normale, y = alto del mondo proiettato sul piano, x = y × z
    const zA = n.clone();
    const yA = new THREE.Vector3(0, 1, 0).addScaledVector(zA, -zA.y).normalize();
    const xA = new THREE.Vector3().crossVectors(yA, zA).normalize();

    const m = new THREE.Mesh(geo, mat);
    m.name = 'raceNumber';
    //m.userData.noDent = true;
    m.position.copy(p);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xA, yA, zA));
    m.visible = visible;
    car.add(m);
    plates.push(m);
  });
  return plates;
}


function makeTargaTexture(text,inv=false) {
  const c = document.createElement('canvas');
  c.width = 600;
  c.height = 100; // targhe vecchie non hanno rapporto 2:1
  const g = c.getContext('2d');
  
  // Sfondo nero della targa
  g.fillStyle = inv ? '#eeeeee' : '#222222';
  g.fillRect(0, 0, c.width, c.height);
  
  // Bordo esterno
  g.strokeStyle = '#000000';
  g.lineWidth = 12;
  g.strokeRect(6, 6, c.width - 12, c.height - 12);
  
  // Provincia scritto in arancione
  console.log(text);
  const arr = text.split(' ');
  const prov = arr.length?arr[0]:'Roma';
  const numb = arr.length>1?arr[1]:'12345F';
  
  //provincia
  g.fillStyle = inv ? '#000000' : '#ee8800';
  g.font = '900 85px monospace';
  g.textAlign = 'left'; 
  g.textBaseline = 'middle';
  g.fillText(String(prov), 50, 55);

  //numeri
  g.fillStyle = inv ? '#000000' : '#ffffff';
  g.font = '900 85px monospace';
  g.textAlign = 'left'; 
  g.textBaseline = 'middle';
  g.fillText(String(numb), 270, 55);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;

  });
}

//sedili, cruscotto, volante, etc...
function buildInterior(parent,forceWidth=0){
  const IZ=-0.1;
  const IY=0;// se non combacia con la scocca, sposta questi due valori
  let steerWheel;

  const L = (parent.userData && parent.userData.dashL) || 1.20;

  // larghezza utile dell'abitacolo, dichiarata dall'auto (Panda 1.20, altra auto 1.36)
  const W = forceWidth || (parent.userData && parent.userData.dashW) || 1.36;
  const SX = W/2 - 0.28;                          // x dei sedili: il fianchetto esterno resta a 2.5 cm dalla fiancata
  const RW = W - 0.16;                            // divano posteriore: più stretto, per le ruote posteriori
  const TW = Math.min(0.22, 2*(SX-0.23) - 0.01);  // tunnel: non entra nei sedili se l'auto è stretta

  const M = c => new THREE.MeshBasicMaterial({ color: c });//no luce!
  const seatM=M(0x2a2d33);
  const bolM=M(0x3c4350);
  const dashM=M(0x15171c);
  const rimM=M(0x0d0d0f);
  const g=new THREE.Group();g.position.set(0,IY,IZ);
  const box=(w,h,d,m,x,y,z,rx)=>{
    const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
    o.position.set(x,y,z);
    if(rx)o.rotation.x=rx;
    g.add(o);
    return o;
  };

  for(const x of[-SX,SX]){
    box(.46,.12,.5,seatM, x,0.50,-.05);              // seduta
    box(.46,.62,.12,seatM,x,0.84,-.36,-.18);       // schienale
    box(.22,.2,.09,bolM,  x,1.18,-.41,-.18);        // poggiatesta
    for(const s of[-1,1]) box(.07,.45,.2,bolM,x+s*.22,.82,-.3,-.18);   // fianchetti
  }

  box(RW,.14,.5,seatM,0,.50,-L+0.25);                // divano posteriore
  box(RW,.6,.12,seatM,0,.85,-L+0.00,-.12);           // divano posteriore
  box(W,.22,.4,dashM,0,.88,.62);                  // plancia
  box(TW,.25,.9,dashM,0,.55,.1);                  // tunnel centrale

  const tilt=new THREE.Group();
  tilt.position.set(SX,.98,.33);
  tilt.rotation.x=.5;
  g.add(tilt);

  // volante
  steerWheel=new THREE.Group();
  tilt.add(steerWheel);
  steerWheel.add(new THREE.Mesh(new THREE.TorusGeometry(.17,.022,8,24),rimM));

  // striscia gialla a ore 12 sul volante
  const markM = M(0xffaa00);
  const markArc = 0.05;
  const mark = new THREE.Mesh(new THREE.TorusGeometry(.17, .0235, 8, 4, markArc), markM);
  mark.rotation.z = Math.PI / 2 - markArc / 2;
  steerWheel.add(mark);

  const sp1=new THREE.Mesh(new THREE.BoxGeometry(.3,.03,.02),rimM);
  const sp2=new THREE.Mesh(new THREE.BoxGeometry(.03,.17,.02),rimM);
  sp2.position.y=-.09;
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.03,10).rotateX(Math.PI/2),rimM);
  steerWheel.add(sp1,sp2,hub);

  const col=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,.35,8).rotateX(Math.PI/2),dashM);
  col.position.set(SX,.92,.5);g.add(col);

  parent.add(g);
  return steerWheel;
}

// sterzo: pure pursuit sul punto di strada davanti all'auto
function assistSteer(){
  const sp=Math.hypot(car.u,car.v);
  if(sp<2||car.air||car.u<0)return 0;
  const Ld=clamp(6+car.u*.55,8,40);                         // lookahead cresce con la velocità
  const p=P[Math.min(P.length-2,car.idx+Math.max(2,Math.round(Ld/DS)))];
  const dx=p.x-car.x, dz=p.z-car.z;
  const alpha=angDiff(car.th,Math.atan2(dx,dz));            // + = bersaglio a sinistra
  const beta=Math.atan2(car.v,Math.max(car.u,3));           // derapata
  const delta=Math.atan(2*2.6*Math.sin(alpha)/Math.max(Math.hypot(dx,dz),1));
  return clamp(delta/maxSteer(sp)+beta*1.2,-1,1);           // + controsterzo automatico
}

// velocità massima sicura: curve davanti + spazio di frenata
function assistSpeed(){
  const g=9.81;
  let vt=CURRENT_CAR_SPEC.maxSpeed/3.6;
  const aB0=.55*MU[Math.min(P[car.idx].surf,MU.length-1)]*g;
  const n=Math.min(70,Math.ceil((Math.max(car.u,0)**2/(2*aB0)+30)/DS));
  for(let j=1;j<=n;j++){
    const p=P[car.idx+j]; if(!p)break;
    const mu=MU[p.surf];
    const k=Math.max(Math.abs(p.k),1/600);
    const vc2=.75*mu*g/k;                                   // velocità limite in curva
    vt=Math.min(vt,Math.sqrt(vc2+2*.55*mu*g*j*DS));         // raggiungibile frenando
  }
  return Math.max(vt,8);
}

//fisica 4 ruote
function physicsPRO(dt){
  const m=CURRENT_CAR_SPEC.mass;
  const I=m*1.7;
  const a=1.3,b=1.3,L=a+b,W=1.5,w2=W/2,g=9.81,hc=0.55;
  let u=car.u,v=car.v,r=car.r;
  
  car.absT=Math.max(0,(car.absT||0)-dt);//abs

  // dopo un urto u cambia di colpo: riallinea le ruote
  if(Math.abs(u-car.uLast)>1.5) for(let i=0;i<4;i++) car.w[i]=u/WR;

  const sp=Math.hypot(u,v);
  const delta=car.steer*maxSteer(sp)+dmg.pull;

  // carichi verticali con trasferimento
  const N0f=m*g*b/L*.5, N0r=m*g*a/L*.5;
  const dl=m*car.axF*hc/(2*L);
  const dtF=m*car.ayF*hc*.4/W, dtR=m*car.ayF*hc*.6/W;
  const N=[
    Math.max(N0f-dl-dtF,N0f*.15), Math.max(N0f-dl+dtF,N0f*.15),
    Math.max(N0r+dl-dtR,N0r*.15), Math.max(N0r+dl+dtR,N0r*.15)];
  const X=[a,a,-b,-b], Y=[w2,-w2,w2,-w2];   // FL FR RL RR (x avanti, y sinistra)

  // gas, freno, retromarcia
  let Fd=0;
  if(ctl.gas>0) Fd=Math.min(CURRENT_CAR_SPEC.power/Math.max(u,5),CURRENT_CAR_SPEC.fmax)*ctl.gas;
  if(ctl.brake>0){
    if(u>.05) car.brkLatch=true;
    else if(!car.brkLatch&&u>-12) Fd-=4500*ctl.brake;
  } else car.brkLatch=false;
  const Feb=(ctl.gas<.05&&u>3)?(200+9*u)/4:0;
  const brakeOn=ctl.brake>0&&car.brkLatch;
  const share=[.2,.2,.3,.3], BIAS=.62;
  
  
  //esp
  // ===== ESP =====
  let espW=-1, espT=0;
  if(espMode>0 && ctl.hb<.5 && !car.air && u>5){
	const d0=car.steer*maxSteer(sp);
	let rDes=u*Math.tan(d0)/(L*(1+(u/ESP_VCH)**2));
	const rMax=.9*(car.muF+car.muR)*.5*g/u;
	rDes=clamp(rDes,-rMax,rMax);
	const beta=Math.atan2(v,u);
	const sr=Math.sign(r), sd=Math.sign(rDes);
	const s=(sr===sd||Math.abs(r)<.08)?sd:sr;
	const ex=((r-rDes)-2*beta)*s;                 // era 1.2*beta
	const dead=ESP_DEAD[espMode];
	if(ex>dead){
		espW=s>0?1:0;
		espT=(ex-dead)*ESP_GAIN[espMode];
		Fd*=1-clamp(ex*4,0,.95);                    // era ex*1.5, max .7
	}else if(ex<-dead*1.5){
		espW=s>0?2:3;
		espT=(-ex-dead*1.5)*ESP_GAIN[espMode]*.7;
		Fd*=1-clamp(-ex*3,0,.8);                    // era -ex, max .5
	}
  }
  car.espAct=espW>=0;
  
  

  let Fx=0,Fy=0,Mz=0,spinMax=0;
  for(let i=0;i<4;i++){
    const fr=i<2;
    const d=fr?delta:0, cd=Math.cos(d), sd=Math.sin(d);

    // velocità del punto ruota nel riferimento ruota
    const vbx=u-r*Y[i], vby=v+r*X[i];
    const vxw= vbx*cd+vby*sd, vyw=-vbx*sd+vby*cd;

    // superficie e aderenza PER RUOTA
    const wd=wheelDat[i];
	
	//larghezza strada
    ////const sf=Math.abs(wd.d)>5.4?MU.length-1:wd.surf;
	const sf=wd.off?MU.length-1:wd.surf;
	
    //guadi
	//let mu=car.air?.03:MU[sf];
	let mu=(car.air?.03:MU[sf])*(wd.wet?.8:1);
	
    if(dmg.lost[i]) mu*=.25;
    const muN=mu*N[i], B=TYRE_B[sf];

    // vettore di slittamento combinato
    const den=Math.max(Math.abs(vxw),3);
    const sx=(car.w[i]*WR-vxw)/den, sy=-vyw/den;
    const s=Math.hypot(sx,sy);
    const ang=Math.atan(B*s);
    const f=Math.sin(1.5*ang);                 // picco poi calo (~30%)
    const F=muN*f;
    const fx0=s>1e-6?F*sx/s:0, fy0=s>1e-6?F*sy/s:0;

    // dinamica ruota (semi-implicita: stabile anche a slip alto)
    const sxn=s>1e-6?sx/s:1;
    const dfds=Math.max(Math.cos(1.5*ang),0)*1.5*B/(1+B*B*s*s);
    const k=muN*(dfds*sxn*sxn+(s>1e-6?f/s:dfds)*(1-sxn*sxn))/den;
    const Tdrv=(Fd-Feb)*WR*share[i];
    ///////const Tb=(brakeOn?16000*WR*ctl.brake*(fr?BIAS:1-BIAS)*.5:0)+(!fr&&ctl.hb>.5?HB_TORQUE:0);
	
	//esp
	const Tesp=(i===espW)?Math.min(espT,.95*muN*WR):0;
	const hbRear=!fr&&ctl.hb>.5;
	const absOnW=absOn&&brakeOn&&!hbRear;     // il freno a mano resta libero di bloccare
	const Tb=(brakeOn?16000*WR*ctl.brake*(fr?BIAS:1-BIAS)*.5:0)+(hbRear?HB_TORQUE:0)+Tesp;
	
    const Ieff=IW+dt*k*WR*WR;
    let wn=car.w[i]+dt*(Tdrv-fx0*WR)/Ieff;
    if(Tb>0){                                   // il freno ferma la ruota, non la inverte
      const dwb=dt*Tb/Ieff;
      wn=Math.abs(wn)<=dwb?0:wn-Math.sign(wn)*dwb;
    }
	
	
	//esp
	if((absOnW||Tesp>0)&&vxw>2){
	  const wMin=(vxw-1.5/B*den)/WR;
	  if(wn<wMin){ wn=wMin; if(absOnW) car.absT=.15; }
	}
	
	
    const wmax=CURRENT_CAR_SPEC.maxSpeed/3.6*1.1/WR;
    car.w[i]=clamp(wn,-wmax,wmax);
    car.slipW[i]=s;
    if(!fr) spinMax=Math.max(spinMax,sx);

    // ruota -> corpo
    const Fxb=fx0*cd-fy0*sd, Fyb=fx0*sd+fy0*cd;
    Fx+=Fxb; Fy+=Fyb;
    Mz+=X[i]*Fyb-Y[i]*Fxb;
  }
  car.spin=clamp((spinMax-.12)*4,0,1.5)*(sp<22?1:.5);

  // resistenze: opposte al vettore velocità (non solo a u)
  const V=Math.max(sp,1e-3);
  const res=car.rr*m*g*Math.tanh(sp*2)/V+CURRENT_CAR_SPEC.drag*sp;
  Fx-=res*u; Fy-=res*v;

  const ax=Fx/m+v*r-g*Math.sin(car.pitchT);
  const ay=Fy/m-u*r-g*Math.sin(car.rollT);
  let nu=u+ax*dt, nv=v+ay*dt, nr=r+(Mz/I-.02*r)*dt;

  // da fermo con freno / freno a mano resta fermo
  if((ctl.hb>.5||(car.brkLatch&&ctl.brake>0))&&ctl.gas<.05&&Math.hypot(nu,nv)<.3){nu=nv=nr=0;}

  // cinematica solo a velocità TOTALE bassa (non più su u con segno)
  const wk=sp<=1?1:clamp(1-(sp-1)/3,0,1);
  if(wk>0){
    const kk=1-Math.exp(-wk*20*dt);
    nr+=(nu*Math.tan(delta)/L-nr)*kk;
    nv+=(0-nv)*kk;
  }

  const ff=1-Math.exp(-10*dt);
  car.axF+=(Fx/m-car.axF)*ff;
  car.ayF+=(Fy/m-car.ayF)*ff;
  car.u=nu; car.v=nv; car.r=nr; car.uLast=nu;
  car.th+=nr*dt;
  car.x+=(nu*Math.sin(car.th)+nv*Math.cos(car.th))*dt;
  car.z+=(nu*Math.cos(car.th)-nv*Math.sin(car.th))*dt;
}


/* ============ FISICA (bicicletta + cerchio di attrito) ============ */
const CAf=140000;//rigidezza deriva front
const CAr=160000;//rigidezza deriva rear
const maxSteer=sp=>.75/(1+Math.pow(sp/18,1.3));//limitatore di sterzo dipende da velocita
function physicsEASY(dt){
 const m=CURRENT_CAR_SPEC.mass;
 const I=CURRENT_CAR_SPEC.mass*1.5;
 const a=1.3;//distanza baricentro asse anteriore
 const b=1.3;//distanza baricentro asse posteriore
 const L=2.6;//passo veicolo
 const g=9.81;//gravita
 const hc=0.55;//altezza baricentro
 const u=car.u;
 const v=car.v;
 const r=car.r;
 const sp=Math.abs(u);
 
 //danneggiamento:
 //let delta=car.steer*maxSteer(sp);
 let delta=car.steer*maxSteer(sp)+dmg.pull;
 
 //ESP+ABS
 //controsterzo assistito oltre i 60kmh
 if(u>16){
	const beta=Math.atan2(v,u);
	delta+=clamp(beta*.35,-.22,.22)*clamp((u-6)/10,0,1);
 }
 
 
 const Nf0=m*g*b/L,Nr0=m*g*a/L,wt=m*car.axF*hc/L;
 const Nf=Math.max(Nf0-wt,Nf0*.4);
 const Nr=Math.max(Nr0+wt,Nr0*.4);
 let Fd=0,Fb=0;
 
 
 if(ctl.gas>0) Fd=Math.min(CURRENT_CAR_SPEC.power/Math.max(u,5), CURRENT_CAR_SPEC.fmax)*ctl.gas;

 if(ctl.brake>0){
  if(u>.05){Fb=-14500*ctl.brake*clamp(u/1.2,0,1);car.brkLatch=true;}
  else if(!car.brkLatch&&u>-12)Fd-=4500*ctl.brake;          // retromarcia solo rilasciando e ripremendo da fermo
 }else car.brkLatch=false;
 
 const Feb=(ctl.gas<.05&&u>3)?200+9*u:0;                      // freno motore
 let FmF=car.muF*Nf,FmR=car.muR*Nr;
 
 car.spin=clamp((Fd*.6)/FmR-1,0,1.5)*(u<22?1:.5);
 
 let Fxf=Fd*.4,Fxr=Fd*.6;

 const bf=Nf/(Nf+Nr);
 
 //freno piu realistico
 const BRAKE_BIAS_F=.62;   // .75 = ideale (non blocca mai), .5 = blocca subito dietro, bilanciamento freno 62% anteriore
 Fxf+=Math.max(Fb*BRAKE_BIAS_F,     -FmF*car.brakeF);
 Fxr+=Math.max(Fb*(1-BRAKE_BIAS_F), -FmR*car.brakeR);

 const HB_GRIP=.45;    // grip totale del posteriore a ruote bloccate (1 = normale)
 const HB_BRAKE=.5;    // quota di quel grip usata per frenare (resto = laterale)
 
 if(ctl.hb > .5){
   //freno a mano funziona sempre! Se u è positivo frena verso l'indietro (-), se u è negativo frena in avanti (+)
   const dir = Math.sign(u) || 1;
   FmR *= HB_GRIP;
   Fxr = -dir * FmR * HB_BRAKE * car.brakeR;
 }
 
 
 
 Fxf=clamp(Fxf,-FmF,FmF);
 Fxr=clamp(Fxr,-FmR,FmR);
 
 const LmF=Math.sqrt(Math.max(FmF*FmF-Fxf*Fxf,(.15*FmF)**2));
 const LmR=Math.sqrt(Math.max(FmR*FmR-Fxr*Fxr,(.15*FmR)**2));
 
 
 let Fyf=0;
 let Fyr=0;
 if(u>.5){
  const den=Math.max(u,2.5);
  const af=Math.atan2(v+a*r,den)-delta;
  const ar=Math.atan2(v-b*r,den);
  Fyf=-LmF*Math.tanh(CAf*car.stF*af/LmF);
  Fyr=-LmR*Math.tanh(CAr*car.stR*ar/LmR);
 }
 const cd=Math.cos(delta);
 const sd=Math.sin(delta);
 let Fx=Fxf*cd-Fyf*sd+Fxr;
 const Fy=Fyf*cd+Fxf*sd+Fyr;
 let Mz=a*(Fyf*cd+Fxf*sd)-b*Fyr;
  
 Fx-=(car.rr*m*g+CURRENT_CAR_SPEC.drag*u*Math.abs(u))*Math.tanh(u*2)+Feb;
 
 const ax=Fx/m+v*r-g*Math.sin(car.pitchT);
 const ay=Fy/m-u*r-g*Math.sin(car.rollT);
 let nu=u+ax*dt;
 let nv=v+ay*dt;
 
 //smorzamento 0.5 e' eccessivo
 let nr=r+(Mz/I-0.20*r)*dt;//0.5 -> 0.20
 
 
 if(u>0&&nu<0&&Fd===0)nu=0;
 
 //if(car.brkLatch&&ctl.brake>0&&ctl.gas<.05&&Math.abs(nu)<.25)nu=0;   // da fermo resta fermo
 if((ctl.hb>.5 || (car.brkLatch&&ctl.brake>0))&&ctl.gas<.05&&Math.abs(nu)<.3)nu=0;//anche il freno a mano deve bloccare!
 
 const wk=u<=1?1:clamp(1-(u-1)/3,0,1);                                // a bassa velocità: cinematica
 if(wk>0){
  const k=1-Math.exp(-wk*20*dt);
  const rk=nu*Math.tan(delta)/L;
  nr+=(rk-nr)*k;
  nv+=(0-nv)*k;//FORZA VELOCITA LATERALE A ZERO!!!
 }
 const f=1-Math.exp(-10*dt);
 car.axF+=(Fx/m-car.axF)*f;
 car.ayF+=(Fy/m-car.ayF)*f;
 car.u=nu;
 car.v=nv;
 car.r=nr;
 car.th+=nr*dt;
 car.x+=(nu*Math.sin(car.th)+nv*Math.cos(car.th))*dt;
 car.z+=(nu*Math.cos(car.th)-nv*Math.sin(car.th))*dt;
 
 
 //fix switch fisica pro/easy
 car.w.fill(nu/WR);      // ruote che girano in modo coerente con la velocità
 car.uLast=nu;           // evita il "riallineamento" brusco quando si torna a PRO
 car.espAct=false;       // niente ESP/ABS in EASY (HUD non resta arancio)
 car.absT=0;
}


//guida assistita
function stepControls(dt){
 const hum=clamp(touch.steer+(keys.left?1:0)-(keys.right?1:0),-1,1);
 const manual=Math.abs(hum)>.05||touch.hb||keys.hb;
 assistW+=clamp((manual?.1:1)-assistW,-8*dt,1.5*dt);        // cede subito, rientra piano
 const au=(assistMode>0&&running)?assistSteer()*assistW:0;
 const tgt=clamp(hum+au,-1,1);

 const same=Math.sign(tgt)===Math.sign(car.steer)&&Math.abs(tgt)>=Math.abs(car.steer);
 const rate=(same||car.steer===0)?8:12;
 car.steer+=clamp(tgt-car.steer,-rate*dt,rate*dt);

 let tg=Math.max(touch.gas,keys.gas?1:0);
 let tb=(touch.brake||keys.brake)?1:0;
 if(tb&&touch.gas)gasSet(0);

 // limitatore di velocità: solo se non freni tu e non usi il freno a mano
 if(assistMode>=2&&running&&!tb&&!car.air&&!(touch.hb||keys.hb)){
   const over=car.u-assistSpeed();
   if(over>0){
     tg*=clamp(1-over/2,0,1);
     if(over>1.5)tb=clamp((over-1.5)/5,0,1);
   }
 }

 ctl.gas+=clamp(tg-ctl.gas,-8*dt,4*dt);
 ctl.brake+=clamp(tb-ctl.brake,-8*dt,6*dt);
 ctl.hb=(touch.hb||keys.hb)?1:0;
}


function stepControlsOLD(dt){
 const tgt=clamp(touch.steer+(keys.left?1:0)-(keys.right?1:0),-1,1);
 const same=Math.sign(tgt)===Math.sign(car.steer)&&Math.abs(tgt)>=Math.abs(car.steer);
 const rate=(same||car.steer===0)?8:12;
 car.steer+=clamp(tgt-car.steer,-rate*dt,rate*dt);
 ////gas diventa uno slider
 ////const tg=(touch.gas||keys.gas)?1:0;
 ////const tb=(touch.brake||keys.brake)?1:0;
 const tg=Math.max(touch.gas,keys.gas?1:0);
 const tb=(touch.brake||keys.brake)?1:0;
 if(tb&&touch.gas)gasSet(0); 
 
 ctl.gas+=clamp(tg-ctl.gas,-8*dt,4*dt);
 ctl.brake+=clamp(tb-ctl.brake,-8*dt,6*dt);
 ctl.hb=(touch.hb||keys.hb)?1:0;
}

const fMat=new THREE.ShaderMaterial({

  void main(){vAge=aAge;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*uScale/(-mv.z);gl_Position=projectionMatrix*mv;}`,
 fragmentShader:`varying float vAge;
  void main(){
   float d=length(gl_PointCoord-.5);
   float core=smoothstep(.5,.0,d);
   vec3 c=mix(vec3(1.,.95,.7),vec3(1.,.5,.08),smoothstep(0.,.35,vAge));
   c=mix(c,vec3(.7,.07,.02),smoothstep(.3,.9,vAge));

function exhaustFlames(power){   // power ~0.7 (piccola) .. 1.5 (grossa)
 const fx=Math.sin(car.th),fz=Math.cos(car.th),lx=Math.cos(car.th),lz=-Math.sin(car.th);
 const cvx=car.u*fx+car.v*lx, cvz=car.u*fz+car.v*lz;      // l'auto si muove: le fiamme la seguono
 for(const o of exhaustOffsets){
  const px=car.x+fx*(o.z-.1)+lx*o.x, pz=car.z+fz*(o.z-.1)+lz*o.x, py=car.yS+o.y;
  const n=Math.round(10*power);
  for(let k=0;k<n;k++){
   const i=fHead;fHead=(fHead+1)%NF;
   const sp=rnd(3,9)*power, j=.6;
   fPos[i*3]=px;fPos[i*3+1]=py;fPos[i*3+2]=pz;
   fVel[i*3]  =cvx-fx*sp+lx*rnd(-j,j);                      // getto verso DIETRO
   fVel[i*3+1]=rnd(-.3,.5);
   fVel[i*3+2]=cvz-fz*sp+lz*rnd(-j,j);
   fMax[i]=fLife[i]=rnd(.10,.22)*(.8+.4*power);
   fS[i]=rnd(.3,.55)*power;
  }
 }
}
function updFlames(dt){
 for(let i=0;i<NF;i++){
  if(fLife[i]<=0){fAge[i]=1;fSize[i]=0;continue;}
  fLife[i]-=dt;
  const t=1-fLife[i]/fMax[i];
  if(t>=1){fLife[i]=0;fAge[i]=1;fSize[i]=0;continue;}
  const dk=Math.max(0,1-4*dt);
  fVel[i*3]*=dk;fVel[i*3+1]=fVel[i*3+1]*dk+1.5*dt;fVel[i*3+2]*=dk;
  fPos[i*3]+=fVel[i*3]*dt;fPos[i*3+1]+=fVel[i*3+1]*dt;fPos[i*3+2]+=fVel[i*3+2]*dt;
  fAge[i]=t;fSize[i]=fS[i]*(1-.6*t);
 }
 fGeo.attributes.position.needsUpdate=fGeo.attributes.aSize.needsUpdate=fGeo.attributes.aAge.needsUpdate=true;
}








function emit(x,y,z,vx,vy,vz,r,g,b,life,s0,s1,a0,grav,drag){
 const i=pHead;pHead=(pHead+1)%NP;
 pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
 pCol[i*3]=r;pCol[i*3+1]=g;pCol[i*3+2]=b;pLife[i]=pMax[i]=life;pS0[i]=s0;pS1[i]=s1;pA0[i]=a0;pG[i]=grav;pD[i]=drag;
}
function splashWater(o,speed){
 const count=Math.round(clamp(speed*.8,8,24));
 const forward=Math.min(speed*.12,5);
 for(let i=0;i<count;i++){
  const angle=rnd(0,Math.PI*2),radius=rnd(0,o.r*.55);
  const blue=Math.random()<.55;
  emit(o.x+Math.cos(angle)*radius,o.y+.06,o.z+Math.sin(angle)*radius,
   Math.cos(angle)*rnd(1.2,3)-Math.sin(car.th)*forward,
   rnd(2.5,5.5)+Math.min(speed*.06,2),
   Math.sin(angle)*rnd(1.2,3)-Math.cos(car.th)*forward,
   blue?.42:.82,blue?.76:.94,1,rnd(.35,.65),.08,rnd(.18,.32),.9,9,1.2);
 }
}
function updParticles(dt){
 for(let i=0;i<NP;i++){
  if(pLife[i]<=0){pAl[i]=0;continue;}
  pLife[i]-=dt;const t=1-pLife[i]/pMax[i];if(t>=1){pLife[i]=0;pAl[i]=0;continue;}
  const dk=Math.max(0,1-pD[i]*dt);
  pVel[i*3]*=dk;pVel[i*3+1]=pVel[i*3+1]*dk-pG[i]*dt;pVel[i*3+2]*=dk;
  pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
  pSize[i]=lerp(pS0[i],pS1[i],t);pAl[i]=pA0[i]*Math.pow(1-t,1.3)*Math.min(1,t*10);
 }
 pGeo.attributes.position.needsUpdate=pGeo.attributes.aSize.needsUpdate=pGeo.attributes.aAlpha.needsUpdate=pGeo.attributes.aColor.needsUpdate=true;
}

const emAcc=[0,0,0,0];

function spawn(w,surf,fast){
 const d=wheelDat[w];
 const fx=Math.sin(car.th);
 const fz=Math.cos(car.th);
 const vxw=car.u*fx+car.v*Math.cos(car.th);
 const vzw=car.u*fz-car.v*Math.sin(car.th);
 const j=()=>rnd(-1,1);
 
 if(surf===(MU.length-1) && Math.random()<.5 && fast){
  //offroad
  emit(d.x,d.y+.2,d.z,vxw*.3-fx*rnd(2,5)+j()*2,rnd(3,7),vzw*.3-fz*rnd(2,5)+j()*2,.26,.17,.10,rnd(.6,1.1),.5,.4,1,14,.2);
 } else if(surf < 4) {
  //asfalto
  emit(d.x,d.y+.2,d.z,vxw*.2+j(),rnd(.6,1.2),vzw*.2+j(),.88,.88,.9,rnd(.7,1.1),.7,rnd(2,3),.3,-.5,1.5);
 } else {
  //terra
  const c=surf===1?[.78,.67,.50]:[.5,.43,.30],k=rnd(.9,1.1);
  emit(d.x,d.y+.25,d.z,vxw*.35+j()*1.6,rnd(1,2.2),vzw*.35+j()*1.6,c[0]*k,c[1]*k,c[2]*k,rnd(1,1.8),1,rnd(3.5,5),.5,-.3,1.8);
  if(fast&&Math.random()<.25) {
    emit(d.x,d.y+.2,d.z,vxw*.3-fx*rnd(1,4)+j()*2,rnd(2,5),vzw*.3-fz*rnd(1,4)+j()*2,.34,.26,.17,rnd(.5,.9),.4,.35,1,14,.2);
  }
 }
}

function emitWheels(dt){
 if(car.air)return;

 const speed=Math.abs(car.u);
 const slipR=Math.abs(car.v-1.3*car.r);
 const slipF=Math.abs(car.v+1.3*car.r);
 
 console.log(slipR);
 
 for(let w=0;w<4;w++){
  //guadi
  if(wheelDat[w].wet)continue;//no polvere in acqua!
  
  const rear=w>=2;
  const slip=rear?slipR:slipF*.6;
  const d=wheelDat[w];
  
  //larghezza strada
  //const off=Math.abs(d.d)>5.4;
  const off=d.off;
  
  const surf=off?(MU.length-1):d.surf;
  const spin=rear?car.spin:0;
  let rate;
  
  if (surf===(MU.length-1)) {
    //offroad
    rate=(speed>1?speed*1.3:0)+slip*7+spin*40;
  } else if (surf < 4) {
    //asfalto, sgommata in partenza (no da auto quasi ferma!!!)
	if(speed > 3 && speed < CURRENT_CAR_SPEC.startSkidSpeed && ctl.gas > 0.5) rate = spin*30 + 5;
	else rate=(slip>3.5?(slip-3.5)*7:0)+spin*30;
  } else {
    //gravel
    rate=(speed>1?speed*.9:0)+slip*6+spin*45;
  }
  rate*=rear?1:.45;
  emAcc[w]+=rate*dt;
  while(emAcc[w]>=1){
    emAcc[w]--;
	spawn(w,surf,spin>.3||slip>5);
  }
 }
}

const SK_MAX=4000;
const SK_HW=.12;               // segmenti massimi, mezza larghezza traccia
const skPos=new Float32Array(SK_MAX*18);
const skCol=new Float32Array(SK_MAX*18);
const skAl=new Float32Array(SK_MAX*6);
const skGeo=new THREE.BufferGeometry();
skGeo.setAttribute('position',new THREE.BufferAttribute(skPos,3).setUsage(THREE.DynamicDrawUsage));

const skMat=new THREE.ShaderMaterial({
 transparent:true,
 depthWrite:false,
 side:THREE.DoubleSide,//ocho al double altrimenti non si vede!
 polygonOffset:true,
 polygonOffsetFactor:-6,
 polygonOffsetUnits:-6,
 vertexShader:'attribute vec3 aColor;attribute float aAlpha;varying vec3 vC;varying float vA;void main(){vC=aColor;vA=aAlpha;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 vC;varying float vA;void main(){gl_FragColor=vec4(vC,vA);}'});

skMesh.frustumCulled=false;

//            asfalto        gravel chiaro  fango scuro    roccioso       offroad
const SK_COL=[[.03,.03,.035],[.34,.26,.17],[.14,.10,.065],[.26,.27,.29],[.22,.16,.09]];
const SK_ALPHA=[.65,.55,.6,.5,.5];

const skW=[0,1,2,3].map(()=>({on:false,has:false,k:0,px:0,pz:0,lx:0,ly:0,lz:0,rx:0,ry:0,rz:0,a:0}));
let skHead=0;

function skidTarget(w,surfIdx){
 const rear=w>=2;
 const d=wheelDat[w];
 if(car.air)return 0;
 const slip=rear?Math.abs(car.v-1.3*car.r):Math.abs(car.v+1.3*car.r)*.6;
 
 //in partenza, sgomma!!!
 if (car.u > 0 && car.u < 10 && ctl.gas > 0.5) return 1.0;
 
 const thr=surfIdx===0?2.2:1.5;
 let t=Math.max(clamp((slip-thr)/4,0,1),rear?clamp(car.spin*1.2,0,1):0);
 if(ctl.hb>.5&&rear&&Math.abs(car.u)>3)t=Math.max(t,.9);                       // freno a mano
 if(ctl.brake>.5&&car.u>12)t=Math.max(t,.3*clamp((car.u-12)/20,0,1));         // frenata forte
 return t;
}

function updSkids(dt){
 let dirty=false;
 for(let w=0;w<4;w++){
  const s=skW[w],d=wheelDat[w];
  
  //guadi
  if(d.wet){s.on=false;continue;}//niente sgommate in acqua!
  
  //larghezza strada
  //const off=Math.abs(d.d)>5.4;
  const off=d.off;
  
  const si=off?4:(d.surf<4?0:d.surf-3);   // 0 asfalto, 1 gravel, 2 fango, 3 roccia, 4 offroad
  
  const tgt=skidTarget(w,si);
  //s.k+=(tgt-s.k)*(1-Math.exp(-(tgt>s.k?20:10)*dt));
    s.k+=(tgt-s.k)*(1-Math.exp(-(tgt>s.k?40:10)*dt));   // era 20: attacco più rapido
	
  if(s.k<0.06){s.on=false;continue;}
  if(!s.on){s.on=true;s.has=false;s.px=d.x;s.pz=d.z;continue;}
  const dx=d.x-s.px,dz=d.z-s.pz,len=Math.hypot(dx,dz);
  if(len<0.00010)continue;//sgomma da 10cm
  
  if(len>4){s.on=false;continue;}
  const nx=-dz/len*SK_HW;
  const nz=dx/len*SK_HW;
  const y=d.y+.07;
  const cLx=d.x+nx;
  const cLz=d.z+nz;
  const cRx=d.x-nx;
  const cRz=d.z-nz;
  //if(!s.has){s.lx=s.px+nx;s.lz=s.pz+nz;s.rx=s.px-nx;s.rz=s.pz-nz;s.ly=s.ry=y;s.a=0;s.has=true;}
    if(!s.has){s.lx=s.px+nx;s.lz=s.pz+nz;s.rx=s.px-nx;s.rz=s.pz-nz;s.ly=s.ry=y;s.a=s.k*SK_ALPHA[si]*.6;s.has=true;}   // era s.a=0
	
  const a=s.k*SK_ALPHA[si];
  const c=SK_COL[si];
  const o=skHead*18;
  const oa=skHead*6;
  // tri1: pL,pR,cL  tri2: pR,cR,cL
  const V=[s.lx,s.ly,s.lz, s.rx,s.ry,s.rz, cLx,y,cLz,  s.rx,s.ry,s.rz, cRx,y,cRz, cLx,y,cLz];
  const A=[s.a,s.a,a, s.a,a,a];
  for(let q=0;q<18;q++){skPos[o+q]=V[q];skCol[o+q]=c[q%3];}
  for(let q=0;q<6;q++)skAl[oa+q]=A[q];
  s.lx=cLx;s.lz=cLz;s.ly=y;s.rx=cRx;s.rz=cRz;s.ry=y;s.px=d.x;s.pz=d.z;s.a=a;
  skHead=(skHead+1)%SK_MAX;dirty=true;
 }
 if(dirty){
  skGeo.attributes.position.needsUpdate=true;
  skGeo.attributes.aColor.needsUpdate=true;
  skGeo.attributes.aAlpha.needsUpdate=true;
 }
}

function initAudio(){try{
 AC=new(window.AudioContext||window.webkitAudioContext)();
 E.master=AC.createGain();E.master.gain.value=muted?0:.5;
 const comp=AC.createDynamicsCompressor();E.master.connect(comp);comp.connect(AC.destination);
 E.buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
 const dd=E.buf.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
 const noise=(f,q,type)=>{const s=AC.createBufferSource();s.buffer=E.buf;s.loop=true;
  const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;s.connect(b);s.start();return b;};
 
 // motore: armoniche della frequenza di scoppio -> saturazione -> passa-basso
 E.bus=AC.createGain();
 const ws=AC.createWaveShaper(),cv=new Float32Array(256);
 for(let i=0;i<256;i++)cv[i]=Math.tanh((i/128-1)*3);ws.curve=cv;
 E.lp=AC.createBiquadFilter();E.lp.type='lowpass';E.lp.Q.value=2;
 E.bus.connect(ws);ws.connect(E.lp);E.lp.connect(E.master);
 const mk=(type,g)=>{const o=AC.createOscillator();o.type=type;const og=AC.createGain();og.gain.value=g;o.connect(og);og.connect(E.bus);o.start();return o;};
 E.o1=mk('sawtooth',.5);E.o2=mk('square',.18);E.o3=mk('sine',.5);E.o4=mk('sawtooth',.12);
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=8;lg.gain.value=1.5;lfo.connect(lg);lg.connect(E.o1.frequency);lfo.start(); // irregolarità
 
 // scarico (soffio grave)
 E.exh=noise(500,.8,'lowpass');E.exhG=AC.createGain();E.exhG.gain.value=0;E.exh.connect(E.exhG);E.exhG.connect(E.master);
 
 // turbina: fischio + soffio
 E.tw=AC.createOscillator();E.tw.type='sine';E.twG=AC.createGain();E.twG.gain.value=0;E.tw.connect(E.twG);E.twG.connect(E.master);E.tw.start();
 E.tn=noise(3500,3,'bandpass');E.tnG=AC.createGain();E.tnG.gain.value=0;E.tn.connect(E.tnG);E.tnG.connect(E.master);
 
 // rumore gomme/strada
 ////E.rd=noise(1100,.7,'bandpass');E.rdG=AC.createGain();E.rdG.gain.value=0;E.rd.connect(E.rdG);E.rdG.connect(E.master);
 
  // rombo di rotolamento: solo grave, niente fruscio
 E.rd=noise(220,.7,'lowpass');E.rdG=AC.createGain();E.rdG.gain.value=0;E.rd.connect(E.rdG);E.rdG.connect(E.master);
 
 // stridio gomme (solo asfalto): rumore filtrato (non toni puri) + chatter stick-slip
 E.sqSrc=AC.createBufferSource();E.sqSrc.buffer=E.buf;E.sqSrc.loop=true;E.sqSrc.start();
 E.sqF=AC.createBiquadFilter();E.sqF.type='bandpass';E.sqF.frequency.value=1800;E.sqF.Q.value=11;
 E.sqF2=AC.createBiquadFilter();E.sqF2.type='bandpass';E.sqF2.frequency.value=2650;E.sqF2.Q.value=9; // rapporto non armonico: resta aspro
 E.sqG=AC.createGain();E.sqG.gain.value=0;
 E.sqG2=AC.createGain();E.sqG2.gain.value=.55;
 E.sqSrc.connect(E.sqF);E.sqSrc.connect(E.sqF2);
 E.sqF.connect(E.sqG);E.sqF2.connect(E.sqG2);E.sqG2.connect(E.sqG);E.sqG.connect(E.master);
 // chatter: lo stridio vero "sfarfalla" rapido e irregolare, non è un vibrato dolce
 E.sqCh=AC.createOscillator();E.sqCh.type='square';E.sqCh.frequency.value=31;

 // sterrato: crepitio morbido
 E.gr=noise(1500,.5,'lowpass');E.grG=AC.createGain();E.grG.gain.value=0;E.gr.connect(E.grG);E.grG.connect(E.master);
 
 
 
 
 
 
 E.boost=0;E.popT=0;E.blowT=0;

   });

  }catch(e){AC=null;}

function burst(freq,type,peak,dur,q){
 const s=AC.createBufferSource();s.buffer=E.buf;
 const b=AC.createBiquadFilter();b.type=type;b.frequency.value=freq;b.Q.value=q||1;
 const g=AC.createGain(),t=AC.currentTime;
 g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(b);b.connect(g);g.connect(E.master);s.start(t,Math.random()*1.5,dur+.05);
}

function updAudio(skid,dt){
 if(!AC)return;
 if(!(dt>0))dt=.016;
 if(!isFinite(E.boost))E.boost=0;
 if(!isFinite(E.popT))E.popT=0;
 if(!isFinite(E.blowT))E.blowT=0;
 
 
 const t=AC.currentTime;
 const rn=clamp((car.rpm-.22)/.78,0,1),R=900+rn*6600,th=ctl.gas;
 const tgt=th*clamp((rn-.2)/.4,0,1);
 E.boost=lerp(E.boost,tgt,1-Math.exp(-(tgt>E.boost?2:6)*dt));
 E.blowT-=dt;
 if(E.boost>.5&&th<.1&&E.blowT<=0){
	burst(2500,'bandpass',.35,.45,.8);
	E.blowT=.8;
}
  // pssh
 if(E.sampled){
  const L=E.layers;
  for(let i=0;i<L.length;i++){
   const l=L[i],lo=i?L[i-1].rpm:-1e9,hi=i<L.length-1?L[i+1].rpm:1e9;
   let w=0;
   if(R>=lo&&R<=l.rpm)w=i?(R-lo)/(l.rpm-lo):1;
   else if(R>l.rpm&&R<=hi)w=i<L.length-1?(hi-R)/(hi-l.rpm):1;
   l.g.gain.setTargetAtTime(Math.sin(w*Math.PI/2),t,.03);                          // crossfade a potenza costante
   l.src.playbackRate.setTargetAtTime(clamp(R/l.rpm,.6,1.5),t,.03);                 // intonazione sui giri reali
  }
  E.sbus.gain.setTargetAtTime(.35+.65*th,t,.06);                                    // rilascio: più basso
  E.slp.frequency.setTargetAtTime(2000+th*5000+rn*3000,t,.08);                      // rilascio: più cupo
  E.bus.gain.setTargetAtTime(0,t,.05);E.exhG.gain.setTargetAtTime(0,t,.05);         // spegne il sintetico

function pop(power){
 const t=AC.currentTime;
 // schiocco: rumore passa-banda, medio-alto
 const s=AC.createBufferSource();s.buffer=E.buf;
 const b=AC.createBiquadFilter();b.type='bandpass';b.frequency.value=rnd(900,1800);b.Q.value=.9;
 const g=AC.createGain();
 g.gain.setValueAtTime(1.2*power,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);
 s.connect(b);b.connect(g);g.connect(E.master);s.start(t,Math.random()*1.5,.15);
 // colpo: tono che scende, si sente anche sugli speaker piccoli
 const o=AC.createOscillator();o.type='triangle';
 o.frequency.setValueAtTime(rnd(140,200),t);o.frequency.exponentialRampToValueAtTime(50,t+.12);
 const og=AC.createGain();
 og.gain.setValueAtTime(.9*power,t);og.gain.exponentialRampToValueAtTime(.001,t+.14);
 o.connect(og);og.connect(E.master);o.start(t);o.stop(t+.16);
}

function crash(cf,cl,sp){
  if(sp<4)return;
  const sev=clamp((sp-8)/25,0,1);
  let best=-1;
  let bd=1e9;
  for(let w=0;w<4;w++){
    if(dmg.lost[w])continue;
    const d=Math.hypot(cl-WO[w][0],cf-WO[w][1]);
    if(d<bd){bd=d;best=w;}
  }
  if(best>=0 && bd<1.05 && sev>.42 && Math.random() < (sev-.42)*1.2) loseWheel(best);
  
  // danno per zona: cf = longitudinale (+ muso), cl = laterale (+ sinistra)
  const zw=[clamp(cf/2.1,0,1), clamp(-cf/2.1,0,1), clamp(cl/.95,0,1), clamp(-cl/.95,0,1)];
  const zadd=.12+sev*.5;
  for(let i=0;i<4;i++) dmg.zone[i]=Math.min(1,dmg.zone[i]+zadd*zw[i]);
  
  
  dent(cl,cf,1.4+sev*.9,.52+sev*.45);   // tolta la soglia: ammacca sempre, anche sugli sportelli
}

function useGLB(buffer){
 if(!THREE.GLTFLoader){alert('GLTFLoader non caricato');return;}
 new THREE.GLTFLoader().parse(buffer,'',gltf=>{
  const V=()=>new THREE.Vector3(),box=new THREE.Box3();
  const model=gltf.scene,wrap=new THREE.Group();wrap.add(model);
  box.setFromObject(model);let sz=box.getSize(V());
  if(sz.x>sz.z)model.rotation.y=Math.PI/2;
  model.updateMatrixWorld(true);box.setFromObject(model);sz=box.getSize(V());
  //model.scale.setScalar(4.2/sz.z);
  model.updateMatrixWorld(true);
  box.setFromObject(model);const c=box.getCenter(V());
  model.position.set(model.position.x-c.x,model.position.y-box.min.y,model.position.z-c.z);
  wrap.updateMatrixWorld(true);
  model.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>{if(m.isMeshStandardMaterial){m.metalness=Math.min(m.metalness,.35);m.roughness=Math.max(m.roughness,.4);}});});
  const re=/wheel|ruota|tyre|tire|rim|cerchi|gomma|chrome8_|chrome44_|chrome45_|chrome46_/i,tops=[];
  (function walk(n){if(re.test(n.name)){tops.push(n);return;}n.children.forEach(walk);})(model);
  box.setFromObject(model);sz=box.getSize(V());
  const quad={};
  tops.forEach(n=>{const b=new THREE.Box3().setFromObject(n),cc=b.getCenter(V()),bs=b.getSize(V());
   if(cc.y>sz.y*.45||bs.z>sz.z*.4)return;
   const key=(cc.x>0?0:1)+(cc.z>0?0:2);(quad[key]=quad[key]||[]).push({n,cc});});
  let wheelsOk=false;
  if([0,1,2,3].every(k=>quad[k])){
   const piv=[],spn=[];
   for(let k=0;k<4;k++){
    const arr=quad[k],ctr=V();arr.forEach(o=>ctr.add(o.cc));ctr.multiplyScalar(1/arr.length);
    const st=new THREE.Group(),sp=new THREE.Group();
    st.position.copy(ctr);st.add(sp);wrap.add(st);st.updateMatrixWorld(true);
    arr.forEach(o=>sp.attach(o.n));piv.push(st);spn.push(sp);
   }
   wheelPivots.length=0;wheelMeshes.length=0;piv.forEach(p=>wheelPivots.push(p));spn.forEach(p=>wheelMeshes.push(p));
   wheelsOk=true;
  }
  carG.children.forEach(o=>{if(o!==carG.userData.shadow)o.visible=false;});
  if(flipG)carG.remove(flipG);
  flipG=new THREE.Group();flipG.add(wrap);carG.add(flipG);
  flipBtn.style.display='block';
  console.log('GLB caricato. Ruote animate:',wheelsOk,'| nodi ruota trovati:',tops.map(n=>n.name));
 },err=>alert('GLB non valido: '+(err.message||err)));
}

function stepCamera(dt) {
  const h = cam.hold;

  if (!running) {
    // menu iniziale: giro continuo attorno all'auto, come tenere premuto Q
    cam.yaw -= 0.50 * dt;   //rad/s
    cam.el   = 0.15;        //un po piu alta
    cam.zoom = 1.50;		//un po allontanata
  } else if (camReturn) {
    // rientro fluido alla visuale di default
    const k = 1 - Math.exp(-6 * dt);
    cam.yaw  -= cam.yaw * k;
    cam.el   -= cam.el * k;
    cam.zoom += (1 - cam.zoom) * k;
	
    if (Math.abs(cam.yaw) < .01 && Math.abs(cam.el) < .005 && Math.abs(cam.zoom - 1) < .005) {
      cam.yaw = 0; cam.el = 0; cam.zoom = 1; camReturn = false;
    }
  }

  if (h.zoomIn || cam.zoomDir === -1) cam.zoom = Math.max(.35, cam.zoom * Math.exp(-1.2 * dt));
  if (h.zoomOut || cam.zoomDir === 1) cam.zoom = Math.min(3.5, cam.zoom * Math.exp(1.2 * dt));
  if (h.up || cam.yawDir === 1) cam.el = Math.min(.75, cam.el + .9 * dt);
  if (h.down || cam.yawDir === -1) cam.el = Math.max(-.65, cam.el - .9 * dt);
  if (h.cw || cam.rotDir === -1) cam.yaw -= 1.4 * dt;   // Ruota CW
  if (h.ccw || cam.rotDir === 1) cam.yaw += 1.4 * dt;   // Ruota CCW
}

function pace(){
 ensurePoints(car.idx+80);let i=car.idx+1;const end=i+55;
 for(;i<end;i++)if(Math.abs(P[i].k)>1/150)break;
 if(i>=end)return null;
 const sg=Math.sign(P[i].k);let mk=0;
 for(let j=i;j<i+16;j++){if(Math.sign(P[j].k)!==sg&&Math.abs(P[j].k)>1/200)break;mk=Math.max(mk,Math.abs(P[j].k));}
 return{dist:(i-car.idx)*DS,R:1/mk,left:sg>0,from:car.idx};
}

  const big=i%4===0;
  h+=`<circle class="td" cx="${x}" cy="${y}" r="${big?4:2}" fill="${v>=REDLINE?RED_OFF:Y_OFF}"/>`;
  dots.push({v,red:v>=REDLINE,on:false});
 }
 h+=`<polygon id="tachNeedle" points="-30,-5 82,-1 82,1 -30,5" fill="${Y}" transform="translate(100 100)"/>`
   +`<circle cx="100" cy="100" r="9" fill="#111111"/></svg>`;
 el.innerHTML=h;

 const cs=el.querySelectorAll('.td');
 const needle=$('tachNeedle');
 const speedText=el.querySelector('#tachSpeedText');
 const gearText=el.querySelector('#tachGearText');
 const clockText=el.querySelector('#tachClockText');
 let lastClock='';

 return function(r,kmh,gea,odo){                       // r = car.rpm (0.22..1)
  const rpm=IDLE+clamp((r-.22)/.78,0,1)*(MAXR-IDLE);
  needle.setAttribute('transform',`translate(100 100) rotate(${rpm/MAXR*SWEEP})`);
  for(let i=0;i<dots.length;i++){
   const d=dots[i];
   const on=d.v<=rpm;
   if(on===d.on)continue;
   d.on=on;
   cs[i].setAttribute('fill',on?(d.red?RED:Y):(d.red?RED_OFF:Y_OFF));
  }
  if(speedText) speedText.textContent=odo.toFixed(1).padStart(7,'0');
  if(gearText) gearText.textContent=gea;

  const now=new Date();
  const clk=String((currentHoursDelta+now.getHours())%24).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  if(clockText&&clk!==lastClock){lastClock=clk;clockText.textContent=clk;}
 };
}


/* ============ TACHIMETRO VELOCITÀ - 2° QUADRANTE (SVG) ============ */
function makeTachSpeed(){
 const el=$('spd');
 const Y='currentColor';
 const MAXSPD=CURRENT_CAR_SPEC.maxSpeed;             // scala 0-240 km/h, come un vero tachimetro
 const SWEEP=240;              // gradi totali di scala, stessa impostazione del contagiri
 const START_ANGLE = 220;
 const a = (v) => (START_ANGLE + (v/MAXSPD)*SWEEP) * Math.PI/180;
 const CXY = 100;
 const pt=(v,r)=>[CXY+Math.cos(a(v))*r,CXY+Math.sin(a(v))*r];

 const ARC_R=55;
 const [ax,ay]=pt(0,ARC_R);
 const [bx,by]=pt(MAXSPD,ARC_R);

 //no righe sul tachimetro velocita
 const TICK_IN=54;
 const TICK_OUT=64;
 const tk=v=>{const [x1,y1]=pt(v,TICK_IN),[x2,y2]=pt(v,TICK_OUT);return `M${x1} ${y1}L${x2} ${y2}`;};

 let h=`<svg viewBox="0 0 200 200" width="${IS_MOBILE ? 110 : 110}" height="${IS_MOBILE ? 110 : 110}">`
  +`<circle cx="100" cy="100" r="98" fill="#1b1b1b" stroke="#666" stroke-width="2"/>`
  +`<circle cx="100" cy="100" r="92" fill="none"    stroke="#c8892a" stroke-width="1.5"/>`
  +`<path d="M${ax} ${ay}A${ARC_R} ${ARC_R} 0 1 1 ${bx} ${by}" fill="none" stroke="#c8892a" stroke-width="3"/>`;

 //scritte km/h
 for(let n=0;n<=MAXSPD;n+=20){
  const [x,y]=pt(n,75);
  h+=`<text x="${x}" y="${y}" fill="${Y}" font-size="15" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="monospace">${n}</text>`
  + `<path d="${tk(n)}"    stroke="${Y}" stroke-width="3"/>`;
 }

 //scritte contorno
 h+=`<text x="100" y="70" fill="${Y}" font-size="6" font-weight="700" text-anchor="middle" font-family="sans-serif">VEGLIA</text>`
   +`<text x="100" y="80" fill="${Y}" font-size="5" font-weight="700" text-anchor="middle" font-family="sans-serif">BORLETTI</text>`
   +`<text x="100" y="140" fill="${Y}" font-size="8" font-weight="700" text-anchor="middle" font-family="sans-serif">KM/H</text>`;

 //contachilometri in basso (distanza percorsa)
 //h+=`<rect                   x="54" y="148" width="92" height="22" rx="3" ry="3" fill="#111111" stroke="${Y}" stroke-width="1"/>`;
 //h+=`<text id="tachOdoText"  x="140" y="159" fill="${Y}" font-size="15" font-weight="700" text-anchor="end" dominant-baseline="central" font-family="monospace">0000.0</text>`;

 h+=`<polygon id="spdNeedle" points="-26,-4 72,-1 72,1 -26,4" fill="${Y}" transform="translate(100 100)"/>`
   +`<circle cx="100" cy="100" r="8" fill="#111111"/></svg>`;
 el.innerHTML=h;

 const needle=el.querySelector('#spdNeedle');
 const odoText=el.querySelector('#tachOdoText');

 return function(kmh,odoKm){                        // kmh = velocità, odoKm = distanza percorsa in km
  const ang=START_ANGLE + clamp(kmh,0,MAXSPD)/MAXSPD*SWEEP;
  needle.setAttribute('transform',`translate(100 100) rotate(${ang})`);
  //if(odoText) odoText.textContent=odoKm.toFixed(1).padStart(5,'0')+' ODO';
 };
}



//indicatore danni
const dmgInd=(()=>{
 const el=$('dmg');
 const col=v=>`hsl(${Math.round(120*(1-clamp(v,0,1)))} 85% 50%)`;
 const G='fill="hsl(120 85% 50%)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"';
 const W=(id,x,y)=>`<rect id="${id}" x="${x}" y="${y}" width="11" height="22" rx="3" ${G}/>`;
 const Y='currentColor';

 el.innerHTML=`<svg viewBox="0 0 80 128" width="50" height="85">`
  // sfondo nero
  +`<rect x="0" y="0" width="80" height="128" rx="10" fill="#1b1b1b" stroke="#555" stroke-width="1.5"/>`
  // ruote
  +W('dwFL',3,16)+W('dwFR',66,16)+W('dwRL',3,86)+W('dwRR',66,86)
  // carrozzeria nera
  +`<rect x="14" y="3" width="52" height="122" rx="14" fill="#000"/>`
  // zone: muso, coda, fianco sx, fianco dx
  +`<path id="dzF" d="M16 42V19Q16 5 30 5H50Q64 5 64 19V42Z" ${G}/>`
  +`<path id="dzR" d="M16 106V111Q16 121 26 121H54Q64 121 64 111V106Z" ${G}/>`
  +`<rect id="dzL"  x="16" y="42" width="6" height="64" ${G}/>`
  +`<rect id="dzRt" x="58" y="42" width="6" height="64" ${G}/>`
  // abitacolo nero
  //+`<rect x="22" y="42" width="36" height="52" rx="6" fill="#000" stroke="${Y}" stroke-width="2"/>`
  +`<rect x="22" y="42" width="36" height="64" rx="6" fill="#000" stroke="${Y}" stroke-width="2"/>`
  +`<text id="dPct" x="40" y="75" fill="${Y}" font-size="14" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="monospace">0%</text></svg>`;
  
 const wid=['dwFL','dwFR','dwRL','dwRR'], zid=['dzF','dzR','dzL','dzRt'];
 const E={}; [...wid,...zid,'dPct'].forEach(i=>E[i]=el.querySelector('#'+i));
 let sig='';

 return function(){
  const z=dmg.zone;
  const wv=[0,1,2,3].map(w=>dmg.lost[w]?1:clamp(Math.max(Math.abs(dmg.toe[w]),Math.abs(dmg.camber[w]))/.25,0,1));
  const lost=dmg.lost.filter(Boolean).length;
  const body=.6*Math.max(z[0],z[1],z[2],z[3])+.4*(z[0]+z[1]+z[2]+z[3])/4;
  const pct=Math.min(100,Math.round(body*70+lost*10+(wv[0]+wv[1]+wv[2]+wv[3])/4*20));
  const s=z.join()+'|'+wv.join()+'|'+pct;
  if(s===sig)return;
  sig=s;
  for(let i=0;i<4;i++){
    E[zid[i]].setAttribute('fill',col(z[i]));
    E[wid[i]].setAttribute('fill',col(wv[i]));
    E[wid[i]].setAttribute('opacity',dmg.lost[i]?.35:1);   // ruota persa: rossa e spenta
  }
  E.dPct.textContent=pct+'%';
 };
})();



//minimappa!
const mm=$('minimap');
const mmCtx=mm.getContext('2d');
const MM_RADIUS=600; // metri di raggio visibile: più alto = mappa più dezoomata
const MM_GRID=24; // risoluzione texture altimetrica, ricalcolata di rado
const mmTerrCanvas=document.createElement('canvas');
mmTerrCanvas.width=mmTerrCanvas.height=MM_GRID;
const mmTerrCtx=mmTerrCanvas.getContext('2d');
const mmTerrImg=mmTerrCtx.createImageData(MM_GRID,MM_GRID);
let mmTerrCX=null,mmTerrCZ=null;
const mmTQ={}, mmC3=[0,0,0];

function updateMinimapTerrain(){
 if(mmTerrCX!==null&&Math.hypot(car.x-mmTerrCX,car.z-mmTerrCZ)<MM_RADIUS*.3)return;
 mmTerrCX=car.x;mmTerrCZ=car.z;
 for(let gz=0;gz<MM_GRID;gz++)for(let gx=0;gx<MM_GRID;gx++){
  const wx=mmTerrCX+(gx/(MM_GRID-1)-.5)*2*MM_RADIUS;
  const wz=mmTerrCZ+(gz/(MM_GRID-1)-.5)*2*MM_RADIUS;
  terrain(wx,wz,mmTQ);
  altCol(mmTQ.y,mmC3);
  const row=MM_GRID-1-gz,idx=(row*MM_GRID+gx)*4;
  mmTerrImg.data[idx]=mmC3[0]*255;mmTerrImg.data[idx+1]=mmC3[1]*255;mmTerrImg.data[idx+2]=mmC3[2]*255;mmTerrImg.data[idx+3]=255;
 }
 mmTerrCtx.putImageData(mmTerrImg,0,0);
}


function drawMinimap(){
 const W=mm.width,H=mm.height,scale=Math.min(W,H)/(MM_RADIUS*2);
 mmCtx.clearRect(0,0,W,H);
 
 //fix mappa specchiata
 mmCtx.save();
 mmCtx.translate(W,0);
 mmCtx.scale(-1,1);
 
 updateMinimapTerrain();
 const span=MM_RADIUS*2*scale;
 const tdx=W/2+(mmTerrCX-MM_RADIUS-car.x)*scale;
 const tdy=H/2-(mmTerrCZ+MM_RADIUS-car.z)*scale;
 mmCtx.imageSmoothingEnabled=false;
 mmCtx.drawImage(mmTerrCanvas,0,0,MM_GRID,MM_GRID,tdx,tdy,span,span);
 
 // griglia ogni 100m
 const GRID=100;
 const halfW=W/2/scale,halfH=H/2/scale;
 const xStart=Math.floor((car.x-halfW)/GRID)*GRID;
 const zStart=Math.floor((car.z-halfH)/GRID)*GRID;
 mmCtx.strokeStyle='rgba(0,0,0,.5)';mmCtx.lineWidth=1;mmCtx.beginPath();
 for(let x=xStart;x<=car.x+halfW;x+=GRID){
  const px=W/2+(x-car.x)*scale;
  mmCtx.moveTo(px,0);mmCtx.lineTo(px,H);
 }
 for(let z=zStart;z<=car.z+halfH;z+=GRID){
  const py=H/2-(z-car.z)*scale;
  mmCtx.moveTo(0,py);mmCtx.lineTo(W,py);
 }
 mmCtx.stroke();

 // strada
 const back=Math.min(car.idx,Math.round(MM_RADIUS/DS));
 const fwd=Math.round(MM_RADIUS/DS);
 const i0=car.idx-back,i1=Math.min(P.length-1,car.idx+fwd);
 ensurePoints(i1);
 mmCtx.strokeStyle='#ffdd55';mmCtx.lineWidth=2;mmCtx.beginPath();
 for(let i=i0;i<=i1;i++){
  const p=P[i],px=W/2+(p.x-car.x)*scale,py=H/2-(p.z-car.z)*scale;
  i===i0?mmCtx.moveTo(px,py):mmCtx.lineTo(px,py);
 }
 mmCtx.stroke();
 
 // guadi: calcolati da fordDef (non dai chunk), così si vedono su tutto il raggio della mappa
 {
  const sCar=P[car.idx].s, s0=P[0].s;
  const k0=Math.floor((sCar-MM_RADIUS)/FORD_ZONE), k1=Math.floor((sCar+MM_RADIUS)/FORD_ZONE);
  mmCtx.strokeStyle='rgba(70,170,255,.95)';
  mmCtx.lineCap='butt';
  for(let k=k0;k<=k1;k++){
   const def=fordDef(k); if(!def)continue;
   const jf=Math.floor((def.s-s0)/DS);
   if(jf<1||jf>i1)continue;
   if(!fordIsStraight(jf,def.len))continue;           // stessa regola del mondo 3D
   const p=P[jf], lx=Math.cos(p.h), lz=-Math.sin(p.h);
   const hw=Math.min(def.wid,60)/2;                   // l'acqua vera finisce dove il rilievo sale (~±30 m)
   const cx=W/2+(p.x-car.x)*scale, cy=H/2-(p.z-car.z)*scale;
   mmCtx.lineWidth=Math.max(3,def.len*scale);
   mmCtx.beginPath();
   mmCtx.moveTo(cx-lx*hw*scale, cy+lz*hw*scale);
   mmCtx.lineTo(cx+lx*hw*scale, cy-lz*hw*scale);
   mmCtx.stroke();
  }
 }

 // marcatore auto
 mmCtx.save();mmCtx.translate(W/2,H/2);mmCtx.rotate(car.th);
 mmCtx.fillStyle='#ff3333';mmCtx.beginPath();
 mmCtx.moveTo(0,-7);mmCtx.lineTo(5,6);mmCtx.lineTo(-5,6);mmCtx.closePath();mmCtx.fill();
 mmCtx.restore();
 
 mmCtx.restore();//restora lo specchiato
}


/* ============ AVVIO / LOOP ============ */
function startGame(){
 if (running) return;
 running = true;
 cam.yaw = angDiff(0, cam.yaw);
 camReturn = true;
 $('start').style.display='none';
 if (!AC) initAudio();                     // una sola volta
 if (!sfxBase.tree) sfxPreload();          // idem
 musicStart();
 if (AC && AC.state === 'suspended') AC.resume();
}

$('start').addEventListener('pointerdown',e=>{e.preventDefault();startGame();});
$('resetBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();resetCar();});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

ensurePoints((AHEAD+3)*CH);
car.idx=PRE;car.x=P[PRE].x;car.z=P[PRE].z;car.th=P[PRE].h;car.camYaw=car.th;


for(let c=0;c<=AHEAD;c++)chunks.set(c,buildChunk(c));


// --- AGGIUNTA PER STABILIZZARE L'AUTO ALL'AVVIO ---
car.yS = P[PRE].y;
carG.position.set(car.x, car.yS, car.z);
carG.rotation.set(0, car.th, 0);
carG.updateMatrixWorld(true);
if (model) model.updateMatrixWorld(true);
// --------------------------------------------------


updateWorld(.016);

let last=performance.now();
let acc=0;
let gt=0;//erba


function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running){stepControls(dt);acc+=dt;while(acc>=H){physicsWrapper(H);acc-=H;}}
 stepCamera(dt);
 
 gt+=dt; 
 grassU.uTime.value=gt;
 
 //guadi
 fordTex.offset.set(gt*.05,gt*.02);//acqua scorre x veloce, y lento
 
 sky.rotation.y+=dt*0.003; // nuvole che scorrono lentissime
 
 updateWorld(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();    
</script>
