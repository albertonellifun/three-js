<script>
(()=>{
'use strict';
const DS=3;
const CH=12;
const HALF=5;
const AHEAD=8;   // 8*12*3 ≈ 290-320 m, sempre dentro i tile (TR=3), era 15
const RATE=0.004;
const H=1/120;
const PRE=20;// punti di strada prima della partenza (vedi punto 2)
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=x=>x-Math.floor(x);
const angDiff=(a,b)=>{
		let d=b-a;
		while(d>Math.PI)d-=2*Math.PI;
		while(d<-Math.PI)d+=2*Math.PI;
		return d;
};
const $=id=>document.getElementById(id);

const PINE_TRUNK_GEO = 4;//tronco è un cilindro quadrato
const PINE_LEAVES_GEO = 6;//le foglie sono coni esagonali :)
let headlightsOn = false;//luci accese anche di giorno, e prudenza... sempre!
let shadowsOn=true;

//danneggiamento!
const dmg={toe:[0,0,0,0],camber:[0,0,0,0],lost:[false,false,false,false],pull:0};
function repairCar(){ 
  spawnCar(); 
  Object.assign(dmg,{toe:[0,0,0,0],camber:[0,0,0,0],lost:[false,false,false,false],pull:0}); 
}

const _v=new THREE.Vector3(), _p=new THREE.Vector3();

function dent(lx,lz,R,depth){
  _p.set(lx,.6,lz);
  const push = lz>=0 ? -1 : 1;          // urto davanti: spinge indietro, urto dietro: spinge avanti
  model.updateMatrixWorld(true);
  let moved=0;
  model.traverse(o=>{
	if(!o.isMesh||o.userData.noDent) return;
	let isWheel = false;
	if (o.parent && (o.parent.name === 'steer' || o.parent.name === 'spin')) isWheel=true;
    
	if(!o.userData.own){o.geometry=o.geometry.clone();o.userData.own=true;}
    
	const pos=o.geometry.attributes.position;
	const inv=o.matrixWorld.clone().invert();
    
	const damageFactor = isWheel ? 0.25 : 1.0;//ruote assorbono la botta di solito
	
	for(let i=0;i<pos.count;i++){
      _v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld);
      model.worldToLocal(_v);
      const d=_v.distanceTo(_p);
      if(d>R)continue;
      
	  const f=(1-d/R)**2*depth*(.6+Math.random()*.4) * damageFactor;//random effetto increspatura violenta!
	  
      _v.z+=push*f*.6; 
	  _v.y-=f;
      model.localToWorld(_v); _v.applyMatrix4(inv);
      pos.setXYZ(i,_v.x,_v.y,_v.z);
      moved++;
    }
    pos.needsUpdate=true; o.geometry.computeVertexNormals();
  });
  console.log('dent: vertici spostati',moved);
}


//erba on/off
let grassOn=true;
const grassBtn=$('grassBtn');
function toggleGrass(){
  grassOn=!grassOn;
  grassBtn.classList.toggle('toggled-red',grassOn);
  for(const t of tiles.values())
    t.objs.forEach(o=>{ if(o.userData.grass)o.visible=grassOn; });
}

// audio on/off

const shadowBtn=$('shadowBtn');
function toggleShadows(){

shadowBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();toggleShadows();});



const lightsBtn = $('lightsBtn');//fari
const hornBtn = $('hornBtn');//clackson
const colorsBtn = $('colorsBtn');//colore

function toggleLights() {
  headlightsOn = !headlightsOn;

hornBtn.addEventListener('pointerdown', e => {

function hornBtnPlay() {
  if (muted) return;
  // Crea un nuovo elemento audio per il clacson
  const hornAudio = new Audio('./evo-engine-horn.mp3');
  hornAudio.volume = 0.8; // Regola il volume se necessario (da 0.0 a 1.0)

  // Effetto visivo sul pulsante (già presente)

}

/* ============ RENDERER / SCENA ============ */
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled = true;//prova ombre
renderer.shadowMap.type = THREE.PCFSoftShadowMap//THREE.BasicShadowMap;//prova ombre




document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
/////scene.fog=new THREE.Fog(0xcadcea,140,470);
scene.fog=new THREE.Fog(0xc4dcf2,140,470);

/*
{
 const c=document.createElement('canvas');
 c.width=2;
 c.height=256;
 const g=c.getContext('2d');
 const gr=g.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#4a82c2');
 gr.addColorStop(.3,'#7fa9d3');
 gr.addColorStop(.48,'#cadcea');
 gr.addColorStop(1,'#cadcea');
 g.fillStyle=gr;
 g.fillRect(0,0,2,256);
 scene.background=new THREE.CanvasTexture(c);
}
*/

// ===== CIELO: cupola con gradiente + nuvole =====
const sky=(()=>{
 const CLOUDS_NUMBER = 15;
 const CLOUDS_SIZE = 0.5;
 const W=2048;
 const Hh=1024;
 const c=document.createElement('canvas'); c.width=W; c.height=Hh;
 const g=c.getContext('2d');

 // gradiente: zenit (alto) -> orizzonte (metà canvas) -> sotto orizzonte
 const gr=g.createLinearGradient(0,0,0,Hh);
 gr.addColorStop(0,   '#0f55c4');
 gr.addColorStop(.25, '#2b83e6');
 gr.addColorStop(.42, '#6fb4f2');
 gr.addColorStop(.5,  '#c4dcf2');
 gr.addColorStop(1,   '#c4dcf2');
 g.fillStyle=gr; g.fillRect(0,0,W,Hh);

 // nuvole: gruppi di "sbuffi" morbidi, schiacciati in orizzontale
 const puff=(x,y,r,a)=>{
  g.save(); g.translate(x,y); g.scale(2.3,1);
  const p=g.createRadialGradient(0,-r*.2,r*.1,0,0,r);
  p.addColorStop(0,`rgba(255,255,255,${a})`);
  p.addColorStop(.6,`rgba(250,252,255,${a*.55})`);
  p.addColorStop(1,'rgba(240,246,255,0)');
  g.fillStyle=p; g.beginPath(); g.arc(0,0,r,0,6.2832); g.fill();
  g.restore();
 };
 for(let n=0;n<CLOUDS_NUMBER;n++) {
  const cx=Math.random()*W;
  const cy=Hh*(.30+Math.random()*.17);
  const scale= CLOUDS_SIZE + Math.random()* CLOUDS_SIZE;
  const parts=[];
  
  for(let k=0;k<9;k++) {
    parts.push([rnd(-90,90)*scale, rnd(-14,14)*scale, rnd(22,50)*scale, rnd(.25, CLOUDS_SIZE)]);
  }
  for(const off of [-W,0,W]) {
    // wrap orizzontale: niente giunzione
    for(const p of parts) puff(cx+off+p[0],cy+p[1],p[2],p[3]);
  }
 }

 const tex=new THREE.CanvasTexture(c);
 tex.anisotropy=4;
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(900,40,20),
  new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,fog:false,depthWrite:false})
 );
 m.renderOrder=-1;
 m.frustumCulled=false;
 scene.add(m);
 return m;
})();

/* ============ TEXTURE STRADA ============ */
function mkTex(draw,w=256,h=512){
	const c=document.createElement('canvas');
	c.width=w;
	c.height=h;

/* ===== ANTI-INCROCIO ===== */
//MIN_GAP: se vuoi più spazio tra i tornanti, portalo a 55-60. Valori troppo alti rendono più frequenti i rettilinei di fallback.
//ARC_SKIP: deve restare maggiore della lunghezza di un tornante (circa 110-140 m), altrimenti scarta i tornanti stessi.
//GEMINI FIX
const MIN_GAP=80;// distanza minima tra tratti non adiacenti (60m)
const MIN_GAP2=MIN_GAP*MIN_GAP;   
const ARC_SKIP=250;// ignora i punti più vicini di 250 m lungo la strada

function nearRoad(x,z,s){
 const cx=Math.floor(x/GRID);
 const cz=Math.floor(z/GRID);
 for(let a=-1;a<=1;a++){
 for(let b=-1;b<=1;b++){
  const arr=grid.get(gkey(cx+a,cz+b));
  if(!arr)continue;
  for(let n=0;n<arr.length;n++){
   const p=P[arr[n]];
   if(s-p.s<ARC_SKIP)continue;
   const dx=p.x-x;
   const dz=p.z-z;
   if(dx*dx+dz*dz<MIN_GAP2)return true;
  }
 }
 }
 return false;
}

// simula i segmenti appena messi in coda con la stessa cinematica di genPoint
function segClear(segs){
 let h=gen.h;
 let k=gen.k;
 let x=gen.x;
 let z=gen.z;
 let n=0;
 const rr=RATE*DS;
 for(const sg of segs){
  let left=sg.len;
  while(left>0){
   const dk=sg.k-k;
   k+=Math.abs(dk)<rr?dk:Math.sign(dk)*rr;
   left-=DS;
   h+=k*DS;
   x+=Math.sin(h)*DS;
   z+=Math.cos(h)*DS;
   if(nearRoad(x,z,gen.s+(++n)*DS))return false;
  }
 }
 return true;
}

  else console.log('scartato '+t);
  queue.length=start;
  planH=planBak;             // scarta e riprova con un'altra curva
 }
 queue.push({k:0,len:60}); // fallback: rettilineo
}

const IS_MOBILE = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const GRASS_N = IS_MOBILE ? 3000 : 30000; // tentativi per tile
const GRASS_WIDTH  = 0.05;                // semi-larghezza alla base del filo
const GRASS_NUMBER = IS_MOBILE ? 3 : 5;   // fili per ciuffo
const GRASS_HEIGHT = 0.5;   // altezza del filo
const GRASS_SPREAD = 0.2;   // raggio di dispersione dei fili alla base
const GRASS_LEAN   = 0.1;   // inclinazione della punta verso l'esterno

const grassGeo = (() => {
  const p = [];
  const step = (Math.PI * 2) / GRASS_NUMBER;
  for (let i = 0; i < GRASS_NUMBER; i++) {
    const a = i * step, c = Math.cos(a), s = Math.sin(a);
    const ox = s * GRASS_SPREAD, oz = c * GRASS_SPREAD;
    p.push(
      ox - GRASS_WIDTH * c, 0,            oz + GRASS_WIDTH * s,
      ox + GRASS_WIDTH * c, 0,            oz - GRASS_WIDTH * s,
      ox + s * GRASS_LEAN,  GRASS_HEIGHT, oz + c * GRASS_LEAN
    );
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  return g;
})();

function addGrass(tile,R){
  const {hs,ads,x0,z0}=tile, M=N+2, pts=[];
  const smp=(arr,x,z)=>{
    const fx=clamp((x-x0)/CS,0,N-1.001);
	const fz=clamp((z-z0)/CS,0,N-1.001);
    const a=Math.floor(fx);
	const b=Math.floor(fz);
	const u=fx-a;
	const v=fz-b;
	const k=(a+1)*M+b+1;
    return lerp(lerp(arr[k],arr[k+1],v),lerp(arr[k+M],arr[k+M+1],v),u);
  };
  const DIRADAMENTO_MIN = 45;
  const DIRADAMENTO_MAX = 78;
  
  for(let k=0;k<GRASS_N;k++){
    const x=x0+R(0,TILE);
    const z=z0+R(0,TILE);
    if(smp(ads,x,z)<5.5)continue;   // più vicino alla strada
    const y=smp(hs,x,z);
	//if(y>52)continue;		  		// no erba oltre 52m di altitudine
    const keep=1-sm(y,DIRADAMENTO_MIN,DIRADAMENTO_MAX);//diradamento 25-58
    if(R(0,1)>keep)continue;
	if(vnoise(x*.05,z*.05)<.12)continue; // chiazze rade invece di un terzo vuoto
	//pts.push([x,y,z,R(.6,1.3)]);
    pts.push([x,y,z,R(.6,1.3)*(1-.4*sm(y,DIRADAMENTO_MIN,DIRADAMENTO_MAX))]);//erba meno alta man mano che aumenta altitudine
  }

  if(!pts.length)return;
  const im=new THREE.InstancedMesh(grassGeo,grassMat,pts.length);
  pts.forEach((t,i)=>{
    dummy.position.set(t[0],t[1]+0.02,t[2]);//-0.05
    dummy.rotation.set(0,R(0,6.28),0);
    dummy.scale.set(1,t[3],1);
    dummy.updateMatrix();
    im.setMatrixAt(i,dummy.matrix);
  });
  im.instanceMatrix.needsUpdate=true;
  im.frustumCulled=false;
  im.userData.grass=true;
  im.visible=grassOn;
  
  scene.add(im);
  tile.objs.push(im);   // disposeTile lo smaltisce già
}

   const p=P[i0+j];
   const lx=Math.cos(p.h);
   const lz=-Math.sin(p.h);
   const y=p.y+.06;
   rp.set([p.x+lx*HALF,y,p.z+lz*HALF,p.x-lx*HALF,y,p.z-lz*HALF],j*6);
   ru.set([0,p.s/12,1,p.s/12],j*4);
   if(j<n-1){
     const a=j*2;
	 ri.push(a,a+1,a+2,a+1,a+3,a+2);
   }
 }
 const rg=new THREE.BufferGeometry();
 rg.setAttribute('position',new THREE.BufferAttribute(rp,3));
 rg.setAttribute('uv',new THREE.BufferAttribute(ru,2));

const TQ={y:0,d:0,ad:0,i:0,t:0,surf:0};
const sm=(x,a,b)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hash2(i,j){let h=(Math.imul(i,374761393)+Math.imul(j,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,z){const i=Math.floor(x),j=Math.floor(z),fx=x-i,fz=z-j,u=fx*fx*(3-2*fx),v=fz*fz*(3-2*fz);
 return lerp(lerp(hash2(i,j),hash2(i+1,j),u),lerp(hash2(i,j+1),hash2(i+1,j+1),u),v);}
const fbm=(x,z)=>vnoise(x,z)*.55+vnoise(x*2.1+7.3,z*2.1-3.1)*.3+vnoise(x*4.3-11,z*4.3+5)*.15;
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// quota del terreno + strada più vicina in (x,z). o.d = distanza laterale con segno (sinistra +), o.ad = distanza assoluta
function terrain(x,z,o){
 const cx=Math.floor(x/GRID),cz=Math.floor(z/GRID);
 let best=1e18;
 let bi=-1;
 let bt=0;
 let ws=0;
 let ys=0;
 for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++){
  const arr=grid.get(gkey(cx+a,cz+b));if(!arr)continue;
  for(let n=0;n<arr.length;n++){
   const i=arr[n],p=P[i],q=P[i+1];if(!q)continue;
   const dx=q.x-p.x,dz=q.z-p.z;let t=((x-p.x)*dx+(z-p.z)*dz)/(dx*dx+dz*dz);t=t<0?0:t>1?1:t;
   const ex=p.x+dx*t-x,ez=p.z+dz*t-z,d2=ex*ex+ez*ez;
   if(d2<best){best=d2;bi=i;bt=t;}
   if(d2<32400){const f=1-Math.sqrt(d2)/180,w=f*f/((d2+4)*(d2+4));ws+=w;ys+=w*(p.y+(q.y-p.y)*t);}
  }}
 
 let dmin=1e4;
 let ynear=24;
 let idw=24;
 let d=1e9;
 let surf=0;
 let sl=0;
 if(bi>=0){
   const p=P[bi];
   const q=P[bi+1];
   const dx=q.x-p.x;
   const dz=q.z-p.z;
   const L=Math.hypot(dx,dz);
   dmin=Math.sqrt(best);
   ynear=p.y+(q.y-p.y)*bt;
   idw=ws>1e-30?ys/ws:24;
   d=(x-(p.x+dx*bt))*(dz/L)+(z-(p.z+dz*bt))*(-dx/L);
   surf=p.surf;
   sl=Math.abs(q.y-p.y)/DS;
 }
 const dE=Math.min(dmin,185);//////185);                      // oltre la finestra di ricerca il terreno non cambia più
 /////let yRef=lerp(ynear,idw,sm(dE,6,12));
 /////yRef=lerp(yRef,24,sm(dE,60,160));
 //GEMINI FIX
 let yRef = lerp(ynear, idw, sm(dE, 6, 12));//Ridotto per evitare incroci
 yRef = lerp(yRef, 24, sm(dE, 60, 160));//Ridotto per evitare incroci
 
 const t=Math.max(0,dE-5);let hn=Math.pow(t,1.7)*.0105*(.45+vnoise(x*.012,z*.012)*1.1);hn/=1+hn/20;
 const dune=(vnoise(x*.035+50,z*.035)-.5)*3*Math.min(1,t/20);
 const mt=95*Math.pow(fbm(x*.0016,z*.0016),1.6)*sm(dE,40,170);
 o.y=yRef+hn+dune+mt+.06*(1-sm(dE,5,7));
 o.i=bi;o.t=bt;o.d=d;o.ad=dmin;o.surf=surf;o.sl=sl;return o;
 
 
}

function buildTile(tx,tz){
 const x0=tx*TILE;
 const z0=tz*TILE,M=N+2;
 const hs=new Float32Array(M*M);
 const hy=new Float32Array(M*M);
 const ads=new Float32Array(M*M);
 const sf=new Uint8Array(M*M);
 for(let a=-1;a<=N;a++)for(let b=-1;b<=N;b++){terrain(x0+a*CS,z0+b*CS,TQ);const k=(a+1)*M+b+1;
  ///xxx
  ////////////////////hs[k]=TQ.y-.4*(1-sm(TQ.ad,5.2,8.5));
  //hs[k]=TQ.y-(.4+6*TQ.sl)*(1-sm(TQ.ad,5.2,8.5));//gradino bordo strada, non mi piace
  hs[k]=TQ.y-(0.08+1.5*TQ.sl)*(1-sm(TQ.ad,5.2,8.5));//no gradino?
  
  
  
  hy[k]=TQ.y;ads[k]=TQ.ad;sf[k]=TQ.surf;}
  
  
 const pos=new Float32Array(N*N*3),nor=new Float32Array(N*N*3),col=new Float32Array(N*N*3),ind=[];
 for(let a=0;a<N;a++)for(let b=0;b<N;b++){
  const k=(a+1)*M+b+1,id=(a*N+b)*3,x=x0+a*CS,z=z0+b*CS;
  pos[id]=x;pos[id+1]=hs[k];pos[id+2]=z;
  const nx=(hs[k-M]-hs[k+M])/(2*CS),nz=(hs[k-1]-hs[k+1])/(2*CS),ny=1/Math.hypot(nx,1,nz);
  nor[id]=nx*ny;nor[id+1]=ny;nor[id+2]=nz*ny;
  altCol(hy[k],c3);const ad=ads[k];
  if(ad<9){const t=clamp((9-ad)/4,0,1)*.8,vc=sf[k]===1?[.58,.48,.34]:[.38,.40,.30];for(let q=0;q<3;q++)c3[q]=lerp(c3[q],vc[q],t);}
  if(ny<.8){const t=clamp((.8-ny)/.25,0,1)*.7;c3[0]=lerp(c3[0],.45,t);c3[1]=lerp(c3[1],.42,t);c3[2]=lerp(c3[2],.38,t);}
  const jt=.92+hash2(Math.round(x/CS),Math.round(z/CS))*.16;
  col[id]=c3[0]*jt;col[id+1]=c3[1]*jt;col[id+2]=c3[2]*jt;
  if(a<N-1&&b<N-1){const i00=a*N+b;ind.push(i00,i00+1,i00+N,i00+N,i00+1,i00+N+1);}
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setIndex(ind);
 const mesh=new THREE.Mesh(g,terrMat);
 mesh.receiveShadow=true;//prova ombra
 scene.add(mesh);
 ////return{tx,tz,x0,z0,mesh,detail:false,obs:[],objs:[]};
 /////return{tx,tz,x0,z0,mesh,detail:false,obs:[],objs:[],hs,ads};//anche hs e ads per l'erba
 return{tx,tz,x0,z0,mesh,detail:false,obs:[],objs:[],hs,ads,born:performance.now(),dirty:false};//LA FIX?
}
function buildDetail(tile){
 tile.detail=true;
 const rng=mulberry((tile.tx*73856093)^(tile.tz*19349663));
 const R=(a,b)=>a+rng()*(b-a);
 const trees=[];
 const rocks=[];
 //densità alberi (100 tentativi)
 for(let k=0;k<100;k++){
	const x=tile.x0+rng()*TILE;
	const z=tile.z0+rng()*TILE;
	terrain(x,z,TQ);
	if(TQ.ad<9||TQ.y>58)continue;
	const dens=clamp((vnoise(x*.008+100,z*.008)-.3)*3,0,1);
	if(rng()<.1+dens*.9)trees.push([x,TQ.y-.2,z,R(.8,1.7)]);
 }
 //densita rocce (45 tentativi)
 for(let k=0;k<45;k++){
	const x=tile.x0+rng()*TILE;
	const z=tile.z0+rng()*TILE;
	terrain(x,z,TQ);
	if(TQ.ad<6.5)continue;
	if(rng()<.35)rocks.push([x,TQ.y,z,R(.6,1.9)]);
 }
 const inst=(geo,mat,arr,fn)=>{
	if(!arr.length)return;
	const im=new THREE.InstancedMesh(geo,mat,arr.length);
	arr.forEach((t,i)=>fn(t,i,im));
	im.instanceMatrix.needsUpdate=true;
	if(im.instanceColor)im.instanceColor.needsUpdate=true;
	im.frustumCulled=false;
	im.castShadow=true;//prova ombra
	scene.add(im);
	tile.objs.push(im);
  };
 inst(pineGeo,pineMat,trees,(t,i,im)=>{
	dummy.position.set(t[0],t[1],t[2]);
	dummy.rotation.set(0,rnd(0,6.28),0);
	dummy.scale.set(t[3]*rnd(.85,1.15),t[3],t[3]*rnd(.85,1.15));
	dummy.updateMatrix();
	im.setMatrixAt(i,dummy.matrix);
	const b=rnd(.7,1.2);
	im.setColorAt(i,tmpCol.setRGB(b,b*rnd(.95,1.1),b));
    tile.obs.push({type:'tree',x:t[0],y:t[1],z:t[2],r:.35*t[3]+.1,col: [0.10, 0.28, 0.13],im,i});
 });
 inst(rockGeo,rockMat,rocks,(t,i,im)=>{
	const sx=t[3]*rnd(.8,1.4);
	const sz=t[3]*rnd(.8,1.3);
	dummy.position.set(t[0],t[1]+t[3]*.2,t[2]);
	dummy.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));
	dummy.scale.set(sx,t[3]*rnd(.6,1),sz);
	dummy.updateMatrix();
	im.setMatrixAt(i,dummy.matrix);
	const g=rnd(.4,.62);
	im.setColorAt(i,tmpCol.setRGB(g,g*.97,g*.92));
    tile.obs.push({type:'rock',x:t[0],y:t[1]+.3,z:t[2],r:Math.max(sx,sz)*.85,col:[g,g*.97,g*.92],im,i});
 });
 addGrass(tile,R);//erba
}

    Object.assign(sh.uniforms,dirtU);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nuniform mat4 uInv;\nvarying vec3 vDP;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\nvDP=(uInv*modelMatrix*vec4(position,1.)).xyz;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',`#include <common>
uniform float uDirt; uniform vec3 uDirtCol; varying vec3 vDP;
float dh(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
float dn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(dh(i),dh(i+vec3(1,0,0)),f.x),mix(dh(i+vec3(0,1,0)),dh(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(dh(i+vec3(0,0,1)),dh(i+vec3(1,0,1)),f.x),mix(dh(i+vec3(0,1,1)),dh(i+vec3(1,1,1)),f.x),f.y),f.z);}`)
      .replace('#include <color_fragment>',`#include <color_fragment>
{
  float n=dn(vDP*7.)*.6+dn(vDP*19.)*.4;
  float low=1.-smoothstep(.15,1.0,vDP.y+(n-.5)*.5);
  float rear=smoothstep(-.3,-2.1,vDP.z);
  float base=low*(.55+.75*rear);
  float mask=smoothstep(.25,.6,base*uDirt*1.6+(n-.5)*.35*uDirt)*clamp(uDirt*1.5,0.,1.);
  diffuseColor.rgb=mix(diffuseColor.rgb,uDirtCol*.8,mask);
}`);
    if (prevCompile) prevCompile(sh);   // livrea: si inserisce subito dopo color_fragment, prima dello sporco
  };
  m.customProgramCacheKey=()=>(prevKey?prevKey.call(m):'')+'dirt';
  m.needsUpdate=true;
}




function collectDirtMats(){
  dirtyMats=[];
  const seen=new Set();
  model.traverse(o=>{
    if(!o.isMesh)return;
    [].concat(o.material).forEach(m=>{
      if(seen.has(m)||!m.color||m.transparent||m.opacity<1||m.isMeshBasicMaterial)return;
      seen.add(m);
      patchDirtMat(m);
      dirtyMats.push({m,c0:m.color.clone(),
        met:m.metalness, rou:m.roughness, cc:m.clearcoat,
        env:m.envMapIntensity, shi:m.shininess,
        spec:m.specular?m.specular.clone():null});
    });
  });
}

function applyDirt(){
  dirtU.uDirt.value=dirt;
  const k=Math.min(dirt,1)*MAX_DIRT_COLOR;     // intensità del colore
  const mk=Math.min(dirt*MAX_DIRT_OPACITY,1);         // l'opacità arriva prima del colore
  for(const d of dirtyMats){
    const m=d.m;
    m.color.copy(d.c0).lerp(dirtCol,k);
    if(d.met!==undefined) m.metalness=lerp(d.met,0,mk);
    if(d.rou!==undefined) m.roughness=lerp(d.rou,1,mk);
    if(d.cc!==undefined)  m.clearcoat=lerp(d.cc,0,mk);
    if(d.env!==undefined) m.envMapIntensity=lerp(d.env,0,mk);
    if(d.shi!==undefined) m.shininess=lerp(d.shi,2,mk);          // Phong/Lambert-like
    if(d.spec) m.specular.copy(d.spec).multiplyScalar(1-mk);
  }  
}

//numeri sulle fiancate!
function makeNumberTexture(num) {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 256;
  const ctx = c.getContext('2d');

  // Sfondo quadrato bianco (con angoli arrotondati per un look da gara pulito)
  const margin = 12;
  const size = 256 - margin * 2;
  const radius = 24; // raggio smussatura angoli

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.roundRect(margin, margin, size, size, [0, 0, radius, radius] );
  ctx.fill();

  // Bordo nero esterno del quadrato
  ctx.strokeStyle = '#111111';
  ctx.lineWidth = 8;
  ctx.stroke();
  
  // Bordo superiore con il colore azzurro
  ctx.strokeStyle = '#0088ee';
  ctx.lineWidth = 40;
  ctx.beginPath();
  ctx.moveTo(margin, margin + 20);
  ctx.lineTo(margin + size, margin + 20);
  ctx.stroke();

  // Testo del numero nero al centro
  ctx.fillStyle = '#111111';
  ctx.font = '900 200px monospace'; // Stile molto più squadrato e tecnico
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(num), 128, 170);

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

 let Fyr=0;
 if(u>.5){
  const den=Math.max(u,2.5);
  const af=Math.atan2(v+a*r,den)-delta;
  const ar=Math.atan2(v-b*r,den);
  Fyf=-LmF*Math.tanh(CAf*car.stF*af/LmF);
  Fyr=-LmR*Math.tanh(CAr*car.stR*ar/LmR);
 }
 const cd=Math.cos(delta);
 const sd=Math.sin(delta);
 let Fx=Fxf*cd-Fyf*sd+Fxr;
 const Fy=Fyf*cd+Fxf*sd+Fyr;
 const Mz=a*(Fyf*cd+Fxf*sd)-b*Fyr;
 Fx-=(car.rr*m*g+.8*u*Math.abs(u))*Math.tanh(u*2)+Feb;
 const ax=Fx/m+v*r-g*Math.sin(car.pitchT);
 const ay=Fy/m-u*r-g*Math.sin(car.rollT);
 let nu=u+ax*dt;
 let nv=v+ay*dt;
 let nr=r+(Mz/I-.5*r)*dt;
 if(u>0&&nu<0&&Fd===0)nu=0;
 
 //if(car.brkLatch&&ctl.brake>0&&ctl.gas<.05&&Math.abs(nu)<.25)nu=0;   // da fermo resta fermo
 if((ctl.hb>.5 || (car.brkLatch&&ctl.brake>0))&&ctl.gas<.05&&Math.abs(nu)<.3)nu=0;//anche il freno a mano deve bloccare!
 
 const wk=u<=1?1:clamp(1-(u-1)/3,0,1);                                // a bassa velocità: cinematica
 if(wk>0){
  const k=1-Math.exp(-wk*20*dt);
  const rk=nu*Math.tan(delta)/L;
  nr+=(rk-nr)*k;
  nv+=(0-nv)*k;
 }
 const f=1-Math.exp(-10*dt);
 car.axF+=(Fx/m-car.axF)*f;
 car.ayF+=(Fy/m-car.ayF)*f;
 car.u=nu;
 car.v=nv;
 car.r=nr;
 car.th+=nr*dt;
 car.x+=(nu*Math.sin(car.th)+nv*Math.cos(car.th))*dt;
 car.z+=(nu*Math.cos(car.th)-nv*Math.sin(car.th))*dt;
}
function stepControls(dt){
 const tgt=clamp(touch.steer+(keys.left?1:0)-(keys.right?1:0),-1,1);
 const same=Math.sign(tgt)===Math.sign(car.steer)&&Math.abs(tgt)>=Math.abs(car.steer);
 const rate=(same||car.steer===0)?8:12;
 car.steer+=clamp(tgt-car.steer,-rate*dt,rate*dt);
 const tg=(touch.gas||keys.gas)?1:0;
 const tb=(touch.brake||keys.brake)?1:0;
 ctl.gas+=clamp(tg-ctl.gas,-8*dt,4*dt);
 ctl.brake+=clamp(tb-ctl.brake,-8*dt,6*dt);
 ctl.hb=(touch.hb||keys.hb)?1:0;
}

function exhaustFlames(power){   // power ~0.7 (piccola) .. 1.5 (grossa)
 const fx=Math.sin(car.th),fz=Math.cos(car.th),lx=Math.cos(car.th),lz=-Math.sin(car.th);
 const cvx=car.u*fx+car.v*lx, cvz=car.u*fz+car.v*lz;      // l'auto si muove: le fiamme la seguono
 for(const o of exhaustOffsets){
  const px=car.x+fx*(o.z-.1)+lx*o.x, pz=car.z+fz*(o.z-.1)+lz*o.x, py=car.yS+o.y;
  const n=Math.round(10*power);
  for(let k=0;k<n;k++){
   const i=fHead;fHead=(fHead+1)%NF;
   const sp=rnd(3,9)*power, j=.6;
   fPos[i*3]=px;fPos[i*3+1]=py;fPos[i*3+2]=pz;
   fVel[i*3]  =cvx-fx*sp+lx*rnd(-j,j);                      // getto verso DIETRO
   fVel[i*3+1]=rnd(-.3,.5);
   fVel[i*3+2]=cvz-fz*sp+lz*rnd(-j,j);
   fMax[i]=fLife[i]=rnd(.10,.22)*(.8+.4*power);
   fS[i]=rnd(.3,.55)*power;
  }
 }
}
function updFlames(dt){
 for(let i=0;i<NF;i++){
  if(fLife[i]<=0){fAge[i]=1;fSize[i]=0;continue;}
  fLife[i]-=dt;
  const t=1-fLife[i]/fMax[i];
  if(t>=1){fLife[i]=0;fAge[i]=1;fSize[i]=0;continue;}
  const dk=Math.max(0,1-4*dt);
  fVel[i*3]*=dk;fVel[i*3+1]=fVel[i*3+1]*dk+1.5*dt;fVel[i*3+2]*=dk;
  fPos[i*3]+=fVel[i*3]*dt;fPos[i*3+1]+=fVel[i*3+1]*dt;fPos[i*3+2]+=fVel[i*3+2]*dt;
  fAge[i]=t;fSize[i]=fS[i]*(1-.6*t);
 }
 fGeo.attributes.position.needsUpdate=fGeo.attributes.aSize.needsUpdate=fGeo.attributes.aAge.needsUpdate=true;
}








function emit(x,y,z,vx,vy,vz,r,g,b,life,s0,s1,a0,grav,drag){
 const i=pHead;pHead=(pHead+1)%NP;
 pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;pVel[i*3]=vx;pVel[i*3+1]=vy;pVel[i*3+2]=vz;
 pCol[i*3]=r;pCol[i*3+1]=g;pCol[i*3+2]=b;pLife[i]=pMax[i]=life;pS0[i]=s0;pS1[i]=s1;pA0[i]=a0;pG[i]=grav;pD[i]=drag;
}
function updParticles(dt){
 for(let i=0;i<NP;i++){
  if(pLife[i]<=0){pAl[i]=0;continue;}
  pLife[i]-=dt;const t=1-pLife[i]/pMax[i];if(t>=1){pLife[i]=0;pAl[i]=0;continue;}
  const dk=Math.max(0,1-pD[i]*dt);
  pVel[i*3]*=dk;pVel[i*3+1]=pVel[i*3+1]*dk-pG[i]*dt;pVel[i*3+2]*=dk;
  pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
  pSize[i]=lerp(pS0[i],pS1[i],t);pAl[i]=pA0[i]*Math.pow(1-t,1.3)*Math.min(1,t*10);
 }
 pGeo.attributes.position.needsUpdate=pGeo.attributes.aSize.needsUpdate=pGeo.attributes.aAlpha.needsUpdate=pGeo.attributes.aColor.needsUpdate=true;
}

const emAcc=[0,0,0,0];

function spawn(w,surf,fast){
 const d=wheelDat[w];
 const fx=Math.sin(car.th);
 const fz=Math.cos(car.th);
 const vxw=car.u*fx+car.v*Math.cos(car.th);
 const vzw=car.u*fz-car.v*Math.sin(car.th);
 const j=()=>rnd(-1,1);
 
 if(surf===(MU.length-1) && Math.random()<.5 && fast){
  //offroad
  emit(d.x,d.y+.2,d.z,vxw*.3-fx*rnd(2,5)+j()*2,rnd(3,7),vzw*.3-fz*rnd(2,5)+j()*2,.26,.17,.10,rnd(.6,1.1),.5,.4,1,14,.2);
 } else if(surf < 4) {
  //asfalto
  emit(d.x,d.y+.2,d.z,vxw*.2+j(),rnd(.6,1.2),vzw*.2+j(),.88,.88,.9,rnd(.7,1.1),.7,rnd(2,3),.3,-.5,1.5);
 } else {
  //terra
  const c=surf===1?[.78,.67,.50]:[.5,.43,.30],k=rnd(.9,1.1);
  emit(d.x,d.y+.25,d.z,vxw*.35+j()*1.6,rnd(1,2.2),vzw*.35+j()*1.6,c[0]*k,c[1]*k,c[2]*k,rnd(1,1.8),1,rnd(3.5,5),.5,-.3,1.8);
  if(fast&&Math.random()<.25) {
    emit(d.x,d.y+.2,d.z,vxw*.3-fx*rnd(1,4)+j()*2,rnd(2,5),vzw*.3-fz*rnd(1,4)+j()*2,.34,.26,.17,rnd(.5,.9),.4,.35,1,14,.2);
  }
 }
}

function emitWheels(dt){
 if(car.air)return;

 const speed=Math.abs(car.u);
 const slipR=Math.abs(car.v-1.3*car.r);
 const slipF=Math.abs(car.v+1.3*car.r);
 
 for(let w=0;w<4;w++){
  const rear=w>=2;
  const slip=rear?slipR:slipF*.6;
  const d=wheelDat[w];
  const off=Math.abs(d.d)>5.4;
  const surf=off?(MU.length-1):d.surf;
  const spin=rear?car.spin:0;
  let rate;
  
  if (surf===(MU.length-1)) {
    //offroad
    rate=(speed>1?speed*1.3:0)+slip*7+spin*40;
  } else if (surf < 4) {
    //asfalto, sgommata in partenza
	if(speed < 5) rate = spin*30 + 5;
	else rate=(slip>3.5?(slip-3.5)*7:0)+spin*30;
  } else {
    //gravel
    rate=(speed>1?speed*.9:0)+slip*6+spin*45;
  }
  rate*=rear?1:.45;
  emAcc[w]+=rate*dt;
  while(emAcc[w]>=1){
    emAcc[w]--;
	spawn(w,surf,spin>.3||slip>5);
  }
 }
}

//            asfalto        gravel chiaro  fango scuro    roccioso       offroad
const SK_COL=[[.03,.03,.035],[.34,.26,.17],[.14,.10,.065],[.26,.27,.29],[.22,.16,.09]];
const SK_ALPHA=[.65,.55,.6,.5,.5];

const skW=[0,1,2,3].map(()=>({on:false,has:false,k:0,px:0,pz:0,lx:0,ly:0,lz:0,rx:0,ry:0,rz:0,a:0}));

function skidTarget(w,surfIdx){
 const rear=w>=2;
 const d=wheelDat[w];
 if(car.air)return 0;
 const slip=rear?Math.abs(car.v-1.3*car.r):Math.abs(car.v+1.3*car.r)*.6;
 
 //in partenza, sgomma!!!
 if (car.u > 0 && car.u < 10 && ctl.gas > 0.5) return 1.0;
 
 const thr=surfIdx===0?2.2:1.5;
 let t=Math.max(clamp((slip-thr)/4,0,1),rear?clamp(car.spin*1.2,0,1):0);
 if(ctl.hb>.5&&rear&&Math.abs(car.u)>3)t=Math.max(t,.9);                       // freno a mano
 if(ctl.brake>.5&&car.u>12)t=Math.max(t,.3*clamp((car.u-12)/20,0,1));         // frenata forte
 return t;
}

function updSkids(dt){
 let dirty=false;
 for(let w=0;w<4;w++){
  const s=skW[w],d=wheelDat[w];
  
  const off=Math.abs(d.d)>5.4;
  const si=off?4:(d.surf<4?0:d.surf-3);   // 0 asfalto, 1 gravel, 2 fango, 3 roccia, 4 offroad
  
  const tgt=skidTarget(w,si);
  //s.k+=(tgt-s.k)*(1-Math.exp(-(tgt>s.k?20:10)*dt));
    s.k+=(tgt-s.k)*(1-Math.exp(-(tgt>s.k?40:10)*dt));   // era 20: attacco più rapido
	
  if(s.k<0.06){s.on=false;continue;}
  if(!s.on){s.on=true;s.has=false;s.px=d.x;s.pz=d.z;continue;}
  const dx=d.x-s.px,dz=d.z-s.pz,len=Math.hypot(dx,dz);
  if(len<0.00010)continue;//sgomma da 10cm
  
  if(len>4){s.on=false;continue;}
  const nx=-dz/len*SK_HW;
  const nz=dx/len*SK_HW;
  const y=d.y+.07;
  const cLx=d.x+nx;
  const cLz=d.z+nz;
  const cRx=d.x-nx;
  const cRz=d.z-nz;
  //if(!s.has){s.lx=s.px+nx;s.lz=s.pz+nz;s.rx=s.px-nx;s.rz=s.pz-nz;s.ly=s.ry=y;s.a=0;s.has=true;}
    if(!s.has){s.lx=s.px+nx;s.lz=s.pz+nz;s.rx=s.px-nx;s.rz=s.pz-nz;s.ly=s.ry=y;s.a=s.k*SK_ALPHA[si]*.6;s.has=true;}   // era s.a=0
	
  const a=s.k*SK_ALPHA[si];
  const c=SK_COL[si];
  const o=skHead*18;
  const oa=skHead*6;
  // tri1: pL,pR,cL  tri2: pR,cR,cL
  const V=[s.lx,s.ly,s.lz, s.rx,s.ry,s.rz, cLx,y,cLz,  s.rx,s.ry,s.rz, cRx,y,cRz, cLx,y,cLz];
  const A=[s.a,s.a,a, s.a,a,a];
  for(let q=0;q<18;q++){skPos[o+q]=V[q];skCol[o+q]=c[q%3];}
  for(let q=0;q<6;q++)skAl[oa+q]=A[q];
  s.lx=cLx;s.lz=cLz;s.ly=y;s.rx=cRx;s.rz=cRz;s.ry=y;s.px=d.x;s.pz=d.z;s.a=a;
  skHead=(skHead+1)%SK_MAX;dirty=true;
 }
 if(dirty){
  skGeo.attributes.position.needsUpdate=true;
  skGeo.attributes.aColor.needsUpdate=true;
  skGeo.attributes.aAlpha.needsUpdate=true;
 }
}

let AC,E={};
const SAMPLES=[
 {url:'evo-engine-idle.mp3',rpm:800},
 {url:'evo-engine-low.mp3', rpm:2000},
 {url:'evo-engine-mid.mp3', rpm:4000},
 {url:'evo-engine-high.mp3',rpm:8000}];




function initAudio(){try{
 AC=new(window.AudioContext||window.webkitAudioContext)();
 E.master=AC.createGain();E.master.gain.value=.55;
 const comp=AC.createDynamicsCompressor();E.master.connect(comp);comp.connect(AC.destination);
 E.buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
 const dd=E.buf.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
 const noise=(f,q,type)=>{const s=AC.createBufferSource();s.buffer=E.buf;s.loop=true;
  const b=AC.createBiquadFilter();b.type=type;b.frequency.value=f;b.Q.value=q;s.connect(b);s.start();return b;};
 // motore: armoniche della frequenza di scoppio -> saturazione -> passa-basso
 E.bus=AC.createGain();
 const ws=AC.createWaveShaper(),cv=new Float32Array(256);
 for(let i=0;i<256;i++)cv[i]=Math.tanh((i/128-1)*3);ws.curve=cv;
 E.lp=AC.createBiquadFilter();E.lp.type='lowpass';E.lp.Q.value=2;
 E.bus.connect(ws);ws.connect(E.lp);E.lp.connect(E.master);
 const mk=(type,g)=>{const o=AC.createOscillator();o.type=type;const og=AC.createGain();og.gain.value=g;o.connect(og);og.connect(E.bus);o.start();return o;};
 E.o1=mk('sawtooth',.5);E.o2=mk('square',.18);E.o3=mk('sine',.5);E.o4=mk('sawtooth',.12);
 const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=8;lg.gain.value=1.5;lfo.connect(lg);lg.connect(E.o1.frequency);lfo.start(); // irregolarità
 // scarico (soffio grave)
 E.exh=noise(500,.8,'lowpass');E.exhG=AC.createGain();E.exhG.gain.value=0;E.exh.connect(E.exhG);E.exhG.connect(E.master);
 // turbina: fischio + soffio
 E.tw=AC.createOscillator();E.tw.type='sine';E.twG=AC.createGain();E.twG.gain.value=0;E.tw.connect(E.twG);E.twG.connect(E.master);E.tw.start();
 E.tn=noise(3500,3,'bandpass');E.tnG=AC.createGain();E.tnG.gain.value=0;E.tn.connect(E.tnG);E.tnG.connect(E.master);
 // rumore gomme/strada
 E.rd=noise(1100,.7,'bandpass');E.rdG=AC.createGain();E.rdG.gain.value=0;E.rd.connect(E.rdG);E.rdG.connect(E.master);
 E.boost=0;E.popT=0;E.blowT=0;
 E.sampled=false;E.layers=[];
 E.sbus=AC.createGain();E.slp=AC.createBiquadFilter();E.slp.type='lowpass';E.slp.frequency.value=6000;
 E.sbus.connect(E.slp);E.slp.connect(E.master);
 Promise.all(SAMPLES.map(s=>fetch(s.url).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(b=>AC.decodeAudioData(b))))
  .then(bufs=>{
   bufs.forEach((buf,i)=>{
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    src.loopStart=.05;src.loopEnd=Math.max(.2,buf.duration-.05);          // evita il click dell'mp3
    const g=AC.createGain();g.gain.value=0;src.connect(g);g.connect(E.sbus);src.start();
    E.layers.push({src,g,rpm:SAMPLES[i].rpm});
   });
   E.sampled=true;
  }).catch(()=>{});                                                         // file mancanti: resta il motore sintetico
  }catch(e){AC=null;}
}
function burst(freq,type,peak,dur,q){
 const s=AC.createBufferSource();s.buffer=E.buf;
 const b=AC.createBiquadFilter();b.type=type;b.frequency.value=freq;b.Q.value=q||1;
 const g=AC.createGain(),t=AC.currentTime;
 g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(b);b.connect(g);g.connect(E.master);s.start(t,Math.random()*1.5,dur+.05);
}

function updAudio(skid,dt){
 if(!AC)return;
 if(!(dt>0))dt=.016;
 if(!isFinite(E.boost))E.boost=0;
 if(!isFinite(E.popT))E.popT=0;
 if(!isFinite(E.blowT))E.blowT=0;
 
 
 const t=AC.currentTime;
 const rn=clamp((car.rpm-.22)/.78,0,1),R=900+rn*6600,th=ctl.gas;

function spawnDebris(o,n,size,pw){
 const s=Math.sin(car.th),co=Math.cos(car.th),vxw=car.u*s+car.v*co,vzw=car.u*co-car.v*s,sp=Math.hypot(car.u,car.v);

   vx:vxw*.55+rnd(-1,1)*pw,vy:rnd(2,5)+sp*.08,vz:vzw*.55+rnd(-1,1)*pw,wx:rnd(-9,9),wy:rnd(-9,9),wz:rnd(-9,9)};

function crash(cf,cl,sp){
  if(sp<4)return;
  const sev=clamp((sp-8)/25,0,1);
  let best=-1;
  let bd=1e9;
  for(let w=0;w<4;w++){
    if(dmg.lost[w])continue;
    const d=Math.hypot(cl-WO[w][0],cf-WO[w][1]);   // distanza contatto -> ruota
    if(d<bd){bd=d;best=w;}
  }
  // ruota persa solo ad alta velocità, contatto vicino alla ruota, e con probabilità contenuta
  if(best>=0 && bd<1.05 && sev>.42 && Math.random() < (sev-.42)*1.2) loseWheel(best);
  if(Math.abs(cf)>.5) dent(cl,cf,1.4+sev*.9,.52+sev*.45);//deve partire a prescindere l'ammaccatura!(X,Z,R,DEPTH)
}
const flyW=[];
function loseWheel(w){
  if(dmg.lost[w])return; dmg.lost[w]=true;
  const piv=wheelPivots[w], m=wheelMeshes[w].clone(true);
  piv.getWorldPosition(m.position); piv.getWorldQuaternion(m.quaternion);
  scene.add(m); piv.visible=false;
  const s=Math.sin(car.th),c=Math.cos(car.th),side=(w%2?-1:1);
  flyW.push({m,vx:car.u*s+c*side*rnd(3,7),vy:rnd(4,8),vz:car.u*c-s*side*rnd(3,7),age:0});
}
function updFlyW(dt){
  for(let k=flyW.length-1;k>=0;k--){
    const d=flyW[k],m=d.m; d.age+=dt;
    if(d.age>20){scene.remove(m);flyW.splice(k,1);continue;}
    d.vy-=18*dt; m.position.x+=d.vx*dt; m.position.y+=d.vy*dt; m.position.z+=d.vz*dt;
    m.rotateX(d.vz*dt*3);
    terrain(m.position.x,m.position.z,SHD);
    if(m.position.y<SHD.y+.33){m.position.y=SHD.y+.33; d.vy=d.vy<-2?-d.vy*.4:0; d.vx*=.97; d.vz*=.97;}
  }
}


function hitObstacles(){
 const cc=Math.floor(car.idx/CH);
 const s=Math.sin(car.th);
 const co=Math.cos(car.th);
 const lists=[];
 
 for(let c=cc-2;c<=cc+2;c++){
    const ch=chunks.get(c);
	if(ch)lists.push(ch.obs);
 }
 const tx=Math.floor(car.x/TILE);
 const tz=Math.floor(car.z/TILE);
 for(let a=-1;a<=1;a++) {
   for(let b=-1;b<=1;b++){
     const t=tiles.get(tileKey(tx+a,tz+b));
	 if(t) lists.push(t.obs);
   }
 }
 if(car.idx<PRE+60) lists.push(penObs);//new jersey
 
 for(const list of lists){
  for(const o of list){
   if(o.dead)continue;
  
    if(car.air&&car.yS-o.y>(o.type==='tree'?7:1.2))continue;
  
  const dx=o.x-car.x,dz=o.z-car.z;if(dx*dx+dz*dz>49)continue;
  const lf=dx*s+dz*co;//distanza frontale
  const ll=dx*co-dz*s;//distanza laterale
  const cf=clamp(lf,-2.1,2.1);
  const cl=clamp(ll,-.95,.95);
  const a=lf-cf;
  const b=ll-cl;
  const d2=a*a+b*b;
  if(d2>=o.r*o.r)continue;
  const sp=Math.hypot(car.u,car.v);//velocita
  
  if(o.type==='post'){
    // paletto: si rompe, nessun rallentamento
	destroyObs(o);
	spawnDebris(o,2,0.20,2);
	car.shake=Math.max(car.shake,.12);
	}
  else if(o.type==='rock'){
    // roccia: si rompe, rallenta
	destroyObs(o);
	spawnDebris(o,4+(Math.random()<.5?1:0),clamp(o.r*.33,.3,.7),3);
	
	crash(cf,cl,sp);//danneggiamento
	
    car.u*=.6;
	car.v*=.6;
	car.r*=.7;
	car.shake=Math.max(car.shake,Math.min(1,.2+sp/30));
    for(let k=0;k<8;k++) emit(o.x,o.y,o.z,rnd(-3,3),rnd(1,4),rnd(-3,3),.62,.58,.52,rnd(.8,1.4),1,4,.6,-.5,1.8);
   }
  else if(o.type==='jersey'){
    // new jersey ferma l'auto se vado piano (sp == 20 circa 70kmh), si distrugge altrimenti
	if (sp < 20) {
		
		crash(cf,cl,sp);//danneggiamento
	
		let d=Math.sqrt(d2);
		let na=a;
		let nb=b;
		if(d<1e-4){d=Math.hypot(lf,ll)||1;na=lf;nb=ll;}                          
		na/=d;
		nb/=d;
		const push=o.r-d+.03;
		car.x-=(na*s+nb*co)*push;
		car.z-=(na*co-nb*s)*push;
		if(sp>1.5){
			car.shake=Math.min(1,.3+sp/30);
			for(let k=0;k<12;k++)emit(o.x,o.y+rnd(1,4),o.z,rnd(-3,3),rnd(0,3),rnd(-3,3),.18,.38,.14,rnd(.8,1.3),.5,.4,1,6,.3);
		}
		car.u=0;
		car.v=0;
		car.r=0;
	} else {
		// Albero: ora si distrugge e genera detriti, rallentando l'auto
		destroyObs(o);
		spawnDebris(o,8,clamp(o.r*.33,0.8,1.8),3);
		
		crash(cf,cl,sp);//danneggiamento
		
		car.u*=.3;
		car.v*=.3;
		car.r*=.35;
		car.shake=Math.max(car.shake,Math.min(1,.2+sp/10));
		for(let k=0;k<8;k++) emit(o.x,o.y,o.z,rnd(-3,3),rnd(1,4),rnd(-3,3),.62,.58,.52,rnd(.8,1.4),1,4,.6,-.5,1.8);
	}
  }
  else {
    // albero: ferma l'auto se vado piano (sp == 20 circa 70kmh), si distrugge altrimenti
	if (sp < 20) {
		
		crash(cf,cl,sp);//danneggiamento
	
		let d=Math.sqrt(d2);
		let na=a;
		let nb=b;
		if(d<1e-4){d=Math.hypot(lf,ll)||1;na=lf;nb=ll;}                          
		na/=d;
		nb/=d;
		const push=o.r-d+.03;
		car.x-=(na*s+nb*co)*push;
		car.z-=(na*co-nb*s)*push;
		if(sp>1.5){
			car.shake=Math.min(1,.3+sp/30);
			for(let k=0;k<12;k++)emit(o.x,o.y+rnd(1,4),o.z,rnd(-3,3),rnd(0,3),rnd(-3,3),.18,.38,.14,rnd(.8,1.3),.5,.4,1,6,.3);
		}
		car.u=0;
		car.v=0;
		car.r=0;
	} else {
		// Albero: ora si distrugge e genera detriti, rallentando l'auto
		destroyObs(o);
		spawnDebris(o,8,clamp(o.r*.33,0.8,1.8),3);
		
		crash(cf,cl,sp);//danneggiamento
		
		car.u*=.3;
		car.v*=.3;
		car.r*=.35;
		car.shake=Math.max(car.shake,Math.min(1,.2+sp/10));
		for(let k=0;k<8;k++) emit(o.x,o.y,o.z,rnd(-3,3),rnd(1,4),rnd(-3,3),.62,.58,.52,rnd(.8,1.4),1,4,.6,-.5,1.8);
	}
   }
  }
 }
}
function updDebris(dt){
 for(let k=debris.length-1;k>=0;k--){
  const d=debris[k],m=d.m;d.age+=dt;

  d.vy-=18*dt;m.position.x+=d.vx*dt;m.position.y+=d.vy*dt;m.position.z+=d.vz*dt;
  m.rotation.x+=d.wx*dt;m.rotation.y+=d.wy*dt;m.rotation.z+=d.wz*dt;

}

function useGLB(buffer){
 if(!THREE.GLTFLoader){alert('GLTFLoader non caricato');return;}
 new THREE.GLTFLoader().parse(buffer,'',gltf=>{
  const V=()=>new THREE.Vector3(),box=new THREE.Box3();
  const model=gltf.scene,wrap=new THREE.Group();wrap.add(model);
  box.setFromObject(model);let sz=box.getSize(V());
  if(sz.x>sz.z)model.rotation.y=Math.PI/2;
  model.updateMatrixWorld(true);box.setFromObject(model);sz=box.getSize(V());
  model.scale.setScalar(4.2/sz.z);model.updateMatrixWorld(true);
  box.setFromObject(model);const c=box.getCenter(V());
  model.position.set(model.position.x-c.x,model.position.y-box.min.y,model.position.z-c.z);
  wrap.updateMatrixWorld(true);
  model.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>{if(m.isMeshStandardMaterial){m.metalness=Math.min(m.metalness,.35);m.roughness=Math.max(m.roughness,.4);}});});
  const re=/wheel|ruota|tyre|tire|rim|cerchi|gomma/i,tops=[];
  (function walk(n){if(re.test(n.name)){tops.push(n);return;}n.children.forEach(walk);})(model);
  box.setFromObject(model);sz=box.getSize(V());
  const quad={};
  tops.forEach(n=>{const b=new THREE.Box3().setFromObject(n),cc=b.getCenter(V()),bs=b.getSize(V());
   if(cc.y>sz.y*.45||bs.z>sz.z*.4)return;
   const key=(cc.x>0?0:1)+(cc.z>0?0:2);(quad[key]=quad[key]||[]).push({n,cc});});
  let wheelsOk=false;
  if([0,1,2,3].every(k=>quad[k])){
   const piv=[],spn=[];
   for(let k=0;k<4;k++){
    const arr=quad[k],ctr=V();arr.forEach(o=>ctr.add(o.cc));ctr.multiplyScalar(1/arr.length);
    const st=new THREE.Group(),sp=new THREE.Group();
    st.position.copy(ctr);st.add(sp);wrap.add(st);st.updateMatrixWorld(true);
    arr.forEach(o=>sp.attach(o.n));piv.push(st);spn.push(sp);
   }
   wheelPivots.length=0;wheelMeshes.length=0;piv.forEach(p=>wheelPivots.push(p));spn.forEach(p=>wheelMeshes.push(p));
   wheelsOk=true;
  }
  carG.children.forEach(o=>{if(o!==carG.userData.shadow)o.visible=false;});
  if(flipG)carG.remove(flipG);
  flipG=new THREE.Group();flipG.add(wrap);carG.add(flipG);
  flipBtn.style.display='block';
  console.log('GLB caricato. Ruote animate:',wheelsOk,'| nodi ruota trovati:',tops.map(n=>n.name));
 },err=>alert('GLB non valido: '+(err.message||err)));
}

function stepCamera(dt) {
  const h = cam.hold;
  if (h.zoomIn || cam.zoomDir === -1) cam.zoom = Math.max(.35, cam.zoom * Math.exp(-1.2 * dt));
  if (h.zoomOut || cam.zoomDir === 1) cam.zoom = Math.min(3.5, cam.zoom * Math.exp(1.2 * dt));
  if (h.up || cam.yawDir === 1) cam.el = Math.min(.75, cam.el + .9 * dt);
  if (h.down || cam.yawDir === -1) cam.el = Math.max(-.65, cam.el - .9 * dt);
  if (h.cw || cam.rotDir === -1) cam.yaw -= 1.4 * dt;   // Ruota CW
  if (h.ccw || cam.rotDir === 1) cam.yaw += 1.4 * dt;   // Ruota CCW
}

addEventListener('keydown',e=>{
	if (e.code==='KeyC') { cam.zoom=1; cam.el=0; cam.yaw=0; }// C = camera di default
	if (e.code === 'KeyQ') cam.rotDir = -1;
    if (e.code === 'KeyE') cam.rotDir = 1;
    if (e.code === 'KeyZ') cam.zoomDir = -1;
    if (e.code === 'KeyX') cam.zoomDir = 1;
    if (e.code === 'KeyV') cam.yawDir = 1;   // V = ruota lo yaw in un verso
    if (e.code === 'KeyB') cam.yawDir = -1;
});

 car.gy=null;
 skW.forEach(s=>{s.on=false;s.has=false;s.k=0;});//toglie sgommate
 
 //sporco rimosso PRIMA di riparare l'auto (respawn)
 dirt=0;
 
 //danneggiamento rimosso
 repairCar();
}
function updateWorld(dt){

 car.odo+=Math.abs(car.u)*dt;
 
 const c=terrain(car.x,car.z,S0);if(c.i>=0)car.idx=c.i;
 hitObstacles();
 updDebris(dt);
 updFlyW(dt);
 
 // 4 ruote
 const fx=Math.sin(car.th),fz=Math.cos(car.th),lx=Math.cos(car.th),lz=-Math.sin(car.th);
 let ym=0;
 let mu=[0,0,0,0];
 let st=[0,0,0,0];
 let rr=0;
 
 let dusty=0;//sporco e' bello
 let sfDust=4;//sporco ci piace
 
 for(let w=0;w<4;w++){
  const wd=wheelDat[w];
  const x=car.x+fx*WO[w][1]+lx*WO[w][0];
  const z=car.z+fz*WO[w][1]+lz*WO[w][0];
  terrain(x,z,SHD);
  wd.x=x;
  wd.z=z;
  wd.y=SHD.y;
  wd.d=SHD.d;
  wd.surf=SHD.surf;
  ym+=SHD.y;
  const off=Math.abs(SHD.d)>5.4;
  const sf=off?(MU.length-1):SHD.surf;
  
  if(sf>=4){ dusty++; sfDust=sf; }//sporco e' bello
  
  mu[w]=MU[sf];
  st[w]=ST[sf];
  rr+=RR[sf];
  
  //danneggiamento!
  if(dmg.lost[w]){ mu[w]*=.25; rr+=.12; }
 }
 car.muF=(mu[0]+mu[1])/2;
 car.muR=(mu[2]+mu[3])/2;
 car.stF=(st[0]+st[1])/2;
 car.stR=(st[2]+st[3])/2;
 car.rr=rr/4;
 
 //danneggiamento:
 const mis=(Math.abs(dmg.toe[0])+Math.abs(dmg.toe[1]))/2;
 dmg.pull=(dmg.toe[0]+dmg.toe[1])*.15;
 car.stF*=1-mis*1.2;  
 car.stR*=1-(Math.abs(dmg.toe[2])+Math.abs(dmg.toe[3]))*.6;
 
 //sporco e' bellissimo
 if(dusty&&!car.air){
  const add=Math.abs(car.u)*dt*(dusty/4)*.004;
  const nd=Math.min(1,dirt+add);
  const t=DIRT_COLS[sfDust];
  // peso del nuovo sporco sul totale; il minimo (.05/s) evita che a dirt=1 il colore resti congelato
  const w=clamp(Math.max(add,dt*.05)/Math.max(nd,.05),0,1);
  dirtCol.lerp(_dc.setRGB(t[0],t[1],t[2]),w);
  dirt=nd;
  applyDirt();
 }
 
 
 
  if(car.air){car.muF=car.muR=.03;car.rr=.003;}
  
  const isBraking = headlightsOn || (ctl.brake > 0 || touch.brake || keys.brake);//stop accende luci
  const isRetromarcia = car.u < 0;//retromarcia accende luci
  stopLight1.intensity = isBraking ? 0.8 : 0;
  stopLight2.intensity = isBraking ? 0.8 : 0;
  backLight1.intensity = isRetromarcia ? 0.8 : 0;
  backLight2.intensity = isRetromarcia ? 0.8 : 0;
  // I fari anteriori si accendono solo se headlightsOn è true
  frontLight1.intensity = headlightsOn ? 2 : 0;
  frontLight2.intensity = headlightsOn ? 2 : 0;
  	
 
 // frenata: muso giù, accelerazione: muso su
 const yF=(wheelDat[0].y+wheelDat[1].y)*0.5;
 const yR=(wheelDat[2].y+wheelDat[3].y)*0.5;
 const yL=(wheelDat[0].y+wheelDat[2].y)*0.5;
 const yRt=(wheelDat[1].y+wheelDat[3].y)*0.5;
 car.pitchT=Math.atan2(yF-yR,2.6);
 car.rollT=Math.atan2(yL-yRt,1.9);
 
 //danneggiamento
 if(dmg.lost[0]){ car.pitchT-=0.08; car.rollT+=0.12; }
 if(dmg.lost[1]){ car.pitchT-=0.08; car.rollT-=0.12; }
 if(dmg.lost[2]){ car.pitchT+=0.08; car.rollT+=0.12; }
 if(dmg.lost[3]){ car.pitchT+=0.08; car.rollT-=0.12; }
 
 
  const GRAV=13;
  const gy=ym/4;
  if(car.gy===null){
    car.gy=gy;
	car.yS=gy;
  }
  const gvyOld=car.gvy;
  car.gvy=lerp(car.gvy,(gy-car.gy)/Math.max(dt,.004),1-Math.exp(-6*dt));
  car.gy=gy;
  car.cool=Math.max(0,car.cool-dt);
  if(!car.air){
    car.yS=gy;
    // decollo: il terreno "scende" più in fretta della caduta libera
    if(car.cool<=0&&Math.abs(car.u)>6&&(car.gvy-gvyOld)/Math.max(dt,.004)<-GRAV){car.air=true;car.vy=gvyOld;}
  }else{
    car.vy-=GRAV*dt;
	car.yS+=car.vy*dt;
    if(car.yS<=gy){                                    
	  // atterraggio
      const imp=car.gvy-car.vy;
	  car.yS=gy;
	  car.air=false;
	  car.cool=.3;
	  car.vy=car.gvy;
      if(imp>3){
        car.shake=Math.max(car.shake,clamp(imp/12,0,1));
        car.u*=1-clamp(imp*.008,0,.12);
        for(let w=0;w<4;w++) {
		  for(let q=0;q<5;q++) {
		    spawn(w,wheelDat[w].surf,true);
		  }
		}
	    //danneggiamento: salto della madocina rompe tutto
	    if(imp>6){
		  const s=clamp((imp-6)/10,0,1);
		  for(let w=0;w<4;w++){
			dmg.toe[w]   =clamp(dmg.toe[w]   +rnd(-1,1)*.12*s,-.35,.35);
			dmg.camber[w]=clamp(dmg.camber[w]+rnd(-1,1)*.15*s,-.35,.35);
		  }
		}
		
      }
    }
 }
 const kp=1-Math.exp(-(car.air?2.5:12)*dt);
 car.pitch=lerp(car.pitch,car.air?Math.atan2(car.vy,Math.max(Math.abs(car.u),6)):car.pitchT+.008*car.axF,kp);
 car.roll=lerp(car.roll,car.air?0:car.rollT+.011*car.ayF,kp);
 
 
 
 carG.position.set(car.x,car.yS,car.z);
 carG.rotation.set(-car.pitch,car.th,car.roll);
 
 //sporchissimo e' bellissimo!
 carG.updateMatrixWorld(true);
 dirtU.uInv.value.copy(carG.matrixWorld).invert();
 
 
 //sole segue l'auto
 {
  const sx=Math.round(car.x*0.5)*2;
  const sz=Math.round(car.z*0.5)*2;   // a scatti di 2 m: meno tremolio
  sun.target.position.set(sx,car.yS,sz);
  sun.position.set(sx+80,car.yS+120,sz+50);
 }
 
 
 {
   const sh=carG.userData.shadow;
   const h=Math.max(0,car.yS-gy);
   sh.position.y=.06-h;
   sh.material.opacity=clamp(1-h/8,.25,1);
 }
 
 
 for(let w=0;w<4;w++) {
   wheelMeshes[w].rotation.x+=car.u/.33*dt;//0.36 vecchia delta, 0.33 nuova delta
 }
 
 //danneggiamento:
 //wheelPivots[0].rotation.y=wheelPivots[1].rotation.y=car.steer*maxSteer(Math.abs(car.u));
 const stA=car.steer*maxSteer(Math.abs(car.u));
 for(let w=0;w<4;w++){
   wheelPivots[w].rotation.y=(w<2?stA:0)+dmg.toe[w];
   wheelPivots[w].rotation.z=dmg.camber[w];
 }
 
 
 
 
 if(steerWheel){
   steerWheel.rotation.z=-car.steer*2.2;
 }
 
 
 // camera 3/4 da dietro, ~45°
 const spd=Math.abs(car.u);
 const beta=spd>5?Math.atan2(car.v,car.u):0;
 car.camYaw+=angDiff(car.camYaw,car.th+clamp(beta*.6,-.6,.6))*(1-Math.exp(-3.5*dt));
 
 //////const dist=8.8+spd*.04,hgt=8.4+spd*.03;
 car.camY=car.camY?lerp(car.camY,car.yS,1-Math.exp(-6*dt)):car.yS;
 
 car.shake=Math.max(0,car.shake-dt*2);
 
 const sk=car.shake*.5+(Math.abs(wheelDat[2].d)>5.4?Math.min(.08,spd*.002):0);
 ////camera.position.set(car.x-Math.sin(car.camYaw)*dist+rnd(-sk,sk),car.camY+hgt+rnd(-sk,sk),car.z-Math.cos(car.camYaw)*dist);
 ////terrain(camera.position.x,camera.position.z,SHD);camera.position.y=Math.max(camera.position.y,SHD.y+1.8);
 ////camera.lookAt(car.x+Math.sin(car.camYaw)*6,car.camY+1.2,car.z+Math.cos(car.camYaw)*6);
 
 
 const CAM_BACK=5.5;
 const CAM_UP=2.5;   // prima 8.8 e 8.4: più piccolo = più vicina / più bassa
 const D=Math.hypot(CAM_BACK+spd*.04,CAM_UP+spd*.03)*cam.zoom;
 const el=clamp(Math.atan2(CAM_UP+spd*.03,CAM_BACK+spd*.04)+cam.el,.08,1.5),hd=D*Math.cos(el),hgt=D*Math.sin(el),cy=car.camYaw+cam.yaw;
 
 camera.position.set(car.x-Math.sin(cy)*hd+rnd(-sk,sk),car.camY+hgt+rnd(-sk,sk),car.z-Math.cos(cy)*hd);
 terrain(camera.position.x,camera.position.z,SHD);camera.position.y=Math.max(camera.position.y,SHD.y+1.8);
 const ahead=6*Math.max(0,Math.cos(cam.yaw));   // girando intorno all'auto guarda sempre verso di lei
 camera.lookAt(car.x+Math.sin(car.camYaw)*ahead,car.camY+1.2,car.z+Math.cos(car.camYaw)*ahead);
 
 
 //il cielo segue!
 sky.position.copy(camera.position);
 
 
 
 
 
 const fov=60+spd*.22;
 if(Math.abs(fov-camera.fov)>.05){camera.fov=fov;camera.updateProjectionMatrix();}
 pMat.uniforms.uScale.value=renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2));
 valley.position.set(car.x,car.camY-48,car.z);
 
 // mondo
 ensurePoints(car.idx+400);
 manageChunks();
 manageTiles();
 emitWheels(dt);
 updSkids(dt);
 updParticles(dt);
 updFlames(dt);
 
 
 
 
 // audio & HUD
 const kmh=car.u*3.6;
 const tops=[40,70,100,135,170,215];
 let gi=0;
 while(gi<5&&Math.abs(kmh)>tops[gi])gi++;
 const low=gi?tops[gi-1]*.55:0;
 const frac=clamp((Math.abs(kmh)-low)/(tops[gi]-low),0,1);
 car.rpm=lerp(car.rpm,Math.max(.22+.78*frac,.22+ctl.gas*.4*(1-frac)),1-Math.exp(-9*dt));
 const slip=Math.max(Math.abs(car.v-1.3*car.r),Math.abs(car.v+1.3*car.r))/9+car.spin*.5;
 
 ////////updAudio(running?slip:0);
  updAudio(running?slip:0,dt);
  
 if(++hudTick%3===0){
  const kmhVal = Math.max(0,Math.round(Math.abs(kmh)));
  const geaVal = car.u<-.5?'R':(Math.abs(kmh)<1&&ctl.gas<.1)?'N':gi+1;
  
  //$('spd').textContent=kmhVal;
  //$('gear').textContent=geaVal;
  
  //veglia borletti
  tach(car.rpm,kmhVal,geaVal);
  $('rpm').classList.toggle('night',headlightsOn);
  
  const off=Math.abs(c.d)>5.4;
  const mode=modeArr[Math.floor(car.idx/CH)];
  const surfType=P[car.idx].surf;
  
  let surfText = '';
  //          tarG   tarB   tarNO  tarmix grav1  grav2  rocks
       if(surfType === 0) surfText = '🚧 ASFALTO 🚧';
  else if(surfType === 1) surfText = '✅​ ASFALTO ✅​';
  else if(surfType === 2) surfText = '✅​ ASFALTO ✅​';
  else if(surfType === 3) surfText = '✅​ ASFALTO ✅​';
  else if(surfType === 4) surfText = '⚠️ STERRATO POLVEROSO ⚠️​';
  else if(surfType === 5) surfText = '⚠️ STERRATO FANGOSO ⚠️';
  else if(surfType === 6) surfText = '⚠️ STERRATO ROCCIOSO ⚠️';

  $('surf').textContent=off?'​⚡ FUORI STRADA ​⚡':surfText;
  
  $('dist').textContent=(car.odo/1000).toFixed(1)+' km';
  if(hudTick%12===0)lastPace=pace();
  const n=$('note');n.innerHTML=lastPace?`${lastPace.left?'◀':'▶'} ${sev(lastPace.R)} <small>${Math.max(0,Math.round(lastPace.dist-(car.idx-lastPace.from)*DS))} m</small>`:'';
 }
}
///const sev=R=>R<21?'TORNANTE':R<34?'1':R<52?'2':R<80?'3':R<125?'4':'5';
const sev=R=>R<40?'TORNANTE​':R<55?'1':R<75?'2':R<100?'3':R<150?'4':'5';

function pace(){
 ensurePoints(car.idx+80);let i=car.idx+1;const end=i+55;
 for(;i<end;i++)if(Math.abs(P[i].k)>1/150)break;
 if(i>=end)return null;
 const sg=Math.sign(P[i].k);let mk=0;
 for(let j=i;j<i+16;j++){if(Math.sign(P[j].k)!==sg&&Math.abs(P[j].k)>1/200)break;mk=Math.max(mk,Math.abs(P[j].k));}
 return{dist:(i-car.idx)*DS,R:1/mk,left:sg>0,from:car.idx};
}

/* ============ CONTAGIRI VEGLIA BORLETTI (SVG) ============ */
const tach=(()=>{
 const el=$('rpm');
 const Y='currentColor';//#f5c518
 const YLancetta='#ffdd11';//piu chiara di #f5c518
 const Y_OFF='#775511';//f5c518
 const RED='#ee3311';
 const RED_OFF='#772211';//
 const N=36;//46;
 const MAXR=9000;
 const REDLINE=6500;
 const a=v=>v/6000*Math.PI;               // 0 a ore 3, 60 a ore 9, 90 a ore 12 (senso orario)
 const pt=(v,r)=>[100+Math.cos(a(v))*r,100+Math.sin(a(v))*r];
 
 // arco: valori sulla stessa scala dei numeri del quadrante (6000 = 180°)
 const ARC_R=55;
 const ARC_START=0;
 const ARC_END=9000;
 const [ax,ay]=pt(ARC_START,ARC_R);
 const [bx,by]=pt(ARC_END,ARC_R);
 
 // tacche a croce (ore 3, 6, 9, 12): raggio interno ed esterno
 const TICK_IN=16;
 const TICK_OUT=64;
 const tk=v=>{const [x1,y1]=pt(v,TICK_IN),[x2,y2]=pt(v,TICK_OUT);return `M${x1} ${y1}L${x2} ${y2}`;};
 
 let h=`<svg viewBox="0 0 200 200" width="${IS_MOBILE ? 150 : 200}" height="${IS_MOBILE ? 150 : 200}">`
  +`<circle cx="100" cy="100" r="98" fill="#1b1b1b" stroke="#666" stroke-width="2"/>`//esterno grigio
  +`<circle cx="100" cy="100" r="92" fill="none"    stroke="#c8892a" stroke-width="1.5"/>`//esterno giallo
  +`<path d="M${ax} ${ay}A${ARC_R} ${ARC_R} 0 1 1 ${bx} ${by}" fill="none" stroke="#c8892a" stroke-width="3"/>`//interno giallo
  +`<path d="${tk(0)}${tk(3000)}${tk(6000)}${tk(9000)}" stroke="${Y}" stroke-width="1.5"/>`;
 
 
 //scritte rpm
 for(let n=0;n<=90;n+=10){
  const [x,y]=pt(n*100,70);
  h+=`<text x="${x}" y="${y}" fill="${Y}" font-size="18" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="monospace">${n}</text>`;
 }
 
 //MARCIA E KMH AL CENTRO
 h+=`<rect                    x="120" y="28" width="44" height="44" rx="3" ry="3" fill="#111111" stroke="${Y}" stroke-width="1"/>`;
 h+=`<text id="tachGearText"  x="140" y="50" fill="#ffffff" font-size="44" font-weight="900" text-anchor="middle" dominant-baseline="central" font-family="monospace">N</text>`;
 
 h+=`<rect                    x="58"  y="113" width="84" height="22"  rx="3" ry="3" fill="#111111" stroke="${Y}" stroke-width="1"/>`;
 h+=`<text id="tachSpeedText" x="138" y="124" fill="#ffffff" font-size="20" font-weight="700" text-anchor="end" dominant-baseline="central" font-family="monospace">0</text>`;
   
 //scritte contorno
 h+=`<text x="100" y="70" fill="${Y}" font-size="6" font-weight="700" text-anchor="middle" font-family="sans-serif">VEGLIA</text>`
   +`<text x="100" y="78" fill="${Y}" font-size="5" font-weight="700" text-anchor="middle" font-family="sans-serif">BORLETTI</text>`
   +`<text x="170" y="88" fill="${Y}" font-size="7" font-weight="700" text-anchor="middle" font-family="sans-serif">RPM x 100</text>`;
   
 //pallini
 const dots=[];
 for(let i=0;i<=N;i++){
  const v=i/N*MAXR;
  const [x,y]=pt(v,85);
  const big=i%4===0;//5
  h+=`<circle class="td" cx="${x}" cy="${y}" r="${big?4:2}" fill="${v>=REDLINE?RED_OFF:Y_OFF}"/>`;
  dots.push({v,red:v>=REDLINE,on:false});
 }
 h+=`<polygon id="tachNeedle" points="-30,-5 82,-1 82,1 -30,5" fill="${YLancetta}" transform="translate(100 100)"/>`
   +`<circle cx="100" cy="100" r="9" fill="#111111"/></svg>`;
 el.innerHTML=h;
 const cs=el.querySelectorAll('.td');
 const needle=$('tachNeedle');
 const speedText=el.querySelector('#tachSpeedText');
 const gearText=el.querySelector('#tachGearText');
 
 return function(r,kmh,gea){                        // r = car.rpm (0.22..1)
  const rpm=900+clamp((r-.22)/.78,0,1)*6600;  // stessa scala dell'audio
  needle.setAttribute('transform',`translate(100 100) rotate(${rpm/6000*180})`);
  for(let i=0;i<dots.length;i++){
   const d=dots[i];
   const on=d.v<=rpm;
   if(on===d.on)continue;
   d.on=on;
   cs[i].setAttribute('fill',on?(d.red?RED:Y):(d.red?RED_OFF:Y_OFF));
  }
  if(speedText) speedText.textContent = kmh + ' kmh';
  if(gearText) gearText.textContent = gea;
 };
})();





/* ============ AVVIO / LOOP ============ */
function startGame(){
 if(running)return;
 running=true;
 $('start').style.display='none';
 initAudio();
 if(AC&&AC.state==='suspended')AC.resume();
}
$('start').addEventListener('pointerdown',e=>{e.preventDefault();startGame();});
$('resetBtn').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();resetCar();});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});

ensurePoints((AHEAD+3)*CH);
car.idx=PRE;car.x=P[PRE].x;car.z=P[PRE].z;car.th=P[PRE].h;car.camYaw=car.th;


for(let c=0;c<=AHEAD;c++)chunks.set(c,buildChunk(c));


// --- AGGIUNTA PER STABILIZZARE L'AUTO ALL'AVVIO ---
car.yS = P[PRE].y;
carG.position.set(car.x, car.yS, car.z);
carG.rotation.set(0, car.th, 0);
carG.updateMatrixWorld(true);
if (model) model.updateMatrixWorld(true);
// --------------------------------------------------


updateWorld(.016);

let last=performance.now();
let acc=0;
let gt=0;//erba

function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(running){stepControls(dt);acc+=dt;while(acc>=H){physics(H);acc-=H;}}
 stepCamera(dt);
 
 gt+=dt; 
 grassU.uTime.value=gt;
 
 sky.rotation.y+=dt*0.003; // nuvole che scorrono lentissime
 
 updateWorld(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();    
</script>
