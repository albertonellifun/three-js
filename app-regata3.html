    <div id="help">A/D o ◀▶ timone · W/S o ▲▼ cazza/lasca · SPAZIO spinnaker · mouse: orbita, rotella: zoom · T: +3 ore</div>

    <div id="hud">

      <div class="p">
        <div id="gt"><button data-d="-1">−</button><span id="tt">--:--</span><button data-d="1">+</button><button id="tr" title="Orologio di sistema">⟲</button></div><b id="kn">0.0</b>nodi<br><span id="sp"></span>

    <div id="tc">
      <div class="g" style="left:12px"><button data-k="KeyA">◀</button><button data-k="KeyD">▶</button></div>
      <div class="g" style="right:12px"><button data-k="KeyW">▲</button><button data-k="KeyS">▼</button><button id="bs">⛵</button></div>
    </div>
    <script src="./three.min.js"></script>
    <script>
      const T = THREE,
        V3 = (x, y, z) => new T.Vector3(x, y, z),
        clamp = (x, a, b) => Math.min(b, Math.max(a, x));
      const sstep = (a, b, x) => {
        x = clamp((x - a) / (b - a), 0, 1);
        return x * x * (3 - 2 * x)
      };
      const lin = h => new T.Color(h).convertSRGBToLinear(),
        R = 600,
        seed = Math.random() * 100;
      /* ---------- noise ---------- */
      function hs(x, y, z) {
        let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967295
      }

      function vn(x, y, z) {
        const ix = Math.floor(x),
          iy = Math.floor(y),
          iz = Math.floor(z);
        let fx = x - ix,
          fy = y - iy,
          fz = z - iz;
        fx *= fx * (3 - 2 * fx);
        fy *= fy * (3 - 2 * fy);
        fz *= fz * (3 - 2 * fz);
        const L = (a, b, t) => a + (b - a) * t,
          h = (a, b, c) => hs(ix + a, iy + b, iz + c);
        return L(L(L(h(0, 0, 0), h(1, 0, 0), fx), L(h(0, 1, 0), h(1, 1, 0), fx), fy), L(L(h(0, 0, 1), h(1, 0, 1), fx), L(h(0, 1, 1), h(1, 1, 1), fx), fy), fz)
      }

      function fbm(x, y, z, o = 5) {
        let s = 0,
          a = .5,
          f = 1;
        for (let i = 0; i < o; i++) {
          s += a * vn(x * f + seed, y * f + seed * .7, z * f + seed * 1.3);
          a *= .5;
          f *= 2.03
        }
        return s
      }
      /* ---------- terreno procedurale ---------- */
      const vols = [];
      let lastVol = 1e9;

      function baseH(x, y, z) {
        let h = (fbm(x * 3, y * 3, z * 3) - .6) * 180;
        if (h > 0) h = h * 1.5 + sstep(5, 20, h) * (1 - Math.abs(fbm(x * 14, y * 14, z * 14, 3) * 2 - 1)) * 9;
        return Math.max(h, -55)
      }

      function hAt(x, y, z) {
        let h = baseH(x, y, z);
        lastVol = 1e9;
        for (const v of vols) {
          const d = Math.acos(clamp(x * v.x + y * v.y + z * v.z, -1, 1)) * R;
          if (d < 90) {
            lastVol = Math.min(lastVol, d);
            h = Math.max(h, -8) + 14 * sstep(90, 12, d) + 36 * Math.pow(clamp(1 - d / 50, 0, 1), 1.2) - 26 * sstep(18, 7, d)
          }
        }
        return h
      }
      const rnd = () => Math.random(),
        rdir = () => {
          for (;;) {
            const x = rnd() * 2 - 1,
              y = rnd() * 2 - 1,
              z = rnd() * 2 - 1,
              l = Math.hypot(x, y, z);
            if (l < 1 && l > .1) return V3(x / l, y / l, z / l)
          }
        };
      for (let i = 0; i < 40000 && vols.length < 3; i++) {
        const d = rdir(),
          h = baseH(d.x, d.y, d.z);
        if (h > -20 && h < 6 && vols.every(v => v.dot(d) < .93)) vols.push(d)
      }
      /* cube-sphere indicizzata */
      const MOB = matchMedia("(pointer:coarse)").matches || innerWidth < 700,
        N = MOB ? 72 : 112,
        idx = new Map(),
        dir = [],
        ind = [];

      function vid(x, y, z) {
        const k = ((x + N) * (2 * N + 1) + (y + N)) * (2 * N + 1) + (z + N);
        let v = idx.get(k);
        if (v === undefined) {
          v = dir.length / 3;
          idx.set(k, v);
          const l = Math.hypot(x, y, z);
          dir.push(x / l, y / l, z / l)
        }
        return v
      }
      for (let f = 0; f < 6; f++) {
        const a = f >> 1,
          s = f & 1 ? 1 : -1,
          u = (a + 1) % 3,
          w = (a + 2) % 3;
        const P = (i, j) => {
          const c = [0, 0, 0];
          c[a] = s * N;
          c[u] = 2 * i - N;
          c[w] = 2 * j - N;
          return vid(c[0], c[1], c[2])
        };
        for (let i = 0; i < N; i++)
          for (let j = 0; j < N; j++) {
            const p = P(i, j),
              q = P(i + 1, j),
              r = P(i + 1, j + 1),
              t = P(i, j + 1);
            s > 0 ? ind.push(p, q, r, p, r, t) : ind.push(p, r, q, p, t, r)
          }
      }
      const nV = dir.length / 3,
        H = new Float32Array(nV),
        tp = new Float32Array(nV * 3),
        tc = new Float32Array(nV * 3),
        op = new Float32Array(nV * 3);
      const C = {
          sand: lin(0xe8d08e),
          shal: lin(0xcdbb88),
          floor: lin(0x1d4c5c),
          grass: lin(0x4a9a30),
          forest: lin(0x1f5a22),
          rock: lin(0x7a726c),
          dark: lin(0x2e2b2a),
          snow: lin(0xffffff),
          lava: lin(0x6a1a08)
        },
        tmp = new T.Color();
      for (let i = 0; i < nV; i++) {
        const x = dir[i * 3],
          y = dir[i * 3 + 1],
          z = dir[i * 3 + 2],
          h = hAt(x, y, z),
          n = fbm(x * 40, y * 40, z * 40, 2),
          vd = lastVol;
        H[i] = h;
        tp[i * 3] = x * (R + h);
        tp[i * 3 + 1] = y * (R + h);
        tp[i * 3 + 2] = z * (R + h);
        op[i * 3] = x * R;
        op[i * 3 + 1] = y * R;
        op[i * 3 + 2] = z * R;
        if (h < 0) tmp.copy(C.shal).lerp(C.floor, clamp(-h / 30, 0, 1));
        else if (vd < 48) tmp.copy(C.dark).lerp(C.rock, n).lerp(C.lava, sstep(9, 0, vd) * .9);
        else if (h < 2.4) tmp.copy(C.sand);
        else if (h < 5) tmp.copy(C.sand).lerp(C.grass, sstep(2.4, 5, h));
        else if (h < 20 + n * 6) tmp.copy(C.grass).lerp(C.forest, clamp(n * 1.6, 0, 1) * sstep(5, 10, h));
        else if (h < 33) tmp.copy(C.rock).lerp(C.dark, n * .6);
        else tmp.copy(C.snow);
        tc[i * 3] = tmp.r;
        tc[i * 3 + 1] = tmp.g;
        tc[i * 3 + 2] = tmp.b
      }
      const scene = new T.Scene(),
        HOR = lin(0xcfe8ff),
        ZEN = lin(0x2a78d6);
      scene.fog = new T.FogExp2(HOR, .0016);
      const tg = new T.BufferGeometry();
      tg.setAttribute('position', new T.BufferAttribute(tp, 3));
      tg.setAttribute('color', new T.BufferAttribute(tc, 3));
      tg.setIndex(ind);
      tg.computeVertexNormals();
      scene.add(new T.Mesh(tg, new T.MeshStandardMaterial({
        vertexColors: true,
        roughness: .95
      })));
      /* ---------- alberi (InstancedMesh) ---------- */
      const tf = (p, r, s) => new T.Matrix4().compose(p, new T.Quaternion().setFromEuler(new T.Euler(r[0], r[1], r[2])), V3(s[0], s[1], s[2]));

      function part(list, g, m, c1, c2) {
        g = g.index ? g.toNonIndexed() : g;
        g.applyMatrix4(m);
        g.computeBoundingBox();
        const p = g.attributes.position,
          b = g.boundingBox,
          a = lin(c1),
          z = lin(c2),
          col = new Float32Array(p.count * 3);
        for (let i = 0; i < p.count; i++) {
          const k = clamp((p.getY(i) - b.min.y) / (b.max.y - b.min.y + 1e-4), 0, 1),
            j = .88 + rnd() * .24;
          col[i * 3] = (a.r + (z.r - a.r) * k) * j;
          col[i * 3 + 1] = (a.g + (z.g - a.g) * k) * j;
          col[i * 3 + 2] = (a.b + (z.b - a.b) * k) * j
        }
        g.setAttribute('color', new T.BufferAttribute(col, 3));
        list.push(g)
      }

      function blob() {
        const g = new T.IcosahedronGeometry(1, 1),
          p = g.attributes.position,
          n = new Float32Array(p.count * 3),
          v = V3(0, 0, 0);
        for (let i = 0; i < p.count; i++) {
          v.fromBufferAttribute(p, i).normalize();
          n[i * 3] = v.x;
          n[i * 3 + 1] = v.y;
          n[i * 3 + 2] = v.z;
          const j = .75 + .5 * vn(v.x * 3, v.y * 3, v.z * 3);
          p.setXYZ(i, v.x * j, v.y * j, v.z * j)
        }
        g.setAttribute('normal', new T.BufferAttribute(n, 3));
        return g
      }

      function merge(list) {
        let n = 0;
        list.forEach(g => n += g.attributes.position.count);
        const o = {
          position: new Float32Array(n * 3),
          normal: new Float32Array(n * 3),
          color: new Float32Array(n * 3)
        };
        let k = 0;
        for (const g of list) {
          for (const a in o) o[a].set(g.attributes[a].array, k * 3);
          k += g.attributes.position.count
        }
        const r = new T.BufferGeometry();
        for (const a in o) r.setAttribute(a, new T.BufferAttribute(o[a], 3));
        return r
      }
      const cyl = (r1, r2, h, y) => new T.CylinderGeometry(r1, r2, h, 6).translate(0, y, 0);

      function broadleaf() {
        const l = [];
        part(l, cyl(.15, .28, 2.6, 1.3), new T.Matrix4(), 0x4a3524, 0x5a4430);
        for (let i = 0; i < 3; i++) part(l, cyl(.05, .1, 1.6, .8), tf(V3(0, 1.8, 0), [.7, i * 2.1, 0], [1, 1, 1]), 0x4a3524, 0x5a4430);
        [
          [0, 4.2, 0, 1.9],
          [1.2, 3.6, .4, 1.4],
          [-1.1, 3.5, -.6, 1.5],
          [.3, 3.4, -1.3, 1.3],
          [-.4, 5.3, .5, 1.3]
        ].forEach(c => part(l, blob(), tf(V3(c[0], c[1], c[2]), [rnd() * 3, rnd() * 3, 0], [c[3], c[3] * .8, c[3]]), 0x1d5a1c, 0x6fb53a));
        return merge(l)
      }

      function pine() {
        const l = [];
        part(l, cyl(.12, .25, 2.5, 1.2), new T.Matrix4(), 0x4a3524, 0x5a4430);
        [
          [1.9, 2.2, .7],
          [1.5, 3.2, .7],
          [1.1, 4.2, .65],
          [.7, 5.1, .6]
        ].forEach(c => part(l, blob(), tf(V3(0, c[1], 0), [0, rnd() * 6, 0], [c[0], c[2], c[0]]), 0x0f3f1c, 0x2e7a35));
        return merge(l)
      }

      function palm() {
        const l = [];
        let x = 0,
          y = 0;
        for (let i = 0; i < 6; i++) {
          part(l, cyl(.13 - i * .008, .17 - i * .008, .95, 0), tf(V3(x, y + .45, 0), [0, 0, -i * .09], [1, 1, 1]), 0x8a7456, 0xa08a68);
          x += Math.sin(i * .09) * .95;
          y += Math.cos(i * .09) * .95
        }
        for (let i = 0; i < 8; i++) {
          const g = new T.PlaneGeometry(.7, 3.4, 1, 5);
          g.rotateZ(-Math.PI / 2).translate(1.7, 0, 0);
          const p = g.attributes.position;
          for (let k = 0; k < p.count; k++) p.setY(k, p.getY(k) - Math.pow(p.getX(k) / 3.4, 2) * 1.8);
          g.computeVertexNormals();
          part(l, g, tf(V3(x, y + .3, 0), [0, i * Math.PI / 4, .25], [1, 1, 1]), 0x2f7a22, 0x7cc43a)
        }
        return merge(l)
      }

      function fir() {
        const l = [];
        part(l, cyl(.1, .2, 1.4, .7), new T.Matrix4(), 0x4a3524, 0x5a4430);
        [
          [1.7, 2.2, 1.1],
          [1.4, 1.9, 2.2],
          [1.1, 1.7, 3.2],
          [.8, 1.5, 4.1],
          [.5, 1.3, 4.9]
        ].forEach(c => part(l, new T.ConeGeometry(c[0], c[1], 8).translate(0, c[2] + c[1] / 2, 0), new T.Matrix4(), 0x0b3520, 0x2b6b38));
        return merge(l)
      }

      function birch() {
        const l = [];
        part(l, cyl(.09, .16, 3.4, 1.7), new T.Matrix4(), 0xe9e5d9, 0xbdb8a6);
        [
          [0, 4.3, 0, 1.25],
          [.8, 3.7, .3, .9],
          [-.7, 3.9, -.4, 1],
          [.1, 5.1, .2, .85]
        ].forEach(c => part(l, blob(), tf(V3(c[0], c[1], c[2]), [rnd() * 3, rnd() * 3, 0], [c[3], c[3] * .85, c[3]]), 0x6fa832, 0xc6d94a));
        return merge(l)
      }

      function bush() {
        const l = [];
        [
          [0, .45, 0, .8],
          [.7, .35, .2, .6],
          [-.6, .3, -.3, .55]
        ].forEach(c => part(l, blob(), tf(V3(c[0], c[1], c[2]), [rnd() * 3, rnd() * 3, 0], [c[3], c[3] * .7, c[3]]), 0x2d6a25, 0x6aa83e));
        return merge(l)
      }
      const tm = new T.MeshStandardMaterial({
          vertexColors: true,
          roughness: .85,
          side: T.DoubleSide
        }),
        geos = [broadleaf(), pine(), palm(), fir(), birch(), bush()],
        caps = MOB ? [400, 250, 400, 900, 200, 500] : [900, 600, 800, 2200, 500, 1400],
        inst = geos.map((g, i) => new T.InstancedMesh(g, tm, caps[i])),
        cnt = [0, 0, 0, 0, 0, 0],
        tint = new T.Color(),
        Y = V3(0, 1, 0),
        m4 = new T.Matrix4(),
        q = new T.Quaternion(),
        qy = new T.Quaternion();
      for (let i = 0, n = MOB ? 110000 : 200000; i < n; i++) {
        const d = rdir(),
          h = hAt(d.x, d.y, d.z);
        if (h < .9 || h > 24 || lastVol < 34) continue;
        const fo = fbm(d.x * 9, d.y * 9, d.z * 9),
          m = fbm(d.x * 22, d.y * 22, d.z * 22),
          r = rnd();
        let k = -1;
        if (h < 2.6) {
          if (r < .45) k = 2
        } else if (fo > .4) {
          if (r < .88) k = h < 9 ? (m > .5 ? 4 : 0) : h < 17 ? (m > .45 ? 3 : 1) : 3
        } else if (h < 14 && r < .3) k = 5;
        if (k >= 0 && k !== 5 && h < 12 && rnd() < .15) k = 5;
        if (k < 0 || cnt[k] >= caps[k]) continue;
        const s = (k === 5 ? .6 : .8) + rnd() * .9,
          sx = s * (.85 + rnd() * .3);
        q.setFromUnitVectors(Y, d);
        qy.setFromAxisAngle(Y, rnd() * 6.28);
        q.multiply(qy);
        m4.compose(d.clone().multiplyScalar(R + h - .3), q, V3(sx, s * (.8 + rnd() * .45), sx));
        tint.setRGB(.85 + rnd() * .3, .85 + rnd() * .25, .8 + rnd() * .3);
        inst[k].setMatrixAt(cnt[k], m4);
        inst[k].setColorAt(cnt[k]++, tint)
      }
      inst.forEach((m, i) => {
        m.count = cnt[i];
        m.frustumCulled = false;
        scene.add(m)
      });
      /* ---------- onde (JS + GLSL identiche) ---------- */
      const WK = [
        [.05, .02, .04, .9, 1.1],
        [-.09, .05, .03, 1.2, .7],
        [.06, -.12, .08, 1.7, .4]
      ];
      const waveH = (p, t) => {
        let h = 0;
        for (const k of WK) h += k[4] * Math.sin(k[0] * p.x + k[1] * p.y + k[2] * p.z + k[3] * t);
        return h
      };
      const U = {
        t: {
          value: 0
        },
        boat: {
          value: V3(0, R, 0)
        },
        fwd: {
          value: V3(0, 0, -1)
        },
        spd: {
          value: 0
        },
        sun: {
          value: V3(0, 1, 0)
        },
        cam: {
          value: V3()
        },
        up: {
          value: V3(0, 1, 0)
        },
        sI: {
          value: 1
        },
        day: {
          value: 1
        },
        nt: {
          value: 0
        }
      };

      function mkWaterNormals() {
        const S = 256,
          h = new Float32Array(S * S),
          oct = [
            [4, 1],
            [8, .55],
            [16, .32],
            [32, .18],
            [64, .1]
          ];
        const sm = x => x * x * (3 - 2 * x);
        for (const [Pn, A] of oct) {
          const o = Pn * 13;
          for (let y = 0; y < S; y++)
            for (let x = 0; x < S; x++) {
              const u = x / S * Pn,
                v = y / S * Pn,
                i = Math.floor(u),
                j = Math.floor(v),
                fx = sm(u - i),
                fy = sm(v - j),

      const c = h < 0 ? mix(K.shal, K.deep, clamp(-h / 30, 0, 1)) : vd < 48 ? (vd < 10 ? K.lava : K.dark) : h < 2.4 ? K.sand : h < 20 ? mix(K.gr, K.fo, clamp((h - 5) / 12, 0, 1)) : h < 33 ? K.rock : K.snow;
      im.data.set([c[0], c[1], c[2], 255], (j * MW + i) * 4)
    }
  }
  x.putImageData(im, 0, 0)
})();
const mp = document.getElementById('mp').getContext('2d'), mcTxt = document.getElementById('mc');

function drawMap() {
  mp.drawImage(mapC, 0, 0);
  mp.strokeStyle = 'rgba(255,255,255,.18)'; mp.lineWidth = 1; mp.beginPath();
  for (let i = 1; i < 12; i++) { mp.moveTo(i * MW / 12, 0); mp.lineTo(i * MW / 12, MH) }
  for (let j = 1; j < 6; j++) { mp.moveTo(0, j * MH / 6); mp.lineTo(MW, j * MH / 6) }
  mp.stroke();
  const la = Math.asin(clamp(P.y, -1, 1)), lo = Math.atan2(-P.z, P.x),
    X = (lo / Math.PI + 1) / 2 * MW, Yy = (.5 - la / Math.PI) * MH,
    ax = Math.sin(hd) / Math.max(Math.cos(la), .15), ay = -Math.cos(hd);
  mp.save(); mp.translate(X, Yy); mp.rotate(Math.atan2(ax, -ay)); mp.scale(1.3, 1.3);
  mp.strokeStyle = 'rgba(255,214,10,' + (.35 + .3 * Math.sin(time * 5)) + ')'; mp.lineWidth = 1.5;
  mp.beginPath(); mp.arc(0, 0, 8 + 2 * Math.sin(time * 5), 0, TAU); mp.stroke();
  mp.fillStyle = '#ffd60a'; mp.strokeStyle = '#000'; mp.lineWidth = 1;
  mp.beginPath(); mp.moveTo(0, -7); mp.lineTo(4.5, 5); mp.lineTo(0, 2.5); mp.lineTo(-4.5, 5); mp.closePath(); mp.fill(); mp.stroke();
  mp.restore();
  mcTxt.textContent = Math.abs(la * 57.2958).toFixed(0) + '°' + (la >= 0 ? 'N' : 'S') + ' ' + Math.abs(lo * 57.2958).toFixed(0) + '°' + (lo >= 0 ? 'E' : 'O')
}	  
	  
	  
      /* ---------- loop ---------- */
      const hDay = HOR.clone(),
        zDay = ZEN.clone(),
        hNight = lin(0x050a16),
        zNight = lin(0x010207),
        hTw = lin(0xff9055),
        zTw = lin(0x3a3f86),
        cSun = lin(0xfff0d8),
        cDusk = lin(0xff9a55),
        cMoon = lin(0x8fa8ff),
        cHD = lin(0xbfdcff),
        cHN = lin(0x1a2a55),
        cGD = lin(0x3a5a70),
        cGN = lin(0x05080f),
        cCl = lin(0x7088a0);
      let timeOff = 0,
        hhG = 12;
      const clock = new T.Clock(),
        A = V3(),
        Rt = V3(),
        Bk = V3(),
        mx = new T.Matrix4(),
        pk = V3(),
        SUN = V3();

const fpsEl = document.getElementById('fps'); let fN = 0, fT = performance.now();

      function frame() {
        requestAnimationFrame(frame);
		
fN++; const pn = performance.now();
if (pn - fT > 500) { fpsEl.textContent = Math.round(fN * 1000 / (pn - fT)) + ' FPS'; fN = 0; fT = pn }
		
        const dt = Math.min(clock.getDelta(), .05);
        time += dt;
        U.t.value = time;
        const N = V3(0, 1, 0).sub(P.clone().multiplyScalar(P.y));
        if (N.lengthSq() < 1e-4) N.set(1, 0, 0);
        N.normalize();
        const E = new T.Vector3().crossVectors(N, P);
        hd = Math.atan2(Tn.dot(E), Tn.dot(N));
        windKn = 12 + 4 * Math.sin(time * .05) + 1.5 * Math.sin(time * .13);
        const wf = windFrom + .5 * Math.sin(time * .021) + .25 * Math.sin(time * .057);
        twa = wrap(wf - hd);
        const a = Math.abs(twa);
        const inp = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
        rudder += (inp - rudder) * Math.min(1, dt * 4);
        Tn.applyAxisAngle(P, -rudder * dt * (.12 + .5 * clamp(speed / 10, 0, 1)));
        trim = clamp(trim + ((keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0)) * .5 * dt, 0, 1);
        spinE = clamp(spinE + (spinOn ? 1 : -1) * dt * .45, 0, 1);
        const e = sstep(0, 1, spinE);
        fillS += ((a > 1.3 ? sstep(1.3, 1.9, a) : 0) - fillS) * Math.min(1, dt * 1.5);
        const sopt = clamp((a - .55) / 2.4, 0, 1);
        let eff = clamp(1 - Math.abs(trim - sopt) * 1.4, .3, 1);
        eff = Math.max(eff, .85 * e * fillS);
        let target = windKn * 1.15 * polar(a) * eff * (1 + .3 * fillS * e) * (1 - .25 * (1 - fillS) * e);
        speed += (target - speed) * Math.min(1, dt * .45);
        const ax = P.clone().cross(Tn).normalize(),
          ds = speed * dt / R,
          np = P.clone().applyAxisAngle(ax, ds);
        if (hAt(np.x, np.y, np.z) > -3) {
          speed *= .6;
          P.applyAxisAngle(ax, -2 * dt / R);
          Tn.applyAxisAngle(ax, -2 * dt / R)
        } else {
          P.copy(np);
          Tn.applyAxisAngle(ax, ds)
        }
        P.normalize();
        Tn.sub(P.clone().multiplyScalar(P.dot(Tn))).normalize();
        /* barca */
        Rt.crossVectors(Tn, P);
        Bk.copy(Tn).negate();
        mx.makeBasis(Rt, P, Bk);
        boat.quaternion.setFromRotationMatrix(mx);
        const wp = P.clone().multiplyScalar(R),
          fr = wp.clone().add(Tn.clone().multiplyScalar(5)).setLength(R),
          bk = wp.clone().sub(Tn.clone().multiplyScalar(5)).setLength(R);
        const bob = waveH(wp, time) * .8,
          pitch = Math.atan2(waveH(fr, time) - waveH(bk, time), 10) - speed * .004;
        boat.position.copy(P).multiplyScalar(R + bob);
        const heelT = -leeT * clamp(.62 * clamp(windKn / 15, .3, 1.3) * Math.sin(Math.min(a, 2.2)) * eff * (1 + .25 * fillS * e), 0, .68);
        roll += (heelT - roll) * Math.min(1, dt * 1.5);
        tilt.rotation.set(pitch, 0, roll + Math.sin(time * 1.1) * .015);
rdr.rotation.y = rudder * .5;
		
		
        if (a > .12 && a < 3) leeT = twa > 0 ? -1 : 1;
        leeS += clamp(leeT - leeS, -dt * 2.6, dt * 2.6);
        const sg = leeS >= 0 ? 1 : -1,
          ab = Math.abs(leeS);
        const ang = .08 + trim * 1.35,
          lf = sstep(.75, .4, a),
          pw = a > .55 ? clamp(1.1 - Math.abs(trim - sopt) * 1.5, .3, 1) : .25;
        boom.rotation.y = leeS * ang;
        main.upd(V3(0, 2.4, -1), V3(leeS * Math.sin(ang) * 6.6, 2.4, -1 + Math.cos(ang) * 6.6), V3(0, 19.4, -1), (.6 + 1.1 * pw) * ab, V3(sg, 0, 0), Math.max(lf, 1 - ab));
        
		/*const ja = ang * .8,
          tkJ = V3(0, 1.5, -7.3),
          jh = 1 - .92 * e;
        jib.visible = jh > .1;
        if (jib.visible) jib.upd(tkJ, tkJ.clone().lerp(V3(leeS * Math.sin(ja) * 3.8, 2.3, .8), jh), tkJ.clone().lerp(V3(0, 15.8, -1.4), jh), (.5 + .9 * pw) * jh * ab, V3(sg, 0, 0), Math.max(lf, 1 - ab));
		spin.visible = e > .01;
        if (spin.visible) {
          const tk = V3(0, 1.3, -8.3);
          spin.upd(tk, tk.clone().lerp(V3(leeS * (2 + 4.4 * fillS), 3.2, -2.2 + (1 - fillS) * 3), e), tk.clone().lerp(V3(0, 18.6, -2.6), e), (3.6 * fillS + .5) * e * ab, V3(sg * .35, .15, -1), Math.max(1 - fillS, 1 - ab))
        }
		*/
const ja = ang * .8,
  tkJ = V3(0, 1.5, -7.3),
  jh = Math.max(0, 1 - 1.8 * e);
jib.visible = jh > .1;
if (jib.visible) jib.upd(tkJ, tkJ.clone().lerp(V3(leeS * (Math.sin(ja) * 3.8 + .6), 2.3, -1.9), jh), tkJ.clone().lerp(V3(0, 15.8, -2.2), jh), (.5 + .9 * pw) * jh * ab, V3(sg, 0, 0), Math.max(lf, 1 - ab));
spin.visible = e > .01;
if (spin.visible) {
  const tk = V3(0, 1.7, -8.8);
  spin.upd(tk,
    tk.clone().lerp(V3(leeS * (2.2 + 4.6 * fillS), 6 + 2.5 * fillS, -3.6 + .8 * fillS), e),
    tk.clone().lerp(V3(0, 21.4, -1.8), e),
    (.6 + 6 * fillS) * e * ab, V3(sg * .35, .25, -1), Math.max(1 - fillS, 1 - ab))
}		
        /* sole, luci, oceano */
        const dd = new Date(),
          hh = ((dd.getHours() + dd.getMinutes() / 60 + dd.getSeconds() / 3600 + timeOff) % 24 + 24) % 24;
        hhG = hh;
        const el = Math.sin((hh - 6) / 12 * Math.PI) * 1.2,
          az = (90 + (hh - 6) * 15) * Math.PI / 180;
        SUN.copy(P).multiplyScalar(Math.sin(el)).addScaledVector(N, Math.cos(az) * Math.cos(el)).addScaledVector(E, Math.sin(az) * Math.cos(el)).normalize();
        const sE = SUN.dot(P),
          dayK = sstep(-.12, .25, sE),
          tw = Math.exp(-Math.pow((sE - .02) / .16, 2)),
          moon = sE < -.06;
        HOR.copy(hNight).lerp(hDay, dayK).lerp(hTw, tw * .65);
        ZEN.copy(zNight).lerp(zDay, dayK).lerp(zTw, tw * .4);
        scene.fog.color.copy(HOR);
        U.sun.value.copy(SUN);
        if (moon) U.sun.value.negate();
        U.sI.value = moon ? .2 : sstep(-.1, .05, sE);
        U.day.value = dayK;
        U.nt.value = 1 - dayK;
        sunL.position.copy(U.sun.value).multiplyScalar(1000);
        sunL.target.position.copy(boat.position);
        sunL.target.updateMatrixWorld();
        sunL.color.copy(moon ? cMoon : cSun).lerp(cDusk, moon ? 0 : tw * .8);
        sunL.intensity = moon ? .45 * (1 - dayK) * sstep(-.06, -.2, sE) : 2.4 * sstep(-.06, .3, sE);
        hemi.position.copy(P);
        hemi.intensity = .12 + .78 * dayK;
        hemi.color.copy(cHN).lerp(cHD, dayK);
        hemi.groundColor.copy(cGN).lerp(cGD, dayK);
        //clouds.material.emissive.copy(cCl).multiplyScalar(.06 + .94 * dayK);
        sailMat.emissiveIntensity = .2 + .8 * dayK;
        spMat.emissiveIntensity = .1 + .3 * dayK;
        discMat.color.setRGB(1, .3 + .12 * Math.sin(time * 2.2), .05);
        U.boat.value.copy(boat.position).setLength(R);
        U.fwd.value.copy(Tn);
        U.spd.value = speed;
        clouds.rotation.y = time * .004;
        /* camera */
        const th = camYaw,
          ph = camPit,
          off = Rt.clone().multiplyScalar(Math.sin(th) * Math.cos(ph)).addScaledVector(P, Math.sin(ph)).addScaledVector(Bk, Math.cos(th) * Math.cos(ph)).multiplyScalar(camD);
        const want = boat.position.clone().addScaledVector(P, 6).add(off);
        if (want.length() < R + 4) want.setLength(R + 4);
        cam.position.lerp(want, 1 - Math.exp(-6 * dt));
        cam.up.copy(cam.position).normalize();
        cam.lookAt(boat.position.clone().addScaledVector(P, 7));
        U.cam.value.copy(cam.position);
        U.up.value.copy(cam.position).normalize();
        sky.position.copy(cam.position);
        renderer.render(scene, cam);
        drawHud();
drawMap();		
      }
      frame();
    </script>
